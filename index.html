漠更干。","diff":3,"tag":["世界气候","热带沙漠气候","机制分析"]}]},{"id":"monsoon-temperate","kind":"concept","name":"温带季风气候","cat":"世界气候","alias":["温带季风","东亚季风气候"],"level":{"jr":"七年级上 · 世界的气候","sr":"必修一 · 气候类型"},"line":"夏季高温多雨、冬季寒冷干燥，出现在中纬度大陆东岸。","why":"海陆热力差造成季风：夏季风从海洋来、带来降水；冬季风从内陆来、干冷。所以它的降水几乎全在夏季。","sections":[{"h":"与亚热带季风的界线","p":"看最冷月：0℃ 上下是分界（秦岭—淮河）。北边冬季要结冰、作物一年一熟或两年三熟；南边可一年两熟。"},{"h":"与同纬度西岸比","p":"同纬度西岸是温带海洋性（全年湿润），东岸是温带季风（雨热同期）。位置换了，气候类型整个换掉。"}],"anchors":[{"iso":"CN","where":"中国华北","see":"夏季暴雨集中，冬季干冷少雪"},{"iso":"KR","where":"韩国","see":"首尔冬冷夏雨，典型的东岸季风"},{"iso":"JP","where":"日本北部","see":"与本州南部差出半个气候带"}],"counter":"“季风气候都湿热”不成立：温带季风的冬季又冷又干，和热带季风完全是两回事。同名不同季。","media":{"svg":"monsoon-temperate","hint":"冬夏风向反转 + 降水柱状对比"},"next":[{"q":"中国北方为什么春天缺水","to":"china-climate"},{"q":"东亚季风为什么这么强","to":"monsoon"}],"cite":"依据：气候类型常识；秦岭—淮河以最冷月 0℃ 为界为通行表述。","tags":["温带季风","雨热同期","华北","冬冷夏热","春旱"],"quiz":[{"lv":"jr","type":"choice","q":"温带季风气候的降水主要集中在","opts":["春季","夏季","秋季","冬季"],"ans":1,"exp":"降水主要由夏季风带来，冬季风来自内陆、干冷，所以冬季少雨。","diff":1,"tag":["世界气候","温带季风气候","概念辨析"]},{"lv":"sr","type":"short","q":"比较温带季风气候与温带海洋性气候的成因差异。","ans":"温带季风：海陆热力性质差异导致冬夏风向反转，夏季风带来降水，雨热同期、气温年较差大；温带海洋性：常年受西风带控制并受暖流增温，全年温和湿润、降水季节分配均匀。","exp":"两者同纬度但分处东岸与西岸，答题要落到“环流机制”，不要只写“降水多少”。","diff":2,"tag":["世界气候","温带季风气候","机制分析"]}]},{"id":"polar","kind":"concept","name":"极地气候","cat":"世界气候","alias":["极地气候","苔原","冰原气候"],"level":{"jr":"七年级上 · 世界的气候","sr":"必修一 · 气候类型"},"line":"全年严寒，最热月也在 10℃ 以下，降水极少且多为固态。","why":"太阳高度低、极夜时间长，得到的热量少；冷空气下沉形成高压，不易成云致雨，所以“极地是白色沙漠”。","sections":[{"h":"苔原与冰原的分界","p":"最热月 0–10℃ 能长苔藓地衣，是苔原；终年在 0℃ 以下是冰原。这条界线决定有没有植被，也决定有没有人长期居住。"},{"h":"南极为什么比北极冷","p":"南极是大陆、海拔高、冰雪反射强；北极是海洋，海水把热量带上来。同纬度，下垫面能把温度拉开二十度。"}],"anchors":[{"iso":"GL","where":"格陵兰","see":"冰盖覆盖大部分岛屿，边缘才有苔原"},{"iso":"IS","where":"冰岛","see":"冰川与苔原共存，靠地热住人"},{"iso":"NO","where":"挪威","see":"斯瓦尔巴群岛，北极圈内的定居点"}],"counter":"南极比北极冷，不是因为“更靠南”，而是因为它是大陆、海拔高。同纬度比较，下垫面与海拔比纬度更能决定温度。","media":{"svg":"polar","hint":"南极（大陆）与北极（海洋）剖面温度对比"},"next":[{"q":"极昼极夜是怎么来的","to":"revolution"},{"q":"冰川化了会怎样","to":"water-cycle"}],"cite":"依据：气候类型常识；南极年均温低于北极、格陵兰冰盖覆盖率为通行事实。","tags":["极地","苔原","冰原","极昼","冰川","南极"],"quiz":[{"lv":"jr","type":"choice","q":"苔原气候与冰原气候的分界大致是最热月均温","opts":["0℃","10℃","20℃","−10℃"],"ans":0,"exp":"最热月 0—10℃ 能长苔藓地衣为苔原；终年在 0℃ 以下为冰原。","diff":1,"tag":["世界气候","极地气候","概念辨析"]},{"lv":"sr","type":"short","q":"说明南极比北极冷的原因。","ans":"南极是大陆、海拔高（平均约 2350 米），冰雪反射率强，热量难以储存；北极是海洋，海水把热量向上输送，起到调节作用。同纬度下，下垫面与海拔的差异可造成二十度以上的温差。","exp":"三个得分点：大陆/海洋、海拔、反射率。","diff":2,"tag":["世界气候","极地气候","机制分析"]}]},{"id":"ethnic-language","kind":"concept","name":"人种与语言","cat":"居民与聚落","alias":["人种","语言","语系","民族"],"level":{"jr":"七年级上 · 人口与人种","sr":"必修二 · 地域文化与人口"},"line":"人种按体质特征划分，语言按语系划分；两者不重合，也不与国界重合。","why":"人种是长期适应环境的体质差异，语言是历史传播的结果——语言能跨人种传播，体质也会因迁移而混合。","sections":[{"h":"三大人种要打个折","p":"教材分黄、白、黑三大人种，是基于体质特征的粗略划分；实际人群连续过渡，“人种”在学界本身有争议。知道划分，也要知道它是简化。"},{"h":"语系比国家少","p":"汉藏、印欧、阿尔泰、南岛等几大语系覆盖全球多数人口；一个国家常有多语系并存，非洲尤其明显。"}],"anchors":[{"iso":"NG","where":"尼日利亚","see":"两百多个民族、五百多种语言"},{"iso":"IN","where":"印度","see":"印欧与达罗毗荼两大语系并存"},{"iso":"BR","where":"巴西","see":"人种混合最典型，混血人口占比高"}],"counter":"“一国一族一语”几乎不存在：非洲多数国界是殖民时期划的，一国多语是常态，欧洲也有大量双语国家。","media":{"svg":"ethnic-language","hint":"语言分布图与国界叠加，看两者如何错位"},"next":[{"q":"为什么一个国家会有几十种语言","to":"diffusion"},{"q":"宗教是怎么分布的","to":"religion"}],"cite":"依据：人口与人种常识；尼日利亚语言数量、印度双语系并存为通行事实。","tags":["人种","语言","语系","民族","多语国家"],"quiz":[{"lv":"jr","type":"choice","q":"非洲许多国家有多种官方语言，主要原因是","opts":["人口数量过多","殖民历史与多民族并存","地形阻隔","宗教多样"],"ans":1,"exp":"国界多为殖民时期划定，把不同族群划进同一国家，独立后沿用殖民语言作官方语言，形成多语并存。","diff":1,"tag":["居民与聚落","人种与语言","概念辨析"]},{"lv":"sr","type":"short","q":"说明“人种划分”与“语言划分”为什么不是一回事。","ans":"人种按体质特征（肤色、发形等）划分，是长期适应环境的结果；语言按语系划分，是历史传播与迁移的结果。语言可以跨人种传播（如西班牙语在美洲），体质也会因通婚混合，两者不重合，也不与国界重合。","exp":"关键词是“体质适应”与“历史传播”，两套机制不同。","diff":2,"tag":["居民与聚落","人种与语言","机制分析"]}]},{"id":"religion","kind":"concept","name":"宗教分布","cat":"居民与聚落","alias":["宗教","三大宗教","基督教","伊斯兰教","佛教"],"level":{"jr":"七年级上 · 语言与宗教","sr":"必修二 · 地域文化"},"line":"基督教、伊斯兰教、佛教各有起源地与核心区，扩散路径决定了今天的分布。","why":"宗教沿商路、征服与移民扩散：扩散早的地方成为核心区，扩散晚的地方成为边缘或少数群体。","sections":[{"h":"三块核心区","p":"伊斯兰教起于阿拉伯半岛，核心在西亚北非；基督教起于西亚、核心转到欧洲并随殖民扩散到美洲；佛教起于南亚，核心在东与东南亚。"},{"h":"一国之内的两层","p":"尼日利亚南北分属伊斯兰与基督教；印度以印度教为主却是佛教发源地。国家边界与宗教边界经常错开。"}],"anchors":[{"iso":"SA","where":"沙特阿拉伯","see":"伊斯兰教发源地，麦加与麦地那"},{"iso":"IT","where":"意大利","see":"天主教中心，梵蒂冈在罗马城内"},{"iso":"IN","where":"印度","see":"印度教为主，佛教在此起源后外传"}],"counter":"宗教分布不等于信仰强度：法国天主教文化身份很重，但实际礼拜率很低。看分布图只能看出“归属”，看不出“虔诚”。","media":{"svg":"religion","hint":"三大宗教扩散路径动画（商路 → 殖民 → 移民）"},"next":[{"q":"宗教为什么能跨洲传播","to":"diffusion"},{"q":"为什么节日日期每年都不一样","to":"cmp-fest"}],"cite":"依据：宗教地理常识；三国起源与核心区为通行表述。","tags":["宗教","伊斯兰教","基督教","佛教","麦加","梵蒂冈"],"quiz":[{"lv":"jr","type":"choice","q":"伊斯兰教的发源地是","opts":["南亚","阿拉伯半岛","欧洲西部","东南亚"],"ans":1,"exp":"7 世纪起源于阿拉伯半岛，麦加、麦地那是圣城；后沿商路扩散到北非、中亚、东南亚。","diff":1,"tag":["居民与聚落","宗教分布","概念辨析"]},{"lv":"sr","type":"short","q":"说明宗教分布图能看出什么、看不出什么。","ans":"能看出各宗教的核心区与扩散范围、国家内部的宗教构成；看不出信仰强度与实际的宗教实践（如法国天主教文化身份重但礼拜率低），也看不出教派内部差异。","exp":"这题考“地图的局限”，答“看不出虔诚程度”是核心。","diff":2,"tag":["居民与聚落","宗教分布","机制分析"]}]},{"id":"settlement","kind":"concept","name":"聚落形态","cat":"居民与聚落","alias":["聚落","乡村","城市形态","带状聚落"],"level":{"jr":"七年级上 · 聚落","sr":"必修二 · 城乡空间结构"},"line":"聚落分乡村与城市，形态受水源、地形、交通影响：带状、团状、散点。","why":"沿河沿路长成带状，平原中心长成团状，牧区与山区多是散点——因为资源本身是分散的。","sections":[{"h":"三种形态的成因","p":"带状：河谷、公路、海岸线限制横向扩展；团状：平原中心、交通交汇；散点：牧区、山区，逐水草或逐地块居住。"},{"h":"城市为什么爱三角洲","p":"水运便利、地势平坦、水源充足，三者叠加。尼罗河三角洲、长江三角洲、恒河三角洲都是人口最密的地方。"}],"anchors":[{"iso":"EG","where":"埃及","see":"尼罗河两岸的带状聚落，两侧就是沙漠"},{"iso":"NL","where":"荷兰","see":"围海造陆后形成的团状城镇群"},{"iso":"MN","where":"蒙古","see":"牧区的散点与季节性迁移"}],"counter":"城市多半不是“规划出来”的：老城沿着水源与道路自然生长，方格网是近代才加上的。看老城地图能读出地形。","media":{"svg":"settlement","hint":"三种聚落形态的卫星影像对比"},"next":[{"q":"城市为什么会越来越大","to":"urbanization"},{"q":"为什么大城市都在三角洲","to":"population"}],"cite":"依据：聚落地理常识；三大三角洲人口密集为通行事实。","tags":["聚落","乡村","城市","带状","三角洲","空心化"],"quiz":[{"lv":"jr","type":"choice","q":"沿河谷延伸的聚落形态属于","opts":["团状","带状","散点","环状"],"ans":1,"exp":"河谷与公路限制横向扩展，聚落沿水线或道路拉长成带状。","diff":1,"tag":["居民与聚落","聚落形态","概念辨析"]},{"lv":"sr","type":"short","q":"说明城市多分布在大河三角洲的原因。","ans":"地形平坦便于建设；水源充足；河运便利、便于对外联系；泥沙冲积形成肥沃土壤，农业基础好，能支撑较多人口。四项叠加使三角洲成为人口与城市最密集的区域。","exp":"至少写出地形、水源、交通三项，只写“水源”不完整。","diff":2,"tag":["居民与聚落","聚落形态","机制分析"]}]},{"id":"china-climate","kind":"concept","name":"中国气候特征","cat":"中国地理","alias":["中国气候","季风气候显著","雨带推移"],"level":{"jr":"八年级上 · 中国的气候","sr":"必修一 · 中国气候"},"line":"季风气候显著、大陆性强、类型复杂多样——三个特征由海陆位置、纬度跨度、地形共同决定。","why":"背靠最大大陆、面朝最大大洋，季风最强；南北跨近 50 个纬度，热量差异大；三级阶梯让同一纬度也能长出不同气候。","sections":[{"h":"三条界线要记牢","p":"1 月 0℃ 等温线≈秦岭—淮河（亚热带与暖温带）；400 毫米等降水量线（农耕与牧业）；季风区与非季风区（大兴安岭—阴山—贺兰山—巴颜喀拉山—冈底斯山）。"},{"h":"雨带怎么北推","p":"4—5 月华南、6 月江淮（梅雨）、7—8 月华北东北，9 月南撤。雨带停留久了就涝，走得快了就旱——“南涝北旱”与“北涝南旱”都是它停错位置。"}],"anchors":[{"iso":"CN","where":"华南（4—5 月）","see":"前汛期，雨带最先到这里"},{"iso":"CN","where":"江淮（6 月）","see":"梅雨，一停一个月"},{"iso":"CN","where":"华北（7—8 月）","see":"雨季最晚，也最容易旱涝急转"}],"counter":"“南方一定比北方湿”不成立：云南干热河谷、新疆伊犁河谷都是例外——地形能改写纬度规律，这也是非地带性。","media":{"svg":"china-climate","hint":"雨带 4—9 月北推南撤动画","img":"china-koppen"},"next":[{"q":"梅雨为什么能停一个月","to":"fronts"},{"q":"为什么南方能一年两熟","to":"agri-china"}],"cite":"依据：中国气候常识；三条界线与雨带推进为教材通行表述，未引用原文。","tags":["中国气候","季风气候","秦岭淮河","雨带","梅雨","南涝北旱"],"quiz":[{"lv":"jr","type":"choice","q":"我国 1 月 0℃ 等温线大致经过","opts":["长江一线","秦岭—淮河一线","黄河一线","南岭一线"],"ans":1,"exp":"这条线同时是亚热带与暖温带、湿润区与半湿润区的分界，是必背的一条。","diff":1,"tag":["中国地理","中国气候特征","概念辨析"]},{"lv":"sr","type":"short","q":"说明我国东部雨带的推移规律，并解释“南涝北旱”的成因。","ans":"规律：4—5 月华南、6 月江淮（梅雨）、7—8 月华北东北，9 月南撤。成因：夏季风弱的年份雨带长时间停在南方，北方雨季推迟或偏短，于是南涝北旱；反之则北涝南旱。","exp":"要写出“夏季风强弱决定雨带停留位置”这个机制，只背月份拿不到分。","diff":2,"tag":["中国地理","中国气候特征","机制分析","季风"]}]},{"id":"rivers","kind":"concept","name":"长江与黄河","cat":"中国地理","alias":["长江","黄河","地上河","含沙量"],"level":{"jr":"八年级上 · 中国的河流","sr":"必修一 · 中国河流"},"line":"长江水量大、无冰期，航运价值高；黄河含沙量世界第一，下游淤成“地上河”。","why":"长江流域降水多、支流多、终年不冻；黄河中游穿过黄土高原，把泥沙带到下游沉积，河床逐年抬高。","sections":[{"h":"地上河是怎么来的","p":"泥沙淤积 → 加高堤防 → 继续淤积 → 再加固。河床最终高于两岸地面，一旦决口就是大范围泛滥。所以治黄的关键在“减沙”，不在“加堤”。"},{"h":"长江为什么能当黄金水道","p":"水量大、无冰期、干支流通航里程长、横贯东西经济带。三条凑齐，才配得上“黄金水道”。"}],"anchors":[{"iso":"CN","where":"黄土高原（中游）","see":"泥沙来源，水土流失最严重"},{"iso":"CN","where":"华北平原（下游）","see":"河床高出地面，靠堤防约束"},{"iso":"CN","where":"长江三角洲","see":"航运与港口最密集的河段"}],"counter":"“黄河水少就不会泛滥”是错的：黄河的问题在沙不在水，历史上决口改道频繁。水量小与灾害重，可以同时成立。","media":{"svg":"rivers","hint":"地上河形成过程动画（淤积—加堤—再淤积）","img":"yangtze-basin"},"next":[{"q":"黄土高原的土为什么会被冲走","to":"exogenic"},{"q":"土地为什么越种越薄","to":"land-resource"}],"cite":"依据：中国河流常识；黄河含沙量居世界首位、下游为地上河均为通行结论。","tags":["长江","黄河","含沙量","地上河","水土流失","黄金水道"],"quiz":[{"lv":"jr","type":"choice","q":"黄河下游形成“地上河”的直接原因是","opts":["水量大","泥沙淤积使河床抬高","流速快","支流众多"],"ans":1,"exp":"泥沙来自中游黄土高原，下游地势平缓、泥沙沉积，河床逐年抬高。","diff":1,"tag":["中国地理","长江与黄河","概念辨析"]},{"lv":"sr","type":"short","q":"为什么说治理黄河的关键在“减沙”而不是“加堤”？","ans":"泥沙主要来自中游黄土高原的水土流失；加高堤防只是把淤积抬高延后，河床继续上升，风险累积。减沙（水土保持、退耕还林、淤地坝）从源头减少来沙，才是根治。","exp":"要答出“加堤是治标、会累积风险”，否则等于没说清关键在哪。","diff":2,"tag":["中国地理","长江与黄河","机制分析"]}]},{"id":"land-resource","kind":"concept","name":"土地资源","cat":"中国地理","alias":["土地资源","耕地红线","荒漠化","水土流失"],"level":{"jr":"八年级上 · 中国的自然资源","sr":"必修二 · 资源与安全"},"line":"中国耕地少、后备资源不足，草地与林地占比大，且分布不均。","why":"山地多平原少（三级阶梯决定），干旱区广（西北），所以耕地集中在东部平原与河谷。","sections":[{"h":"人均才是真问题","p":"总量大、人均少：人均耕地不到世界平均的一半。所以“18 亿亩红线”守的是人均底线，不是总量。"},{"h":"三种退化","p":"荒漠化（西北，风蚀与水缺）、盐碱化（灌溉不当，蒸发把盐带到表层）、水土流失（黄土高原、南方红壤丘陵）。三种成因不同，治理手段也不同。"}],"anchors":[{"iso":"CN","where":"东北黑土区","see":"最肥沃的耕地，也在退化"},{"iso":"CN","where":"西北干旱区","see":"荒漠化前沿，退耕还林还草"},{"iso":"CN","where":"黄土高原","see":"水土流失，泥沙进黄河"}],"counter":"“地大物博”常被误读：国土面积第三，但人均耕地、人均水都低于世界平均。总量与人均要分开说。","media":{"svg":"land-resource","hint":"耕地分布与人口分布叠加图"},"next":[{"q":"黑土为什么会变薄","to":"soil"},{"q":"耕地为什么集中在东部","to":"agri-china"}],"cite":"依据：中国土地资源常识；人均耕地低于世界平均为通行统计结论。","tags":["土地资源","耕地","18亿亩","荒漠化","盐碱化"],"quiz":[{"lv":"jr","type":"choice","q":"我国耕地资源的基本特点是","opts":["总量小、人均多","总量大、人均少","分布均匀","后备资源充足"],"ans":1,"exp":"国土面积大但山地多平原少，人均耕地不到世界平均的一半，所以有“18 亿亩红线”。","diff":1,"tag":["中国地理","土地资源","概念辨析"]},{"lv":"sr","type":"short","q":"说明荒漠化、盐碱化、水土流失的成因差异。","ans":"荒漠化：干旱区风力侵蚀与过度放牧开垦，植被退化；盐碱化：灌溉不当、地下水位上升，蒸发把盐分带到表层；水土流失：降水集中且植被破坏，坡面径流冲刷表土。三者分别对应风、水盐、水蚀。","exp":"要区分“风蚀”“盐分上移”“径流冲刷”，不能都写“环境破坏”。","diff":2,"tag":["中国地理","土地资源","机制分析"]}]},{"id":"agri-china","kind":"concept","name":"中国农业分布","cat":"中国地理","alias":["农业分布","中国农业","东耕西牧","南稻北麦","商品粮基地"],"level":{"jr":"八年级上 · 中国的农业","sr":"必修二 · 农业地域"},"line":"东耕西牧、南稻北麦；界线大致是 400 毫米等降水量线与秦岭—淮河。","why":"降水决定能不能种（400 毫米以下宜牧），热量决定种什么（秦岭淮河以南可稻作两熟）。","sections":[{"h":"三大农业区","p":"东部季风区（种植业为主）、西北干旱区（灌溉农业与牧业）、青藏高寒区（河谷农业与高寒牧业）。分区看的是水热组合，不是行政区。"},{"h":"商品粮基地在哪","p":"东北平原（地多人少、机械化高）、长江中下游（水热好、单产高）。一个靠规模，一个靠单产。"}],"anchors":[{"iso":"CN","where":"东北平原","see":"春小麦、玉米、大豆，商品率最高"},{"iso":"CN","where":"长江中下游","see":"水稻两熟，鱼米之乡"},{"iso":"CN","where":"内蒙古草原","see":"牧区，400 毫米线以西"}],"counter":"“南方只种稻”不成立：江淮也种小麦，南方还有甘蔗、油菜、柑橘。作物看的是水热组合，不是纬度标签。","media":{"svg":"agri-china","hint":"400mm 等降水量线与主要作物分布叠加","img":"china-terrace"},"next":[{"q":"为什么东北也能种水稻","to":"agri-location"},{"q":"南方为什么吃米北方吃面","to":"cmp-diet"}],"cite":"依据：中国农业分布常识；三大农业区划分为教材通行表述。","tags":["农业分布","南稻北麦","东耕西牧","商品粮","东北大米"],"quiz":[{"lv":"jr","type":"choice","q":"我国“东耕西牧”的分界大致接近","opts":["200 毫米等降水量线","400 毫米等降水量线","800 毫米等降水量线","秦岭—淮河一线"],"ans":1,"exp":"400 毫米线以西降水不足以稳定发展种植业，以牧业为主；秦岭—淮河是南北方的分界。","diff":1,"tag":["中国地理","中国农业分布","概念辨析"]},{"lv":"sr","type":"short","q":"说明东北平原与长江中下游成为商品粮基地的不同原因。","ans":"东北：地多人少、耕地集中连片、机械化程度高，商品率高，靠规模；长江中下游：水热条件好、单产高、一年多熟，靠单产与复种。","exp":"一个靠“规模”，一个靠“单产”，答成同一套理由就错了。","diff":2,"tag":["中国地理","中国农业分布","机制分析"]}]},{"id":"china-population","kind":"concept","name":"中国人口与民族","cat":"中国地理","alias":["胡焕庸线","黑河腾冲线","民族分布","人口东密西疏","人口与民族","民族"],"level":{"jr":"八年级上 · 中国的人口","sr":"必修二 · 人口分布"},"line":"人口东密西疏，胡焕庸线（黑河—腾冲）两侧差异悬殊；56 个民族大杂居、小聚居。","why":"东部平原多、降水多、经济密度高；西部高原沙漠广，承载力低。人口分布本质是“能住的地方有多少”。","sections":[{"h":"胡焕庸线是什么","p":"1935 年提出的一条经验线：东南半壁住了九成以上人口，西北半壁不到一成。它不是政策线，也不是自然分界，但近百年格局没大变。"},{"h":"民族为什么在西南最集中","p":"地形破碎、山谷阻隔，历史上外来人口难以深入，族群得以保留；同时河谷通道又让交流不断，所以是“大杂居、小聚居”。"}],"anchors":[{"iso":"CN","where":"黑河—腾冲线以东","see":"平原与沿海，人口最密集"},{"iso":"CN","where":"西南山区","see":"民族自治地方最集中的区域"},{"iso":"CN","where":"西北干旱区","see":"绿洲与河谷是人口的全部落脚点"}],"counter":"胡焕庸线不是“不能越过”：新疆城镇化在提高，但线的整体格局没变。局部变化与整体稳定可以同时成立。","media":{"svg":"china-population","hint":"夜间灯光图与胡焕庸线叠加","img":"china-popdensity"},"next":[{"q":"胡焕庸线为什么分得这么准","to":"population"},{"q":"进城的人会不会改变这条线","to":"urbanization"}],"cite":"依据：胡焕庸线为 1935 年提出的经验线；东西人口比例约 94:6 为通行表述。","tags":["胡焕庸线","黑河腾冲","人口东密西疏","56个民族","民族分布"],"quiz":[{"lv":"jr","type":"choice","q":"胡焕庸线大致连接的两座城市是","opts":["黑河—腾冲","漠河—广州","北京—上海","兰州—昆明"],"ans":0,"exp":"黑河（黑龙江）到腾冲（云南），东南半壁集中了九成以上人口。","diff":1,"tag":["中国地理","中国人口与民族","概念辨析"]},{"lv":"sr","type":"short","q":"说明胡焕庸线东西差异的自然原因，并解释“经验线”的含义。","ans":"线以东多平原丘陵、降水较多、热量条件好，适宜农耕与居住；线以西多高原沙漠、降水少、生态脆弱，承载力低。“经验线”指它是根据人口分布统计归纳出来的界线，不是政策划定，也不是自然界线。","exp":"“经验线”三个字必须解释，否则等于没答第二问。","diff":2,"tag":["中国地理","中国人口与民族","机制分析"]}]},{"id":"cyclone","kind":"concept","name":"气旋与反气旋","cat":"天气","alias":["气旋","反气旋","低压","高压","伏旱"],"level":{"jr":"七年级上 · 天气","sr":"必修一 · 常见天气系统"},"line":"低压中心气流上升、成云致雨；高压中心下沉、天气晴朗。北半球气旋逆时针、反气旋顺时针。","why":"气压梯度力把空气推向低压，地转偏向力让它偏转成旋转；上升或下沉决定成不成云。","sections":[{"h":"天气差别","p":"台风是强气旋（狂风暴雨）；长江中下游伏旱是副高＝反气旋控制（晴热少雨）。同一个“气压系统”概念，一个带来灾，一个带来旱。"},{"h":"风向怎么判","p":"北半球气旋：东侧偏南风、西侧偏北风；反气旋相反。判风向先画气压梯度力，再顺手偏 30°–45°。"}],"anchors":[{"iso":"CN","where":"长江中下游","see":"七八月伏旱，副高控制"},{"iso":"PH","where":"菲律宾","see":"西北太平洋台风最常登陆的地方之一"},{"iso":"RU","where":"俄罗斯","see":"冬季大陆高压，干冷少雪"}],"counter":"“低压一定下雨”要加条件：水汽不足时低压也只是阴天。沙漠里的低压系统常常只刮风不下雨。","media":{"svg":"cyclone","img":"typhoon-profile","hint":"气旋与反气旋的辐合辐散"},"next":[{"q":"台风为什么在海上生成","to":"heating"},{"q":"伏旱为什么这么难熬","to":"pressure-belts"}],"cite":"依据：天气系统常识；伏旱与副高、台风与热带气旋为通行结论。","tags":["气旋","反气旋","台风","伏旱","低压","高压"],"quiz":[{"lv":"jr","type":"choice","q":"北半球气旋的水平气流方向是","opts":["顺时针辐散","逆时针辐合","顺时针辐合","逆时针辐散"],"ans":1,"exp":"低压中心四周气流向中心辐合，受地转偏向力右偏成逆时针；反气旋相反，顺时针辐散。","diff":1,"tag":["天气","气旋与反气旋","概念辨析"]},{"lv":"sr","type":"short","q":"说明台风与伏旱分别对应哪种气压系统，天气为什么不同。","ans":"台风是强烈发展的热带气旋（低压），中心气流上升，带来狂风暴雨；伏旱是副热带高压（反气旋）控制，下沉气流抑制成云，晴热少雨。上升与下沉决定成不成云。","exp":"落点写“上升/下沉”，比罗列天气现象更能得分。","diff":2,"tag":["天气","气旋与反气旋","机制分析"]}]},{"id":"soil","kind":"concept","name":"土壤与植被","cat":"自然带","alias":["土壤","黑土","红壤","植被"],"level":{"jr":"七年级上 · 自然景观","sr":"必修一 · 土壤与植被"},"line":"土壤是气候、生物、地形、母质、时间共同作用的产物；植被类型与土壤类型大致对应。","why":"气候决定有机质积累与淋溶强度：冷湿环境积累（黑土），热湿环境淋溶（砖红壤），干旱环境积盐（荒漠土）。","sections":[{"h":"三类典型","p":"黑土：冷湿、草甸根系多、有机质厚；砖红壤：高温多雨、淋溶强、酸性贫瘠；荒漠土：蒸发强、盐分上移、有机质少。"},{"h":"土壤与农业","p":"黑土高产不是因为“肥”，而是因为有机质层厚、结构好。反过来，热带雨林下的砖红壤一旦失去植被覆盖，很快就硬结。"}],"anchors":[{"iso":"CN","where":"东北黑土区","see":"有机质层最厚的耕地"},{"iso":"BR","where":"亚马孙","see":"砖红壤，淋溶强、酸性"},{"iso":"EG","where":"埃及西部","see":"荒漠土，盐分聚集"}],"counter":"土壤肥沃不等于降水多：黑土在冷湿环境形成，热带雨林下反而贫瘠。有机质是“积累 vs 分解”的平衡结果。","media":{"svg":"soil","hint":"气候带 → 土壤类型的对应动画"},"next":[{"q":"黑土为什么越来越薄","to":"land-resource"},{"q":"热带雨林的土为什么不能种地","to":"rainforest"}],"cite":"依据：土壤地理常识；黑土有机质层厚、砖红壤淋溶强为通行结论。","tags":["土壤","黑土","红壤","有机质","盐碱","土壤肥沃"],"quiz":[{"lv":"jr","type":"choice","q":"我国东北黑土有机质含量高的主要原因是","opts":["气温高、分解快","冷湿环境有机质积累多","降水多、淋溶强","母质本身肥沃"],"ans":1,"exp":"冬季寒冷使有机质分解慢，草甸根系大量积累，形成深厚腐殖质层。","diff":1,"tag":["自然带","土壤与植被","概念辨析"]},{"lv":"sr","type":"short","q":"说明“土壤肥沃与降水多少不成正比”，并用黑土与砖红壤对比。","ans":"肥力取决于有机质积累与分解的平衡：黑土在冷湿环境下分解慢、积累多，土层深厚肥沃；砖红壤在高温多雨下分解快、淋溶强，养分流失、酸性贫瘠。降水多反而更容易贫瘠。","exp":"关键在“积累 vs 分解”，不是“水多就好”。","diff":2,"tag":["自然带","土壤与植被","机制分析"]}]},{"id":"industry-location","kind":"concept","name":"工业区位因素","cat":"产业","alias":["工业区位","产业转移","原料指向","市场指向"],"level":{"jr":"八年级上 · 工业","sr":"必修二 · 工业区位"},"line":"工业选址看原料、市场、动力、劳动力、交通、技术与政策，不同工业的主导因素不同。","why":"原料指向（易腐、运输成本高）、市场指向（体积大、易碎）、劳动力指向（劳动密集）、技术指向（高附加值）。","sections":[{"h":"三类典型","p":"钢铁：靠近原料或交通枢纽；服装：劳动力便宜；芯片：人才与供应链。选址不是“越便宜越好”，是“最贵的那一项在哪里”。"},{"h":"产业转移的路径","p":"先搬到低成本地区（服装、组装），再往技术升级（设计、品牌）。所以“转移”和“升级”往往同时发生，不是二选一。"}],"anchors":[{"iso":"CN","where":"长三角","see":"电子与装备制造，靠近供应链"},{"iso":"VN","where":"越南","see":"服装鞋帽转移的主要承接地"},{"iso":"DE","where":"德国","see":"高端装备，靠技术与技工"}],"counter":"“工厂都往成本低处搬”不完整：芯片、医药反而更集中，因为要靠近人才、专利与供应链。成本不是唯一变量。","media":{"svg":"industry-location","hint":"同一件产品的四段工序分布动画"},"next":[{"q":"港口为什么能带起一片工厂","to":"transport"},{"q":"工厂搬走以后当地怎么办","to":"development"}],"cite":"依据：工业区位理论；越南承接纺织服装转移、德国高端装备为通行事实。","tags":["工业区位","产业转移","工厂选址","劳动力","芯片","服装"],"quiz":[{"lv":"jr","type":"choice","q":"服装加工业布局时最看重的因素是","opts":["原料产地","廉价劳动力","技术人才","气候条件"],"ans":1,"exp":"劳动密集型，人工成本占比高，所以向劳动力便宜的地区转移。","diff":1,"tag":["产业","工业区位因素","概念辨析"]},{"lv":"sr","type":"short","q":"说明产业转移中“转移”与“升级”为什么常同时发生。","ans":"转出地把低附加值环节（加工组装）迁到低成本地区，同时把资源集中到研发、设计、品牌等高附加值环节；承接地获得就业与配套产业，逐步向上游攀升。两者是同一过程的两面，不是二选一。","exp":"答题要体现“环节分工”，而不是“工厂整体搬家”。","diff":2,"tag":["产业","工业区位因素","机制分析"]}]},{"id":"transport","kind":"concept","name":"交通布局","cat":"产业","alias":["交通布局","枢纽","港口","运量"],"level":{"jr":"八年级上 · 交通运输","sr":"必修二 · 交通运输布局"},"line":"交通线沿地形与人口分布铺设，节点（港口、枢纽）决定区域兴衰。","why":"修路成本受地形控制：平原直、山区弯、桥隧贵；运量决定方式：海运大宗、航空轻贵、铁路中长距。","sections":[{"h":"四种方式怎么选","p":"运量：海运 > 铁路 > 公路 > 航空；速度：航空 > 公路 > 铁路 > 海运；成本正相反。所以大宗走海/铁，急件走航空。"},{"h":"枢纽效应","p":"鹿特丹靠莱茵河口吃下欧洲腹地；新加坡卡在马六甲海峡。枢纽不是“位置好”，而是“位置 + 腹地 + 效率”三件事同时成立。"}],"anchors":[{"iso":"NL","where":"鹿特丹","see":"莱茵河口，欧洲最大港口"},{"iso":"SG","where":"新加坡","see":"马六甲海峡，转口贸易枢纽"},{"iso":"CN","where":"中欧班列","see":"陆路通道改写内陆出口路径"}],"counter":"“修路必然带动经济”要打问号：没有产业与人口的线路会闲置。“通道”只是条件，不是红利本身。","media":{"svg":"transport","hint":"四种运输方式的运量-成本-速度对比图"},"next":[{"q":"新加坡凭什么当中转站","to":"industry-location"},{"q":"修了路为什么还是穷","to":"human-land"}],"cite":"依据：交通布局常识；鹿特丹、新加坡的枢纽地位为通行事实。","tags":["交通","港口","枢纽","运量","中欧班列","运河"],"quiz":[{"lv":"jr","type":"choice","q":"大宗笨重货物长距离运输最适合的方式是","opts":["航空","公路","水运或铁路","管道"],"ans":2,"exp":"水运运量最大、成本最低但速度慢；铁路适合中长距大宗。航空快但贵，只适合轻贵重。","diff":1,"tag":["产业","交通布局","概念辨析"]},{"lv":"sr","type":"short","q":"说明新加坡成为国际航运枢纽的条件。","ans":"位置：扼守马六甲海峡，是太平洋与印度洋航线的必经之地；港口水深条件好，可停靠大型船舶；腹地转口贸易发达，配套金融、加油、维修服务完善；政策自由、效率高。位置 + 效率 + 服务三者叠加。","exp":"只写“位置好”不完整，要补“港口条件与服务效率”。","diff":2,"tag":["产业","交通布局","机制分析"]}]},{"id":"human-land","kind":"concept","name":"人地关系","cat":"产业","alias":["人地关系","可持续发展","承载力","环境容量"],"level":{"jr":"八年级下 · 可持续发展","sr":"必修二 · 人地关系"},"line":"从“征服自然”到“人地协调”，核心是承认环境有承载力、发展有代价。","why":"承载力由资源与环境容量决定；技术能提高上限，也会制造新约束（污染、碳排放）。所以“技术进步”不是无条件的好消息。","sections":[{"h":"三种观点","p":"地理环境决定论（环境说了算）、可能论（人可以选择）、可持续发展（在不越过底线的范围内选择）。教材从决定论讲到可持续，是观念史。"},{"h":"三条底线","p":"资源可持续、环境可持续、社会公平。少一条都不成立：只讲环保不讲就业，政策推不动；只讲增长不讲环境，代价后移。"}],"anchors":[{"iso":"NL","where":"荷兰","see":"围海造陆，收益与生态代价并存"},{"iso":"AE","where":"阿联酋","see":"沙漠中的城市化，靠淡化与空调"},{"iso":"CR","where":"哥斯达黎加","see":"生态旅游，把保护变成收入"}],"counter":"“可持续＝不发展”是误读：它要求把代价内部化（谁污染谁付费），不是停下来。停下对穷国更不公平。","media":{"svg":"human-land","hint":"承载力超载与恢复的模拟曲线"},"next":[{"q":"荷兰填海造陆换来了什么","to":"development"},{"q":"沙漠城市靠什么活着","to":"oasis"}],"cite":"依据：人地关系与可持续发展理论；三国案例为通行教材案例类型。","tags":["人地关系","可持续","承载力","环境容量","碳中和"],"quiz":[{"lv":"jr","type":"choice","q":"可持续发展的三个内涵不包括","opts":["生态持续","经济持续","社会持续","无限增长"],"ans":3,"exp":"可持续讲的是在资源与环境承载力之内发展，无限增长恰恰是它的反面。","diff":1,"tag":["产业","人地关系","概念辨析"]},{"lv":"sr","type":"short","q":"说明“可持续不等于不发展”的理由。","ans":"可持续要求把环境代价内部化（谁污染谁付费、谁受益谁补偿），在承载力范围内提高效率与公平；停止发展会让贫困地区失去改善机会，反而加剧对资源的粗放利用。所以是“改变发展方式”，不是“停止发展”。","exp":"答题要落在“内部化代价”与“社会公平”，只写保护环境不完整。","diff":2,"tag":["产业","人地关系","机制分析"]}]},{"id":"development","kind":"concept","name":"发达国家与发展中国家","cat":"居民与聚落","alias":["发达国家","发展中国家","南北差异","新兴经济体"],"level":{"jr":"七年级上 · 发展与合作","sr":"必修二 · 区域发展"},"line":"按经济发展水平分两类，但“发达”的判据不止人均 GDP。","why":"人均 GDP 高不等于发展水平高：还要看产业结构、教育医疗、基础设施与贫富差距。","sections":[{"h":"南北差异从哪来","p":"殖民时期的产业分工：一方提供原料与初级产品，一方掌握加工与金融。独立后分工惯性仍在，这就是“南北对话”的背景。"},{"h":"为什么单列新兴经济体","p":"金砖、东南亚部分国家工业化速度快，人均还不高但产业完整度上来了。二分法解释不了它们，所以要多一档。"}],"anchors":[{"iso":"US","where":"美国","see":"高收入、服务业为主，内部差距也大"},{"iso":"BD","where":"孟加拉国","see":"劳动密集出口导向，人均仍低"},{"iso":"BR","where":"巴西","see":"中等收入陷阱的典型样本"}],"counter":"二分法会失真：海湾产油国人均很高，产业结构却很单一。人均收入、产业复杂度、社会保障是三件不同的事。","media":{"svg":"development","hint":"人均 GDP 与产业复杂度的散点图（国家气泡）"},"next":[{"q":"工厂为什么往东南亚搬","to":"industry-location"},{"q":"为什么有人要跨国打工","to":"migration"}],"cite":"依据：发展经济学常识；巴西中等收入陷阱、孟加拉成衣出口为通行案例。","tags":["发达国家","发展中国家","南北差异","中等收入陷阱","新兴经济体"],"quiz":[{"lv":"jr","type":"choice","q":"划分发达国家与发展中国家最常用的指标是","opts":["国土面积","人口数量","经济发展水平","纬度位置"],"ans":2,"exp":"通常用人均 GDP、产业结构、工业化与城市化水平等综合判断，不是单一指标。","diff":1,"tag":["居民与聚落","发达国家与发展中国家","概念辨析"]},{"lv":"sr","type":"short","q":"说明为什么“人均 GDP 高”不足以判断一个国家是否发达。","ans":"人均 GDP 会被资源出口或单一产业抬高（如海湾产油国），但不代表产业结构完整、技术自主、公共服务与社会保障完善；还要看产业复杂度、教育医疗水平、贫富差距与区域差异。","exp":"要举出“资源型高收入”的反例，否则只是重复题干。","diff":2,"tag":["居民与聚落","发达国家与发展中国家","机制分析"]}]},{"id":"region-asia","kind":"concept","name":"亚洲与季风区","alias":["亚洲概况","亚洲气候","世界第一大洲","亚洲的地理位置","亚欧大陆东部"],"level":{"jr":"七年级下 · 我们生活的大洲——亚洲","sr":"必修三 · 区域地理"},"line":"面积最大、人口最多、跨纬度最广的大洲，也是海陆热力差异最极端、季风最典型的大洲。","why":"亚洲面积约 4400 万平方千米，南北跨纬度约 90°，东部和南部背靠世界最大的大陆、面朝世界最大的大洋——海陆热力差在这里被放到最大，季风于是最强、最典型。","mech":"同一个大洲内部反差极大：东部湿润多雨，中部深居内陆形成干旱的温带大陆性气候，北部伸入北极圈——纬度、海陆、地形三要素在亚洲被同时放大。","anchors":[{"iso":"CN","where":"中国东部","see":"季风区：雨热同期，人口与农业的密集带"},{"iso":"IN","where":"南亚","see":"西南季风爆发式到来，旱雨两季分明"},{"iso":"MN","where":"蒙古高原","see":"深居内陆，温带大陆性气候，干冷干热"},{"iso":"JP","where":"日本群岛","see":"岛国湿润，海洋性对季风的修正"}],"counter":"亚洲不是全都季风：中亚的乌兹别克斯坦几乎终年干燥——季风只属于海陆交界的大陆东岸，不会随“亚洲”这个标签自动生效。","next":[{"q":"季风的发动机是什么","to":"monsoon"},{"q":"中东为什么水比油贵","to":"middle-east-oil"}],"cite":"依据：亚洲与中、印、日、蒙档案的气候与位置字段；组内整理，未引用教材原文。","cat":"区域地理","sections":[{"h":"为什么","p":"面积最大、海陆反差极端，季风最强最典型。"},{"h":"内部差异","p":"东部湿润、中部干旱、北部入极圈——纬度、海陆、地形三要素同时被放大。"}],"media":{"svg":"region-asia","hint":"亚洲与季风区"},"tags":["亚洲","季风区","世界地理","区域地理","海陆位置"],"quiz":[{"lv":"jr","type":"choice","q":"亚洲东部和南部季风气候最典型，最主要的原因是","opts":["纬度跨度大","海陆热力性质差异显著","地形以高原为主","洋流影响强"],"ans":1,"exp":"世界最大的大陆面对世界最大的大洋，冬夏海陆气压差被放到最大。","diff":1,"tag":["区域地理","亚洲与季风区","季风成因"]},{"lv":"sr","type":"short","q":"简述亚洲气候复杂多样的成因（至少三条）。","ans":"①面积大、跨纬度广，跨寒温热三带；②东西距海远近悬殊，东部季风、中部大陆性；③地形起伏大，高原山地对气流抬升与阻挡明显。","exp":"纬度、海陆、地形三条要分开写，漏一条扣一层。","diff":2,"tag":["区域地理","亚洲与季风区","成因分析"]}]},{"id":"middle-east-oil","kind":"concept","name":"中东：石油与水资源","alias":["中东石油","波斯湾","中东水资源","石油宝库","两河流域"],"level":{"jr":"七年级下 · 东半球其他的地区和国家","sr":"必修二 · 资源与安全"},"line":"全球石油储量与出口量最集中的地区，同时也是水资源最紧缺的地区——“水比油贵”。","why":"波斯湾沿岸集中了全球一半以上的探明石油储量，油轮经霍尔木兹海峡输出；但这里大部分是热带沙漠气候，降水稀少、河流短少，水资源比能源更稀缺。","mech":"石油埋藏在波斯湾沿岸的沉积盆地，埋藏浅、油质好、成本低；石油带来财富却不带来水——国家间的河流、地下水与海水淡化，比石油更敏感。","anchors":[{"iso":"SA","where":"沙特阿拉伯","see":"波斯湾沿岸大油田，海水淡化规模全球第一"},{"iso":"IQ","where":"伊拉克","see":"两河流域：底格里斯河与幼发拉底河"},{"iso":"AE","where":"阿联酋","see":"迪拜：石油财富转向港口与金融"}],"counter":"中东不等于石油富豪：也门几乎不产油——把海湾六国的景象推广到整个中东，是媒体画面造成的错觉。","next":[{"q":"石油是在什么地质条件下埋藏的","to":"structures"},{"q":"干旱地区怎么搞农业","to":"oasis"}],"cite":"依据：沙特、伊拉克、阿联酋档案的位置与经济字段；组内整理，未引用教材原文。","cat":"区域地理","sections":[{"h":"为什么","p":"波斯湾沿岸沉积盆地储油，沙漠气候缺水——石油与水在同一片土地上倒挂。"},{"h":"地缘意义","p":"霍尔木兹海峡是全球石油运输的咽喉，中东局势牵动世界能源价格。"}],"media":{"svg":"middle-east-oil","hint":"中东：石油与水资源"},"tags":["中东","石油","波斯湾","水资源","霍尔木兹海峡"],"quiz":[{"lv":"jr","type":"choice","q":"中东石油主要分布在","opts":["地中海沿岸","波斯湾沿岸","红海沿岸","里海沿岸"],"ans":1,"exp":"波斯湾沿岸及其海底是全球石油储量和出口最集中的区域。","diff":1,"tag":["区域地理","中东：石油与水资源","能源分布"]},{"lv":"sr","type":"short","q":"解释中东“水比油贵”现象的形成原因。","ans":"油：波斯湾沿岸沉积盆地储油丰富、开采成本低，出口全球。水：大部分地区为热带沙漠气候，降水稀少、蒸发强烈、河流稀少，地下水与跨界河流成为争夺对象，只能依赖海水淡化与高价进口水。","exp":"要从“油多”与“水缺”两个相反条件分别落笔，缺一半扣一半。","diff":2,"tag":["区域地理","中东：石油与水资源","成因分析"]}]},{"id":"europe-west","kind":"concept","name":"欧洲西部：发达国家的密集带","alias":["欧洲西部","西欧","温带海洋性气候农业","欧盟"],"level":{"jr":"七年级下 · 欧洲西部","sr":"必修二 · 区域发展"},"line":"发达国家最集中的地区：温带海洋性气候 + 统一市场，把三十多个国家联成一片高收入区域。","why":"大部分位于 40°N—60°N 的大陆西岸，终年受西风带控制，加上北大西洋暖流增温增湿，冬季远比同纬度其他地区温和。","mech":"平原为主的地形让西风深入内陆，多雨多雾的天气适合多汁牧草——乳畜业发达；工业革命从这里起步，服务业与制造业至今占绝对主导。","anchors":[{"iso":"GB","where":"英国","see":"典型的温带海洋性气候：终年温和湿润"},{"iso":"FR","where":"法国","see":"平原农业与高端制造业并存"},{"iso":"NO","where":"挪威","see":"北大西洋暖流让高纬港口终年不冻"}],"counter":"温带海洋性气候不等于阳光充足：伦敦的纬度与中国漠河相当，冬天下午四点天黑——“温和湿润”说的是温差小、降水均匀，不是晴天多。","next":[{"q":"同为岛国，日本和英国差在哪","to":"cmp-jp-uk"},{"q":"这种气候怎么影响农业","to":"oceanic"}],"cite":"依据：英、法、挪档案的气候与经济字段；组内整理，未引用教材原文。","cat":"区域地理","sections":[{"h":"为什么","p":"纬度 + 西风 + 暖流 + 平原，四个条件叠加出温带海洋性气候。"},{"h":"经济","p":"工业革命的起源地，如今服务业与高端制造占绝对主导，欧盟统一市场放大规模效应。"}],"media":{"svg":"europe-west","hint":"欧洲西部：发达国家的密集带"},"tags":["欧洲西部","温带海洋性气候","发达国家","乳畜业","欧盟"],"quiz":[{"lv":"jr","type":"choice","q":"欧洲西部冬季比同纬度地区温和，主要原因是","opts":["地势低平","受西风带和北大西洋暖流影响","森林覆盖率高","人口密集"],"ans":1,"exp":"西风把暖湿空气从大西洋送上大陆，暖流进一步增温增湿。","diff":1,"tag":["区域地理","欧洲西部","气候成因"]},{"lv":"sr","type":"short","q":"分析温带海洋性气候对欧洲西部农业生产的影响。","ans":"有利：终年温和湿润，光照不足但多汁牧草生长旺盛，乳畜业发达。不利：光热不足，粮食作物与油料作物产量受限，谷物种植需要更多光照条件。","exp":"要答出“利于牧草、不利谷物”这一对矛盾，只写有利或只写不利都扣分。","diff":2,"tag":["区域地理","欧洲西部","气候与农业"]}]},{"id":"africa-sahel","kind":"concept","name":"撒哈拉以南非洲：资源与单一经济","alias":["撒哈拉以南非洲","黑非洲","单一商品经济","热带高原大陆"],"level":{"jr":"七年级下 · 撒哈拉以南非洲","sr":"必修二 · 人地关系"},"line":"热带高原大陆：矿产与生物资源丰富，却因出口初级产品、进口制成品而长期贫困。","why":"撒哈拉沙漠以南以热带草原和热带雨林气候为主；矿产、水能与生物资源丰富，但历史上长期被殖民掠夺，独立后经济结构仍未扭转。","mech":"“单一商品经济”：出口一两种矿产或农产品原料，价格受国际市场摆布；进口价高的工业制成品——剪刀差把资源财富留在了别人手里。","anchors":[{"iso":"NG","where":"尼日利亚","see":"石油出口国：油价的起落直接写进国家财政"},{"iso":"CD","where":"刚果民主共和国","see":"钴、铜等战略矿产富集，加工能力薄弱"},{"iso":"KE","where":"肯尼亚","see":"咖啡与鲜花出口，单一作物看天吃饭"}],"counter":"非洲不是“天然穷”：资源禀赋优于许多发达国家——落后的根源在历史与贸易结构，把账全记在气候或资源上是一种偏见。","next":[{"q":"同纬度为什么一边沙漠一边雨林","to":"cmp-sahara-amazon"},{"q":"发达国家与发展中国家的差别从哪来","to":"development"}],"cite":"依据：尼日利亚、刚果、肯尼亚档案的经济与气候字段；组内整理，未引用教材原文。","cat":"区域地理","sections":[{"h":"为什么","p":"热带草原与雨林气候为主，资源丰富，贸易结构却是“卖原料、买制成品”。"},{"h":"出路","p":"发展加工制造、区域合作与多样化种植，把产业链留在本国。"}],"media":{"svg":"africa-sahel","hint":"撒哈拉以南非洲：资源与单一经济"},"tags":["撒哈拉以南非洲","单一商品经济","初级产品","热带草原"],"quiz":[{"lv":"jr","type":"choice","q":"撒哈拉以南非洲长期落后的经济结构特征是","opts":["出口工业制成品","单一商品经济","以服务业为主","高科技产业主导"],"ans":1,"exp":"出口初级农矿产品、进口工业制成品，价格受国际市场支配。","diff":1,"tag":["区域地理","撒哈拉以南非洲","单一商品经济"]},{"lv":"sr","type":"short","q":"从贸易结构角度分析撒哈拉以南非洲经济落后的原因。","ans":"出口以初级农矿产品为主，附加值低且价格波动大；进口工业制成品价格高，形成贸易剪刀差；本国加工能力薄弱，产业链利润外流。","exp":"要写出“低卖高买”的机制，堆资源名称不给分。","diff":2,"tag":["区域地理","撒哈拉以南非洲","贸易结构"]}]},{"id":"china-four-regions","kind":"concept","name":"中国四大地理区域","alias":["四大地理区域","北方南方西北青藏","秦岭淮河","中国区域差异"],"level":{"jr":"八年级下 · 中国的地理差异","sr":"必修三 · 区域发展"},"line":"北方、南方、西北、青藏——每一条界线背后，都对应一种农业方式。","why":"秦岭—淮河一线（1 月 0℃ 等温线与 800mm 等降水量线重合处）分开北方与南方；400mm 等降水量线大体分开东部季风区与西北干旱区；昆仑山—祁连山—横断山托起地势第一、二级阶梯上的青藏区。","mech":"划分不是画着好看：北方旱地种麦、南方水田种稻、西北畜牧与灌溉农业、青藏高寒河谷农业——气候和地形给了条件，人就长出了对应的活法。","anchors":[{"iso":"CN","where":"北方地区（华北平原）","see":"旱地麦作，冬季河流结冰"},{"iso":"CN","where":"南方地区（长江中下游）","see":"水田稻作，河网纵横"},{"iso":"CN","where":"西北地区（新疆）","see":"绿洲农业，靠山麓冰雪融水"},{"iso":"CN","where":"青藏地区","see":"高寒气候，农业挤在河谷里"}],"counter":"秦岭—淮河不是一堵墙：它是两条线（0℃ 与 800mm）的重合过渡带——线上以南既有麦田也有水田，把过渡带当分界墙是常见的理解偏差。","next":[{"q":"雨带怎么在南北之间推移","to":"rain-belt"},{"q":"中国气候为什么复杂多样","to":"china-climate"}],"cite":"依据：中国档案的地形、气候与农业字段；组内整理，未引用教材原文。","cat":"中国地理","sections":[{"h":"为什么","p":"两条等值线 + 一级阶梯，画出四个生活方式完全不同的区域。"},{"h":"怎么用","p":"每个区域的农业类型、民居、交通方式都能从“气候 + 地形”推出来。"}],"media":{"svg":"china-four-regions","hint":"中国四大地理区域"},"tags":["四大地理区域","秦岭淮河","北方","南方","西北","青藏"],"quiz":[{"lv":"jr","type":"choice","q":"划分北方地区与南方地区的主导界线是","opts":["400mm 等降水量线","秦岭—淮河一线","昆仑山—祁连山","地势第二、三级阶梯界线"],"ans":1,"exp":"秦岭—淮河是 1 月 0℃ 等温线与 800mm 等降水量线的重合带。","diff":1,"tag":["中国地理","中国四大地理区域","界线"]},{"lv":"sr","type":"short","q":"列举秦岭—淮河一线的地理意义（不少于三条）。","ans":"①1 月 0℃ 等温线经过；②800mm 年等降水量线经过；③暖温带与亚热带分界；④湿润区与半湿润区分界；⑤旱地与水田的大致分界；⑥河流有无结冰期的分界。","exp":"答出任意三条即可，成对出现（温带/降水）更有说服力。","diff":2,"tag":["中国地理","中国四大地理区域","地理意义"]}]},{"id":"rain-belt","kind":"concept","name":"中国雨带推移","alias":["雨带推移","梅雨","南涝北旱","夏季风进退","副热带高压"],"level":{"jr":"八年级上 · 中国的气候","sr":"必修一 · 常见天气系统"},"line":"中国东部的雨带 4—9 月随夏季风北进南退：季风走到哪，雨就下到哪。","why":"5 月雨带徘徊在华南沿海，6 月北跳长江中下游形成梅雨，7—8 月推进到华北、东北，9 月随冬季风南下迅速撤回——一步不乱地跟着副热带高压脊线走。","mech":"副高北抬，雨带跟着北跳；副高位置异常（停留过久或过快北上），就会造成“南涝北旱”或“北涝南旱”的极端年份。","anchors":[{"iso":"CN","where":"华南","see":"5—6 月前汛期：雨带第一站"},{"iso":"CN","where":"长江中下游","see":"6 月中旬入梅，梅雨连月"},{"iso":"CN","where":"华北","see":"7—8 月雨季，全年降水大头"}],"counter":"梅雨不是全国下雨：6 月长江梅雨时华北还在旱——雨带是一条几千公里长的窄带，走到哪淋到哪，其它地方该旱还是旱。","next":[{"q":"季风的发动机是什么","to":"monsoon"},{"q":"锋面和雨带有什么关系","to":"fronts"}],"cite":"依据：中国档案的气候字段与季风常识；组内整理，未引用教材原文。","cat":"中国地理","sections":[{"h":"为什么","p":"夏季风推进到哪，冷暖气流交汇的锋面雨带就到哪。"},{"h":"异常年份","p":"副高强弱与位置异常，直接对应南涝北旱或北涝南旱。"}],"media":{"svg":"rain-belt","hint":"中国雨带推移","img":"china-rainbelt"},"tags":["雨带","梅雨","夏季风","副热带高压","南涝北旱"],"quiz":[{"lv":"jr","type":"choice","q":"我国东部雨带推移到华北、东北地区的时间大约是","opts":["4—5 月","6 月","7—8 月","9—10 月"],"ans":2,"exp":"夏季风 7—8 月最强北进，锋面雨带随之到达华北。","diff":1,"tag":["中国地理","中国雨带推移","时间"]},{"lv":"sr","type":"short","q":"说明副热带高压位置异常如何导致“南涝北旱”。","ans":"副高位置偏南、长期停留在南方：锋面雨带滞留长江流域，南方雨季过长形成涝灾，北方受夏季风影响时间缩短形成旱灾——雨带南北摆动的时间差被拉大。","exp":"要点：副高位置决定雨带位置，雨带滞留地涝、雨带未到地旱。","diff":2,"tag":["中国地理","中国雨带推移","机制分析"]}]},{"id":"earthquake","kind":"concept","name":"地震与板块构造","alias":["地震","火山地震带","环太平洋地震带","中国的自然灾害"],"level":{"jr":"八年级上 · 中国的自然灾害","sr":"必修一 · 地质构造"},"line":"全球 85% 以上的强震发生在板块边界——中国多震，是因为恰好被两大火山地震带夹住。","why":"板块碰撞与错动的能量在岩层中累积，超过岩层承受极限的瞬间释放就是地震。地中海—喜马拉雅带与环太平洋带是全球地震最集中的两条带。","mech":"中国位于环太平洋火山地震带与地中海—喜马拉雅火山地震带之间：台湾在太平洋板块与亚欧板块碰撞的前缘，西南的青藏高原东缘是印度洋板块俯冲挤压的产物。","anchors":[{"iso":"JP","where":"日本","see":"环太平洋带上最活跃的一段，每年有感地震上千次"},{"iso":"ID","where":"印度尼西亚","see":"三大板块交界的群岛，强震与海啸多发"},{"iso":"CN","where":"中国西南","see":"青藏高原东缘：板块挤压的能量释放区"}],"counter":"板块内部也会地震：华北平原远离板块边界却发生过唐山大地震——板内断裂带同样能积累能量，“离边界远就安全”是错觉。","next":[{"q":"板块是怎么运动的","to":"plate"},{"q":"台风和寒潮算哪类灾害","to":"typhoon-coldwave"}],"cite":"依据：日、印尼、中档案的位置与地形字段；组内整理，未引用教材原文。","cat":"自然灾害","sections":[{"h":"为什么","p":"板块边界能量集中释放，两条地震带覆盖了全球绝大多数强震。"},{"h":"中国的位置","p":"两大火山地震带之间，台湾与西南是能量释放最集中的区域。"}],"media":{"svg":"earthquake","img":"global-seismicity","hint":"地震与板块构造"},"tags":["地震","板块构造","环太平洋地震带","自然灾害"],"quiz":[{"lv":"jr","type":"choice","q":"我国地震多发的主要原因是","opts":["地处两大火山地震带之间","地势西高东低","季风气候不稳定","河流含沙量大"],"ans":0,"exp":"环太平洋带与地中海—喜马拉雅带在中国交汇影响。","diff":1,"tag":["自然灾害","地震与板块构造","成因"]},{"lv":"sr","type":"short","q":"用板块构造学说解释日本多地震的原因。","ans":"日本位于太平洋板块与亚欧板块的碰撞挤压边界（环太平洋火山地震带），板块交界处岩层活动强烈，能量释放频繁，因此多火山与地震。","exp":"要素：板块名称 + 边界类型 + 能量释放，缺一扣一层。","diff":2,"tag":["自然灾害","地震与板块构造","板块分析"]}]},{"id":"typhoon-coldwave","kind":"concept","name":"台风与寒潮","alias":["台风","寒潮","灾害性天气","西北太平洋台风"],"level":{"jr":"八年级上 · 中国的自然灾害","sr":"必修一 · 常见天气系统"},"line":"影响中国的两种灾害性天气：一个从热带海上带来狂风暴雨，一个从北方带来大风降温。","why":"台风生成于热带洋面（西北太平洋最活跃），夏秋季登陆东南沿海；寒潮源自西伯利亚—蒙古一带的冷高压，冬半年南下，24 小时降温 10℃ 以上并伴大风。","mech":"两者都是大尺度天气系统：台风靠海水蒸发供能，登陆后失去水汽来源迅速减弱；寒潮是冷高压爆发式南下，带来的不只是降温，还有沙尘、霜冻与暴雪。","anchors":[{"iso":"PH","where":"菲律宾以东洋面","see":"台风的典型源地与走廊"},{"iso":"CN","where":"东南沿海","see":"台风登陆最频繁的地带"},{"iso":"MN","where":"蒙古高原","see":"寒潮南下的必经门户"}],"counter":"台风不全有害：盛夏伏旱期，台风降雨常常正好缓解东南沿海的旱情——灾害性天气也在参与水分平衡，别把它只当坏消息。","next":[{"q":"锋面雨是怎么下的","to":"fronts"},{"q":"雨带走到华北是什么时候","to":"rain-belt"}],"cite":"依据：中、菲、蒙档案的气候字段与天气常识；组内整理，未引用教材原文。","cat":"自然灾害","sections":[{"h":"台风","p":"热带气旋：暖海面供能，狂风 + 暴雨 + 风暴潮，登陆减弱。"},{"h":"寒潮","p":"冷高压南下：大风、降温、霜冻、沙尘，冬半年主力。"}],"media":{"svg":"typhoon-coldwave","hint":"台风与寒潮"},"tags":["台风","寒潮","灾害性天气","冷高压","热带气旋"],"quiz":[{"lv":"jr","type":"choice","q":"影响中国的台风主要生成于","opts":["地中海","西北太平洋热带洋面","蒙古高原","印度洋西部"],"ans":1,"exp":"高温高湿的热带洋面是台风的能量来源，西北太平洋是全球最活跃的生成区。","diff":1,"tag":["自然灾害","台风与寒潮","源地"]},{"lv":"sr","type":"short","q":"比较台风与寒潮在源地、发生季节与天气表现上的差异。","ans":"源地：台风生成于热带洋面，寒潮源于西伯利亚—蒙古冷高压。季节：台风夏秋为主，寒潮多在冬半年。天气：台风带来狂风、特大暴雨与风暴潮；寒潮带来剧烈降温、大风、霜冻与沙尘。","exp":"三要素逐项对比，混答扣半。","diff":2,"tag":["自然灾害","台风与寒潮","对比分析"]}]},{"id":"loess-plateau","kind":"concept","name":"黄土高原：水土流失与治理","alias":["黄土高原","水土流失","小流域治理","打坝淤地"],"level":{"jr":"八年级下 · 黄土高原","sr":"必修三 · 生态脆弱区的治理"},"line":"世界最大的黄土堆积区，也是水土流失最严重的地区之一。","why":"黄土结构疏松、垂直节理发育，夏季降水集中且多暴雨，加上历史上植被破坏——疏松的土、集中的雨、稀疏的植被三者叠加，沟壑不断加深加宽。","mech":"治理是“工程 + 生物 + 农业”三件套：打坝淤地、修梯田是工程，植树种草是生物，退耕还林还草与轮作是农业技术——小流域综合治理是标准答案的框架。","anchors":[{"iso":"CN","where":"黄土高原（黄河中游）","see":"沟壑纵横：千沟万壑是水一刀一刀刻出来的"}],"counter":"水土流失不全是人为：黄土本身就是风从西北内陆搬运来的——没有人类砍伐之前，“暴雨 + 疏松黄土 + 植被稀疏”的组合照样在侵蚀，人类只是把速率放大了。","next":[{"q":"四大区域里它属于哪个","to":"china-four-regions"},{"q":"黄河为什么含沙量这么大","to":"rivers"}],"cite":"依据：中国档案的地形与河流字段；组内整理，未引用教材原文。","cat":"中国地理","sections":[{"h":"为什么","p":"疏松黄土 + 暴雨 + 植被破坏，三个条件同时在场，侵蚀速率被放大。"},{"h":"怎么治","p":"小流域综合治理：工程、生物、农业技术三管齐下。"}],"media":{"svg":"loess-plateau","hint":"黄土高原：水土流失与治理","img":"loess-plateau"},"tags":["黄土高原","水土流失","小流域治理","黄河"],"quiz":[{"lv":"jr","type":"choice","q":"黄土高原水土流失严重的人为原因主要是","opts":["黄土结构疏松","降水集中多暴雨","植被破坏与不合理开垦","沟壑纵横地形破碎"],"ans":2,"exp":"前三项都是自然原因，只有人类活动是人为原因。","diff":1,"tag":["中国地理","黄土高原","人为原因"]},{"lv":"sr","type":"short","q":"按“工程措施、生物措施、农业技术措施”分类说明小流域综合治理的做法。","ans":"工程措施：打坝淤地、修水平梯田、建水库。生物措施：植树种草、封山育林。农业技术措施：合理轮作、退耕还林还草、改进耕作方式。","exp":"三类各举至少一例，归类错误不给分。","diff":2,"tag":["中国地理","黄土高原","治理措施"]}]},{"id":"service-industry","kind":"concept","name":"服务业与产业升级","alias":["第三产业","服务业","产业结构","产业升级"],"level":{"jr":"八年级上 · 经济发展","sr":"必修二 · 产业区位"},"line":"经济越发达，服务业（第三产业）占比越高——这是产业结构演进的通用规律。","why":"三次产业比重随经济发展“退一、稳二、进三”：农业比重下降，工业先升后稳，服务业持续上升；发达经济体服务业占比普遍在 70% 以上。","mech":"服务业依赖人口密度、交通与技术：城市越大、越是交通枢纽和科技中心，服务业越发达。产业升级的本质，是把劳动力与资本从低附加值部门移向高附加值部门。","anchors":[{"iso":"US","where":"美国","see":"服务业占 GDP 约 8 成，制造业回流是政治话题"},{"iso":"IN","where":"印度","see":"软件服务外包跳过制造业阶段的结构样本"},{"iso":"CN","where":"中国东部沿海","see":"从世界工厂到制造 + 服务双轮"}],"counter":"服务业占比高不等于“更先进”：一些资源型国家服务业虚高、工业空心化——判断产业水平要结合就业质量与附加值，不能只看百分比。","next":[{"q":"发达国家与发展中国家的差距","to":"development"},{"q":"工业为什么还在中国","to":"industry-location"}],"cite":"依据：美、印、中档案的经济字段；组内整理，未引用教材原文。","cat":"人文地理","sections":[{"h":"为什么","p":"收入提高 → 消费结构变化 → 服务业需求扩张，规律近乎普适。"},{"h":"怎么看","p":"比重只是一半，另一半看就业质量与附加值。"}],"media":{"svg":"service-industry","hint":"服务业与产业升级"},"tags":["服务业","第三产业","产业结构","产业升级"],"quiz":[{"lv":"jr","type":"choice","q":"三次产业结构随经济发展演进的一般规律是","opts":["第一产业比重持续上升","第二产业比重无限扩大","第三产业比重不断上升","三次产业比重不变"],"ans":2,"exp":"收入提高带动服务消费扩张，第三产业比重持续上升。","diff":1,"tag":["人文地理","服务业与产业升级","规律"]},{"lv":"sr","type":"short","q":"为什么发达国家服务业比重普遍较高？","ans":"①收入水平高，消费结构偏向服务；②制造业自动化释放劳动力；③城市密集与交通便利支撑服务业集聚；④科技与金融等生产性服务业需求大。","exp":"从需求侧与供给侧各答一半，只答消费升级不完整。","diff":2,"tag":["人文地理","服务业与产业升级","成因"]}]},{"id":"cmp-jp-uk","kind":"compare","name":"日本 vs 英国 · 同为岛国","alias":["日本和英国","日英对比","两个岛国"],"level":{"jr":"七年级下 · 地区与国家","sr":"必修二 · 地域文化"},"a":"JP","b":"GB","dim":"岛国的发展路径","rows":[{"k":"海陆位置","a":"大陆东岸，面对太平洋","b":"大陆西岸，面对大西洋"},{"k":"气候","a":"季风气候，海洋性明显","b":"温带海洋性气候，终年温和"},{"k":"资源","a":"矿产贫乏，依赖进口","b":"煤铁较早开发，能源逐步依赖进口"},{"k":"近代路径","a":"明治维新后快速工业化","b":"工业革命的发源地"}],"why":"同为岛国，日本在大陆东岸吃季风，英国在大陆西岸吃西风——位置决定气候，气候决定农业与生活，贸易与技术决定命运。","counter":"“岛国＝海洋性气候”不成立：日本本州北部冬季多雪，比英国冷得多——西北季风掠过日本海拾起水汽，在同纬度上制造了截然不同的冬天。","next":[{"q":"季风怎么翻转","to":"monsoon"},{"q":"欧洲西部为什么温和","to":"europe-west"}],"cite":"依据：日、英档案的位置、气候与经济字段；组内整理，未引用教材原文。","cat":"区域对比","sections":[{"h":"为什么","p":"东西岸之差，是季风与西风之差，也是两条近代化路径之差。"}],"media":{"svg":"cmp-jp-uk","hint":"日本 vs 英国 · 同为岛国"},"tags":["日本","英国","岛国","对比"],"quiz":[{"lv":"jr","type":"choice","q":"日本与英国气候差异的根本原因是","opts":["国土面积不同","分别位于大陆东岸与西岸","人口密度不同","纬度相差悬殊"],"ans":1,"exp":"大陆东岸受季风控制，大陆西岸受西风带控制，位置决定气候。","diff":1,"tag":["区域对比","日本 vs 英国 · 同为岛国","海陆位置"]},{"lv":"sr","type":"short","q":"比较日本与英国在气候类型上的差异并分析原因。","ans":"日本：季风气候为主，冬夏风向相反，南部亚热带、北部温带，海洋性强但冬季西北季风带来降雪。英国：全年受西风带与北大西洋暖流影响，温带海洋性气候，终年温和湿润、降水均匀。原因：海陆位置（大陆东岸 vs 西岸）决定了受控的大气环流系统不同。","exp":"先答现象再答机制，“东岸季风、西岸西风”是核心得分点。","diff":2,"tag":["区域对比","日本 vs 英国 · 同为岛国","气候对比"]}]},{"id":"cmp-north-south","kind":"compare","name":"中国北方 vs 南方 · 一条秦岭淮河","alias":["南北方差异","秦岭淮河南北","北方南方对比"],"level":{"jr":"八年级下 · 四大地理区域","sr":"必修一 · 中国气候"},"a":"CN","b":"CN","dim":"南北差异","rows":[{"k":"界线","a":"秦岭—淮河以北","b":"秦岭—淮河以南"},{"k":"气温","a":"1 月均温 < 0℃，河流结冰","b":"1 月均温 > 0℃，河流不结冰"},{"k":"降水","a":"年降水 < 800mm，半湿润","b":"年降水 > 800mm，湿润"},{"k":"耕地","a":"旱地为主","b":"水田为主"},{"k":"作物","a":"小麦、玉米、甜菜","b":"水稻、油菜、甘蔗"},{"k":"交通","a":"公路铁路为主","b":"传统上水运占优"}],"why":"一条秦岭—淮河把中国东部切成两种农业文明：北旱地南水田、北面南米——气候给的条件不同，人地适应方式就不同。","counter":"南北差异在缩小：南水北调、大棚技术与商品粮流通让北方冬天也有鲜菜——自然条件决定初始禀赋，技术可以改写一部分结果。","next":[{"q":"四大区域怎么划分","to":"china-four-regions"},{"q":"中国气候为什么复杂","to":"china-climate"}],"cite":"依据：中国档案的气候与农业字段；组内整理，未引用教材原文。","cat":"中国地理","sections":[{"h":"为什么","p":"0℃ 与 800mm 两条线重合处，是南北方的分水岭。"}],"media":{"svg":"cmp-north-south","hint":"中国北方 vs 南方 · 一条秦岭淮河"},"tags":["南北方","秦岭淮河","旱地水田","中国地理"],"quiz":[{"lv":"jr","type":"choice","q":"造成我国南北方耕作制度差异的主要因素是","opts":["地形","气候（热量与降水）","土壤颜色","人口密度"],"ans":1,"exp":"热量决定熟制，降水决定水田旱地，气候是主因。","diff":1,"tag":["中国地理","中国北方 vs 南方 · 一条秦岭淮河","耕作制度"]},{"lv":"sr","type":"short","q":"从气候角度解释我国“北麦南稻”格局的形成。","ans":"北方：1 月均温低于 0℃、年降水 400—800mm，热量与水分适合旱地小麦、玉米等作物。南方：1 月均温高于 0℃、年降水 800mm 以上，水热充足且雨热同期，适合水稻等喜湿喜热作物。气候条件决定土地利用方式，进而塑造作物格局。","exp":"“条件 → 土地利用 → 作物”三步链，跳步扣分。","diff":2,"tag":["中国地理","中国北方 vs 南方 · 一条秦岭淮河","北麦南稻"]}]},{"id":"cmp-sahara-amazon","kind":"compare","name":"撒哈拉 vs 亚马孙 · 同纬度不同命运","alias":["撒哈拉和亚马孙","沙漠雨林对比","同纬度不同气候"],"level":{"jr":"七年级上 · 世界的气候","sr":"必修一 · 地理环境差异性"},"a":"NE","b":"BR","dim":"大气环流","rows":[{"k":"纬度","a":"北回归线附近","b":"赤道附近"},{"k":"环流","a":"副热带高压：气流下沉","b":"赤道低压：气流上升"},{"k":"降水","a":"多数地区不足 50mm","b":"多数地区超过 2000mm"},{"k":"植被","a":"热带荒漠","b":"热带雨林"},{"k":"人口","a":"稀少，沿河沿海分布","b":"雨林内稀少，河口城市集中"}],"why":"决定植被的不是纬度而是大气环流：下沉气流的地方成沙漠，上升气流的地方成雨林——纬度相近，命运相反。","counter":"撒哈拉曾经是草原：几千年前这里湖泊成群、河马出没——把“沙漠＝永远干旱”当成永恒，会错过气候变迁的证据。","next":[{"q":"气压带是怎么形成的","to":"pressure-belts"},{"q":"沙漠里怎么种东西","to":"oasis"}],"cite":"依据：尼日尔、巴西档案的气候字段与环流常识；组内整理，未引用教材原文。","cat":"世界气候","sections":[{"h":"为什么","p":"副高下沉 → 蒸发大于降水 → 荒漠；赤道低压上升 → 对流旺盛 → 雨林。"}],"media":{"svg":"cmp-sahara-amazon","hint":"撒哈拉 vs 亚马孙 · 同纬度不同命运"},"tags":["撒哈拉","亚马孙","热带沙漠气候","热带雨林气候","大气环流"],"quiz":[{"lv":"jr","type":"choice","q":"撒哈拉沙漠形成的主要原因是大面积受","opts":["赤道低压带控制","副热带高压带控制","西风带控制","季风控制"],"ans":1,"exp":"副热带高压控制下气流下沉，难以成云致雨。","diff":1,"tag":["世界气候","撒哈拉 vs 亚马孙 · 同纬度不同命运","环流"]},{"lv":"sr","type":"short","q":"同在低纬度，为什么亚马孙是雨林而撒哈拉是荒漠？","ans":"亚马孙：常年受赤道低压带控制，气流上升对流旺盛，多对流雨，水热充足形成雨林。撒哈拉：受副热带高压带下沉气流控制，水汽难以凝结，且沿岸离岸风与寒流加剧干旱，形成荒漠。差异的根源是大气环流而非纬度。","exp":"关键得分点是“上升 vs 下沉”两套垂直运动。","diff":2,"tag":["世界气候","撒哈拉 vs 亚马孙 · 同纬度不同命运","机制分析"]}]},{"id":"cmp-plains","kind":"compare","name":"东北平原 vs 美国中部平原","alias":["东北平原美国平原","商品粮基地对比","两大平原"],"level":{"jr":"八年级上 · 中国的农业","sr":"必修二 · 农业地域"},"a":"CN","b":"US","dim":"商品粮基地","rows":[{"k":"纬度","a":"约 40°—50°N","b":"约 35°—45°N"},{"k":"气候","a":"温带季风，雨热同期但冬冷","b":"温带大陆性，温差大降水较少"},{"k":"土壤","a":"黑土黑钙土，有机质高","b":"黑土带，世界最肥沃之一"},{"k":"作物","a":"春小麦、玉米、大豆、水稻","b":"小麦、玉米、大豆、棉花"},{"k":"问题","a":"低温冻害与黑土退化","b":"历史上有黑风暴教训"}],"why":"同是“平地 + 缓坡 + 土层深厚”的商品粮摇篮：一个靠季风的雨热同期，一个靠大陆性气候的大温差——禀赋相似，机制不同。","counter":"黑土地不是取之不尽：两地都吃过土壤退化亏——东北黑土层变薄，美国 1930 年代黑风暴卷走上亿吨表土。高产背后都有养护成本。","next":[{"q":"中国的农业怎么分布","to":"agri-china"},{"q":"农业区位怎么分析","to":"agri-location"}],"cite":"依据：中美档案的地形、气候与农业字段；组内整理，未引用教材原文。","cat":"农业对比","sections":[{"h":"为什么","p":"地形与土壤给了同样的可能性，气候差异决定种什么、怎么种。"}],"media":{"svg":"cmp-plains","hint":"东北平原 vs 美国中部平原"},"tags":["东北平原","美国中部平原","商品粮","黑土"],"quiz":[{"lv":"jr","type":"choice","q":"东北平原发展商品粮生产的最突出优势是","opts":["单位面积产量全国最高","地广人稀、商品率高","全年高温多雨","靠近热带市场"],"ans":1,"exp":"人均耕地多、机械化程度高，粮食商品率高。","diff":1,"tag":["农业对比","东北平原 vs 美国中部平原","商品粮"]},{"lv":"sr","type":"short","q":"两地都是黑土带商品粮基地，面临的主要生态问题分别是什么？","ans":"东北平原：黑土层因风蚀水蚀与过度垦殖而变薄、有机质下降。美国中部平原：历史上过度开垦叠加干旱，1930 年代爆发“黑风暴”，表土被大规模吹蚀。共同教训：高产必须配套土壤养护（轮作、留茬、防护林）。","exp":"两地各答一个具体问题 + 一条共同教训。","diff":2,"tag":["农业对比","东北平原 vs 美国中部平原","生态问题"]}]},{"id":"cmp-delta","kind":"compare","name":"尼罗河三角洲 vs 长江三角洲","alias":["尼罗河三角洲长江三角洲","三角洲对比","两大三角洲"],"level":{"jr":"七年级上 · 居民与聚落","sr":"必修二 · 城镇化"},"a":"EG","b":"CN","dim":"三角洲的开发","rows":[{"k":"河流","a":"尼罗河，世界第一长河","b":"长江，中国第一大河"},{"k":"气候","a":"地中海气候向沙漠气候过渡","b":"亚热带季风气候"},{"k":"农业","a":"长绒棉闻名世界","b":"水稻、油菜、蚕桑"},{"k":"城市","a":"开罗：非洲最大城市之一","b":"上海：中国最大的经济中心"},{"k":"共同问题","a":"泥沙减少后海岸侵蚀","b":"地面沉降与海水倒灌压力"}],"why":"三角洲都是“河流泥沙 + 平缓地形 + 充足水源”的产物：农业与城市自然向这里聚集——两条大河的三角洲分别是埃及和中国的经济心脏。","counter":"三角洲也有烦恼：上游建坝拦沙之后泥沙补给减少，叠加地面沉降，两个三角洲都在与海平面“赛跑”——肥沃与脆弱是一体两面。","next":[{"q":"中国的河流长什么样","to":"rivers"},{"q":"城市为什么会长大","to":"urbanization"}],"cite":"依据：埃及、中国档案的河流、气候与城市字段；组内整理，未引用教材原文。","cat":"人文地理","sections":[{"h":"为什么","p":"泥沙、水源、平地三要素让三角洲成为人口与城市的聚集地。"}],"media":{"svg":"cmp-delta","hint":"尼罗河三角洲 vs 长江三角洲"},"tags":["尼罗河","长江","三角洲","开罗","上海"],"quiz":[{"lv":"jr","type":"choice","q":"三角洲地区农业发达、城市密集的共同原因是","opts":["地势高峻水流急","地形平坦、土壤肥沃、水源充足","矿产资源丰富","气候寒冷蒸发弱"],"ans":1,"exp":"冲积平原土层深厚肥沃，灌溉水源稳定，宜农宜居。","diff":1,"tag":["人文地理","尼罗河三角洲 vs 长江三角洲","区位"]},{"lv":"sr","type":"short","q":"为什么说三角洲地区“肥沃与脆弱并存”？","ans":"肥沃：河流泥沙沉积形成深厚肥沃土壤，水源充足，农业与城市高度发育。脆弱：上游建坝拦沙使泥沙补给减少，海岸侵蚀加剧；地势低平叠加地面沉降，面临海水倒灌与洪涝风险。","exp":"两面都要答，只答肥沃只给一半。","diff":2,"tag":["人文地理","尼罗河三角洲 vs 长江三角洲","辩证分析"]}]},{"id":"japan","kind":"concept","name":"日本：岛国怎么活成经济大国","alias":["日本","日本经济","加工贸易","太平洋沿岸工业带","濑户内海"],"level":{"jr":"七年级下 · 我们邻近的地区和国家（日本）","sr":"区域地理 · 岛国经济与工业布局"},"line":"山地占 3/4、资源贫乏、多火山地震的岛国，靠\"进口原料—加工—出口产品\"挤进发达国家前列。","why":"国土四分之三是山地丘陵，平原狭小且大多在沿海；工业所需的原料、燃料绝大部分靠进口，国内市场又小。唯一能规模利用的交通是海运，于是工厂只能建在港湾旁边。","mech":"工业集中在太平洋沿岸和濑户内海沿岸：深水良港可停大船、填海造陆有平地、铁路与劳动力密集、便于进口原料和出口产品。农业精耕细作，稻米自给，渔业发达。文化上东西兼容。","anchors":[{"iso":"JP","where":"日本","see":"太平洋沿岸工业带：东京—名古屋—大阪—北九州"},{"iso":"AU","where":"澳大利亚","see":"铁矿石、煤炭的主要供应地之一"},{"iso":"CN","where":"中国","see":"日本最大的进口来源国与出口市场之一"}],"counter":"\"缺资源就发展不了工业\"是错觉。日本把资源缺乏逼成了效率：单位 GDP 能耗全球最低之一、海运摊薄了运费。代价同样真实——航线一断，工厂就停。","next":[{"q":"季风为什么雨热同期","to":"monsoon"},{"q":"东南亚也是岛国和半岛组成的","to":"se-asia"}],"cite":"依据：人教版七年级下册第七章第一节；组内整理，未引用教材原文。","cat":"区域地理","sections":[{"h":"位置与地形","p":"太平洋西北的群岛国家，海岸线曲折多良港；山地丘陵占 3/4，平原集中在沿海。"},{"h":"经济模式","p":"加工贸易型：进口原料燃料 → 加工 → 出口工业品，工业带贴海岸线布局。"}],"media":{"svg":"japan","hint":"日本：岛国经济的有利与不利","img":"japan-topo"},"tags":["日本","加工贸易","工业布局","岛国"],"quiz":[{"lv":"jr","type":"choice","q":"日本工业集中分布在太平洋沿岸，主要原因是","opts":["沿海平原广阔、多良港，便于进口原料和出口产品","沿海地区矿产资源丰富","沿海地区气候温暖湿润","为了避开地震带"],"ans":0,"exp":"加工贸易型经济要\"两头在外\"，靠海运和港口。","diff":1,"tag":["区域地理","日本","工业布局"]},{"lv":"sr","type":"short","q":"说明日本发展加工贸易型经济的条件与代价。","ans":"条件：岛国多良港、海运便利；国内资源贫乏、市场狭小，只能进口原料、出口产品；沿海平原有填海造陆空间，铁路与劳动力集中。代价：对国际市场和海上航线高度依赖，原料或市场波动会直接冲击工业。","exp":"要答出\"条件（港湾、资源、市场）\"与\"代价（依赖外部）\"两层。","diff":2,"tag":["区域地理","日本","辩证分析"]}]},{"id":"se-asia","kind":"concept","name":"东南亚：十字路口的稻米与橡胶","alias":["东南亚","马六甲海峡","中南半岛","马来群岛","热带季风气候","橡胶"],"level":{"jr":"七年级下 · 东南亚","sr":"区域地理 · 热带农业与交通位置"},"line":"两洲两洋之间的十字路口，热带雨林与热带季风并存，稻米自给、橡胶与棕榈油出口世界第一。","why":"中南半岛山河相间、南北纵列，河流下游形成三角洲；马来群岛位于板块交界，多火山与肥沃火山土。赤道附近终年高温多雨形成热带雨林；10°—20° 纬度带受季风控制，有明显旱雨季，是热带季风气候。","mech":"人口与城市集中在河流沿岸和河口三角洲：地形平坦、水源充足、水运与海运便利。马六甲海峡扼守太平洋与印度洋之间最短航线，新加坡靠转口贸易与炼油起家。","anchors":[{"iso":"SG","where":"新加坡","see":"马六甲东端的转口贸易与炼油中心"},{"iso":"TH","where":"泰国","see":"天然橡胶与稻米出口大国，湄南河三角洲"},{"iso":"ID","where":"印度尼西亚","see":"全球最大棕榈油生产国，火山最多的群岛"}],"counter":"\"热带就一定穷\"不成立：新加坡就在赤道边上，是发达国家。位置（转口港）与制度，比气候更能解释贫富。","next":[{"q":"季风的成因","to":"monsoon"},{"q":"印度也靠季风吃饭","to":"india"}],"cite":"依据：人教版七年级下册第七章第二节；组内整理，未引用教材原文。","cat":"区域地理","sections":[{"h":"十字路口","p":"连接亚洲与大洋洲、太平洋与印度洋，马六甲海峡是最短航线的咽喉。"},{"h":"热带物产","p":"热带雨林与热带季风两种气候，水稻一年两到三熟，橡胶、棕榈油、椰子大量出口。"}],"media":{"svg":"se-asia","hint":"东南亚：位置—地形—气候—农业—城市","img":"malacca"},"tags":["东南亚","马六甲海峡","热带雨林","热带季风","稻米"],"quiz":[{"lv":"jr","type":"choice","q":"东南亚城市多分布在河流沿岸和河口三角洲，主要原因是","opts":["地形平坦、水源充足、水运便利","矿产资源丰富","气候凉爽宜人","远离火山地震带"],"ans":0,"exp":"河口三角洲\"地平、水足、运得出\"，是人口与城市的第一选择。","diff":1,"tag":["区域地理","东南亚","城市分布"]},{"lv":"sr","type":"short","q":"分析马六甲海峡地理位置的重要性。","ans":"马六甲海峡位于马来半岛与苏门答腊岛之间，是连接太平洋与印度洋的最短航线，也是东亚通往南亚、中东、欧洲的必经通道，航运量大；沿岸新加坡借此发展转口贸易与炼油工业。","exp":"要素：连接哪两洋 + 最短航线 + 对东亚的意义。","diff":2,"tag":["区域地理","东南亚","交通位置"]}]},{"id":"india","kind":"concept","name":"印度：西南季风决定丰歉","alias":["印度","西南季风","热带季风气候","服务外包","班加罗尔","乞拉朋齐"],"level":{"jr":"七年级下 · 印度","sr":"区域地理 · 季风农业与旱涝"},"line":"一年分三季，6—9 月的西南季风带来全年八成降水——它早来晚来、强一点弱一点，就是洪涝与干旱。","why":"南亚季风由海陆热力差叠气压带风带季节移动形成：夏季赤道低压北移，东南信风越过赤道右偏成西南季风，从印度洋带来大量水汽。","mech":"季风不稳定使降水年际变化大，旱涝频繁。德干高原西北部位于西高止山背风侧，降水少；东北部乞拉朋齐在迎风坡，是世界雨极。耕地面积居亚洲前列，水稻与小麦为主；班加罗尔凭英语人才与政策做软件与信息服务外包。","anchors":[{"iso":"IN","where":"印度","see":"西南季风、德干高原、班加罗尔"},{"iso":"BD","where":"孟加拉国","see":"乞拉朋齐下游，洪涝最重的三角洲"},{"iso":"CN","where":"中国","see":"同为季风农业，雨热同期但季风强弱不同"}],"counter":"\"热带就干旱\"不成立：乞拉朋齐年降水超过一万毫米。印度的干旱不是总量不足，是季风不稳定加上分布不均。","next":[{"q":"季风到底怎么形成的","to":"monsoon"},{"q":"中国雨带也是这么推移的","to":"rain-belt"}],"cite":"依据：人教版七年级下册第七章第三节；组内整理，未引用教材原文。","cat":"区域地理","sections":[{"h":"三季与季风","p":"3—5 月热季、6—9 月雨季、10 月至次年 2 月凉季；雨季降水占全年约 80%。"},{"h":"农业与产业","p":"水稻小麦为主，旱涝频繁；软件外包靠英语人才与政策，与农业并存。"}],"media":{"svg":"india","hint":"印度：西南季风强弱与旱涝","img":"india-monsoon"},"tags":["印度","西南季风","旱涝","服务外包"],"quiz":[{"lv":"jr","type":"choice","q":"印度旱涝灾害频繁，主要原因是","opts":["西南季风强弱与进退时间不稳定","地势中间高四周低","河流含沙量太大","常年受副热带高压控制"],"ans":0,"exp":"季风带来全年 80% 降水，强弱与迟早直接决定旱涝。","diff":1,"tag":["区域地理","印度","旱涝成因"]},{"lv":"sr","type":"short","q":"从季风角度说明印度发展灌溉农业的必要性。","ans":"印度降水高度集中在 6—9 月西南季风期，且季风强弱与进退时间年际变化大，旱涝频繁；旱季长达半年以上，作物需水与降水错位；因此必须修水库、打机井、修渠，以灌溉调节时间与空间上的不平衡，保证稳产。","exp":"要点：降水集中 + 年际不稳 + 旱季长 + 灌溉调节时空分布。","diff":2,"tag":["区域地理","印度","农业区位"]}]},{"id":"russia","kind":"concept","name":"俄罗斯：纬度高，东西差距比南北更大","alias":["俄罗斯","西伯利亚","西伯利亚大铁路","资源型经济","冻土"],"level":{"jr":"七年级下 · 俄罗斯","sr":"区域地理 · 资源与交通布局"},"line":"面积世界第一，但四分之三的人口与工业挤在乌拉尔山以西——不是南北差，是东西差。","why":"纬度高，冬季漫长严寒，冻土广布，北部北冰洋沿岸港口封冻期长。地形自西向东依次为东欧平原、乌拉尔山、西西伯利亚平原、中西伯利亚高原、东西伯利亚山地，呈\"平原—高原—山地\"阶梯抬升。","mech":"人口、城市、工业集中在欧洲部分；亚洲部分资源丰富但开发成本高，靠西伯利亚大铁路与油气管道把资源西运。农业集中在伏尔加河流域与南部黑土带，北部只能林业与放牧。","anchors":[{"iso":"RU","where":"俄罗斯","see":"东欧平原核心区、秋明油气、西伯利亚大铁路"},{"iso":"CN","where":"中国","see":"油气与木材的主要买家，东线天然气管道"},{"iso":"KZ","where":"哈萨克斯坦","see":"同为内陆资源型经济，靠管道外运"}],"counter":"\"国土大就强\"是错觉：亚洲部分占面积四分之三、人口不到四分之一，冻土与距离把资源锁在地下。","next":[{"q":"气候为什么随纬度变","to":"zonality"},{"q":"中国东北也冷","to":"northeast"}],"cite":"依据：人教版七年级下册第七章第四节；组内整理，未引用教材原文。","cat":"区域地理","sections":[{"h":"地形与气候","p":"自西向东平原—高原—山地；纬度高、冬季长，冻土广布。"},{"h":"人口与经济","p":"人口工业集中在欧洲部分；亚洲部分靠铁路和管道输出油气、木材与矿产。"}],"media":{"svg":"russia","hint":"俄罗斯：自西向东的地形与人口梯度","img":"russia-taiga"},"tags":["俄罗斯","冻土","资源型经济","西伯利亚"],"quiz":[{"lv":"jr","type":"choice","q":"俄罗斯人口和城市主要集中在欧洲部分，主要原因是","opts":["气候较温和、开发历史早、交通便利","亚洲部分没有矿产资源","亚洲部分面积太小","欧洲部分地势最高"],"ans":0,"exp":"亚洲部分冷、远、冻土多，开发成本高。","diff":1,"tag":["区域地理","俄罗斯","人口分布"]},{"lv":"sr","type":"short","q":"说明俄罗斯亚洲部分资源丰富却开发缓慢的原因。","ans":"①纬度高、气候严寒，冻土广布，施工与生产期短；②距欧洲核心市场远，运输成本高，依赖西伯利亚大铁路与管道；③人口稀少、劳动力不足、基础设施薄弱；④生态脆弱，冻土融化会破坏工程基础。","exp":"四个要素：气候、距离与运输、劳动力与基础设施、生态。","diff":3,"tag":["区域地理","俄罗斯","资源开发"]}]},{"id":"australia","kind":"concept","name":"澳大利亚：半环状的气候与骑在羊背上","alias":["澳大利亚","大自流盆地","骑在羊背上","坐在矿车上","大分水岭"],"level":{"jr":"七年级下 · 澳大利亚","sr":"区域地理 · 南半球农业与矿产"},"line":"南半球，季节与我们相反；气候自东、南、北三面向内陆由湿变干，呈半环状分布。","why":"东部大分水岭挡住来自太平洋的水汽，迎风坡多雨、背风坡干旱；中部大自流盆地靠地下水维持牧业；西部高原沙漠广布。降水从沿海向内陆递减，农业与人口也跟着呈环状分布。","mech":"沿海湿润区种小麦、养牛羊并发展混合农业；内陆干旱区粗放牧羊；最干旱的中部几乎无人。人口九成集中在东南沿海（气候温和、港口多、移民开发早）。铁矿、煤炭、铝土大量出口。","anchors":[{"iso":"AU","where":"澳大利亚","see":"大分水岭、大自流盆地、东南沿海城市带"},{"iso":"CN","where":"中国","see":"铁矿石与煤炭的最大买家之一"},{"iso":"NZ","where":"新西兰","see":"同为南半球温带农业出口国"}],"counter":"\"澳大利亚整个国家都干旱\"不成立：东部沿海年降水可超 1200mm，塔斯马尼亚是温带海洋性气候；干旱的是中部与西部。","next":[{"q":"气候为什么会呈带状","to":"zonality"},{"q":"巴西也是沿海挤满人","to":"brazil"}],"cite":"依据：人教版七年级下册第八章第四节；组内整理，未引用教材原文。","cat":"区域地理","sections":[{"h":"三大地形区","p":"东部山地（大分水岭）、中部平原（大自流盆地）、西部高原（沙漠）。"},{"h":"半环状分布","p":"降水自沿海向内陆递减，农业、人口、城市随之呈环状集中在外圈。"}],"media":{"svg":"australia","hint":"澳大利亚：东中西三大地形区与降水递减","img":"uluru"},"tags":["澳大利亚","大自流盆地","半环状","混合农业"],"quiz":[{"lv":"jr","type":"choice","q":"澳大利亚气候呈半环状分布，主要影响因素是","opts":["降水自沿海向内陆递减","纬度位置南北对称","洋流全部为寒流","地形以平原为主"],"ans":0,"exp":"东、南、北三面靠海有水分，内陆被大分水岭与距离隔断水汽。","diff":1,"tag":["区域地理","澳大利亚","气候分布"]},{"lv":"sr","type":"short","q":"说明澳大利亚人口集中在东南沿海的自然与经济原因。","ans":"自然：东南沿海属亚热带湿润气候，温带海洋性气候，气候温和湿润，降水较多；有优良港湾，地形平坦。经济：殖民开发最早，城市与工业基础好，交通便利，内陆则干旱、水源缺乏。","exp":"自然（气候、港湾、地形）+ 人文（开发历史、交通）两层。","diff":2,"tag":["区域地理","澳大利亚","人口分布"]}]},{"id":"usa","kind":"concept","name":"美国：农业带是气候与市场的共同产物","alias":["美国","农业带","玉米带","乳畜带","小麦带","专业化"],"level":{"jr":"七年级下 · 美国","sr":"区域地理 · 农业专业化与区位"},"line":"玉米带、小麦带、乳畜带不是随便划的——每一条都对着\"气候、地形、市场\"三个条件。","why":"中部大平原平坦、黑土肥沃、密西西比河水系便于运输；东北部五大湖附近城市密集，鲜奶不耐长途运输，于是形成乳畜带；中西部夏季高温多雨形成玉米带；西部大平原半干旱，形成小麦带与牧业。","mech":"农业生产专业化 + 机械化 + 规模化，单产高、商品率高。工业上东北部是传统工业区（煤铁近、水运便），南部与西部靠石油、电子、航空航天崛起。移民国家，人口增长以国际迁移为主。","anchors":[{"iso":"US","where":"美国","see":"玉米带、乳畜带、大平原小麦带"},{"iso":"CN","where":"中国","see":"大豆、玉米的主要进口市场"},{"iso":"BR","where":"巴西","see":"同为农产品出口大国，大豆直接竞争"}],"counter":"\"人少所以效率高\"因果倒了：先有专业化、机械化、规模化，才有少数人种大量地。人少是结果。","next":[{"q":"农业区位怎么分析","to":"agri-location"},{"q":"中国东北也是大农场","to":"northeast"}],"cite":"依据：人教版七年级下册第九章第一节；组内整理，未引用教材原文。","cat":"区域地理","sections":[{"h":"三大地形区","p":"西部高大山地、中部平原、东部低缓山地，平原占一半以上。"},{"h":"农业专业化","p":"按气候与市场划分农业带，机械化程度高，商品率高。"}],"media":{"svg":"usa","hint":"美国：自东向西的农业带","img":"usa-irrigation"},"tags":["美国","农业带","专业化","机械化"],"quiz":[{"lv":"jr","type":"choice","q":"美国东北部形成乳畜带的主要区位条件是","opts":["城市密集、市场近，鲜奶不耐长途运输","气候干旱、牧草优质","劳动力廉价","铁矿资源丰富"],"ans":0,"exp":"乳畜业是市场指向型，靠近大城市群。","diff":1,"tag":["区域地理","美国","农业区位"]},{"lv":"sr","type":"short","q":"分析美国农业生产专业化带来的有利影响。","ans":"①充分利用各地区的自然条件与社会经济条件，提高单产与品质；②便于大规模机械化、专业化作业，提高劳动生产率；③形成规模经营与稳定供应链，商品率高；④便于农业科技推广与专业化服务。不利：单一化种植易受市场与灾害冲击，过度机械化与化肥使用带来环境压力。","exp":"答出三条有利 + 一条不利即可满分。","diff":2,"tag":["区域地理","美国","农业专业化"]}]},{"id":"brazil","kind":"concept","name":"巴西：雨林与沿海，两副面孔","alias":["巴西","亚马孙雨林","热带雨林开发","咖啡","圣保罗"],"level":{"jr":"七年级下 · 巴西","sr":"区域地理 · 雨林开发与保护"},"line":"亚马孙平原是世界最大热带雨林，但巴西九成人口住在东南沿海——雨林里几乎没人。","why":"亚马孙平原终年受赤道低压控制，高温多雨，形成热带雨林；巴西高原是热带草原气候，干湿季分明。人口集中在东南沿海：亚热带湿润气候温和、港口优良、殖民开发早。","mech":"经济以咖啡、甘蔗、大豆、铁矿出口为主，圣保罗—里约是工业与城市核心。雨林开发（修路、牧场、大豆）带来外汇与就业，也带来水土流失、生物多样性丧失与碳排放。","anchors":[{"iso":"BR","where":"巴西","see":"亚马孙平原雨林、巴西高原、东南沿海城市带"},{"iso":"CN","where":"中国","see":"巴西大豆与铁矿石的最大买家"},{"iso":"PE","where":"秘鲁","see":"亚马孙上游，同一条流域的开发压力"}],"counter":"\"开发雨林等于发展\"是短视：雨林蒸腾维持区域降水，砍到一定比例后降水减少，周边农业与水电本身也会受损。","next":[{"q":"热带雨林气候怎么形成","to":"rainforest"},{"q":"亚马孙和撒哈拉同纬度吗","to":"cmp-sahara-amazon"}],"cite":"依据：人教版七年级下册第九章第二节；组内整理，未引用教材原文。","cat":"区域地理","sections":[{"h":"两大地形区","p":"北部亚马孙平原（世界最大冲积平原）、南部巴西高原（世界最大高原）。"},{"h":"开发与保护","p":"雨林提供木材、矿产与耕地，也调节区域降水；开发必须留出保护与缓冲带。"}],"media":{"svg":"brazil","hint":"巴西：雨林与东南沿海的对比","img":"amazon-aerial"},"tags":["巴西","亚马孙雨林","热带草原","咖啡"],"quiz":[{"lv":"jr","type":"choice","q":"巴西人口和城市主要分布在东南沿海，主要原因是","opts":["气候温和、港口优良、开发历史早","亚马孙平原地形最平坦","东南沿海矿产资源最丰富","内陆高原海拔太高"],"ans":0,"exp":"亚马孙湿热难居、内陆交通不便，沿海条件最好。","diff":1,"tag":["区域地理","巴西","人口分布"]},{"lv":"sr","type":"short","q":"说明亚马孙雨林的生态价值与开发中应采取的合理措施。","ans":"生态价值：调节全球碳氧平衡、涵养水源、维持区域降水、保护生物多样性、保持水土。合理措施：划定自然保护区与缓冲区；采育结合、限制皆伐；发展林下经济与生态旅游；加强卫星监测与执法；推广已开垦土地的集约利用，减少新开垦。","exp":"价值答两条、措施答三条。","diff":3,"tag":["区域地理","巴西","雨林保护"]}]},{"id":"polar-region","kind":"concept","name":"极地地区：一个是海，一个是陆","alias":["极地地区","南极","北极","极昼极夜","泰山站","黄河站"],"level":{"jr":"七年级下 · 极地地区","sr":"区域地理 · 极地科考与环境"},"line":"北极是海，南极是陆——这一句话决定了两个极地在气候、生物、科考上的全部差别。","why":"南极是冰雪覆盖的大陆，平均海拔最高，冰雪反射强，是冷高压中心，比北极冷得多；北极是北冰洋，海水储热使气温较高。两者都在极圈以内，都有极昼极夜。","mech":"南极：企鹅、磷虾、海豹，无常住居民，只有科考站（长城站、中山站、昆仑站、泰山站）。北极：北极熊、海象，因纽特人世代居住。中国在南极建四站，在北极建黄河站。极地科考集中在极昼的暖季（南极 11 月—次年 3 月）。","anchors":[{"iso":"AQ","where":"南极洲","see":"长城站、中山站、昆仑站、泰山站"},{"iso":"NO","where":"挪威","see":"北极黄河站所在国，斯瓦尔巴群岛"},{"iso":"GL","where":"格陵兰","see":"世界最大岛，冰盖加速消融"}],"counter":"\"南极比北极冷是因为纬度更高\"不准确：两者纬度相当。冷在南极是大陆、海拔高、冰雪反射强、又是冷高压中心；北极有海水储热，气温高得多。","next":[{"q":"公转怎么造成极昼极夜","to":"revolution"},{"q":"五带是怎么划的","to":"zones"}],"cite":"依据：人教版七年级下册第十章；组内整理，未引用教材原文。","cat":"区域地理","sections":[{"h":"一陆一海","p":"南极为大陆、北极为海洋，这决定了两地气温、生物与科考条件的差别。"},{"h":"科考与保护","p":"南极有四个中国科考站；《南极条约》规定只用于和平与科学目的。"}],"media":{"svg":"polar-region","hint":"极地地区：南极大陆与北冰洋的对比","img":"antarctica"},"tags":["极地地区","南极","北极","极昼极夜","科考站"],"quiz":[{"lv":"jr","type":"choice","q":"南极地区比北极地区冷得多，主要原因是","opts":["南极是大陆，海拔高、冰雪反射强","南极纬度比北极高得多","南极距太阳更远","南极周围全是暖流"],"ans":0,"exp":"两者纬度相当，差别在\"陆与海\"、海拔与反射率。","diff":1,"tag":["区域地理","极地地区","气温差异"]},{"lv":"sr","type":"short","q":"说明我国南极科考站多选择在 11 月至次年 3 月建站与考察的原因。","ans":"此时为南半球夏季，南极圈内出现极昼，白昼长、气温相对较高，便于野外作业与运输；海冰融化，科考船可达；而 4—10 月为极夜与严寒期，无法开展野外工作。","exp":"要素：南半球夏季 + 极昼 + 气温与海冰条件。","diff":2,"tag":["区域地理","极地地区","科考时间"]}]},{"id":"northeast","kind":"concept","name":"东北三省：山环水绕，沃野千里","alias":["东北三省","东北平原","北大仓","商品粮基地","老工业基地","黑土"],"level":{"jr":"八年级下 · 北方地区（东北三省）","sr":"区域地理 · 商品粮基地与老工业基地转型"},"line":"三面环山、中间平原，黑土厚、耕地多，成了\"北大仓\"；但纬度高、热量不足，一年只能种一季。","why":"地形上西为大兴安岭、北为小兴安岭、东为长白山，中间是东北平原（松嫩平原、辽河平原、三江平原）。温带季风气候，冬季漫长寒冷，无霜期短，热量条件是农业最大的限制。","mech":"商品粮基地靠三件事：耕地面积大、黑土肥沃、机械化程度高，加上人均耕地多，因此商品率全国最高。工业靠煤、铁、石油：鞍山钢铁、大庆油田、长春汽车。资源型城市面临资源枯竭，正在转型。","anchors":[{"iso":"CN","where":"三江平原","see":"中国最大的商品粮基地之一，人均耕地多"},{"iso":"CN","where":"大庆","see":"石油城，资源型城市转型的样本"},{"iso":"CN","where":"鞍山","see":"靠本地铁矿发展的钢铁工业基地"}],"counter":"\"地多所以农业强\"只说对一半：东北单产不如南方，强在人均耕地多、商品率高；黑土退化与热量不足是真实短板。","next":[{"q":"农业区位怎么分析","to":"agri-location"},{"q":"中国农业怎么分布","to":"agri-china"}],"cite":"依据：人教版八年级下册第六章第二节；组内整理，未引用教材原文。","cat":"中国地理","sections":[{"h":"山环水绕","p":"大兴安岭、小兴安岭、长白山三面环绕，中间是平坦的东北平原。"},{"h":"北大仓与老工业基地","p":"黑土与机械化撑起商品粮基地；煤铁石油撑起重工业，如今同时面临转型。"}],"media":{"svg":"northeast","hint":"东北三省：地形—气候—农业—工业","img":"changbai"},"tags":["东北三省","商品粮基地","黑土","老工业基地"],"quiz":[{"lv":"jr","type":"choice","q":"东北三省成为我国重要商品粮基地，最主要的条件是","opts":["耕地面积大、人均耕地多、机械化程度高","热量充足，一年三熟","降水丰沛，河网密布","劳动力廉价且充足"],"ans":0,"exp":"商品率高低看\"产得多、吃得少\"，人均耕地是关键。","diff":1,"tag":["中国地理","东北三省","农业区位"]},{"lv":"sr","type":"short","q":"分析东北三省农业发展的限制性因素及应对措施。","ans":"限制：纬度高、热量不足，无霜期短，只能一年一熟，易受低温冻害；黑土退化、水土流失；冬季漫长影响牧业与运输。措施：培育耐寒早熟品种、发展大棚与地膜覆盖；秸秆还田、轮作与保护性耕作保护黑土；发展农产品深加工延长产业链。","exp":"限制答两条、措施答两条。","diff":2,"tag":["中国地理","东北三省","农业可持续"]}]},{"id":"beijing","kind":"concept","name":"北京：背山面海，四重身份","alias":["北京","中轴线","京津冀","首都功能","政治文化中心"],"level":{"jr":"八年级下 · 北方地区（北京）","sr":"区域地理 · 城市职能与区域协同"},"line":"西北山地、东南平原，背山面海；政治文化中心叠加国际交往与科技创新，一座城担四重身份。","why":"北京位于华北平原西北缘，西为西山、北为燕山，东南面向平原，永定河冲积扇提供水源与平地，这种\"背山面海\"的格局是历代建都的地形基础。","mech":"城市职能决定空间结构：中轴线串起宫城、坛庙与城门，是都城规划的骨架；如今人口与功能过度集中带来大城市病，靠京津冀协同发展疏解非首都功能、建设城市副中心与雄安新区破解。","anchors":[{"iso":"CN","where":"北京","see":"中轴线、故宫、天安门广场"},{"iso":"CN","where":"雄安新区","see":"承接疏解的非首都功能"},{"iso":"CN","where":"天津","see":"京津冀的出海口与港口"}],"counter":"\"首都就该什么产业都做\"是误区：非首都功能不疏解，人口与水资源撑不住；北京的人均水资源量远低于全国平均。","next":[{"q":"中国四大地理区域怎么划","to":"china-four-regions"},{"q":"南北方为什么以秦岭淮河为界","to":"cmp-north-south"}],"cite":"依据：人教版八年级下册第六章第四节；组内整理，未引用教材原文。","cat":"中国地理","sections":[{"h":"地形与选址","p":"西北山地、东南平原，永定河冲积扇，背山面海便于防守与漕运。"},{"h":"职能与协同","p":"四中心定位 + 中轴线格局；京津冀协同疏解非首都功能。"}],"media":{"svg":"beijing","hint":"北京：地形、职能与区域协同","img":"beijing-aerial"},"tags":["北京","中轴线","京津冀","城市职能"],"quiz":[{"lv":"jr","type":"choice","q":"北京的城市职能不包括","opts":["重化工业基地","政治中心","文化中心","国际交往中心"],"ans":0,"exp":"首都要疏解非首都功能，重化工业恰恰是要搬出去的。","diff":1,"tag":["中国地理","北京","城市职能"]},{"lv":"sr","type":"short","q":"说明北京疏解非首都功能的原因与措施。","ans":"原因：人口与产业过度集中，水资源短缺、交通拥堵、地价高、环境压力大，与政治文化中心的定位不符。措施：建设城市副中心与雄安新区承接疏解；迁出一般制造业与区域性批发市场；严控人口规模；发展高精尖产业与公共服务。","exp":"原因答两条、措施答两条。","diff":2,"tag":["中国地理","北京","区域协同"]}]},{"id":"yangtze-delta","kind":"concept","name":"长江三角洲：江海交汇的城市群","alias":["长江三角洲","长三角","浦东","城市群","鱼米之乡"],"level":{"jr":"八年级下 · 南方地区（长江三角洲）","sr":"区域地理 · 城市群与产业分工"},"line":"长江在这里入海，太湖水系与京杭运河在这里交汇——一个上海，带出一整座城市群。","why":"地形是长江冲积形成的低平三角洲，河网密布、湖泊众多；亚热带季风气候，雨热同期；长江黄金水道把内陆腹地与海洋连起来，这是它区别于其他三角洲的根本优势。","mech":"水运成本低 → 原料与产品大进大出 → 外向型制造业与外贸；上海以金融、航运、贸易为龙头，苏州、无锡、宁波等按产业链分工，形成同城化城市群。农业上是\"鱼米之乡\"，水稻、油菜、淡水养殖发达。","anchors":[{"iso":"CN","where":"上海","see":"国际金融、航运、贸易中心，浦东开发开放"},{"iso":"CN","where":"苏州","see":"电子信息制造业，承接上海溢出"},{"iso":"CN","where":"杭州","see":"数字经济与民营经济活跃"}],"counter":"\"靠海就能富\"不成立：同样靠海，长三角强在长江这条深入内陆 2800 公里的水道，腹地才是它的护城河。","next":[{"q":"工业区位怎么分析","to":"industry-location"},{"q":"尼罗河三角洲也不同","to":"cmp-delta"}],"cite":"依据：人教版八年级下册第七章第二节；组内整理，未引用教材原文。","cat":"中国地理","sections":[{"h":"位置与地形","p":"长江入海口，三角洲低平、河网密布，亚热带季风气候。"},{"h":"城市群分工","p":"上海做金融航运，周边做制造与配套，形成产业链分工的城市群。"}],"media":{"svg":"yangtze-delta","hint":"长三角：位置—水网—产业—城市群","img":"yrd-bund"},"tags":["长江三角洲","城市群","浦东","外向型经济"],"quiz":[{"lv":"jr","type":"choice","q":"长江三角洲发展经济的最大优势是","opts":["江海联运、水运便利，腹地广阔","矿产资源丰富","土地价格低廉","气候干旱少雨"],"ans":0,"exp":"长江黄金水道打通内陆腹地，是其他沿海地区没有的条件。","diff":1,"tag":["中国地理","长三角","区位优势"]},{"lv":"sr","type":"short","q":"说明长三角城市群内部产业分工的合理性。","ans":"上海以金融、航运、贸易与现代服务业为主，地价与人力成本高，适合高附加值环节；苏州、无锡等地承接制造业与配套，土地与劳动力成本较低；宁波、舟山承担港口物流。分工使各城市按比较优势布局，避免同质竞争，形成完整产业链并降低整体成本。","exp":"要素：核心城市做高端服务 + 周边做制造配套 + 港口分工 + 降低总成本。","diff":3,"tag":["中国地理","长三角","产业分工"]}]},{"id":"hk-macao","kind":"concept","name":"香港与澳门：一国两制，两条经济路","alias":["香港","澳门","一国两制","粤港澳大湾区","自由贸易港","填海造地"],"level":{"jr":"八年级下 · 南方地区（香港和澳门）","sr":"区域地理 · 特别行政区经济"},"line":"都是\"一国两制\"下的特别行政区，都缺平地：香港靠自由贸易与金融，澳门靠旅游博彩。","why":"两地山地丘陵多、平地少，靠填海造地扩展空间；香港有深水良港且长期实行自由贸易，发展为国际金融、航运与贸易中心；澳门腹地小、港口条件弱，博彩旅游业成为主导产业。","mech":"香港与内地形成\"前店后厂\"分工，制造业北移、服务业留守；澳门以博彩旅游带动酒店、零售、会展。如今都靠粤港澳大湾区与横琴粤澳深度合作区拓展空间与产业。","anchors":[{"iso":"CN","where":"香港","see":"维多利亚港、国际金融中心"},{"iso":"CN","where":"澳门","see":"博彩旅游业，填海形成的路氹城"},{"iso":"CN","where":"横琴","see":"粤澳深度合作区，澳门产业多元的承接地"}],"counter":"\"自由港就等于制造业强\"不对：香港制造业早因土地与人力成本外移，如今靠服务业；单一产业（如博彩）也会带来结构风险。","next":[{"q":"台湾也是岛屿经济","to":"taiwan"},{"q":"珠三角与世界工厂","to":"service-industry"}],"cite":"依据：人教版八年级下册第七章第三节；组内整理，未引用教材原文。","cat":"中国地理","sections":[{"h":"共同的约束","p":"山地多、平地少，填海造地是共同选择；资源与市场都依赖外部。"},{"h":"两条路径","p":"香港走自由贸易与金融航运；澳门走博彩旅游，并向横琴拓展多元产业。"}],"media":{"svg":"hk-macao","hint":"香港与澳门：两条经济路径","img":"hk-harbour"},"tags":["香港","澳门","一国两制","大湾区"],"quiz":[{"lv":"jr","type":"choice","q":"香港和澳门共同的自然条件是","opts":["地狭人稠、山地多平地少","矿产资源丰富","大河三角洲上，平原广阔","气候为温带季风"],"ans":0,"exp":"两地都靠填海造地，说明平地极度稀缺。","diff":1,"tag":["中国地理","香港澳门","自然条件"]},{"lv":"sr","type":"short","q":"比较香港与澳门主导产业的差异并分析原因。","ans":"香港以金融、航运、贸易等服务业为主：拥有深水良港、长期自由贸易制度、法治与国际化人才。澳门以博彩旅游业为主：港口与水运条件弱、市场腹地小，历史上形成博彩专营，旅游带动酒店零售会展。共同问题是产业单一、土地有限，需借助大湾区与横琴拓展。","exp":"差异要说清，原因要落到\"港口条件 + 制度 + 历史\"。","diff":3,"tag":["中国地理","香港澳门","产业比较"]}]},{"id":"taiwan","kind":"concept","name":"台湾：山脉纵贯，平原挤在西侧","alias":["台湾","台湾岛","中央山脉","玉山","火烧寮","出口导向"],"level":{"jr":"八年级下 · 南方地区（台湾省）","sr":"区域地理 · 岛屿经济与地形"},"line":"中国第一大岛，山脉纵贯南北、玉山近 4000 米；平原集中在西侧，人也集中在西侧。","why":"台湾岛位于亚欧板块与太平洋板块碰撞带，中央山脉由此隆起，玉山海拔 3952 米，是中国东部最高峰。山脉偏东，西侧形成嘉南平原等冲积平原；北回归线穿过中部，北部亚热带、南部热带季风气候。","mech":"地形决定人口与产业布局：西部平原交通便利、开发早，集中绝大多数人口与城市；东部山地陡崖直逼海岸，港口与聚落少。降水丰沛，火烧寮是中国雨极；经济以出口导向的电子、半导体产业为核心。","anchors":[{"iso":"CN","where":"台北","see":"西部盆地中的政治经济中心"},{"iso":"CN","where":"高雄","see":"西南沿海的港口与重工业"},{"iso":"CN","where":"玉山","see":"海拔 3952 米，中国东部最高峰"}],"counter":"\"岛就是平的\"不成立：台湾山地占三分之二，可用的平地几乎全在西侧，这也是人口与产业高度集中的原因。","next":[{"q":"板块边界怎么造山","to":"plate"},{"q":"台风为什么常来","to":"typhoon-coldwave"}],"cite":"依据：人教版八年级下册第七章第四节；组内整理，未引用教材原文。","cat":"中国地理","sections":[{"h":"地形","p":"中央山脉纵贯，玉山 3952 米；山地约占三分之二，平原集中在西部。"},{"h":"气候与经济","p":"北回归线穿过，南北分属亚热带与热带季风；出口导向的电子产业为主。"}],"media":{"svg":"taiwan","hint":"台湾：山脉纵贯、平原偏西","img":"taiwan-sat"},"tags":["台湾","中央山脉","玉山","出口导向"],"quiz":[{"lv":"jr","type":"choice","q":"台湾岛人口和城市主要集中在西部，主要原因是","opts":["西部多平原，开发早、交通便利","西部矿产资源最丰富","东部降水太少","东部海拔太低"],"ans":0,"exp":"山脉偏东，西部才有成片平原。","diff":1,"tag":["中国地理","台湾","人口分布"]},{"lv":"sr","type":"short","q":"说明台湾岛地形对交通与聚落分布的影响。","ans":"山脉纵贯南北且偏东，东部山地陡崖直逼海岸，平地狭小，聚落少、港口条件差，环岛铁路与公路多沿西部平原与东部狭窄海岸修建；西部平原面积大、河流冲积土壤肥沃，人口城市集中，交通网密集。东西向联系需穿越山脉，成本高。","exp":"要点：地形格局 → 东西差异 → 交通线走向与成本。","diff":3,"tag":["中国地理","台湾","地形与聚落"]}]},{"id":"tarim","kind":"concept","name":"塔里木盆地：绿洲围着沙漠转","alias":["塔里木盆地","塔克拉玛干","绿洲农业","西气东输","坎儿井"],"level":{"jr":"八年级下 · 西北地区（塔里木盆地）","sr":"区域地理 · 干旱区绿洲与资源开发"},"line":"深居内陆、四周高山，降水极少；水从山顶的冰雪来，绿洲沿着盆地边缘串成一圈。","why":"距海遥远且被群山环抱，海洋水汽难以进入，年降水量多在 50mm 以下，形成温带大陆性气候。但高山冰川融水在山麓形成一系列冲积扇，山麓地带因此有了水。","mech":"绿洲农业依赖冰雪融水：水源稳定但总量有限，靠坎儿井、渠道减少蒸发。城镇与交通线沿绿洲串成珠链，沙漠公路穿越流沙。盆地地下富集油气，是西气东输的起点，开发同时要防沙、节水、保护绿洲。","anchors":[{"iso":"CN","where":"塔里木盆地","see":"塔克拉玛干沙漠、绿洲农业带"},{"iso":"CN","where":"轮南","see":"西气东输一线的起点"},{"iso":"CN","where":"吐鲁番","see":"坎儿井灌溉，极端干旱区的智慧"}],"counter":"\"有绿洲就能无限扩大耕地\"是危险的：绿洲靠融水维持，上游用水过多会让下游断流、荒漠化加剧，罗布泊的干涸就是教训。","next":[{"q":"绿洲农业怎么形成的","to":"oasis"},{"q":"西北为什么干旱","to":"desert"}],"cite":"依据：人教版八年级下册第八章第二节；组内整理，未引用教材原文。","cat":"中国地理","sections":[{"h":"干旱的成因","p":"深居内陆、群山环抱，海洋水汽难达，年降水多在 50mm 以下。"},{"h":"绿洲与资源","p":"冰雪融水养绿洲，坎儿井减少蒸发；油气富集，靠管道外输。"}],"media":{"svg":"tarim","hint":"塔里木盆地：山地—绿洲—沙漠—油气","img":"taklamakan"},"tags":["塔里木盆地","绿洲农业","西气东输","坎儿井"],"quiz":[{"lv":"jr","type":"choice","q":"塔里木盆地的绿洲主要分布在","opts":["盆地边缘的山麓地带","盆地正中央","沙漠内部的沙丘间","高山雪线以上"],"ans":0,"exp":"水从山上下来，山麓冲积扇才有水与平地。","diff":1,"tag":["中国地理","塔里木盆地","绿洲分布"]},{"lv":"sr","type":"short","q":"分析塔里木盆地绿洲农业发展需要防范的生态问题及对策。","ans":"问题：水资源总量有限且依赖融水，过量引水导致下游断流、地下水位下降、植被枯死、土地荒漠化与盐碱化；不合理开垦加剧沙害。对策：推广滴灌喷灌节水；合理分配上下游水量；退耕还林还草、建防护林；控制绿洲规模，保护天然植被。","exp":"问题答两条、对策答三条。","diff":3,"tag":["中国地理","塔里木盆地","生态保护"]}]},{"id":"sanjiangyuan","kind":"concept","name":"三江源：中华水塔怎么维持","alias":["三江源","青藏地区","中华水塔","高寒牧业","青藏铁路","国家公园"],"level":{"jr":"八年级下 · 青藏地区（三江源）","sr":"区域地理 · 高寒生态屏障"},"line":"长江、黄河、澜沧江都从这里出发；海拔高、气温低，草甸与湿地像海绵一样蓄水，生态一旦破坏极难恢复。","why":"青藏高原平均海拔 4000 米以上，气温低、蒸发弱、空气稀薄，降水虽不多但损耗小，冰川、冻土、湖泊与高寒草甸共同把水存住，形成大江大河的发源地。","mech":"高寒草甸根系固土蓄水，湿地调蓄径流；一旦超载放牧或鼠害泛滥，草甸退化、冻土融化、水源涵养能力下降，下游水量与泥沙随之变化。保护靠国家公园体制：禁牧、生态搬迁、鼠害防治、以草定畜。青藏铁路用桥隧与片石通风路基保护冻土。","anchors":[{"iso":"CN","where":"三江源","see":"长江、黄河、澜沧江源头，国家公园"},{"iso":"CN","where":"拉萨","see":"青藏高原的核心城市，高原河谷农业"},{"iso":"CN","where":"格尔木","see":"青藏铁路重要节点，冻土工程试验区"}],"counter":"\"高原无人区不用保护\"是错的：越少人扰动越脆弱，草甸一旦退化，恢复要几十年；而且它的水供养着下游数亿人。","next":[{"q":"水循环怎么走","to":"water-cycle"},{"q":"高寒牧业怎么活","to":"soil"}],"cite":"依据：人教版八年级下册第九章第二节；组内整理，未引用教材原文。","cat":"中国地理","sections":[{"h":"为什么是水塔","p":"海拔高、气温低、蒸发弱，冰川冻土与草甸湿地共同蓄水。"},{"h":"怎么保护","p":"国家公园统一管理：禁牧、生态搬迁、鼠害防治、以草定畜。"}],"media":{"svg":"sanjiangyuan","hint":"三江源：高寒环境与水塔功能","img":"tuotuo"},"tags":["三江源","青藏地区","中华水塔","国家公园"],"quiz":[{"lv":"jr","type":"choice","q":"三江源被称为\"中华水塔\"，主要原因是","opts":["海拔高、气温低，冰川湿地蓄水能力强","降水最多，年降水量全国第一","地势低洼，湖泊众多","人口稠密，用水量大"],"ans":0,"exp":"水塔靠\"存\"不靠\"降\"：低温使蒸发弱，草甸湿地像海绵。","diff":1,"tag":["中国地理","三江源","水源涵养"]},{"lv":"sr","type":"short","q":"说明三江源草甸退化对下游可能产生的影响。","ans":"草甸退化 → 根系固土蓄水能力下降 → 水源涵养减弱、径流季节变化加大；水土流失加剧，河流含沙量上升，下游河床淤积、防洪压力增大；湖泊湿地萎缩，生物栖息地丧失；冻土融化进一步破坏地表稳定。","exp":"沿\"草甸—蓄水—径流—泥沙\"链条答。","diff":3,"tag":["中国地理","三江源","生态影响"]}]},{"id":"flood-drought","kind":"concept","name":"洪涝与干旱：季风的两副面孔","alias":["洪涝","干旱","旱涝灾害","春旱","梅雨","防洪"],"level":{"jr":"八年级上 · 中国的自然灾害","sr":"必修一 · 气象灾害"},"line":"洪涝与干旱不是两种天气，而是同一场季风降水在时间和空间上分配不均的两个极端。","why":"我国东部属季风气候，降水集中在夏季且年际变化大。夏季风强、雨带停留久 → 洪涝；夏季风弱或雨带跳过 → 干旱。地形上，长江中下游与淮河流域地势低平、排水不畅，最易成涝；华北春季气温回升快、蒸发强而雨季未到，形成春旱。","mech":"洪涝的成因要同时看\"水多\"和\"排不出\"：降水强度、河网排水能力、湖泊调蓄、地面硬化。干旱要看\"水少\"和\"要得多\"：降水、蒸发、农业需水与工业生活用水。防治上，洪涝靠修堤、蓄洪、退耕还湖与海绵城市；干旱靠节水、调水、抗旱品种与水库调度。","anchors":[{"iso":"CN","where":"长江中下游","see":"梅雨集中、地势低平，洪涝最重"},{"iso":"CN","where":"华北平原","see":"春季降水少、蒸发强，春旱突出"},{"iso":"BD","where":"孟加拉国","see":"季风 + 三角洲，全球洪涝最重的地区之一"}],"counter":"\"洪涝就是雨下得太多\"不完整：同样雨量，地面硬化、湖泊被围垦、河道被占，成灾程度完全不同——灾害是自然与人类活动叠加的结果。","next":[{"q":"中国的雨带怎么推移","to":"rain-belt"},{"q":"台风也带来暴雨","to":"typhoon-coldwave"}],"cite":"依据：人教版八年级上册第二章第四节、必修一第六章；组内整理，未引用教材原文。","cat":"自然灾害","sections":[{"h":"为什么东部多","p":"季风降水集中且年际变化大；长江中下游、淮河地势低平排水不畅。"},{"h":"怎么防","p":"洪涝：堤防、蓄洪区、退耕还湖、海绵城市；干旱：节水、调水、抗旱品种。"}],"media":{"svg":"flood-drought","hint":"洪涝与干旱：同一场季风的两面","img":"flood-delta"},"tags":["洪涝","干旱","季风","气象灾害"],"quiz":[{"lv":"jr","type":"choice","q":"我国东部洪涝灾害多发的自然原因是","opts":["夏季降水集中，地势低平排水不畅","全年降水均匀","地形以高原为主","河流全部为内流河"],"ans":0,"exp":"\"水多 + 排不出\"，两条都要有。","diff":1,"tag":["自然灾害","洪涝","成因"]},{"lv":"sr","type":"short","q":"从水循环角度分析城市内涝的形成原因与缓解措施。","ans":"原因：城市化使不透水面增加、下渗减少，地表径流增大且汇流时间缩短；排水管网标准偏低；河湖调蓄空间被占；短时强降水超出排水能力。措施：增加透水铺装、下沉式绿地与雨水花园（海绵城市）；疏浚河道、退耕还湖恢复调蓄；提高管网标准；建设蓄水池与预警调度系统。","exp":"按\"降水—下渗—径流—排水\"链条答，措施对应每一环。","diff":3,"tag":["自然灾害","城市内涝","水循环"]}]},{"id":"landslide-debris","kind":"concept","name":"滑坡与泥石流：三个条件凑齐才成灾","alias":["滑坡","泥石流","地质灾害","西南山区","崩塌"],"level":{"jr":"八年级上 · 中国的自然灾害","sr":"必修一 · 地质灾害"},"line":"陡峭沟谷 + 大量松散碎屑 + 短时暴雨，三个条件凑齐，泥石流才会沿沟倾泻而下。","why":"滑坡是斜坡上的岩土体在重力作用下整体下滑；泥石流是含大量泥沙石块的洪流。两者都需要三个条件：坡度大（势能）、物质松散（碎屑来源）、水（触发与润滑）。","mech":"我国西南山区（横断山、川滇、青藏东缘）三个条件最齐全：地形陡、断裂发育岩石破碎、暴雨集中。人类活动会放大灾害：陡坡开垦、修路切坡、采矿弃渣、砍伐植被都增加松散物质。防治要\"避让 + 工程 + 生物 + 监测\"：避开沟口与陡坡建房、修拦挡坝与排导槽、退耕还林、布设雨量监测与预警。","anchors":[{"iso":"CN","where":"川滇山区","see":"断裂带密集、暴雨集中，泥石流高发"},{"iso":"CN","where":"舟曲","see":"2010 年特大泥石流，县城沿沟而建"},{"iso":"NP","where":"尼泊尔","see":"喜马拉雅南坡，地震后滑坡链生灾害"}],"counter":"\"泥石流是纯天灾\"不成立：同样的雨，植被被砍、弃渣堆在沟里的地方损失大得多，很多灾难的\"物质来源\"是人放上去的。","next":[{"q":"地震也会触发滑坡","to":"earthquake"},{"q":"地理信息技术怎么防灾","to":"disaster-reduction"}],"cite":"依据：人教版八年级上册第二章第四节、必修一第六章；组内整理，未引用教材原文。","cat":"自然灾害","sections":[{"h":"三个条件","p":"陡峭沟谷（势能）、松散碎屑（物质）、短时暴雨（触发），缺一不成灾。"},{"h":"怎么防","p":"避让沟口陡坡；拦挡坝、排导槽；退耕还林；雨量监测与预警。"}],"media":{"svg":"landslide-debris","hint":"泥石流形成的三个条件","img":"debris-flow"},"tags":["滑坡","泥石流","地质灾害","西南山区"],"quiz":[{"lv":"jr","type":"choice","q":"我国西南地区泥石流多发，主要原因不包括","opts":["地势平坦，河网稀疏","地形陡峭，沟谷发育","岩石破碎，碎屑物质多","夏季暴雨集中"],"ans":0,"exp":"西南恰是地形最崎岖的地区，\"地势平坦\"说反了。","diff":1,"tag":["自然灾害","泥石流","成因"]},{"lv":"sr","type":"short","q":"分析人类活动如何加剧泥石流灾害，并提出防治措施。","ans":"加剧：陡坡开垦与砍伐使植被固土能力下降；修路切坡、采矿弃渣在沟谷堆积，直接提供松散物质；不合理建房占据沟口排泄通道，放大损失。措施：退耕还林还草、恢复植被；弃渣场规范化并修建拦挡坝；沟口设排导槽并禁止建房；建立雨量监测与群测群防预警；灾害高风险区实施生态搬迁。","exp":"加剧答两条、措施答三条。","diff":3,"tag":["自然灾害","泥石流","防治"]}]},{"id":"disaster-reduction","kind":"concept","name":"防灾减灾：三种地理信息技术怎么分工","alias":["防灾减灾","地理信息技术","遥感","GIS","GNSS","北斗","监测预警"],"level":{"jr":"八年级上 · 中国的自然灾害（防灾减灾）","sr":"必修一 · 地理信息技术在防灾中的应用"},"line":"RS 负责\"看得见\"，GIS 负责\"算得出\"，GNSS 负责\"找得到\"——三种技术各管一段，合起来才是一条防灾链。","why":"灾害管理分四段：监测、评估、预警、救援。遥感能大范围快速成像，解决\"哪里发生了什么\"；GIS 把地形、人口、交通、历史灾点叠在一起做空间分析，解决\"哪里最危险\"；卫星导航提供精确坐标，解决\"人在哪、路怎么走\"。","mech":"一次典型流程：卫星与雷达遥感监测雨情与淹没范围 → GIS 叠加坡度、人口密度、道路，生成风险图与撤离路线 → 预警平台按阈值发布 → 救援队用 GNSS 定位与导航 → 灾后用遥感评估损失。工程措施（堤坝、拦挡坝）与非工程措施（预警、演练、保险）必须配合。","anchors":[{"iso":"CN","where":"北斗系统","see":"全球卫星导航，短报文可在无信号区求救"},{"iso":"CN","where":"国家预警信息发布中心","see":"暴雨、台风、地质灾害预警发布"},{"iso":"JP","where":"日本","see":"地震紧急速报系统，秒级预警"}],"counter":"\"有了技术就不会有伤亡\"是幻想：预警要传到人、人要会跑。日本的经验说明，演练与教育和技术同等重要。","next":[{"q":"地震能不能预警","to":"earthquake"},{"q":"台风路径怎么测","to":"typhoon-coldwave"}],"cite":"依据：人教版八年级上册第二章第四节、必修一第六章；组内整理，未引用教材原文。","cat":"自然灾害","sections":[{"h":"三种技术","p":"RS 监测获取影像，GIS 做空间分析与制图，GNSS 提供定位与导航。"},{"h":"一条链","p":"监测 → 评估 → 预警 → 救援 → 灾后评估，技术与工程、演练配合。"}],"media":{"svg":"disaster-reduction","hint":"RS / GIS / GNSS 在防灾中的分工"},"tags":["防灾减灾","遥感","GIS","GNSS","预警"],"quiz":[{"lv":"jr","type":"choice","q":"在灾害监测中，能大范围快速获取地表影像的技术是","opts":["遥感（RS）","全球卫星导航系统（GNSS）","地理信息系统（GIS）","数字地球"],"ans":0,"exp":"RS 负责\"看得见\"，GIS 负责分析，GNSS 负责定位。","diff":1,"tag":["自然灾害","地理信息技术","技术分工"]},{"lv":"sr","type":"short","q":"说明 GIS 在防灾减灾中的具体作用。","ans":"①叠加坡度、地层、降水、人口密度、道路等图层，制作灾害风险区划图；②模拟洪水淹没范围、泥石流影响范围，确定危险区与安全区；③规划撤离路线与救援物资调度路径；④灾后统计受灾面积与人口，辅助损失评估与重建规划。","exp":"四点各一句，都要落到\"空间分析\"。","diff":2,"tag":["自然灾害","GIS","应用"]}]}];

ch/china-relief.webp","ver":"1","alt":"中国分层设色地形图与三级阶梯分界线","cap":"中国地形与三级阶梯：昆仑山—祁连山—横断山是第一、二级分界，大兴安岭—太行山—巫山—雪峰山是第二、三级分界。底图仅示陆域地形，未含南海诸岛插图。","credit":"底图 Uwe Dedering / CC BY-SA 3.0；阶梯分界线与标注为本项目叠加"},"japan-topo":{"src":"assets/teach/japan-topo.webp","ver":"1","alt":"日本分层设色地形图","cap":"日本地形：山地丘陵占四分之三，平原零星分布在沿海；本州太平洋一侧那条狭长低地，就是京滨—中京—阪神工业带所在。","credit":"Wikimedia Commons · CC BY-SA 3.0"},"malacca":{"src":"assets/teach/malacca.webp","ver":"1","alt":"马六甲海峡卫星影像","cap":"马六甲海峡（卫星影像）：马来半岛与苏门答腊岛夹出的这条水道，是太平洋与印度洋之间最短航线的咽喉。","credit":"NASA MODIS Rapid Response · 公有领域"},"india-monsoon":{"src":"assets/teach/india-monsoon.webp","ver":"1","alt":"印度季风积雨云压境","cap":"印度西孟加拉邦的季风：6 月西南季风登陆时，积雨云压到稻田上方，全年八成的雨集中在这四个月里。","credit":"Abhijit Kar Gupta · CC BY 2.0"},"russia-taiga":{"src":"assets/teach/russia-taiga.webp","ver":"1","alt":"西伯利亚泰加林","cap":"西伯利亚泰加林：针叶林从乌拉尔山一直铺到太平洋，是俄罗斯亚洲部分最主要的景观，也是人口稀少的直接原因。","credit":"Vyacheslav Argenberg · CC BY 4.0"},"uluru":{"src":"assets/teach/uluru.webp","ver":"1","alt":"澳大利亚中部乌鲁鲁航拍","cap":"中部的乌鲁鲁：四周是红色沙丘与稀疏灌丛，年降水不足 300mm——这就是澳大利亚\"半环状\"气候最干的那一圈。","credit":"Emily Cox · CC BY-SA 4.0"},"usa-irrigation":{"src":"assets/teach/usa-irrigation.webp","ver":"1","alt":"美国大平原中心支轴灌溉","cap":"大平原上的中心支轴灌溉：一个个圆盘就是一台喷灌机转出来的。地块大到这个程度，只能用机械化与专业化去种。","credit":"John A. Kelley / USDA NRCS · 公有领域"},"amazon-aerial":{"src":"assets/teach/amazon-aerial.webp","ver":"1","alt":"亚马孙雨林航拍","cap":"亚马孙雨林：河曲在密林里绕行，树冠连成一片。这里贡献了全球最丰富的生物多样性，也是巴西人口最少的地方。","credit":"lubasi · CC BY-SA 2.0"},"antarctica":{"src":"assets/teach/antarctica.webp","ver":"1","alt":"南极洲卫星影像","cap":"南极洲（卫星影像）：一块被冰盖整个盖住的大陆，四周是海冰。它比北极冷，是因为这里是陆、海拔高、冰雪反射强。","credit":"NASA MODIS Land Rapid Response Team · 公有领域"},"beijing-aerial":{"src":"assets/teach/beijing-aerial.webp","ver":"1","alt":"北京故宫航拍","cap":"北京中轴线的核心：故宫的院落沿一条直线层层铺开，向南一直延伸到天安门与永定门。","credit":"Güldem Üstün · CC BY 2.0"},"yrd-bund":{"src":"assets/teach/yrd-bund.webp","ver":"1","alt":"上海外滩与浦东夜景","cap":"上海外滩与浦东：黄浦江在这里拐弯，一侧是百年租界建筑，一侧是陆家嘴。长三角的城市群就是从这条江口长出来的。","credit":"Dllu · CC BY-SA
