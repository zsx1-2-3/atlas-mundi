        var sinT = Math.sqrt(Math.max(0, 1 - cosT * cosT));
        var ph = Math.random() * Math.PI * 2;
        dx = sinT * Math.cos(ph);
        dy = sinT * Math.sin(ph);
        dz = -cosT;                        // -Z 是相机朝向，星星在正前方
        // 前三分之一的星要求落在银河带附近（|与带法向的夹角| < 0.34）
        if (i % 2 !== 0) break;
      } while (Math.abs(dx * NW[0] + dy * NW[1] + dz * NW[2]) > 0.24 && ++tries < 14);
      pos[i * 3] = r * dx;
      pos[i * 3 + 1] = r * dy;
      pos[i * 3 + 2] = r * dz;
      // 星色微差：少量暖白、一部分冷蓝、其余纯白，避免一片死白
      var b = 0.46 + Math.random() * 0.54;
      var t = Math.random();
      if (t < 0.18) { col[i*3] = b; col[i*3+1] = b*0.86; col[i*3+2] = b*0.72; }
      else if (t < 0.50) { col[i*3] = b*0.78; col[i*3+1] = b*0.89; col[i*3+2] = b; }
      else { col[i*3] = b; col[i*3+1] = b; col[i*3+2] = b; }
      pha[i] = Math.random() * Math.PI * 2;
      // 幂次压低：多数是小星，少数几颗明显亮 —— 真实夜空就是这个分布
      siz[i] = 0.8 + Math.pow(Math.random(), 2.6) * 2.6;
      // 最亮的那 3% 给十字星芒（实拍里过曝的亮星都带衍射十字）
      spk[i] = (i % 2 === 0 && Math.random() < 0.07) ? 1 : 0;
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('aColor', new THREE.Float32BufferAttribute(col, 3));
    g.setAttribute('aPhase', new THREE.Float32BufferAttribute(pha, 1));
    g.setAttribute('aSize', new THREE.Float32BufferAttribute(siz, 1));
    g.setAttribute('aSpike', new THREE.Float32BufferAttribute(spk, 1));

    STAR_MAT = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uDpr: { value: Math.min(window.devicePixelRatio || 1, 2) }
      },
      vertexShader: [
        'attribute vec3 aColor;',
        'attribute float aPhase;',
        'attribute float aSize;',
        'attribute float aSpike;',
        'uniform float uTime;',
        'uniform float uDpr;',
        'varying vec3 vC;',
        'varying float vA;',
        'varying float vS;',
        'void main() {',
        '  vC = aColor;',
        '  vS = aSpike;',
        '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
        // 每颗星的呼吸周期不同（0.9~2.3 倍速），相位也随机
        '  float tw = 0.5 + 0.5 * sin(uTime * (0.9 + fract(aPhase) * 2.4) + aPhase * 7.0);',
        '  vA = 0.5 + 0.5 * tw;',
        // 点的大小要给足：1 像素以下的点在浏览器里基本看不见，
         // 之前那版就是这样，整片夜空看起来"没有星星"
        '  gl_PointSize = clamp(aSize * uDpr * (52.0 / -mv.z) * (0.85 + 0.3 * tw)',
        '                       * (1.0 + aSpike * 1.6), 1.0, 9.0 * uDpr);',
        '  gl_Position = projectionMatrix * mv;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'varying vec3 vC;',
        'varying float vA;',
        'varying float vS;',
        'void main() {',
        '  vec2 q = gl_PointCoord - vec2(0.5);',
        '  float d = length(q);',
        // 星核：软边圆点
        '  float core = smoothstep(0.5, 0.06, d);',
        // 十字星芒：两条极窄的亮带叠在核上，只有 vS=1 的亮星才有
        '  float sx = smoothstep(0.045, 0.0, abs(q.x)) * smoothstep(0.5, 0.02, d);',
        '  float sy = smoothstep(0.045, 0.0, abs(q.y)) * smoothstep(0.5, 0.02, d);',
        '  float a = max(core, max(sx, sy) * vS * 0.9);',
        '  gl_FragColor = vec4(vC * vA, a * vA);',
        '}'
      ].join('\n'),
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    scene.add(new THREE.Points(g, STAR_MAT));
  }

  function srgbToLin(c) { return Math.pow(c, 2.2); }

  function earthMaterial(dayTex, nightTex) {
    var hasNight = nightTex ? 1 : 0;
    var uniforms = {
      dayMap: { value: dayTex },
      dayMapB: { value: dayTex },   // 8K 到达前先指向同一张，mix 恒为 0
      uMixB: { value: 0 },          // 0 → 1 时从 dayMap 交叉淡化到 dayMapB
      nightMap: { value: nightTex || dayTex },
      hasNight: { value: hasNight },
      nightMix: { value: 0 },       // 0=白天，1=全夜（看城市灯光）
      uFade: { value: 0 },          // 整球淡入，避免"啪"一下贴上来
      /* 昼夜分界：按太阳方向决定这半边用白天贴图还是夜间贴图。
         uTermOn=0 时完全不参与计算，行为和以前一模一样。 */
      uSunDir: { value: new THREE.Vector3(1, 0, 0) },
      uTermOn: { value: 0 },
      /* 地形法线：贴图没到时 uBump 保持 0，整段计算被跳过，
         行为和加这个功能之前完全一样。 */
      uNormalMap: { value: dayTex },
      uBump: { value: 0 },
      uNormalScale: { value: 1.25 },
      uRelief: { value: 2.1 },
      uShade: { value: 1.0 },
      /* 专题图层（气候 / 地形）：uLayerMap 是等距柱状贴图，uLayerMix 做淡入。
         uLayerMix=0 时整段不参与计算，行为和没有这个功能之前一模一样。
         气候贴图海洋处 alpha=0，于是海面仍透出底下的卫星影像；
         地形贴图不透明，整颗球换成地图册式的高程着色。 */
      uLayerMap: { value: null },
      uLayerMix: { value: 0 },
      uSpec: { value: 0.7 },
      uSpecPow: { value: 26.0 },
      uTone: { value: 0.9 },
      uLight: { value: new THREE.Vector3(0, 0, 1) }
    };

    var vert = [
      'varying vec2 vUv;',
      'varying vec3 vN;',
      'varying vec3 vNL;',
      'varying vec3 vV;',
      'void main() {',
      '  vUv = uv;',
      // vNL 是没旋转过的法线：昼夜分界要"钉在地表上"，不能被自转/拖拽带跑
      '  vNL = normalize(normal);',
      '  vN = normalize(mat3(modelMatrix) * normal);',
      '  vec4 wp = modelMatrix * vec4(position, 1.0);',
      '  vV = normalize(cameraPosition - wp.xyz);',
      '  gl_Position = projectionMatrix * viewMatrix * wp;',
      '}'
    ].join('\n');

    /* 光照只跟「面朝相机」有关，不再跟世界坐标里的太阳位置有关。
       原因很直接：地球一转，固定光源就会把暗面转到正面，于是"白天模式"
       看起来总有半颗球是黑的。现在亮面永远朝着观察者，边缘做一点收暗
       保留球体的立体感，但不再出现晨昏线 —— 白天就是全球白天。 */
    var frag = [
      'uniform sampler2D dayMap;',
      'uniform sampler2D dayMapB;',
      'uniform sampler2D nightMap;',
      'uniform float uMixB;',
      'uniform float hasNight;',
      'uniform float nightMix;',
      'uniform float uFade;',
      'uniform vec3 uSunDir;',
      'uniform float uTermOn;',
      'uniform sampler2D uNormalMap;',
      'uniform float uBump;',
      'uniform float uNormalScale;',
      'uniform float uRelief;',
      'uniform float uShade;',
      'uniform float uSpec;',
      'uniform float uSpecPow;',
      'uniform float uTone;',
      'uniform vec3 uLight;',
      'uniform sampler2D uLayerMap;',
      'uniform float uLayerMix;',
      'varying vec2 vUv;',
      'varying vec3 vN;',
      'varying vec3 vNL;',
      'varying vec3 vV;',
      'vec3 s2l(vec3 c){ return pow(c, vec3(2.2)); }',
      'vec3 l2s(vec3 c){ return pow(c, vec3(1.0/2.2)); }',
      'void main() {',
      '  vec3 n = normalize(vN);',
      '  vec3 v = normalize(vV);',
      '  float facing = max(dot(n, v), 0.0);',
      // 只在轮缘收暗到 80%，既有体积感又不出现"暗面"
      '  float limb = mix(0.80, 1.0, smoothstep(0.0, 0.66, facing));',
      '  vec3 dA = s2l(texture2D(dayMap, vUv).rgb);',
      '  vec3 dB = s2l(texture2D(dayMapB, vUv).rgb);',
      /* 一张像素覆盖几个 uv × 8192 = 每屏幕像素吃几个 8K 纹理像素。
         放大时（<1）才用 8K；缩小时 8K 会走 mip 缺失的最近邻采样而闪烁，
         所以缩小时退回带 mipmap 的 4K —— 两张图按这个比例软过渡，没有跳变。 */
      '  float tpp = max(fwidth(vUv.x), fwidth(vUv.y)) * 8192.0;',
      '  float k = smoothstep(1.5, 0.8, tpp) * uMixB;',
      /* ---------- 体积光 ----------
         贴图直出时整颗球亮度一样，看着就是个圆片。这里加一束"从观察者
         左上方打过来"的光（跟法线起伏用的是同一束，两者方向一致才不打架）：
         亮面提 10%、暗面压 30%，球就有了立体感。
         光跟着相机走而不是太阳 —— 否则地球一转，暗面就转到正面，
         "白天模式"里会凭空出现半个黑夜。 */
      /* 光必须是**一个方向**，不能拿"点到相机的方向"加个偏移凑：
         v 每个像素都不同，等于光源跟着像素乱转，明暗自然出不来。
         uLight 由 CPU 每帧按相机算好（相机上方偏左）。 */
      '  vec3 Lv = normalize(uLight);',
      '  float sdot = dot(n, Lv);',
      '  float shade = mix(1.0 - 0.60 * uShade, 1.0 + 0.20 * uShade,',
      '                    smoothstep(-0.55, 0.85, sdot));',
      '  vec3 day = mix(dA, dB, k) * limb * shade;',
      /* ---------- 海面反光 ----------
         海水和陆地的差别在蓝通道：海是"蓝远大于红"。用这个差当遮罩，
         在光来的那一侧加一块小而亮的高光（Blinn-Phong，指数 46 = 很紧的一点）。
         这是"球是立体的"最有效的暗示 —— 一块会移动的亮斑，
         比任何明暗渐变更像真的。 */
      '  float sea = smoothstep(0.012, 0.075, day.b - day.r);',
      '  vec3 Hv = normalize(Lv + v);',
      '  float spec = pow(max(dot(n, Hv), 0.0), uSpecPow) * sea * uSpec;',
      '  day += vec3(0.42, 0.56, 0.78) * spec;',
      /* ---------- 地形法线（起伏） ----------
         贴图本身是"平"的：山脉和沙漠一样亮，只能靠颜色区分。
         这里用一张法线贴图把每个像素的法线歪一下，再跟"从观察者左上方
         打过来"的一束光做点积，明暗差就是这一点的起伏。
         光源固定在相机侧而不是太阳侧 —— 否则转到夜面时整片地形全黑。
         TBN 不用屏幕导数算：球面的切向就是"东"和"北"，
         east = 上 × n，north = n × east，两个叉乘就够。 */
      '  if (uBump > 0.5) {',
      '    vec3 nt = texture2D(uNormalMap, vUv).xyz * 2.0 - 1.0;',
      '    vec3 east = cross(vec3(0.0, 1.0, 0.0), n);',
      '    if (length(east) < 0.0008) east = vec3(1.0, 0.0, 0.0);',
      '    east = normalize(east);',
      '    vec3 north = normalize(cross(n, east));',
      '    vec3 nP = normalize(n + (east * nt.x + north * nt.y) * uNormalScale);',
      '    vec3 L = Lv;',
      '    float rl = (dot(nP, L) - dot(n, L)) * uRelief;',
      '    day *= clamp(1.0 + rl, 0.52, 1.62);',
      '  }',
      '  vec3 col = day;',
      '  float nightK = nightMix;',   // 夜里用多少夜间贴图（0=全白天）
      '  if (hasNight > 0.5) {',
      '    vec3 lights = s2l(texture2D(nightMap, vUv).rgb);',
      /* 夜图自己的"深蓝海面"就是整片蓝雾的来源：直接乘 3.2 会把它一起提亮。
         先按亮度做软阈值，只留真正的灯光，底噪压掉；再补 0.6% 的地表亮度
         给陆地一点轮廓 —— 再多就又开始发蓝了。 */
      '    float ll = dot(lights, vec3(0.299, 0.587, 0.114));',
      '    lights *= smoothstep(0.014, 0.11, ll);',
      /* 夜半球保留 10% 的地表亮度（原来是 0.6%）。
         纯灯光的夜面是一块黑，看不出那边是什么大陆；留一点底色，
         轮廓认得出来，又不至于像加了层蓝雾。 */
      /* 2.1 → 2.9：加了 ACES 之后中间调被压，灯光显得发闷，
         这里补回来，夜里还是一眼能看出城市带。 */
      '    vec3 night = lights * 2.9 + day * 0.10;',
      /* 昼夜分界：世界坐标法线点太阳方向，>0 是白昼侧。
         ±0.05 的过渡带 ≈ 3°，一条柔和的过渡，不是一条硬线。 */
      '    if (uTermOn > 0.5) {',
      // 用局部法线：分界跟着地表走，转球/自转都不会让它跑掉
      '      float sd = dot(normalize(vNL), normalize(uSunDir));',
      '      float dayK = smoothstep(-0.05, 0.05, sd);',
      '      nightK = max(nightMix, (1.0 - dayK) * uTermOn);',
      '    }',
      '    col = mix(day, night, nightK);',
      '  }',
      // 边缘大气：Fresnel 越靠轮廓越亮，模拟散射
      '  float rim = pow(1.0 - facing, 3.8);',
      // 夜面把蓝色边缘光收掉大半，否则整个轮廓糊成一圈蓝雾
      '  col += vec3(0.12, 0.32, 0.66) * rim * 0.26 * (1.0 - 0.7 * nightK);',
      /* 这里必须自己转回 sRGB。
         实测过：three 的 outputColorSpace 只作用于内置材质，
         自写的 ShaderMaterial 不会被追加 colorspace 转换 ——
         去掉这行，渲染出来的像素正好比贴图暗一个 gamma（102 → 35）。
         取中心点与 8K 贴图同坐标对比：贴图 (101,80,48)、渲染 (102,81,48)，
         一一对上，说明这条链路是对的。 */
      /* ---------- 轻微调色 ----------
         和实验页并排看，这颗球"发淡"：贴图直出没有明暗层次，
         中间调偏灰。这里补两笔（都作用在线性值上）：
         · 提饱和 12%：把每个像素往远离灰色的方向推
         · 压一点暗部：pow(1.06) 让中间调略沉，白的地方基本不动
         数值都很小，目的是"更像照片"，不是滤镜。 */
      '  float lum0 = dot(col, vec3(0.2126, 0.7152, 0.0722));',
      '  col = mix(vec3(lum0), col, 1.12);',
      /* ACES 的近似曲线（Narkowicz 版），在**线性**空间里压中间调、收高光：
         这正是实验页看起来"厚"的原因 —— 它挂了 toneMapping，我们没挂。
         直接照搬会让整颗球发闷，所以用 uTone 控制混合比例。 */
      '  vec3 aces = (col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14);',
      '  col = mix(col, aces, uTone);',
      '  col = pow(max(col, 0.0), vec3(1.06));',
      /* ---------- 专题图层（气候 / 地形） ----------
         必须放在**调色之后**：ACES + 提饱和 + pow(1.06) 会把图层压暗，
         地球上的颜色就和图例的色块对不上了（用户一眼就看出来了）。
         放在最后 → 输出正好等于贴图原色。
         limb 保留边缘收暗，球不至于看起来像一张贴纸。
         alpha 参与混合：气候图海洋 alpha=0，海面继续用卫星影像。 */
      '  if (uLayerMix > 0.001) {',
      '    vec4 lc = texture2D(uLayerMap, vUv);',
      '    col = mix(col, s2l(lc.rgb) * limb, lc.a * uLayerMix);',
      '  }',
      '  gl_FragColor = vec4(l2s(col) * uFade, 1.0);',
      '}'
    ].join('\n');

    return new THREE.ShaderMaterial({
      uniforms: uniforms,
      vertexShader: vert,
      fragmentShader: frag
    });
  }

  /* ---------- 球面地名标注 ----------
     "像谷歌地图"拆开就是两件事，都靠数据 + 一次贪心排布解决：

     ① 每个地名自带「从第几级缩放开始出现」的门槛。这个门槛不是我们拍的，
        是 Natural Earth 的 MIN_LABEL（制图师标好的）—— 世界视角只出现
        二十来个大国与洲名，拉近了小国才逐个浮出。
     ② 放不下的让位。按重要度从高到低试着放，和已放的矩形一撞就藏。
        242 个国家名同时铺上去必然糊成一团，避让才是"专业感"的来源。

     用 3D 点投影到屏幕坐标，而不是 CSS2DRenderer（那要多引一个模块）。 */
  var NE_FAR_ZOOM = 2.0;          // 世界视角 ≈ Natural Earth zoom 2.0
  var _lp = null;
  var _lc = null;                 // 复用的投影临时量，避免每帧分配

  function neZoomNow() {
    var z = globe.camTarget || CAM_FAR;
    return NE_FAR_ZOOM + (CAM_FAR - z) * 2.4;
  }

  var LABEL_POP = {};
  var LABEL_META = null;     // geo/meta.json：所有国家的名称/大洲/人口/中心点
  /* iso → 主权国 iso。港/澳/台这类地区在 labels.json 里带 parent（CN），
     球面点它们时不能开独立档案卡，要落到主权国（中国）的档案上。
     从 labels.json 的 countries 提取（40 条：格陵兰→DK、关岛→US、港澳台→CN……）。 */
  var SOVEREIGN = { TW: 'CN', HK: 'CN', MO: 'CN' };  // 港澳台先硬兜底，labels.json 到了再按数据补齐

  function buildLabels(pack) {
    var host = document.getElementById('labels');
    if (!host || !pack) return;
    host.innerHTML = '';
    globe.labels = [];
    if (!_lp) _lp = new THREE.Vector3();
    /* 各国人口（NE 的 POP_EST），卡片用它决定"要不要列地区语言"：
       小国只留官方语言。数据里没有人口时按 0 处理，等于不筛。 */
    LABEL_POP = pack.pops || {};

    /* 归属表：地区 iso → 主权国 iso（港澳台→CN、格陵兰→DK、法属波利尼西亚→FR……）。
       球面点击靠它把"点地区"落到"主权国的档案"，不再给台湾这类地区单开一张卡。 */
    /* 不清空：港澳台的硬兜底必须先留着，labels.json 里有的按 iso 覆盖上来 */
    (pack.countries || []).forEach(function (c) {
      if (c.iso && c.parent) {
        SOVEREIGN[String(c.iso).toUpperCase()] = String(c.parent).toUpperCase();
      }
    });

    /* 优先级的唯一含义是"抢位顺序"：数字小的先放，后来者撞上就让。
       国家要排在大洲前面 —— 大洲的锚点几乎一定压在大国领土上（南美洲的锚点
       就在巴西境内），大洲先放的话，巴西、阿根廷在全球视角永远显示不出来，
       屏幕上只剩"南美洲"。 */
    var list = [];
    (pack.countries || []).forEach(function (c) {
      /* 有完整档案的（cn/fr/us）排最前、样式更亮；
         其余国家也可点，但只是基础档案，按普通国名处理。 */
      list.push({ c: c, cls: c.d ? 'mk' : '', pri: c.d ? 0 : 1 });
    });
    (pack.oceans || []).forEach(function (c) { list.push({ c: c, cls: 'mo', pri: 2 }); });
    (pack.continents || []).forEach(function (c) { list.push({ c: c, cls: 'mc', pri: 3 }); });
    /* 岛 / 湖 / 海峡：都要放大到很后面才出现，优先级最低 —— 位置冲突时先让国家名 */
    (pack.features || []).forEach(function (c) {
      list.push({ c: c, cls: c.k === 'i' ? 'mi' : (c.k === 'l' ? 'ml' : 'ms'), pri: 4 });
    });

    // 只排一次。同优先级内保持数据本身的顺序（国家已按 LABELRANK 排好）
    list.sort(function (a, b) { return a.pri - b.pri; });

    list.forEach(function (it) {
      var c = it.c, d = el('div', 'mlabel' + (it.cls ? ' ' + it.cls : ''), c.n);
      var rec = {
        el: d, lon: c.lon, lat: c.lat, z: c.z || 0,
        kind: it.cls || 'kp', iso: c.iso || '',
        v: new THREE.Vector3(), w: 0, h: 0, on: false
      };
      var tgt = c.iso || c.parent || "";
      if (tgt) {
        d.dataset.iso = tgt;
        /* 按在字上也要能转球：把 pointerdown 交给同一套拖拽逻辑。
           松开时如果位移很小才算"点击"，否则一次拖拽会顺手打开一个档案。 */
        d.addEventListener('pointerdown', function (e) {
          if (globe.dragDown) globe.dragDown(e);
        });
        d.addEventListener('click', function (e) {
          e.stopPropagation();
          if (globe.moved > 6) return;
          openCountry(c);
        });
        /* 悬停预热：鼠标停在国名上，多半下一步就是点它。
           几何和档案一起取 —— 点下去时两条链路都已落地，卡片和国界同时出现。
           这是替代原来「开机 4 秒后把 236 个档案全部预取一遍」的做法：
           那个方案实测要下 5MB、耗时 33 秒，把首屏带宽全占了，
           而用户一次浏览最多点三五个国家。 */
        d.addEventListener('mouseenter', function () {
          var up = String(tgt).toUpperCase();
          loadGeo(up);
          prefetchCard(up);
        });
      }
      host.appendChild(d);
      globe.labels.push(rec);
    });

    // 量一遍尺寸（此时全部 opacity:0 但已布局，一次 reflow 拿全）
    globe.labels.forEach(function (L) {
      L.w = L.el.offsetWidth || 40;
      L.h = L.el.offsetHeight || 16;
    });
  }

  function hideLabel(L) {
    if (L.on || L._o !== '0') { L.on = false; L._o = '0'; L.el.style.opacity = '0'; }
    /* 飞行 / 拖拽期间**不撤销** will-change。
       撤销再重建一次，浏览器要把这段文字重新栅格化、重传一张纹理；
       760ms 的飞行里几十个标签反复进出，就是"镜头一顿一顿"的主要来源
       （实测：把标签层整个藏起来，同一段飞行掉帧从 6 次变 0 次）。
       停下来后的下一帧，这里会因为 flying/dragging 都为 false 而统一收掉，
       层数不会越积越多。 */
    if (L._wc && !globe.flying && !globe.dragging) { L._wc = 0; L.el.style.willChange = 'auto'; }
    if (L.el.style.pointerEvents !== 'none') L.el.style.pointerEvents = 'none';
  }

  /* ---------- 地形标签 ----------
     山脉 / 高原 / 盆地 / 平原 / 沙漠 / 河流 / 名峰，结构对齐国名标签
     （el / lon / lat / z / v / w / h / on），updateLabels 直接复用同一套
     投影、球缘裁剪和矩形避让 —— 不必再写一份。 */
  function buildTerrainLabels(data) {
    var host = document.getElementById('tlabels');
    if (!host || !data) return;
    host.innerHTML = '';
    globe.tlabels = [];
    if (!_lp) _lp = new THREE.Vector3();
    data.forEach(function (d) {
      var node = el('div', 'tlabel k-' + d.k + ' tap', d.n);
      host.appendChild(node);
      /* 点名字 → 在球上画出这块地貌的边界。按在字上也要能转球，
         所以 pointerdown 交给拖拽逻辑，松手位移很小才算点击。 */
      node.addEventListener('pointerdown', function (e) {
        if (globe.dragDown) globe.dragDown(e);
      });
      node.addEventListener('click', function (e) {
        e.stopPropagation();
        if (globe.moved > 6) return;
        if (globe.toggleTShape) globe.toggleTShape(d.n);
      });
      globe.tlabels.push({
        el: node, name: d.n, lon: d.lon, lat: d.lat, z: d.z || 4,
        kind: d.k, pri: d.z || 4, tap: true,
        v: new THREE.Vector3(), w: node.offsetWidth, h: node.offsetHeight, on: false
      });
    });
  }

  /* ---------- 地形边界 ----------
     点地形名 → 在球上画出这块山 / 盆地 / 高原的外轮廓，或者这条河的河道。
     数据来自 Natural Earth 的矢量要素，构建期用 Douglas-Peucker 抽稀、并把
     首尾相接的碎段串成一整条（geo/terrain_shapes.json，约 160KB，懒加载）。

     两条硬约束，都是用户踩出来的：
     · **线宽必须是屏幕 1px**。以前用 TubeGeometry 按球半径定粗细，拉近以后
       一条河能有七八个像素宽，"和手画上去的一样"。WebGL 的 Line 宽度恒为
       1 设备像素、不随缩放变粗，正是"和地图上一样细"。
     · **可以同时存在多条**。点黄河再点长江，黄河那条要留着 —— 只有再点
       同一条（或切图层）才消失，而且是淡出，不是"啪"地没掉。 */
  var tShapeData = null, tShapeLoading = false;
  var tShapeSel = {};                    // 名字 -> THREE.Group（可同时多条）
  var TSHAPE_COLOR = 0x18c9e8;
  var TSHAPE_FADE = 220;                 // 淡出时长（ms）
  /* 目标**屏幕**宽度（CSS px）。1px 的 Line 用户嫌细，几何定宽又会随缩放变粗，
     所以走"管子 + 每帧按相机距离重算半径"这条路：
     半径 = 目标像素 × 该处 1 像素对应的世界长度 ÷ 2。 */
  var TSHAPE_PX = 1.7;
  var TSHAPE_RBASE = 0.0012;             // 构造几何时的基准半径
  var TSHAPE_RSEG = 5;                   // 管子横截面边数
  var tShapeTubes = [];                  // 需要每帧调粗细的管子
  var tShapeLastWant = 0;

  /* 每帧（在 renderer.render 之前）调用：把每条管子缩放到目标屏幕宽度。
     顶点排布是 TubeGeometry 的 (环 × 横截面) 网格，所以按环取中心、
     用单位偏移重新摆一次即可 —— 纯乘加，不重建几何。 */
  var tShapeFrame = 0, tShapeCamZ = 0;
  function tShapeUpdateWidth(camera, renderer) {
    if (!tShapeTubes.length) return;
    tShapeFrame++;
    var h = (renderer.domElement && renderer.domElement.clientHeight) || 800;
    var camZ = camera.position.length();
    /* 相机正在推拉（滚轮/双指缩放）时，want 每帧都在变。改一次粗细要把整个
       position buffer 重传一遍 GPU，连着几帧都传，手感就是"缩放一顿一顿"。
       改成缩放期间隔帧更新 —— 粗细差半帧（<2%）肉眼分辨不出来。 */
    var zooming = Math.abs(camZ - tShapeCamZ) > 1e-4;
    tShapeCamZ = camZ;
    var fov = camera.fov * Math.PI / 180;
    /* 球面（半径 1）处 1 个世界单位对应多少像素。相机到球面距离用 camZ - 1，
       透视缩放就是 2·tan(fov/2)·d / 屏高。 */
    var perPx = 2 * Math.tan(fov / 2) * Math.max(0.05, camZ - 1) / h;
    var want = TSHAPE_PX * perPx * 0.5;
    want = Math.max(0.00028, Math.min(0.02, want));
    /* 变化小于 3.5% 就不动（原来 1.5% 太灵敏，慢速滚轮会连着十几帧都触发重算） */
    if (tShapeLastWant && Math.abs(want - tShapeLastWant) / tShapeLastWant < 0.035) return;
    if (zooming && (tShapeFrame & 1)) return;
    tShapeLastWant = want;
    for (var m = 0; m < tShapeTubes.length; m++) {
      var mesh = tShapeTubes[m];
      var geo = mesh.geometry;
      if (!geo || !geo.attributes.position) continue;
      var pos = geo.attributes.position, arr = pos.array;
      var ud = mesh.userData, cen = ud.centers, uni = ud.unit;
      var rv = ud.ringVerts;
      for (var i = 0, n = pos.count; i < n; i++) {
        var ci = ((i / rv) | 0) * 3;
        var o = i * 3;
        arr[o]     = cen[ci]     + uni[o]     * want;
        arr[o + 1] = cen[ci + 1] + uni[o + 1] * want;
        arr[o + 2] = cen[ci + 2] + uni[o + 2] * want;
      }
      pos.needsUpdate = true;
      /* 不再每帧 computeBoundingSphere（那要再遍历一遍全部顶点）。
         这些管子全部贴在半径 1 的球面上、球心在原点，包围球写死 1.08
         就足够视锥剔除用了 —— 这是缩放抖动最贵的一笔开销。 */
      if (!geo.boundingSphere) geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 1.08);
    }
  }
  globe.tShapeUpdateWidth = tShapeUpdateWidth;

  function tShapeDispose(g) {
    if (g.parent) g.parent.remove(g);
    g.traverse(function (c) {
      var k = tShapeTubes.indexOf(c);
      if (k >= 0) tShapeTubes.splice(k, 1);
      if (c.geometry) c.geometry.dispose();
      if (c.material) c.material.dispose();
    });
  }

  /* 淡出：先把材质透明度降到 0，再拆几何。
     切图层/退出图层时用这个，线条是"化掉"的，不会突然消失。 */
  function tShapeFadeOut(g) {
    var mats = [];
    g.traverse(function (c) { if (c.material) mats.push(c.material); });
    mats.forEach(function (m) { m.userData.o0 = m.opacity; });
    var t0 = performance.now();
    (function step() {
      var k = Math.min(1, (performance.now() - t0) / TSHAPE_FADE);
      var a = 1 - k;
      mats.forEach(function (m) { m.opacity = m.userData.o0 * a; });
      if (k < 1) requestAnimationFrame(step);
      else tShapeDispose(g);
    })();
  }

  function tShapeMark(name, on) {
    (globe.tlabels || []).forEach(function (L) {
      if (L.name === name) L.el.classList[on ? 'add' : 'remove']('picked');
    });
  }

  function tShapeRemove(name) {
    var g = tShapeSel[name];
    delete tShapeSel[name];
    tShapeMark(name, false);
    if (g) tShapeFadeOut(g);
  }

  function tShapeClear() {
    Object.keys(tShapeSel).forEach(tShapeRemove);
  }
  globe.tShapeClear = tShapeClear;

  function tShapeDraw(name, ring) {
    if (!globe.sphere || !ring || !ring.length) return;
    /* 数据有两种形状：单段 [[lon,lat],...] 和多段 [[[lon,lat],...],...] */
    var segs = (Array.isArray(ring[0]) && Array.isArray(ring[0][0])) ? ring : [ring];

    var runs = [];
    segs.forEach(function (seg) {
      var n = seg.length;
      if (n < 2) return;
      /* 闭合判定：面要素首尾点重合，河流不是。坐标是 ×10 的整数，5 就是 0.5°。 */
      var closed = n > 3 &&
        Math.abs(seg[0][0] - seg[n - 1][0]) < 5 &&
        Math.abs(seg[0][1] - seg[n - 1][1]) < 5;
      /* 跨换日线要断开，否则楚科奇、斐济那种环会横穿整个球面 */
      var cur = [];
      for (var i = 0; i < n + (closed ? 1 : 0); i++) {
        var q = seg[i % n];
        var lon = q[0] / 10, lat = q[1] / 10;
        if (cur.length) {
          var prev = cur[cur.length - 1];
          if (Math.abs(lon - prev[0]) > 180) { runs.push(cur); cur = []; }
        }
        cur.push([lon, lat]);
      }
      if (cur.length > 1) runs.push(cur);
    });
    if (!runs.length) return;

    var group = new THREE.Group();
    group.userData.tshape = true;
    group.userData.name = name;
    var MAT = new THREE.MeshBasicMaterial({
      color: TSHAPE_COLOR, transparent: true, opacity: 0.95, depthWrite: false
    });
    var v = new THREE.Vector3();

    runs.forEach(function (pts) {
      if (pts.length < 2) return;
      var vs = pts.map(function (q) {
        llToVec3(q[0], q[1], 1.004, v);   // 略高于球面，避免和地形贴图 z-fighting
        return new THREE.Vector3(v.x, v.y, v.z);
      });
      var curve = new THREE.CatmullRomCurve3(vs, false, 'centripetal');
      var tseg = Math.max(8, Math.min(pts.length - 1, 420));
      var geo;
      try {
        geo = new THREE.TubeGeometry(curve, tseg, TSHAPE_RBASE, TSHAPE_RSEG, false);
      } catch (e) { return; }

      /* 把顶点拆成「环心 + 单位径向偏移」，供每帧等比缩放（见 tShapeUpdateWidth）。
         环心直接取每一圈顶点的重心，比再算一遍曲线参数更稳。 */
      var pos = geo.attributes.position;
      var ringVerts = TSHAPE_RSEG + 1;
      var rings = Math.ceil(pos.count / ringVerts);
      var centers = new Float32Array(rings * 3);
      var unit = new Float32Array(pos.count * 3);
      var a = pos.array;
      for (var r = 0; r < rings; r++) {
        var s0 = r * ringVerts, cx = 0, cy = 0, cz = 0, cnt = 0;
        for (var j = 0; j < ringVerts; j++) {
          var o = (s0 + j) * 3;
          if (s0 + j >= pos.count) break;
          cx += a[o]; cy += a[o + 1]; cz += a[o + 2]; cnt++;
        }
        if (!cnt) continue;
        cx /= cnt; cy /= cnt; cz /= cnt;
        centers[r * 3] = cx; centers[r * 3 + 1] = cy; centers[r * 3 + 2] = cz;
        for (var j2 = 0; j2 < ringVerts; j2++) {
          var oo = (s0 + j2) * 3;
          if (s0 + j2 >= pos.count) break;
          unit[oo]     = (a[oo]     - cx) / TSHAPE_RBASE;
          unit[oo + 1] = (a[oo + 1] - cy) / TSHAPE_RBASE;
          unit[oo + 2] = (a[oo + 2] - cz) / TSHAPE_RBASE;
        }
      }
      var mesh = new THREE.Mesh(geo, MAT);
      mesh.userData.centers = centers;
      mesh.userData.unit = unit;
      mesh.userData.ringVerts = ringVerts;
      mesh.renderOrder = 6;
      tShapeTubes.push(mesh);
      group.add(mesh);
    });
    if (!group.children.length) return;
    globe.sphere.add(group);
    tShapeSel[name] = group;
    tShapeMark(name, true);
  }

  /* 一份数据、一个加载队列：预热期间点下来的请求排队，数据到了就画。 */
  var tShapeQueue = [];
  function loadShapes(cb) {
    if (tShapeData) { if (cb) cb(); return; }
    if (cb) tShapeQueue.push(cb);
    if (tShapeLoading) return;
    tShapeLoading = true;
    fetchGeoData('geo/terrain_shapes.json', function (d) {
      tShapeLoading = false;
      tShapeData = d || {};
      var q = tShapeQueue;
      tShapeQueue = [];
      q.forEach(function (f) { f(); });
    });
  }
  globe.tShapeWarm = function () { loadShapes(null); };

  /* 点名字：没画就画上，已经画了就收掉 —— 多条可以同时存在。 */
  globe.toggleTShape = function (name) {
    if (tShapeSel[name]) { tShapeRemove(name); return; }
    tShapeMark(name, true);              // 先给即时反馈
    loadShapes(function () {
      if (!tShapeData[name]) { tShapeMark(name, false); return; }
      /* 连点同一条、在数据到达前又取消的情况：以最新状态为准 */
      if (tShapeSel[name]) return;
      tShapeDraw(name, tShapeData[name]);
    });
  };

  /* 地名层"当前该显示哪些"。图层和洋流各有各的开合：
       只开图层 → 地形名；只开洋流 → 洋流名；两个都开 → 两套一起
       （洋流名在海上、地形名在陆地，一般不打架）。
     只在状态变化时重建一次，不在每帧的循环里拼数组。 */
  function refreshTActive() {
    var out = [];
    var layerOn = !!globe.layerName;
    /* 风带名排在最前：这一层的信息就是"哪条带在哪"，被国名挤掉就白开了。
       标签是逐帧按数组顺序抢位置的，排前面就等于优先。 */
    if (globe.wbOn && globe.wbLabels) out = out.concat(globe.wbLabels);

    /* 底图那一套名字（国名 / 地形名）二选一，规则和 syncLabelLayers 里
       的 showCountry 必须一致，否则会出现"CSS 让它显示、这里又没把它排进去"
       —— 结果是开了全部国境线反而一个国名都看不见。三种情况：
         只开图层            → 地形名（国名让位）
         图层 + 全部国境线   → 国名（要靠名字对照是哪一国，地形名收起）
         没开图层            → 国名（洋流/季风/风带只是叠在海上，国名留着当参照）
       洋流、季风两层同时开时国名也只拼一次。 */
    var base = (layerOn && !globe.allBordersOn) ? globe.tlabels : globe.labels;
    if (base) out = out.concat(base);

    if (globe.ocOn && globe.ocLabels) out = out.concat(globe.ocLabels);
    /* 季风名压在陆地上，和洋流名分处两片，一般不抢位置 */
    if (globe.mnOn && globe.mnLabels) out = out.concat(globe.mnLabels);
    globe.tActive = out;

    /* 关掉某一层时，它的名字元素还挂在 DOM 上（几何是淡出移除的，标签不走那条路），
       每帧只更新 tActive 里的元素 —— 于是这些孤儿名字会一直亮在球面上。
       症状：开了洋流再关掉，随后点季风，海上凭空浮出一片"加那利寒流"。
       这里按层的开关直接把整组压暗。 */
    var mute = function (arr, on) {
      if (!arr || on) return;
      for (var i = 0; i < arr.length; i++) if (arr[i]) hideLabel(arr[i]);
    };
    mute(globe.ocLabels, globe.ocOn);
    mute(globe.mnLabels, globe.mnOn);
    mute(globe.wbLabels, globe.wbOn);
    mute(globe.tlabels, globe.layerName);
  }
  globe.refreshTActive = refreshTActive;

  function updateLabels() {
    /* 图层 / 洋流 / 季风 / 风带模式下换一套数据源：国名会让位
       （两层字同时铺满屏幕必然糊成一团）。但开了"全部国境线"就得反过来 ——
       判国家要靠国名，地形名这时收起来。

       tActive 由 refreshTActive 统一拼好：当前开着的每一层的名字合在一起，
       顺带把已经关掉的层的孤儿名字压暗；没有这层缓存时退回国名。 */
    var arr = (globe.tActive && globe.tActive.length) ? globe.tActive : globe.labels;
    if (!arr || !arr.length) return;
    var stage = globeStage();
    if (!stage) return;
    var paint = [];                 // 本帧要画的标签：[[x, y, alpha, L], ...]
    if (!_lp) _lp = new THREE.Vector3();
    if (!_lc) _lc = new THREE.Vector3();
    var w = stage.clientWidth, h = stage.clientHeight;
    var nz = neZoomNow();
    var camPos = globe.camera.position;
    var camLen = camPos.length() || 1;
    var placed = [];               // 已占用矩形 [x0,y0,x1,y1]

    /* ---- 两道"分批上"的闸门（治点击后镜头一顿一顿）----
       实测：点开一个国家，镜头压到 CAM_NEAR 之后屏幕上的地名会从十几条
       跳到七十多条 —— 探针中途取样那一次，60ms 内新冒出 59 条。
       每冒一条就是一次文字栅格化 + 一次合成层创建，59 条挤在同一帧里，
       那一帧必然超过 16.7ms；而飞行期间这七十几条又每帧改 transform，
       把飞行段的每一帧都顶在预算线上（实测：把整个地名层藏起来，掉帧归零）。

       ① 每帧最多放 10 条新地名的名额。多出来的等下一帧、再下一帧 ——
          反正只差几十毫秒，观众看到的是"渐次浮现"，比"唰一下全出来"更好看。
       ② 镜头在飞/手在拖时，在场地名封顶 34 条（按优先级，也就是 Natural Earth
          的 LABELRANK，重要的先上）。已经在场的永不因这条被撤，所以不会闪。
          停下来后名额恢复，剩下的地名照样补齐 —— 静止时的画面和原来完全一样。 */
    /* 原来 34 / 10：飞行时最多 34 条、每帧只放 10 条新地名 —— 慢机上要两秒才铺满
       （实测点开法国后可见标签 31→39→47→…→60，到 +2 秒才齐），用户反馈
       "国家名晚了好几秒才出来"。现在放宽到 100 / 60：一帧就能把候选全部摆上，
       几乎看不出"渐次浮现"，代价是那一帧多栅格化几十条文字。
       100 这个上限也不是随便定的：1280×800 下经矩形避让后实际最多只能摆 60 条左右，
       所以它基本不再构成瓶颈，只是防止极小屏幕上叠字。
       用户第二次反馈"点了国家之后有些国家或岛屿的名字会延迟"——就是这两个数字
       卡出来的（岛屿在优先级里排最后，名额一满全被挡住，要等飞行结束才补上）。 */
    var flyCap = (globe.flying || globe.dragging) ? 100 : 1e9;
    /* 手在拖的时候一个新标签都不许上：每冒一条就是一次文字栅格化 + 合成层创建，
       正好砸在用户"正在拖"的那一帧上 —— 这就是转动/缩放时"忽然顿一下"的来源之一。
       已经在场的标签照旧跟着动，松手后下一帧立刻补齐（补齐发生在静止帧，看不出来）。 */
    var newBudget = globe.dragging ? 0 : 60;

    /* ---- 球体的屏幕投影圆 ----
       球在透视投影下仍是一个圆：视半角 asin(R/z)，投影到 NDC 的半径
       = tan(asin(R/z)) / tan(fov/2)，再乘半屏高就是像素半径。
       以前只按"法线朝向"过滤，但球缘的点投影压缩得很厉害，标签自己还有宽高，
       于是字会越过球的轮廓、飘在星空上。现在硬性要求整个标签框都落在圆内。 */
    var vHalf = (globe.camera.fov * 0.5) * Math.PI / 180;
    var silN = Math.tan(Math.asin(Math.min(0.995, 1 / camLen))) / Math.tan(vHalf);
    var rPx = silN * h * 0.5;
    _lc.set(0, 0, 0).project(globe.camera);
    var cx = (_lc.x * 0.5 + 0.5) * w;
    var cy = (-_lc.y * 0.5 + 0.5) * h;

    for (var i = 0; i < arr.length; i++) {
      var L = arr[i];

      /* 位置要先算出来：下面"该不该显示"不再只看全局 nz，
         还要看这个标签离视点中心有多近（见 centerBoost）。 */
      var dot;
      if (L.alts) {
        /* 洋流名：三个锚点里挑最正对镜头的那个（换的时候留 0.06 的余量，
           免得两个点分数接近时名字左右横跳）。 */
        dot = -2;
        for (var ai = 0; ai < L.alts.length; ai++) {
          llToVec3(L.alts[ai][0], L.alts[ai][1], 1.02, _lp);
          _lp.applyMatrix4(globe.spin.matrixWorld);
          var dv = (_lp.x * camPos.x + _lp.y * camPos.y + _lp.z * camPos.z) /
                   (_lp.length() * camLen);
          if (ai === 0 || dv > dot + 0.06) { dot = dv; L.v.copy(_lp); }
        }
      } else {
        llToVec3(L.lon, L.lat, 1.02, L.v);
        L.v.applyMatrix4(globe.spin.matrixWorld);
        // 与相机方向的夹角余弦：1 = 正在视点中心，0 = 球的侧面
        dot = (L.v.x * camPos.x + L.v.y * camPos.y + L.v.z * camPos.z) /
              (L.v.length() * camLen);
      }

      /* 视点中心加成 —— 治"点开国家后，周围的国家和岛屿名字不出现"。
         原来只按全局 nz 判定门槛，可 nz 只由相机距离决定：
           全球视角 z=CAM_FAR   → nz = 2.0
           点开一个国家 z=CAM_NEAR → nz = 2.5   （就这两档）
         而 labels.json 里国家 z 的中位数是 4.0、岛屿在 3.2~4.4 ——
         也就是说点进去之后，门槛 2.5 只够让"最大的那几十个"名字露头，
         用户想看的周边小国和岛屿全在门槛之外，得自己再滚一轮滚轮才会冒出来。
         所以聚焦模式下按视线放宽：正对镜头那片最多放宽 2 档，球缘那片 0.25
         以下不放宽。全球视角（camMode=far）不加成，保持干净的地球。 */
      var focusMode = (globe.camMode === 'near' || globe.flying);
      var centerBoost = focusMode ? Math.max(0, (dot - 0.25) / 0.75) * 2.0 : 0;
      var nzEff = nz + centerBoost;

      // ① 缩放门槛：洲名远了才在、洋名中段、国名按 MIN_LABEL 逐个放开
      /* 国家名一律走 MIN_LABEL，中法美也不例外 ——
         "永远显示"会让缩小以后只剩三个名字挂在球上，看着像作弊。
         可点这件事不靠显示来保证：它们仍然排在最前面（避让时优先）。 */
      var show;
      if (L.kind === 'mc') show = nz < 3.5;          // 大洲：拉近就撤
      else if (L.kind === 'mo') show = nzEff >= (L.z || 0);  // 海域：按各自的门槛浮现
      /* 留 0.03 的容差：全球视角 nz 恰好算成 2.0，可相机阻尼永远差一点点
         到不了目标值，nz 就是 1.99x —— 于是 MIN_LABEL=2.0 的那批大国
         （巴西、阿根廷、中国）在全球视角全都不显示。 */
      /* 滞回：已经显示出来的标签，要掉到门槛以下 0.09 才撤。
         没有这条时，飞行中 nz 连续变化，边缘的小国会一帧显示一帧隐藏，
         屏幕上就是一片乱闪。 */
      else show = nzEff >= L.z - (L.on ? 0.09 : 0.03);
      if (!show) { hideLabel(L); continue; }

      /* 只留"正对镜头的那一面"。之前阈值 0.14 太松，球edge一圈的国家名
         全被投影到画面边界上挤成一圈 —— 现在 0.30 起步，再往上渐显。 */
      /* 国名要求正对镜头（球面 61° 以内），否则球边缘那一圈压缩得最厉害、
         文字挤成一排。大洲大洋例外：它们本来就稀疏、一个字管一大片，
         放宽到 75° 才能压住画面四周的空。 */
      /* 只留"真正正对镜头"的那一片：0.62 约等于球面 ±52°。
         再往外，投影压缩得厉害，字会飘到球外、压在星空上。 */
      /* 圆边界裁剪已经保证"字不会出球"，所以这里不必再用很高的角度门槛。
         门槛太高（0.62≈52°）时，巴西、阿根廷这种正好落在球缘附近的国家
         会整片消失 —— 那是"少了一半国家"而不是"更干净"。 */
      var dotMin = (L.kind === 'mc' || L.kind === 'mo') ? 0.26 : 0.34;
      // 同理：已经显示的，多给 0.06 的余量再撤
      if (dot < dotMin - (L.on ? 0.06 : 0)) { hideLabel(L); continue; }

      _lp.copy(L.v).project(globe.camera);
      var x = (_lp.x * 0.5 + 0.5) * w;
      var y = (-_lp.y * 0.5 + 0.5) * h;
      /* 岛屿标签抬到点上方：小岛本来就只有几个像素，字压在正中间等于把岛盖住。 */
      if (L.kind === 'mi') y -= L.h * 0.75;
      /* 洋流名也往上抬一点，否则正好压在光带上，字和带子互相糊 */
      if (L.kind === 'oc') y -= L.h * 0.62;
      /* 季风名同理，抬得再高一点：箭头比洋流箭头大一号，字贴太近会顶到箭头上 */
      if (L.kind === 'mn') y -= L.h * 0.85;
      /* 风带名压在自己那条箭头带的正上方：箭头就在这一圈上跑，
         不抬起来就是字压箭头，两边都看不清 */
      if (L.kind === 'wb') y -= L.h * 0.78;

      // 出画一半的地名直接藏：贴着边缘被切一半的字比没有还难看
      var rx = x - L.w / 2, ry = y - L.h / 2;
      if (rx < 2 || rx + L.w > w - 2 || ry < 2 || ry + L.h > h - 2) { hideLabel(L); continue; }

      /* 整个标签框必须落在球体投影圆内（用框的对角半径算，不是中心点）：
         中心在圆内、四个角探出去的，照样会飘在星空上。 */
      var qx = Math.abs(x - cx) + L.w * 0.5;
      var qy = Math.abs(y - cy) + L.h * 0.5;
      var far = Math.sqrt(qx * qx + qy * qy);
      var discA = (rPx * 0.99 + (L.on ? 9 : 0) - far) / Math.max(22, rPx * 0.13);
      if (discA <= 0) { hideLabel(L); continue; }
      discA = Math.min(1, discA);

      // ② 矩形避让
      /* 避让带容差：已经显示出来的标签，被别人压掉一半以内就先让着，
         压掉一半以上才撤。没有容差时，两个位置接近的地名会随零点几像素
         的位移反复抢位 —— 屏幕上就是"一闪一闪"。
         新出现的标签（L.on 为 false）仍然要求完全不重叠，保证不会挤成一坨。 */
      var area = L.w * L.h, cover = 0;
      /* 两个标签之间留 5px 空隙：只判"矩形相交"的话，青藏高原 / 通天河
         这种位置相邻的会紧贴在一起印成"青藏高原通天河"，看着像串行了。 */
      var GAPP = 5;
      for (var k = 0; k < placed.length; k++) {
        var q = placed[k];
        var ox = Math.min(rx + L.w, q[2] + GAPP) - Math.max(rx, q[0] - GAPP);
        var oy = Math.min(ry + L.h, q[3] + GAPP) - Math.max(ry, q[1] - GAPP);
        if (ox > 0 && oy > 0) cover += ox * oy;
        if (!L.on && cover > 0) break;
      }
      if (cover > (L.on ? area * 0.5 : 0)) { hideLabel(L); continue; }
      /* 上面两道闸门：已经显示的不受名额限制（免得一闪一闪），
         新出现的才排队。 */
      if (!L.on) {
        if (placed.length >= flyCap || newBudget <= 0) { hideLabel(L); continue; }
        newBudget--;
      }
      placed.push([rx, ry, rx + L.w, ry + L.h]);

      /* 两道渐隐：越靠近球轮廓越淡（转过去就不会突然消失），
         越靠近屏幕边缘越淡（不贴着边界堆成一圈）。 */
      // 距阈值 0.18 以内渐显，再往里满亮
      var limb = Math.min(1, Math.max(0, (dot - dotMin) / 0.16));
      var edge = Math.min(Math.min(rx, w - rx - L.w), Math.min(ry, h - ry - L.h));
      var edgeA = Math.min(1, Math.max(0, edge / 110));
      /* 以前是 limb*edgeA*discA 三连乘，越靠近球缘/屏幕边缘越淡，最后只剩一丁点不透明度。
         实测代价：加拿大、格陵兰这些正好落在雪原上的国名，本来就白字压白雪，
         再被乘到 0.1 就直接看不见了。改成给"贴边"留一条下限 —— 仍然会淡，
         但淡到 0.6 就打住，不会淡成不存在。 */
      var alpha = limb * (0.60 + 0.40 * edgeA * discA);
      if (alpha < (L.on ? 0.05 : 0.08)) { hideLabel(L); continue; }

      /* 341 个标注每帧无脑写 style 是最贵的一笔开销（首屏卡顿的来源之一）。
         只在数值真的变了才写，静止时几乎零写入。 */
      /* translate3d 让浏览器把这一层交给合成器按小数像素平移，
         而不是每帧重新栅格化文字 —— 后者就是"自转时国名疯狂抖动"的原因。
         will-change 只给当前可见的那几十个，不然 341 个图层会把首屏拖死。 */
      /* 越靠球缘字越小（0.78→1.0）：这是"贴在球面上"的视觉线索之一，
         比单纯淡出更像球面透视。 */
      /* 0.78 的缩放在 13.5px 上只剩 10.5px，雪白底上真的认不出来；收到 0.88 起步 */
      var sc = (0.88 + 0.12 * dot).toFixed(3);
      var tr = 'translate(-50%,-50%) translate3d(' +
               x.toFixed(2) + 'px,' + y.toFixed(2) + 'px,0) scale(' + sc + ')';
      if (L._t !== tr) { L._t = tr; L.el.style.transform = tr; }
      if (!L._wc) { L._wc = 1; L.el.style.willChange = 'transform'; }
      var op = alpha.toFixed(2);
      if (L._o !== op) { L._o = op; L.el.style.opacity = op; }
      /* 时间指示模式下所有标签都不接事件 —— 不只是国家，大洲/海洋/岛这些
         没 iso 的标签也在内。它们同样挂着 click（走 parent 分支），
         只关国家那几个的话，点"北美洲"照样会弹出一张卡片。
         这里写的是内联样式，优先级高于 CSS 的 .time-mode .mlabel 规则，
         所以必须在这拦一道。 */
      /* 图层模式下国名一层不让点 —— 原来只挡了"开了全部国境线"那种情况，
         结果直接在地形/气候图层里还能点开国家档案卡。

         **但地形名必须例外**：地形名本来就只在图层模式下出现，
         原来这里把"图层开着"当成了"所有标签都不接事件"，于是地形名
         从上线起就没有一次真的被点中过 —— 命中测试被 pointer-events:none
         挡在浏览器那一层，挂在元素上的 click 监听根本不会被触发
         （用 element.click() 测试却能"通过"，所以之前一直没查出来）。 */
      var picking = globe.timeMode || globe.probeMode ||
                    (!!globe.layerName && !L.tap);
      if (picking) {
        if (L.el.style.pointerEvents !== 'none') L.el.style.pointerEvents = 'none';
      } else if (L.tap) {
        /* 地形名可以点：点开在球上画出这块山/盆地的边界 */
        if (L.el.style.pointerEvents !== 'auto') L.el.style.pointerEvents = 'auto';
      } else if (L.iso && L.el.style.pointerEvents === 'none') {
        L.el.style.pointerEvents = 'auto';
      }
      L.on = true;
      paint.push([x, y, alpha, L]);
    }
    paintLabels(paint, w, h);
  }

  /* ---------- 地名 Canvas 绘制 ----------
     所有地名文字画在一张覆盖层 canvas 上，DOM 标签的文字由 CSS 置为透明。
     为什么不用 DOM 文字：文字作为合成层，在亚像素位置平移时会被反复插值采样，
     144Hz 下球缘那批（每帧只挪 0.5~2px）清晰度高频跳变，看起来就是在闪。
     canvas 每帧直接光栅化到屏幕，同一位置只画一次，没有累积插值。 */
  var _lblCanvas = null, _lblCtx = null;

  /* 各类型地名的字形参数，照抄 CSS 里的 .mlabel / .mc / .mo / .mi / .ml / .ms / .mk。
     canvas 套不了 class，只能手动对齐；将来改 CSS 记得同步这张表。 */
  var LBL_FONT = '"Inter","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  var LBL_STYLE = {
    mc: { size: 14.5, weight: 600, color: 'rgba(232,241,254,.92)', italic: false },
    mo: { size: 13,   weight: 400, color: 'rgba(180,212,246,.78)', italic: true },
    mi: { size: 12.5, weight: 400, color: 'rgba(214,232,252,.82)', italic: false },
    ml: { size: 12,   weight: 400, color: 'rgba(148,206,238,.82)', italic: true },
    ms: { size: 11.5, weight: 400, color: 'rgba(162,202,240,.76)', italic: true },
    mk: { size: 13.5, weight: 500, color: '#ffffff', italic: false }
  };
  var LBL_DEFAULT = { size: 13, weight: 400, color: '#ffffff', italic: false };

  /* sprite 超采样倍率。2 倍分辨率渲染、按 1 倍尺寸绘制：
     缩小采样本身会平滑边缘，浮点定位时的插值差异因此小得多，
     文字边缘不会再一帧一个样（否则就是"闪"）。 */
  var SPR_SS = 2;

  /* 把一个地名栅格化成一张离屏小画布，缓存到 L._spr 上（文字不变，只做一次）。
     返回 { c: 画布, w/h: CSS 像素尺寸 }。按 dpr 放大渲染，高分屏上不糊。 */
  function labelSprite(L, dpr) {
    if (L._txt === undefined) L._txt = (L.el.textContent || '').trim();
    if (!L._txt) return null;
    if (L._spr && L._spr.dpr === dpr) return L._spr;

    var st = LBL_STYLE[L.kind] || LBL_DEFAULT;
    var font = (st.italic ? 'italic ' : '') + st.weight + ' ' + st.size + 'px ' + LBL_FONT;

    var m = document.createElement('canvas').getContext('2d');
    m.font = font;
    var tw = m.measureText(L._txt).width;
    /* 留出描边和斜体的余量 */
    var pad = Math.ceil(st.size * 0.45);
    var w = Math.ceil(tw) + pad * 2;
    var h = Math.ceil(st.size * 1.35) + pad * 2;

    var k = dpr * SPR_SS;
    var cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(w * k));
    cv.height = Math.max(1, Math.round(h * k));
    var cx = cv.getContext('2d');
    cx.scale(k, k);
    cx.font = font;
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    cx.lineJoin = 'round';

    /* 描边压底：原来靠 4 层 text-shadow 在多背景上都压得住，
       canvas 用一圈圆角描边近似 —— 白字压在雪原/沙漠上也能看清。 */
    cx.lineWidth = 2.4;
    cx.strokeStyle = 'rgba(0,0,0,.72)';
    cx.strokeText(L._txt, w / 2, h / 2);

    cx.fillStyle = st.color;
    cx.fillText(L._txt, w / 2, h / 2);

    L._spr = { c: cv, w: w, h: h, dpr: dpr };
    return L._spr;
  }

  function paintLabels(paint, w, h) {
    var stage = globeStage();
    if (!stage) return;

    if (!_lblCanvas) {
      _lblCanvas = document.createElement('canvas');
      _lblCanvas.id = 'labels-canvas';
      _lblCtx = _lblCanvas.getContext('2d');
      if (!_lblCtx) {
        /* 拿不到 2d 上下文（极少数环境禁 canvas）→ 回退成原来的 DOM 文字 */
        _lblCanvas = null;
        document.body.classList.remove('labels-canvas');
        return;
      }
      document.body.classList.add('labels-canvas');
    }

    /* 必须真的挂进 DOM —— 少了这一行，canvas 只是个游离对象：
       画得再好也不会显示（getBoundingClientRect 返回 0x0、computed style 全空）。
       挂到 #globe-stage 下、与 #labels 平级，z-index:10 才能压过 #labels 的 5。 */
    var host = stage;
    if (_lblCanvas.parentNode !== host) host.appendChild(_lblCanvas);

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var cw = Math.round(w * dpr), ch = Math.round(h * dpr);
    if (_lblCanvas.width !== cw || _lblCanvas.height !== ch) {
      _lblCanvas.width = cw;
      _lblCanvas.height = ch;
      _lblCanvas.style.width = w + 'px';
      _lblCanvas.style.height = h + 'px';
    }

    var c = _lblCtx;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.lineJoin = 'round';

    /* 每个地名先栅格化成一张小位图（sprite），之后每帧只做 drawImage 搬运。
       为什么不每帧 fillText：canvas 的 fillText 会在当前基线上重新光栅化文字，
       基线是浮点数，亚像素位置每帧都不同 → 每次得到的字形位图都有细微差别，
       看起来就是文字在上下跳。sprite 只栅格化一次，之后就固定不变了。
       （这一步也顺带让每帧开销从"重新排版+光栅化"降到"贴一张图"。） */
    for (var i = 0; i < paint.length; i++) {
      var p = paint[i];
      var x = p[0], y = p[1], a = p[2], L = p[3];
      if (a <= 0.02) continue;

      var spr = labelSprite(L, dpr);
      if (!spr) continue;

      c.globalAlpha = a;
      /* 位置用浮点，不对齐像素。
         sprite 是高倍超采样的位图，缩小绘制时 GPU 会做平滑采样，
         文字边缘不会一帧一个样；反过来，对齐到设备像素会让每帧位移
         0.5~2px 的标签变成 1/dpr 的阶梯（144Hz 下就是明显的一跳一跳）。 */
      c.drawImage(spr.c, x - spr.w / 2, y - spr.h / 2, spr.w, spr.h);
    }

    c.globalAlpha = 1;
  }

  /* ---------- 相机与飞行动画 ----------
     用"目标值 + 每帧阻尼逼近"而不是 tween 时间轴：这样飞行途中随时可以
     被拖拽打断，不会出现动画和手动操作互相抢控制权。 */
  /* 相机距离要保证「整颗球 + 大气层」都在画面里：
     fov=42° 时视口高 = 2*z*tan(21°)，要装下半径 R 的球，z ≥ R/tan(21°)。
     之前的 CAM_NEAR=2.60 是按半径 1.0 算出来的临界值，可大气层半径 1.095，
     于是点到某个国家、相机压到 2.60 时上下各被切掉一条 —— 这才是
     "点开之后上面一小部分被截断"的真凶。现在两个距离都由 fitZ() 按实际
     大气外缘反算，竖屏时还会把水平方向一起算进去。
     手动缩放下限单独给（比聚焦距离近得多），才能像以前一样贴到地表看细节。 */
  var CAM_FAR = 3.02;      // 全球视角（buildGlobe 里按视口重算）
  var CAM_NEAR = 2.81;     // 聚焦某国（整球入画）
  var CAM_MIN = 1.42;      // 手动缩放最近：球会超出画面，等于贴近看
  var CAM_MAX = 5.20;

  function flyTo(lon, lat, camZ) {
    if (!globe.spin) return;
    globe.rotTargetY = -lon * D2R - Math.PI / 2;
    globe.rotTargetX = Math.max(-1.15, Math.min(1.15, lat * D2R));
    globe.camTarget = camZ;
    globe.flying = true;
    globe.autoSpin = false;
  }

  function flyToCountry(iso) {
    var list = (globe.data && globe.data.countries) || [];
    var c = null;
    for (var i = 0; i < list.length; i++) if (list[i].iso === iso) c = list[i];
    /* 只有三国在球面有国界几何，但"飞过去"这件事对所有国家都成立 ——
       没有几何就从 meta 的中心点飞。以前这里直接 return，
       于是点日本、点埃及都停在原地，像没反应。 */
    var lon, lat;
    if (c) { lon = c.center[0]; lat = c.center[1]; }
    else {
      var m = LABEL_META && LABEL_META[String(iso).toUpperCase()];
      if (!m) return;
      lon = m.lon; lat = m.lat;
    }
    globe.camMode = 'near';
    flyTo(lon, lat, CAM_NEAR);
    globe.idleUntil = performance.now() + 1e9;   // 面板开着就不自转
  }

  /* 只退回"全球尺度"，**不动朝向**。
     点开中国 → 关面板，应该还是看着中国，只是镜头拉回；
     转球和挪镜头是两件事，混在一起就变成了"关闭 = 重置"。
     双击同理：只缩回去，不把球转回初始角度。 */
  function flyOut() {
    if (!globe.spin) return;
    globe.camMode = 'far';
    globe.camTarget = CAM_FAR;
    globe.autoSpin = true;
    globe.idleUntil = performance.now() + 1200;
  }

  /* 等镜头停稳（飞行阻尼收敛）再做事。
     典型用途：卡片里的地标照片。它们要下载、解码、再当纹理传上 GPU，
     而这三件事全落在镜头正在飞的这 700ms 里 —— 实测点一个国家掉的那几帧，
     一半来自这里。宁可让图晚 0.3 秒出现，也别让镜头抖。
     1.6 秒兜底：飞行被打断、或者用户拖住了球，不能让回调永远不执行。 */
  globe.whenSettled = function (cb) {
    var t0 = performance.now();
    (function wait() {
      if (!globe.flying || performance.now() - t0 > 1600) { cb(); return; }
      requestAnimationFrame(wait);
    })();
  };

  function buildGlobe(data) {
    var stage = globeStage();

    var w = stage.clientWidth || 640;
    var h = stage.clientHeight || 480;

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 100);

    /* 整球入画所需的相机距离。
       注意是 sin 不是 tan：球体的投影边界由切线锥决定，视半角 = asin(R/z)。
       用 tan（当平面圆盘算）会得到偏小的距离，球顶球底就差那一两条像素被切掉。
       竖屏时水平方向更紧，所以取竖直/水平中更小的那个半角。
       比例直接量 DOM，不用 camera.aspect —— 首帧那一刻的 aspect 有可能还没定。 */
    function stageAspect() {
      return (stage.clientHeight > 0) ? (stage.clientWidth / stage.clientHeight) : 1.78;
    }
    function fitZ(R) {
      var vHalf = 21 * D2R;
      var hHalf = Math.atan(Math.tan(vHalf) * stageAspect());
      return R / Math.sin(Math.min(vHalf, hHalf));
    }
    /* 竖屏时若严格按 1.14（含大气外缘）装下，球只能占屏高四成，太小。
       竖屏改按 1.02 —— 球体本身几乎满宽，大气在左右各裁掉一点点看不出。 */
    /* 竖屏原来按 1.02 装球，于是外层大气（1.045）左右各被切掉一截，
       看起来像气泡被削了两个边。改成 1.06 —— 球略小一点，气壳完整。 */
    function farZ() { return fitZ(stageAspect() < 1.05 ? 1.06 : 1.14); }
    /* 聚焦就该真的拉近。上一版按"整球入画"取 1.07，只比全球视角近 6%，
       点完国家几乎看不出变化 —— 那不叫聚焦。现在按 0.74 取：
       球约放大到画面的 1.38 倍，国家明显变大，边缘自然溢出画面，
       读起来是"飞近去了"，而不是"被切掉一条"。 */
    function nearZ() { return fitZ(stageAspect() < 1.05 ? 0.80 : 0.74); }

    CAM_FAR = farZ();
    CAM_NEAR = nearZ();
    camera.position.set(0, 0, CAM_FAR);
    globe.camTarget = CAM_FAR;
    globe.camMode = 'far';

    /* ---- 一台机器卡、另一台不卡：MSAA × 高分屏 ----
       同一台机器、同一段飞行、只改 devicePixelRatio 实测（掉帧次数）：
         dpr=1.00 → 13      dpr=1.25 → 25      dpr=1.50 → 10      dpr=2.00 → 80
       1.25 和 1.5 之间那一下不是巧合：1.25 还开着 MSAA，1.5 因为下面这行
       被关掉了。也就是说"卡不卡"主要不是像素多少，而是**有没有叠 4×MSAA**。
       4×MSAA 让这颗球的多重采样缓冲区变成 4 倍带宽，而片元着色器本身已经很重
       （昼夜双贴图混合 + 法线扰动 + 体积光 + 海面高光 + ACES 色调映射），
       在集显 / 高分屏上直接超 16.7ms —— 整段飞行就掉到 30fps。

       关掉之后：dpr=1.25 从 25 降到 8，dpr=2.00 从 80 降到 11，dpr=1.50 是 10。
       而 dpr≥1.25 本身就有超采样，球缘和金色国界线的锯齿已经看不出来，
       少这一层 MSAA 视觉上几乎无损（1.0 的屏仍然给它开着，那里是真需要）。

       分辨率保持 devicePixelRatio（上限 2）不降档：实测把 dpr=2 的缓冲区
       压到 1.5 倍并不能再减少掉帧（都是 11~12 次），说明剩下的瓶颈不在填充率，
       降档只是白白牺牲清晰度，所以不做。 */
    var DPR = window.devicePixelRatio || 1;

    /* 抗锯齿：硬件 MSAA 关掉，改用超采样。
       4×MSAA 的像素成本是四倍，而收益只在"球体边缘 + 金色国界线"这两处；
       这颗球的片元着色器本来就很重（昼夜混合 + 法线扰动 + 体积光 + 海面高光
       + ACES），叠加 4×MSAA 在核显上直接超过 16.7ms —— 实测 dpr=1.0：
         MSAA 开   平均帧 20.9ms / 掉帧 11 次
         MSAA 关   平均帧 17.2ms / 掉帧  3 次
       所以完全不开硬件 MSAA（`antialias:false`），改成把低分屏按 1.3 倍
       渲染再缩回屏幕：像素成本只有 MSAA 的 1/3，实测 17.4ms / 掉帧 2~3 次，
       球缘和国界线的台阶感肉眼与 MSAA 无差。
       dpr ≥ 1.25 的屏本身像素已经密，1:1 渲染就够，不再额外加负担。 */
    var AA_SCALE = DPR < 1.25 ? 1.3 : 1;
    var renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true,
      powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(DPR * AA_SCALE, 2));
    renderer.setSize(w, h, false);
    stage.appendChild(renderer.domElement);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        renderer.domElement.classList.add('ready');
      });
    });

    addStars(scene);

    var tilt = new THREE.Group();
    var spin = new THREE.Group();
    tilt.add(spin);
    scene.add(tilt);

    /* 先建素色球，贴图到位再换材质。这样即使纹理跨域失败，
       地球仍然是可见的实心球，而不是一片空白。 */
    /* 贴图到位前不显示球体。之前用深蓝色兜底球，在星空背景里看着像
       "一个透明的球"，比什么都不显示更差。现在加载期间只有星空 + 进度提示，
       贴图到了再把球显示出来。 */
    var fallbackMat = new THREE.MeshBasicMaterial({ color: 0x0e2438 });
    /* 分段提到 160×100：贴到近处看时轮廓不再是折线。
       贴图 UV 不受影响，代价只有多几千个三角形。 */
    var sphere = new THREE.Mesh(new THREE.SphereGeometry(1, 160, 100), fallbackMat);
    sphere.visible = false;
    spin.add(sphere);

    /* ---------- 昼夜分界 ----------
       不做叠加层，直接让球体材质自己分两半：
       法线点太阳方向 > 0 的那半边用白天贴图，< 0 的那半边换成夜间贴图
       （城市灯光那套）。第一版做的是"整体压暗 + 画一条金色晨昏线"，
       方向错了 —— 要的是"一半白天模式、一半黑夜模式"，不是一条分界线。 */
    globe.term = { on: false };

    /* 太阳直射点：UTC 12:00 正对 0° 经线，每小时西移 15°；
       纬度用赤纬的近似公式（一年一轮，误差 < 0.5°，看昼夜够用）。
       这里给的是球体局部坐标，shader 里也改用局部法线比 ——
       分界线于是钉在地表上，转球或自转都不会把它带跑。 */
    var _sunTmp = new THREE.Vector3();
    function updateSunTerm() {
      var m = globe.earthMat;
      if (!m || !m.uniforms.uSunDir || !sphere) return;
      var now = new Date();
      var utcH = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
      var lon = -(utcH - 12) * 15;
      var doy = Math.floor((now - Date.UTC(now.getUTCFullYear(), 0, 0)) / 86400000);
      var decl = 23.44 * Math.sin(2 * Math.PI * (284 + doy) / 365);
      llToVec3(lon, decl, 1, _sunTmp);
      m.uniforms.uSunDir.value.copy(_sunTmp);
    }
    globe.updateSunTerm = updateSunTerm;

    /* 大气：两层菲涅尔壳。
       以前这两层是 MeshBasicMaterial 的纯色球 —— BackSide 只能看到"球的
       内壁"，等于在整个圆面上糊了一层淡蓝，而真正的边缘辉光并不存在。
       现在改成按视角做菲涅尔：正对相机的地方完全透明，越靠轮廓越亮，
       颜色加算叠加，于是只有一圈光晕，球面本身不被蒙住。
       外缘 1.06 和 fitZ(1.07) 配套 —— 聚焦时不会被上下切掉。 */
    function atmoMaterial(color, power, strength) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uColor: { value: new THREE.Color(color) },
          uPow: { value: power },
          uOpacity: { value: 0 }
        },
        vertexShader: [
          'varying vec3 vN;',
          'varying vec3 vP;',
          'void main() {',
          '  vN = normalize(normalMatrix * normal);',
          '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
          '  vP = mv.xyz;',
          '  gl_Position = projectionMatrix * mv;',
          '}'
        ].join('\n'),
        fragmentShader: [
          'uniform vec3 uColor;',
          'uniform float uPow;',
          'uniform float uOpacity;',
          'varying vec3 vN;',
          'varying vec3 vP;',
          'void main() {',
          '  vec3 v = normalize(-vP);',
          // abs()：BackSide 看到的是内壁，法线朝外，点积是负的
          '  float f = pow(1.0 - abs(dot(normalize(vN), v)), uPow);',
          '  gl_FragColor = vec4(uColor, f * uOpacity);',
          '}'
        ].join('\n'),
        side: THREE.BackSide,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
    }
    globe.atmo = [
      { mat: atmoMaterial(0x74b4ff, 3.6, 1), base: 0.42 },   // 贴着球面的细亮边
      { mat: atmoMaterial(0x2f6ea8, 2.6, 1), base: 0.26 }    // 外面散开的一层
    ];
    var atmoIn = new THREE.Mesh(new THREE.SphereGeometry(1.004, 64, 48), globe.atmo[0].mat);
    var atmoOut = new THREE.Mesh(new THREE.SphereGeometry(1.045, 48, 32), globe.atmo[1].mat);
    atmoIn.renderOrder = 4;
    atmoOut.renderOrder = 3;
    window.__atmo = globe.atmo;          // 调试用：命令行里可以直接调参
    window.__globe = globe;
    scene.add(atmoIn);
    scene.add(atmoOut);

    /* 经纬网与大陆轮廓：只在没有贴图时显示（兜底形态）。
       有贴图后它们会显得杂乱，所以贴图一到就隐藏。 */
    /* 大陆轮廓：贴图未到时的兜底骨架，球淡入后隐掉。
       经纬网不再放进 wire —— 它现在是 4096×2048 的贴图，画一次要几十毫秒，
       放进开机流程会拖慢首屏；改成点按钮时惰性生成。 */
    var landLine = ringsToLines(data.land || [], 1.0015, new THREE.LineBasicMaterial({
      color: 0x4a7ea8, transparent: true, opacity: 0.40
    }));
    spin.add(landLine);
    globe.wire = [
      { o: landLine, base: landLine.material.opacity }
    ];
    globe.grid = null;

    /* 国界线一共三档材质，颜色统一是同一支金（0xffd98a），只靠透明度分层：
       - matOn   当前正在看的这一国（最亮）
       - matLit  点过、留着没熄的（"拼图"已经拼上的那几块）
       - matAll  「显示全部国境线」铺满全屏的那一层（最淡）
       以前全量边界用的是米白 0xf3ead8，和选中的金线是两种颜色，
       屏幕上同时出现时看着像两套系统；现在统一一支金，只分浓淡。 */
    /* 半径：只比球面高一点点。
       以前点亮线用 1.008 —— 放大到省级时，那 0.008 的半径差会被透视放大成
       十几像素，"金线浮在地图上方"就是这么来的（用户原话"有一段不小的距离"）。
       球体是 160×100 细分，弦高只有 1.2e-4，所以 1.0012 已经稳稳压在地表之上、
       不会再被深度剔除；1.0018 / 1.0012 的差也远大于深度分辨率，不会打架。 */
    var BORDER_R_ON = 1.0018, BORDER_R_ALL = 1.0012;
    globe.matOn = new THREE.LineBasicMaterial({
      color: 0xffd98a, transparent: true, opacity: 1, depthWrite: false
    });
    globe.matLit = new THREE.LineBasicMaterial({
      color: 0xffd98a, transparent: true, opacity: 0.62, depthWrite: false
    });
    /* 图层模式下国境线改冷白：金色压在彩色气候图 / 棕绿地形图上几乎看不见。
       切换图层时由 syncBorderColor 统一改，不动几何。 */
    globe.syncBorderColor = function () {
      var on = !!globe.layerName;
      var c = on ? 0xeaf7ff : 0xffd98a;
      [globe.matOn, globe.matLit, globe.matAll].forEach(function (m) {
        if (m) m.color.setHex(c);
      });
      /* 图层底色浅，同样的 1px 线要更实才看得见 */
      if (globe.matAll) globe.matAll.opacity = on ? 0.62 : 0.40;
      if (globe.matLit) globe.matLit.opacity = on ? 0.78 : 0.62;
    };
    globe.matAll = new THREE.LineBasicMaterial({
      color: 0xffd98a, transparent: true, opacity: 0.40, depthWrite: false
    });
    /* 国界默认隐藏。满屏金线会把照片级的地球拉回"数据可视化"的观感，
       而且哪块是哪国并不需要常驻提示。点过的国家会把轮廓留在球上 —— 见 lightBorder。 */
    (data.countries || []).forEach(function (c) {
      var line = ringsToLines(c.rings, BORDER_R_ON, globe.matLit);
      line.visible = false;
      spin.add(line);
      globe.groups[c.iso] = line;
    });

    /* 经纬网在这里就先建、先渲染两帧。
       这是本页最贵的一次性开销（4096×2048 画布 + 32MB 纹理 + mip 链 + shader 编译，
       集显实测 300ms 上下）。放在"球还在加载、屏幕上只有加载环"的时候做，
       用户对这 300ms 的预期本来就是等待；等球出来再做，就是一次无来由的卡顿。 */
    setTimeout(function () { prepareGrid(true); }, 0);

    /* 贴图异步替换 */
    loadEarthTextures(function (dayTex, nightTex, day8) {
      if (!dayTex) {
        sphere.visible = true;      // 贴图失败才退回素色球
        /* 经纬网是异步建的，此刻可能还没建 —— 原来写的是 grat（不存在的变量名），
           真走到"贴图失败"这条分支就会抛 ReferenceError。 */
        if (globe.grid) globe.grid.visible = true;
        landLine.visible = true;
        globeMsg('地表纹理未能加载，已回退为轮廓模式', true);
        return;
      }
      /* 各向异性过滤 —— 这是"糊"的主因。
         球面越靠近轮廓，贴图被压缩得越厉害（水平方向几乎压成一条线）。
         没有各向异性过滤时只能做各向同性的 mipmap 采样，边缘必然模糊。
         开到硬件上限后，同样的贴图会明显锐利。 */
      var maxAniso = renderer.capabilities.getMaxAnisotropy
        ? renderer.capabilities.getMaxAnisotropy() : 1;
      function tune(t) {
        if (!t) return;
        t.anisotropy = maxAniso;
        t.minFilter = THREE.LinearMipmapLinearFilter;
        t.magFilter = THREE.LinearFilter;
        t.generateMipmaps = true;
        t.needsUpdate = true;
      }
      tune(dayTex);
      tune(nightTex);

      sphere.material = earthMaterial(dayTex, nightTex);
      globe.earthMat = sphere.material;
      /* 法线贴图可能比材质先到（它更快），也可能后到（回调里自己挂） */
      if (globe.normalTex) {
        globe.earthMat.uniforms.uNormalMap.value = globe.normalTex;
        globe.earthMat.uniforms.uBump.value = 1;
      }
      /* 8K 到位就直接挂上，uMixB 恒为 1：
         shader 里按 fwidth 算"每像素吃几个 8K 纹素"，缩放时自动在 4K/8K 之间软切换，
         所以这里不需要任何交叉淡化动画 —— 也就没有"淡化到一半卡一下"这回事。 */
      if (day8) {
        globe.earthMat.uniforms.dayMapB.value = day8;
        globe.earthMat.uniforms.uMixB.value = 1;
      }
      sphere.visible = true;
      globe.texReady = true;
      /* 线框不在这里隐藏 —— 见渲染循环里跟 uFade 反向淡出的那一段。
         直接隐藏会让"线框消失"和"球淡入"之间出现两帧空白。 */

      /* 趁球还完全透明（uFade = 0）把三张贴图都推上显存。
         renderer.initTexture 是同步的：这一步会卡住主线程（8K 那张在集显上
         可能几百毫秒），但此时画面上只有星空和加载环，卡在这一刻最不刺眼。 */
      try {
        renderer.initTexture(dayTex);
        if (nightTex) renderer.initTexture(nightTex);
        if (day8) renderer.initTexture(day8);
      } catch (e) { /* 老版本 three 没有 initTexture，交给首帧上传也一样 */ }

      /* 再等两帧才起淡入：让"上传 + 着色器编译"都落在球不可见的时候。 */
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          globe.fadeStart = performance.now();
        });
      });
      if (typeof onGlobeReady === 'function') onGlobeReady();

      var subEl3 = document.getElementById('globe-sub');
      if (subEl3) subEl3.textContent = '拖动旋转 · 滚轮缩放 · 点击地名开档';
    }, renderer);

    /* 点亮一国国界 —— 这就是"拼图"的那一块。
       规则（用户定的玩法）：
         1. 点开哪国，就把那国轮廓留成金色，关掉面板也不熄 —— 拼上的块不撤；
         2. 当前正在看的那条更亮（matOn），其余已拼的略暗（matLit）；
         3. 只有"关闭全部国境线"会清盘：所有线一起熄灭。
       内置三家（中法美）的线在建球时就建好了，其余国家按需从 geo 分片里取，
       取到后缓存起来 —— 同一国第二次点不再走网络，也不再建几何。 */
    var borderCache = {};      // iso -> Line（含内置三国）
    var borderSrc = {};        // iso -> 'coarse' | 'fine'，粗轮廓是临时的，细的到了要换掉
    var pendingLit = {};       // iso -> [cb]，正在加载的
    var curLit = null;         // 当前最亮的那条
    globe.wantLit = {};        // iso -> true，表示"用户点过、应该亮着"

    function applyLit(iso, line) {
      if (!line) return;
      line.visible = true;
      line.material = globe.matOn;
      if (curLit && curLit !== line) curLit.material = globe.matLit;
      curLit = line;
      globe.active = iso;
    }

    /* 用档案自带的粗轮廓先点亮。
       为什么需要这一步：金线走 geo/（CDN），卡片走 data/（同源 Pages），
       两条链路实测差最多 700ms，表现就是"卡片展开了、国土还在路上"。
       档案里的 outline 是随卡片一起来的，先拿它顶上去，画面立刻完整；
       精细几何随后到，再把这条换成 0.006° 的版本（下面 upgrade）。
       球面一像素约 0.3°，粗轮廓是 0.05°，肉眼分不出，所以这个"升级"
       主要是为了放大后和面板里的 SVG 对齐。 */
    function litFromOutline(iso, outline) {
      var rings = outlineRings(outline);
      if (!rings) return false;
      return litFromRings(iso, rings, 'coarse');
    }

    /* 用一串环直接点亮 —— 数据在内存里时走这条，不等网络。 */
    function litFromRings(iso, rings, src) {
      var line = ringsToLines(rings, BORDER_R_ON, globe.matLit);
      if (!line) return false;
      borderCache[iso] = line;
      borderSrc[iso] = src || 'pre';
      spin.add(line);
      applyLit(iso, line);
      return true;
    }

    function lineFromGeo(gj) {
      var rings = [];
      (gj.features || []).forEach(function (f) {
        var g = f.geometry || {};
        var polys = g.type === 'Polygon' ? [g.coordinates]
          : (g.type === 'MultiPolygon' ? g.coordinates : []);
        polys.forEach(function (poly) {
          poly.forEach(function (ring) { if (ring && ring.length > 2) rings.push(ring); });
        });
      });
      if (!rings.length) return null;
      /* 半径 1.008：必须比全量国境线（1.006）更靠外，否则两线重合时
         外层那条会盖住这条，"当前选中"就亮不起来了（深度缓冲按视线方向取近的）。 */
      return ringsToLines(rings, BORDER_R_ON, globe.matLit);
    }

    /* 档案到得比几何早时，用粗轮廓先画（由 renderDetail 调用）。 */
    globe.maybePreempt = function (iso, outline) {
      if (!iso || !outline) return;
      iso = String(iso).toUpperCase();
      if (!globe.wantLit[iso]) return;         // 用户已经关掉/换国了
      if (borderSrc[iso] === 'fine') return;   // 精细的已经在画了，别倒退
      if (borderCache[iso]) return;            // 已经有线，交给 upgrade 处理
      litFromOutline(iso, outline);
    };

    globe.lightBorder = function (iso, cb) {
      if (!iso) { if (cb) cb(); return; }
      iso = String(iso).toUpperCase();
      globe.wantLit[iso] = true;

      var cached = borderCache[iso] || globe.groups[iso];
      if (cached) { applyLit(iso, cached); if (cb) cb(); return; }
      if (pendingLit[iso]) { if (cb) pendingLit[iso].push(cb); return; }

      /* 快路径：全量国境线的顶点早就下好了（geo/borders.json），同一份数据按国家
         分过组，直接切出本国那几环就能画 —— 不发任何请求。
         这就是"有的国家点下去还要等一下"的根治：那点延迟原本全在等
         data/{iso}.json 或 geo/n/{iso}.json 的网络往返。 */
      if (ALL_BY_ISO && ALL_BY_ISO[iso]) {
        if (litFromRings(iso, ALL_BY_ISO[iso], 'pre')) { if (cb) cb(); return; }
      }

      /* 数据还没预加载完（页面刚开几秒）：先用档案里的粗轮廓顶上 */
      if (CARD_OUTLINE[iso] && litFromOutline(iso, CARD_OUTLINE[iso])) {
        if (cb) cb();
      }

      pendingLit[iso] = [];
      loadGeo(iso).then(function (gj) {
        var waits = pendingLit[iso] || [];
        delete pendingLit[iso];
        /* 异步回来时用户可能已经关面板、或点了"关闭全部国境线"（清盘） */
        if (gj && globe.wantLit[iso]) {
          var line = lineFromGeo(gj);
          if (line) {
            /* 粗线已占位：原地换成精细的。两条都挂在 spin 上，先加后删，
               中间不会有一帧"什么都没有"。 */
            var old = borderCache[iso];
            borderCache[iso] = line;
            borderSrc[iso] = 'fine';
            spin.add(line);
            applyLit(iso, line);
            if (old && old !== line) {
              old.visible = false;
              spin.remove(old);
              try { old.geometry.dispose(); } catch (e) {}
            }
          }
        }
        waits.forEach(function (f) { try { f(); } catch (e) {} });
      });
    };

    /* 关面板：当前这条降成"已拼"，不熄灭。 */
    globe.dimCurrent = function () {
      if (curLit) curLit.material = globe.matLit;
      curLit = null;
      globe.active = null;
    };

    /* 只撤某一国的金线（随堂测验切题用）。
       clearLit 是"关掉全部国境线"的整盘操作，会连用户自己拼上的块一起熄掉；
       这里只清指定这一国，别的都不动 —— 否则测完一轮，用户之前看的国家也黑了。 */
    globe.unlightBorder = function (iso) {
      if (!iso) return;
      iso = String(iso).toUpperCase();
      globe.wantLit[iso] = false;
      delete pendingLit[iso];
      var gone = [];
      if (borderCache[iso]) { gone.push(borderCache[iso]); delete borderCache[iso]; delete borderSrc[iso]; }
      if (globe.groups[iso]) { gone.push(globe.groups[iso]); delete globe.groups[iso]; }
      gone.forEach(function (o) {
        o.visible = false;
        if (spin) { try { spin.remove(o); } catch (e) {} }
        try { o.geometry.dispose(); } catch (e) {}
      });
      if (gone.indexOf(curLit) >= 0) curLit = null;
      if (globe.active === iso) globe.active = null;
    };

    /* 清盘：全量国境线关掉时调用，连同已拼的块一起熄灭。 */
    globe.clearLit = function () {
      Object.keys(borderCache).forEach(function (k) { borderCache[k].visible = false; });
      Object.keys(globe.groups).forEach(function (k) { globe.groups[k].visible = false; });
      globe.wantLit = {};
      pendingLit = {};
      borderSrc = {};
      curLit = null;
      globe.active = null;
      Array.prototype.forEach.call(
        document.querySelectorAll('.dock-item'),
        function (n) { n.classList.remove('active'); }
      );
    };

    /* 空闲预热：这两样第一次使用都要现做（全量国境线的顶点拼装、
       经纬网画 4096×2048 的贴图 + 编译 shader），用户点下去会僵一下。
       球稳定后趁空闲先把它们建好，之后开关只切 visible —— 秒开。
       建好先设 visible=false，不改变当前画面。

       注意：预热**不走** toggleAllBorders。开关语义里"关掉全量国境线"等于清盘，
       预热打开再关掉就会把用户已经拼上的金线一起清掉。 */
    function warmHeavyLayers() {
      if (!globe.spin) return;
      if (!globe.grid && typeof buildGraticule === 'function') prepareGrid(true);

      /* 把 AudioContext 提前建好（此时是 suspended 状态，不发声）。
         以前只在第一次 pointerdown 里建，而创建 AudioContext 本身要
         60~100ms —— 正好压在点击起飞的那一帧上，第一次点任何国家都会
         顿一下。提前建，第一次点击只剩一次 resume，几毫秒。 */
      warmAudio();

      /* 全量国境线提前备好。
         以前这里预取的是十六个分片共 4.0MB，实测首屏 30 秒累计 8.9MB / 185 条请求，
         手机流量和弱网扛不住，所以砍掉了；砍完的代价是每次点按钮都要现拉现合并。
         现在换成专门为这层做的 geo/borders.json：0.06° 抽稀，721KB（gzip 236KB），
         是分片的六分之一 —— 预取不再心疼，按钮回到秒开。
         排到 2.6 秒之后：让首屏贴图和影像先走，别抢链路。
         这里不用 requestIdleCallback —— 页面一直跑着 rAF 循环，实测等不到
         空闲帧（timeout 兜底在 headless 下也没如期触发），预热就这么丢了；
         固定延迟反而稳。 */
      setTimeout(function () {
        if (globe.prewarmBorders) globe.prewarmBorders();
      }, 1200);
    }
    globe.warmHeavyLayers = warmHeavyLayers;

    /* 经纬网：建好 → 真正渲染两帧（上传纹理 + 编译 shader）→ 隐藏。
       只 initTexture / compile 是不够的 —— 实测 shader 编译能做掉，
       但 4096×2048 的 CanvasTexture 的 mip 链仍要等到第一次真实 draw call
       才生成，那一帧在软件渲染下能到 1 秒，在独显上也有几十毫秒。
       所以这里把网格缩到球心（0.001 倍，连一个像素都占不到），
       挂上去渲染两帧，等纹理和 program 都进了显存再还原、再隐藏。
       预热期掉这两帧，用户看到的是自转中的地球，不会注意到。 */
    function prepareGrid(silent) {
      if (globe.grid) return globe.grid;
      if (!globe.spin) return null;
      var g = buildGraticule(1.0018);
      if (silent) g.scale.setScalar(0.001);
      g.visible = true;
      globe.spin.add(g);
      globe.grid = g;
      try {
        if (globe.renderer) {
          if (g.material.map && globe.renderer.initTexture) {
            globe.renderer.initTexture(g.material.map);
          }
          if (globe.renderer.compile) globe.renderer.compile(scene, camera);
        }
      } catch (e) { /* 老版本 three：留给首次绘制，最多卡一次 */ }
      if (silent) {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            if (globe.grid !== g) return;      // 期间用户点了按钮
            g.scale.setScalar(1);
            g.visible = false;
          });
        });
      }
      return g;
    }

    /* 经纬网是底图辅助线。气压带/风带、季风带一开，金线就从半透明的带子
       中间穿过去，把一条条带子切成格子 —— 带子填充只有 0.11，压不住 0.92
       亮度的金线，看起来就是"金线压在带子上"。
       与其把带子涂实（会糊掉底图的海岸线和地貌），不如让辅助线让位：这两层
       在场时网格整体降到 42%，退成背景参考线，带子和箭头才是主角。
       原亮度存在材质 __baseOp 上，只取一次，关掉图层立即恢复。 */
    function gridDim() {
      var g = globe.grid;
      if (!g) return;
      var k = (globe.wbOn || globe.mnOn) ? 0.42 : 1;
      g.traverse(function (o) {
        var m = o.material;
        if (!m || m.opacity === undefined) return;
        if (m.__baseOp === undefined) m.__baseOp = m.opacity;
        m.opacity = m.__baseOp * k;
      });
    }
    globe.gridDim = gridDim;

    /* 排查用：把某个经纬度转到正对相机，并指定相机距离。
       截图比对"金线贴不贴合"时必须能精确复现同一个视角，靠拖鼠标没法复现。 */
    window.__look = function (lon, lat, dist) {
      if (!globe.spin || !globe.tilt) return false;
      globe.camMode = 'manual';
      globe.flying = false;
      globe.autoSpin = false;
      if (dist) globe.camTarget = dist;
      globe.spin.rotation.y = -lon * D2R - Math.PI / 2;
      globe.tilt.rotation.x = lat * D2R;
      return true;
    };

    /* 排查用：看当前拼上了几块、全量线在不在。 */
    window.__sb = function () {
      return {
        active: globe.active || null,
        lit: Object.keys(borderCache).filter(function (k) { return borderCache[k].visible; }),
        litBuiltin: Object.keys(globe.groups).filter(function (k) { return globe.groups[k].visible; }),
        gridBuilt: !!globe.grid,
        gridVisible: !!(globe.grid && globe.grid.visible),
        bordersBuilt: !!allBorders,
        bordersVisible: !!(allBorders && allBorders.visible),
        bordersBusy: !!allBusy,
        /* 调试用：相机距离与球体朝向。手机端捏合/拖拽没法用肉眼验证，
           靠这两个数确认手势到底有没有生效。 */
        camZ: globe.camera ? Math.round(globe.camera.position.z * 1000) / 1000 : null,
        rot: globe.spin ? Math.round(globe.spin.rotation.y * 1000) / 1000 : null,
        tilt: globe.tilt ? Math.round(globe.tilt.rotation.x * 1000) / 1000 : null,
        pinCN: !!globe.pinCN
      };
    };

    /* 全部国境线：一条 LineSegments 铺满整颗球。
       240 个国家各建一个对象会有 240 次 draw call，合成一条只有 1 次。

       数据用 geo/borders.json（scripts/build_all_borders.py 生成，0.06° 抽稀）：
       721KB，十六个分片是 4.0MB。之所以能砍这么多——球面一像素约 0.3°，
       分片那份 0.006° 的精度有 99% 的点落在同一个像素里，纯属白传。
       这份数据在地球稳定后就会预取、预建几何，点按钮只切 visible。

       分片那条老路留着兜底：all.json 拿不到（旧版本缓存、改坏了）时照旧合并，
       只是慢一点，不会变成"按钮点了没反应"。 */
    var allBorders = null, allBusy = false, allWant = false, allPend = null;

    /* 解析 geo/borders.json。数据是按国家分组的（c: {ISO: [环...]}），一份两用：
         · 全量国境线 —— 把所有环拼成一条 LineSegments
         · 点亮单国  —— 直接切出该国那几环，零网络
       坐标是整数化的 0.02°，这里还原成度。 */
    function ringsFromAllData(d) {
      if (!d || !d.c) return null;
      var s = d.s || 1, byIso = {}, all = [];
      Object.keys(d.c).forEach(function (iso) {
        var src = d.c[iso], rings = [];
        for (var i = 0; i < src.length; i++) {
          var row = src[i], ring = new Array(row.length), j;
          for (j = 0; j < row.length; j++) ring[j] = [row[j][0] / s, row[j][1] / s];
          if (ring.length > 2) { rings.push(ring); all.push(ring); }
        }
        if (rings.length) byIso[String(iso).toUpperCase()] = rings;
      });
      if (!all.length) return null;
      ALL_BY_ISO = byIso;
      return all;
    }

    /* 取全量国界顶点：一个 Promise、一次网络，多处调用共享。 */
    function loadAllRings() {
      if (allPend) return allPend;
      allPend = fetchAny('geo/borders.json').then(function (d) {
        var rings = ringsFromAllData(d);
        if (!rings) throw new Error('all.json 内容为空');
        return rings;
      });
      /* 失败一次就别反复打网络，清掉让下次还有机会重试 */
      allPend.catch(function () { allPend = null; });
      return allPend;
    }

    /* 建几何。建过一次就不再建（开关只切 visible）。
       半径 1.006：球半径是 1，差值必须比深度缓冲的精度大一档，
       否则线会陷进球面被剔掉（1.0045 实测就完全看不见）。
       颜色与选中的金线同一支（matAll = 0.40 透明度），只分浓淡。
       点亮的那几国画在 1.008，永远压在这层上面。 */
    function makeAllBorders(rings) {
      if (allBorders || !rings || !rings.length) return allBorders;
      allBorders = ringsToLines(rings, BORDER_R_ALL, globe.matAll);
      allBorders.visible = false;
      spin.add(allBorders);
      return allBorders;
    }

    /* 加载期间用户又点了：把回调排上，加载完一次性通知。
       以前是 `if (allBusy) return;` —— 直接返回、cb 不调、按钮的 busy 类
       永远摘不掉，之后所有点击都被 `if (classList.contains('busy')) return`
       挡在外面。用户点两下就变成"按钮没反应"，而屏幕上线的状态跟他以为的
       完全对不上 —— 这就是"偶发"的来源。 */
    var allWait = [];

    function flushAll(v) {
      allWait.splice(0).forEach(function (f) { try { f(v); } catch (e) {} });
    }

    /* 兜底：十六个分片合并（4.0MB）。只在 all.json 不可用时走。 */
    function ringsFromChunks() {
      var jobs = [];
      var got = 0;
      function tick() {
        got++;
        if (!allWant) return;
        globeMsg(got < GEO_COUNT
          ? '正在加载全部国境线… ' + got + '/' + GEO_COUNT
          : '正在合并国境线…');
      }
      for (var b = 0; b < GEO_COUNT; b++) {
        jobs.push(fetchAny('geo/c' + b + '.json')
          .then(function (x) { tick(); return x; })
          .catch(function () { tick(); return null; }));
      }
      return Promise.all(jobs).then(function (list) {
        var rings = [];
        list.forEach(function (all) {
          if (!all) return;
          Object.keys(all).forEach(function (iso) {
            (((all[iso] || {}).features) || []).forEach(function (f) {
              var g = f.geometry || {};
              var polys = g.type === 'Polygon' ? [g.coordinates]
                : (g.type === 'MultiPolygon' ? g.coordinates : []);
              polys.forEach(function (poly) {
                poly.forEach(function (ring) {
                  if (ring && ring.length > 2) rings.push(ring);
                });
              });
            });
          });
        });
        return rings;
      });
    }

    function buildAllBorders(show) {
      allWant = !!show;
      if (allBorders) {                 // 预建已完成：只切显隐，秒开
        allBorders.visible = allWant;
        if (!allWant) globe.clearLit();
        globeMsg('');
        flushAll(allWant);
        return;
      }
      if (allBusy) return;              // 在路上的那次会按最新 allWant 收尾
      allBusy = true;
      if (allWant) globeMsg('正在准备全部国境线…');

      loadAllRings()
        .catch(function () {
          if (allWant) globeMsg('正在加载全部国境线… 0/' + GEO_COUNT);
          return ringsFromChunks();
        })
        .then(function (rings) {
          allBusy = false;
          if (!rings || !rings.length) { globeMsg(''); flushAll(false); return; }
          makeAllBorders(rings);
          if (allBorders) allBorders.visible = allWant;
          globeMsg('');
          flushAll(allWant);
        })
        .catch(function () {
          allBusy = false;
          globeMsg('');
          flushAll(false);
        });
    }

    /* 洋流层要拿这套环去画陆地遮罩，但它在另一个闭包里 —— 挂一个只读取的
       入口出来，共用同一份 Promise，不会多打一次网络。 */
    globe.loadRings = loadAllRings;

    /* 预热：地球转起来之后，趁空闲把 all.json 取回来并把几何建好（visible=false）。
       用户点按钮时就不用等网络，也不用等那一下同步的顶点拼装。
       建完不显示、不动画面。 */
    globe.prewarmBorders = function () {
      if (allBorders) return;
      loadAllRings().then(function (rings) {
        if (allBorders) return;        // 期间用户已经点开过，别重复建
        makeAllBorders(rings);
        if (allBorders) {
          allBorders.visible = false;
          if (globe.renderer && globe.renderer.compile) {
            /* 提前编译一次：否则第一次显示时那一帧要编 shader，能到几十毫秒 */
            try { globe.renderer.compile(scene, camera); } catch (e) {}
          }
        }
      }).catch(function () { /* 预热失败无所谓，点按钮时会重试 */ });
    };

    globe.toggleAllBorders = function (cb) {
      if (cb) allWait.push(cb);
      /* 建好一次就留着，开关只切 visible。
         以前关掉就 dispose，下次打开又得重新合并一轮 —— 用户手感就是
         "第一次点卡一下、第二次又卡一下"。这个对象只有一条 draw call，
         留着占不了多少内存。 */
      if (allBorders) {
        allBorders.visible = !allBorders.visible;
        /* 关掉全量国境线 = 清盘：连已拼上的金线一起熄灭。
           这是用户定的玩法 —— 点过的国家会一直亮着，只有这里能一次抹掉。 */
        if (!allBorders.visible) globe.clearLit();
        flushAll(allBorders.visible);
        return;
      }
      globeMsg('正在加载全部国境线…');
      buildAllBorders(true);
    };

    globe.scene = scene;
    globe.camera = camera;
    globe.renderer = renderer;
    globe.tilt = tilt;
    globe.spin = spin;
    globe.sphere = sphere;
    globe.data = data;
    globe.ready = true;

    /* 球一建好就开始拉全量国境线的顶点（721KB / gzip 236KB），比等"球稳定"
       早好几秒 —— 那份数据太小，不差这点带宽，但能让按钮真正提前备好。
       数据到手后隔一拍再建几何：建那一下是同步的（几万个顶点拼数组），
       别撞在首屏第一帧上。 */
    loadAllRings().then(function () {
      setTimeout(function () {
        if (globe.prewarmBorders) globe.prewarmBorders();
      }, 1200);
    }).catch(function () {});

    // ---- 交互：拖拽 ----
    var cv = renderer.domElement;
    var downAt = { x: 0, y: 0 };

    /* 拖拽要能从"地名"上开始。
       现在 239 个国家的地名都可点，它们盖住了球面相当大一片；如果按住字就拖不动，
       手感会碎得厉害。所以：down 绑在 canvas 和每个地名上，move/up 统一挂 window
       （带 globe.dragging 守卫），这样从字上按下也能直接转球。 */
    /* ---------- 拖拽旋转 + 双指捏合缩放 ----------
       以前只有 wheel：手机上根本没有滚轮事件，所以**缩放完全不可用**；
       而拖拽虽然没有 pointercancel 保护（#globe-stage 少了 touch-action:none），
       手指划两下就被浏览器抢去滚页面，收到的是一次 pointercancel。

       这里把指针按 id 记账：手机两根手指会同时发 pointermove，
       不分 id 的话两指的位移互相覆盖，镜头会跳。
       一根手指 = 转球；两根手指 = 捏合，转动同时停下
       （否则球会跟着两指中点乱跑）。 */
    var ptrs = {};          // pointerId -> {x, y}
    var dragId = null;      // 负责转球的那根
    var pinching = false;
    var pinch0 = 0;         // 捏合开始时两指距离（px）
    var pinchCam0 = 0;      // 捏合开始时的相机距离

    function ptrCount() { return Object.keys(ptrs).length; }
    function ptrDist() {
      var ids = Object.keys(ptrs);
      if (ids.length < 2) return 0;
      var a = ptrs[ids[0]], b = ptrs[ids[1]];
      var dx = a.x - b.x, dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy) || 1;
    }

    function dragDown(e) {
      /* 鼠标只认左键；触摸和笔没有 button 之分。 */
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };

      if (ptrCount() === 1) {
        dragId = e.pointerId;
        globe.dragging = true;
        globe.lastInput = performance.now();
        globe.last.x = e.clientX;
        globe.last.y = e.clientY;
        downAt.x = e.clientX;
        downAt.y = e.clientY;
        globe.moved = 0;
        globe.vel.x = globe.vel.y = 0;
        globe.lastMoveT = performance.now();
        cv.classList.add('dragging');
        globe.autoSpin = false;
        if (globe.pinCN) setPinChina(false);   // 手一转就是要自己看，钉子拔掉
        globe.flying = false;        // 手动接管，打断正在进行的飞行
        return;
      }

      if (ptrCount() === 2) {
        pinching = true;
        pinch0 = ptrDist();
        pinchCam0 = globe.camTarget;
        globe.dragging = false;
        globe.vel.x = globe.vel.y = 0;
        globe.moved = 999;           // 这一串动作不许被当成"点了一下"
        cv.classList.remove('dragging');
        globe.camMode = 'manual';
        globe.flying = false;
      }
    }

    function dragMove(e) {
      var p = ptrs[e.pointerId];
      if (!p) return;                // 不是我们记过的指针（比如第二根手指之外的多余触点）
      p.x = e.clientX;
      p.y = e.clientY;
      globe.lastInput = performance.now();

      /* 双指：只算缩放。两指分开 → 距离变大 → 相机拉近（camZ 变小）。
         用手势的"倍数"而不是每帧增量，捏多少走多少，松手不飘。 */
      if (pinching && ptrCount() >= 2) {
        var d = ptrDist();
        if (pinch0 > 0 && d > 0) {
          globe.camTarget = Math.max(CAM_MIN, Math.min(CAM_MAX, pinchCam0 * (pinch0 / d)));
        }
        globe.autoSpin = false;
        globe.idleUntil = performance.now() + 2600;
        return;
      }

      if (!globe.dragging || e.pointerId !== dragId) return;
      var dx = e.clientX - globe.last.x;
      var dy = e.clientY - globe.last.y;
      globe.last.x = e.clientX;
      globe.last.y = e.clientY;
      globe.moved += Math.abs(dx) + Math.abs(dy);
      // 0.0016 弧度/像素：拖满 1200px 约转 110°，手一抖不会转到背面
      globe.spin.rotation.y += dx * 0.0016;
      globe.tilt.rotation.x += dy * 0.0016;

      /* 松手后那一段惯性，速度必须是「弧度/毫秒」，不能是「弧度/事件」。
         原来存的是这一帧的位移量：浏览器把快速划动的 pointermove 合并投递时，
         一次事件可能带 120px，速度就变成慢速拖动的十几倍 —— 松手后球直接飞出去；
         反过来慢慢拖时每次只挪 3px，松手几乎立刻停。同一台机器手感忽快忽慢。
         这里按两次事件的时间差归一，再用 EMA 抖掉抖动。 */
      var nowV = performance.now();
      var dtm = Math.max(8, Math.min(64, nowV - (globe.lastMoveT || nowV - 16)));
      globe.lastMoveT = nowV;
      var ix = (dx * 0.0016) / dtm;
      var iy = (dy * 0.0016) / dtm;
      globe.vel.x = globe.vel.x * 0.62 + ix * 0.38;
      globe.vel.y = globe.vel.y * 0.62 + iy * 0.38;
      /* 上限 2.0 弧度/秒：再快就是"甩"，整颗球会糊成一片转影 */
      var VMAX = 0.0020;
      globe.vel.x = Math.max(-VMAX, Math.min(VMAX, globe.vel.x));
      globe.vel.y = Math.max(-VMAX, Math.min(VMAX, globe.vel.y));
      var lim = 78 * D2R;
      globe.tilt.rotation.x = Math.max(-lim, Math.min(lim, globe.tilt.rotation.x));
    }

    /* 收尾：抬起一根手指、或整段手势结束。 */
    function dragUp(e) {
      if (e && e.pointerId !== undefined) delete ptrs[e.pointerId];
      var n = ptrCount();

      if (pinching && n < 2) {
        pinching = false;
        globe.idleUntil = performance.now() + 2600;
        if (n === 1) {
          /* 松掉一根、还剩一根：让留下的那根接着转。
             基准点重设到它当前的位置，否则球会"跳"一下。 */
          for (var k in ptrs) { dragId = Number(k); break; }
          globe.dragging = true;
          globe.last.x = ptrs[dragId].x;
          globe.last.y = ptrs[dragId].y;
          globe.vel.x = globe.vel.y = 0;
          cv.classList.add('dragging');
          return;
        }
      }
      if (n > 0) return;

      dragId = null;
      if (!globe.dragging) {
        /* 捏合结束时 dragging 已经是 false，但自转要恢复 */
        globe.autoSpin = true;
        return;
      }
      globe.dragging = false;
      cv.classList.remove('dragging');
      /* 只有真正拖动过才延时恢复自转。
         之前这里一律 +2.4 秒，于是"点一下画面"也会让地球停两秒半 ——
         单击本来只是看看，不该改变自转状态。
         顺带修了个老 bug：原来看的是"最后一小段位移"，慢慢拖松手时几乎总是 0，
         于是拖动之后自转立刻恢复，和"停 2.4 秒"的意图不符。现在累计整段位移。 */
      globe.autoSpin = true;
      globe.idleUntil = performance.now() + (globe.moved > 6 ? 2400 : 0);
      /* 手停在原地再松手，是没有"甩"的：最后一次移动离抬起超过 120ms
         就把速度清掉。否则球会在你已经收手之后才开始加速转，非常怪。 */
      if (performance.now() - (globe.lastMoveT || 0) > 120) {
        globe.vel.x = globe.vel.y = 0;
      }
    }
    globe.dragDown = dragDown;
    cv.addEventListener('pointerdown', dragDown);

    /* ---------- 时间指示 ----------
       射线打到球面拿交点，再转回经纬度算当地时间。
       交点用的是世界坐标，必须先 worldToLocal 回球体坐标 ——
       直接拿世界坐标算经纬度，地球转过多少，时间就错多少。 */
    var _ray = new THREE.Raycaster();
    var _ndc = new THREE.Vector2();
    globe.pickLL = function (clientX, clientY) {
      var r = cv.getBoundingClientRect();
      if (!r.width || !r.height) return null;
      _ndc.x = ((clientX - r.left) / r.width) * 2 - 1;
      _ndc.y = -((clientY - r.top) / r.height) * 2 + 1;
      _ray.setFromCamera(_ndc, camera);
      var hit = _ray.intersectObject(sphere, false);
      if (!hit || !hit.length) return null;
      var p = hit[0].point.clone();
      sphere.worldToLocal(p);
      return vec3ToLL(p);
    };

    var pinLayer = document.getElementById('time-pins');
    var TPIN_MAX = 6;                      // 最多同时钉 6 个，再多就从最早的开始收
    var pins = [];                         // { anchor, lat, lon, kind } —— 位置靠经纬度每帧重算
    /* 点一下气泡本体就关掉它（不再单独做 ×）。
       直接改 DOM 会漏掉 pins 数组（它才是每帧投影的依据），两边一起删。 */
    function bindPinClose(rec, box) {
      var b = box.querySelector('.tp-bubble');
      if (!b) return;
      b.title = '点击关闭';
      b.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var at = pins.indexOf(rec);
        if (at >= 0) pins.splice(at, 1);
        rec.anchor.classList.add('out');
        setTimeout(function () {
          if (rec.anchor.parentNode) rec.anchor.parentNode.removeChild(rec.anchor);
        }, 170);
      });
    }

    /* 超过上限就收最早的一个。按 pins 数组删 —— 之前按 children 删，
       加了单独关闭之后两边顺序会不同步，可能删错节点。 */
    function trimPins() {
      while (pins.length > TPIN_MAX) {
        var old = pins.shift();
        if (old.anchor.parentNode) old.anchor.parentNode.removeChild(old.anchor);
      }
    }

    function showTimePin(cx, cy, ll) {
      if (!pinLayer) return;
      /* 时区按经度算：每 15° 一小时。真实时区有政治边界，
         这里要的是"这一点在太阳下的地方时"，按经度反而更自洽。 */
      var offMin = Math.round(ll.lon / 15 * 60);
      var now = new Date();
      var t = new Date(now.getTime() + offMin * 60000);
      var hh = t.getUTCHours(), mm = t.getUTCMinutes();
      var off = offMin / 60;
      var offStr = 'UTC' + (off >= 0 ? '+' : '−') +
        (Math.abs(off) % 1 === 0 ? Math.abs(off) : Math.abs(off).toFixed(1));
      var ns = ll.lat >= 0 ? 'N' : 'S';
      var ew = ll.lon >= 0 ? 'E' : 'W';

      /* 每个落点各自一个标记，互不覆盖 —— 连着点三处就有三个时间钉在那儿。
         气泡里的时间是**点击那一刻**的，不会跟着走；但钉子的**位置**必须跟着地球：
         它记的是经纬度，每帧重新投影到屏幕上，所以缩放、拖拽之后它仍然扎在同一个点上。 */
      var anchor = document.createElement('div');
      anchor.className = 'tpin-anchor';
      var d = document.createElement('div');
      d.className = 'tpin k-time' + (cy < 150 ? ' below' : '');
      d.innerHTML =
        '<div class="tp-bubble"><b>' + (hh < 10 ? '0' : '') + hh + ':' +
          (mm < 10 ? '0' : '') + mm + '</b>　' +
