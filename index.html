rc":"assets/teach/yangtze-basin.webp","ver":"e8587a30","alt":"长江流域水系图","cap":"长江干流与主要支流：宜昌以上为上游，落差集中；宜昌到湖口是中游，荆江曲流、洞庭与鄱阳两湖都在这一段；湖口以下是下游，江阔水缓。","credit":"Shannon1，数据来自 Natural Earth · CC BY-SA 4.0"},"loess-plateau":{"src":"assets/teach/loess-plateau.webp","ver":"768f5db0","alt":"山西大同浑源一带的黄土丘陵","cap":"黄土高原的典型地貌：千沟万壑、坡面破碎。黄土垂直节理发育、遇水就崩解，植被一被破坏，冲刷顺着这些沟谷一路切下去，泥沙全进了黄河。","credit":"Till Niermann · CC BY-SA 3.0"},"china-terrace":{"src":"assets/teach/china-terrace.webp","ver":"fd72440e","alt":"云南元阳的梯田","cap":"云南元阳梯田：把坡地改成一层层水平田面，保水、保土、保肥，是南方山区\"因地制宜\"的经典做法。和华北平原的大片旱地放在一起看，就是\"南稻北麦、东耕西牧\"的两端。","credit":"Jialiang Gao, peace-on-earth.org · CC BY-SA 3.0"}};
  try { TCH_LV = localStorage.getItem('tch-level') || 'jr'; } catch (e) {}

  function tchNorm(s) {
    return String(s || '').toLowerCase()
      .replace(/[\s·・、，,。.．/\\|_\-—－:：;；!！?？"'“”‘’（）()【】\[\]]/g, '');
  }

  function tchFind(id) {
    for (var i = 0; i < TEACH.length; i++) if (TEACH[i].id === id) return TEACH[i];
    return null;
  }

  function tchHit(q) {
    var s = tchNorm(q);
    if (s.length < 2) return null;
    var best = null, bestLen = 0, bestDerived = false;
    for (var i = 0; i < TEACH.length; i++) {
      var it = TEACH[i];
      var keys = [{ v: it.name, d: false }].concat(
        (it.alias || []).map(function (a) { return { v: a, d: false }; }));
      if (it.kind === 'compare') {
        [it.a, it.b].forEach(function (iso) {
          var nm = (typeof LABEL_META !== 'undefined' && LABEL_META && LABEL_META[iso])
                   ? LABEL_META[iso].n : '';
          /* 派生键（国名＋维度）排在后面：同样长度时，条目本名优先。
             否则搜"中国农业"会先命中"法国 vs 中国 · 农业与餐桌"。 */
          if (nm) keys.push({ v: nm + (it.dim || ''), d: true });
        });
      }
      for (var k = 0; k < keys.length; k++) {
        var key = tchNorm(keys[k].v);
        if (!key || key.length < 2) continue;
        var forward = s.indexOf(key) === 0;               // 查询以条目名开头
        var prefix = s.length >= 3 && key.indexOf(s) === 0; // 查询是条目名的前缀
        var inside = key.length >= 3 && s.length >= 4 && s.indexOf(key) > 0;
        if (!(forward || prefix || inside)) continue;
        /* 命中长度取"被认出来的那一段"，追问提示靠它判断多打了几个字 */
        var mlen = prefix ? s.length : key.length;
        var better = mlen > bestLen || (mlen === bestLen && bestDerived && !keys[k].d);
        if (better) { best = it; bestLen = mlen; bestDerived = keys[k].d; }
      }
    }
    return best ? { it: best, len: bestLen } : null;
  }

  function tchLevelBar() {
    var lv = el('div', 'tch-lv');
    lv.appendChild(el('b', '', '课本口径'));
    var seg = el('div', 'tch-seg');
    [['jr', '初中'], ['sr', '高中']].forEach(function (p) {
      var btn = el('button', TCH_LV === p[0] ? 'on' : '', p[1]);
      btn.type = 'button';
      btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        TCH_LV = p[0];
        try { localStorage.setItem('tch-level', TCH_LV); } catch (e2) {}
        /* 面板开着就重画面板，否则重画下拉 —— 两处都能切，状态只有一个 */
        if (K_OPEN_ID && detail.classList.contains('open')) {
          var same = tchFind(K_OPEN_ID);
          if (same) { openKCard(same); return; }
        }
        renderResults(qInput ? qInput.value : '');
      });
      seg.appendChild(btn);
    });
    lv.appendChild(seg);
    return lv;
  }

  function tchGo(iso) {
    var tgt = String((typeof targetIso === 'function' ? targetIso(iso) : iso) || iso).toUpperCase();
    flyToCountry(tgt);
    openDetail(tgt, cardOf(tgt), false);
    setSearch(false);
    if (qInput) qInput.blur();
  }

  function tchAsk(txt) {
    if (!qInput) return;
    qInput.value = txt;
    renderResults(txt);
    qInput.focus();
  }

  function tchCard(it, extra) {
    var box = el('div', 'tch');
    if (extra && extra > 2) {
      box.appendChild(el('div', 'tch-tip',
        '这条追问没有单独条目。先用下面这张卡回答：完整讲解里有反例和“接着问”。'));
    }

    var hd = el('div', 'tch-hd');
    hd.appendChild(el('span', 'tch-kind', it.kind === 'compare' ? '对比' : '概念'));
    hd.appendChild(el('span', 'tch-name', it.name));
    if (it.level) hd.appendChild(el('span', 'tch-book', it.level[TCH_LV] || ''));
    box.appendChild(hd);

    /* 下拉只给"是什么 + 为什么"两段，其余（地点、反例、追问、依据）都在面板里。
       理由：下拉是"确认搜对了没有"的地方，不是读长文的地方。 */
    if (it.kind === 'concept') {
      box.appendChild(el('div', 'tch-line', it.line));
      box.appendChild(el('div', 'tch-sec', '为什么'));
      box.appendChild(el('p', 'tch-p', it.why));
    } else {
      /* 对比没有"定义"，用一句话说清差在哪，表格留给面板 */
      var brief = String(it.why || '').split('。')[0];
      box.appendChild(el('div', 'tch-line', brief ? brief + '。' : (it.dim + '对比')));
    }

    /* 说清"点开能得到什么"：只说"展开详解"，用户不知道里面有东西 */
    var bits = [];
    if ((it.anchors || []).length) bits.push((it.anchors || []).length + ' 个能飞过去的地方');
    if (it.counter) bits.push('1 个反例');
    if (it.media && it.media.hint) bits.push('1 个图示位');
    if ((it.quiz || []).length) bits.push((it.quiz || []).length + ' 道经典题');
    if (bits.length) box.appendChild(el('div', 'tch-hook', '卡里还有 ' + bits.join(' · ')));

    var more = el('button', 'tch-more', '完整讲解 · 在右侧打开');
    more.type = 'button';
    more.appendChild(el('i', '', '›'));
    more.addEventListener('mousedown', function (e) { e.preventDefault(); });
    more.addEventListener('click', function (e) { e.stopPropagation(); openKCard(it); });
    box.appendChild(more);
    return box;
  }

  /* ---------- 关键词兜底：本名/别名没命中时，才查标签 ---------- */
  function tchTagHit(q) {
    var s2 = tchNorm(q);
    if (s2.length < 2) return [];
    var out = [];
    for (var i = 0; i < TEACH.length; i++) {
      var it = TEACH[i], best = 0, hitTag = null;
      var tg = it.tags || [];
      for (var j = 0; j < tg.length; j++) {
        var t = tchNorm(tg[j]);
        if (!t || t.length < 2) continue;
        var sc = 0;
        if (s2 === t) sc = 3;                       // 完全就是这个词
        else if (s2.indexOf(t) >= 0) sc = 2;         // 输入里带着这个词
        else if (t.indexOf(s2) >= 0) sc = 1;         // 输入是词的一部分
        if (sc > best) { best = sc; hitTag = tg[j]; }
      }
      if (best) out.push({ it: it, score: best, tag: hitTag });
    }
    out.sort(function (a, b) { return b.score - a.score; });
    return out;
  }

  /* 一条命中就直接出卡；多条给一张短列表，不把它塞成第二个搜索引擎 */
  function tchTagBlock(hits) {
    if (!hits.length) return null;
    if (hits.length === 1 || hits[0].score >= 3) {
      var wrap = el('div', 'sr-list');
      wrap.appendChild(tchCard(hits[0].it, 0));
      return wrap;
    }
    var box = el('div', 'sr-list');
    var hd = el('div', 'sr-sug-h');
    hd.appendChild(el('span', '', '相关知识点 · ' + hits.length + ' 条'));
    box.appendChild(hd);
    hits.slice(0, 6).forEach(function (h) {
      var it = h.it;
      var row = el('div', 'sr-item');
      row.appendChild(srIcon('doc'));
      var txt = el('div', 'sr-txt');
      var nm = el('div', 'sr-name', it.name);
      nm.appendChild(el('span', 'sr-tag', h.tag));
      txt.appendChild(nm);
      txt.appendChild(el('div', 'sr-sub', String(it.line || '').slice(0, 46)));
      row.appendChild(txt);
      row.addEventListener('click', function () { openKCard(it); });
      box.appendChild(row);
    });
    if (hits.length > 6) {
      box.appendChild(el('div', 'sr-foot', '还有 ' + (hits.length - 6) + ' 条，换个更具体的词试试'));
    }
    return box;
  }

  /* ---------- 空输入时的"可以这样问" ----------
     "换一批"以前是从写死的 10 个 id 里随机抽 4 个 —— 换两下必然撞车。
     改成把全部概念卡放进池子，按"洗牌队列"发放：一轮之内不重复，
     一轮走完再洗牌，新一轮开头还要避开上一轮的尾巴。 */
  var SUG_QUEUE = [], SUG_LAST = [];

  function sugRefill() {
    var pool = TEACH.filter(function (x) { return x.kind === 'concept' && x.name; })
                    .map(function (x) { return x.id; });
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    /* 上一批刚看过的 5 个挪到队尾，保证"换一批"一眼看去是真的换了 */
    if (SUG_LAST.length) {
      var tail = [], head = [];
      pool.forEach(function (id) { (SUG_LAST.indexOf(id) < 0 ? head : tail).push(id); });
      pool = head.concat(tail);
    }
    SUG_QUEUE = pool;
  }

  function sugTake(n) {
    var out = [], guard = 0;
    /* guard 是保险丝：万一条目被删得只剩三两个，也不能在这儿转成死循环 */
    while (out.length < n && guard++ < 600) {
      if (!SUG_QUEUE.length) sugRefill();
      var id = SUG_QUEUE.shift();
      if (out.indexOf(id) < 0) out.push(id);
    }
    SUG_LAST = out;
    return out;
  }

  function srSuggest() {
    var wrap = el('div', 'sr-sug');

    /* 今天一条：按"第几天"取模，同一天打开看到的是同一张卡（不随刷新乱跳） */
    var poolDaily = TEACH.filter(function (x) { return x.kind === 'concept'; });
    if (poolDaily.length) {
      var dayN = Math.floor(Date.now() / 86400000);
      var daily = poolDaily[dayN % poolDaily.length];
      var dc = el('div', 'sr-daily');
      dc.appendChild(el('span', 'sr-daily-tag', '今天'));
      var dtx = el('div', 'sr-daily-txt');
      dtx.appendChild(el('div', 'sr-daily-name', daily.name));
      dtx.appendChild(el('div', 'sr-daily-line', String(daily.line || '').slice(0, 68)));
      dc.appendChild(dtx);
      dc.appendChild(el('span', 'sr-daily-go', '看看 ›'));
      dc.addEventListener('mousedown', function (e) { e.preventDefault(); });
      dc.addEventListener('click', function (e) { e.stopPropagation(); openKCard(daily); });
      wrap.appendChild(dc);
    }

    var hd = el('div', 'sr-sug-h');
    hd.appendChild(el('span', '', '可以这样问'));
    var again = el('button', 'sr-sug-more', '换一批');
    again.type = 'button';
    hd.appendChild(again);
    wrap.appendChild(hd);

    var chips = el('div', 'sr-sug-chips');
    function fill() {
      chips.innerHTML = '';
      sugTake(5).forEach(function (id) {
        var it = tchFind(id);
        if (!it) return;
        /* chip 是"引子"不是标题：先把冒号后面的副题去掉（"香港与澳门：一国两制"
           → "香港与澳门"），再压到 10 个字。不这样收，一个长条目就独占一整行，
           一屏只放得下三个词，看着又挤又碎。全名挂在 title 上。 */
        var nmn = String(it.name || '');
        var ci = nmn.search(/[：:]/);
        if (ci >= 2) nmn = nmn.slice(0, ci);
        var label = nmn.length > 10 ? nmn.slice(0, 10) + '\u2026' : nmn;
        if (!label) return;
        var b = el('button', 'sr-sug-chip', label);
        b.type = 'button';
        if (it.name && it.name !== label) b.title = it.name;
        b.addEventListener('mousedown', function (e) { e.preventDefault(); });
        b.addEventListener('click', function (e) { e.stopPropagation(); openKCard(it); });
        chips.appendChild(b);
      });
      /* 轻微上浮淡入：换一批看得见"换"这个动作，而不是原地硬闪一下 */
      chips.classList.remove('pop');
      void chips.offsetWidth;
      chips.classList.add('pop');
    }
    fill();
    wrap.appendChild(chips);      // 先放"可以这样问"的词，再放最近看过

    /* 有历史就在下面补一行"最近看过" —— 比随机推荐准得多 */
    var rec = (K_RECENT || []).map(tchFind).filter(Boolean).slice(0, 4);
    if (rec.length) {
      var h2 = el('div', 'sr-sug-h');
      h2.appendChild(el('span', '', '最近看过'));
      wrap.appendChild(h2);
      var chips2 = el('div', 'sr-sug-chips');
      rec.forEach(function (it) {
        var b2 = el('button', 'sr-sug-chip ghost', it.name);
        b2.type = 'button';
        b2.addEventListener('mousedown', function (e) { e.preventDefault(); });
        b2.addEventListener('click', function (e) { e.stopPropagation(); openKCard(it); });
        chips2.appendChild(b2);
      });
      wrap.appendChild(chips2);
    }

    again.addEventListener('mousedown', function (e) { e.preventDefault(); });
    again.addEventListener('click', function (e) { e.stopPropagation(); fill(); });
    return wrap;
  }

  function tchBlock(q) {
    var hit = tchHit(q);
    if (!hit) { if (searchWrap) searchWrap.classList.remove('tch-open'); return null; }
    if (searchWrap) searchWrap.classList.add('tch-open');
    var wrap = el('div', 'sr-list');
    wrap.appendChild(tchCard(hit.it, tchNorm(q).length - hit.len));
    return wrap;
  }

  /* ---------- 右侧面板里的详解卡 ---------- */
  var K_OPEN_ID = null;

  /* 最近看过：本地记 5 条，回访用户第一眼看到自己的痕迹 */
  var K_RECENT = [];
  try { K_RECENT = JSON.parse(localStorage.getItem('tch-recent') || '[]') || []; } catch (e) { K_RECENT = []; }
  function kRemember(id) {
    if (!id) return;
    K_RECENT = K_RECENT.filter(function (x) { return x !== id; });
    K_RECENT.unshift(id);
    if (K_RECENT.length > 5) K_RECENT.length = 5;
    try { localStorage.setItem('tch-recent', JSON.stringify(K_RECENT)); } catch (e) {}
  }
  /* 走过的知识卡路径。关闭面板、打开国家档案时清空 —— 两条线不能混。 */
  var K_PATH = [];

  /* 链条走完了给三个出口：回起点 / 换一个知识点 / 看一张对比卡 */
  function kExit(it) {
    var nx = (it.next || []).filter(function (n) { return n && n.to; });
    var exhausted = !nx.length || nx.every(function (n) { return K_PATH.indexOf(n.to) >= 0; });
    /* 两种时候给出口：真的走到头了（两个追问都走过），或者已经走了 3 跳以上。
       后者更常见——用户不是没路走，而是怕迷路。 */
    if (!exhausted && K_PATH.length < 3) return null;

    var box = el('div', 'kexit');
    box.appendChild(el('div', 'kexit-h',
      exhausted ? '这条线到这里了' : '已经走了 ' + K_PATH.length + ' 跳'));

    var row = el('div', 'kexit-row');

    if (K_PATH.length > 1) {
      var back = el('button', 'kexit-btn', '回到起点');
      back.type = 'button';
      back.addEventListener('click', function () {
        var first = tchFind(K_PATH[0]);
        if (first) openKCard(first, { path: [K_PATH[0]] });
      });
      row.appendChild(back);
    }

    var pool = TEACH.filter(function (x) {
      return x.kind === 'concept' && K_PATH.indexOf(x.id) < 0;
    });
    if (pool.length) {
      var pick = el('button', 'kexit-btn', '换一个知识点');
      pick.type = 'button';
      pick.addEventListener('click', function () {
        var p = pool[Math.floor(Math.random() * pool.length)];
        openKCard(p);
      });
      row.appendChild(pick);
    }

    var cmp = null;
    for (var i = 0; i < TEACH.length; i++) {
      if (TEACH[i].kind === 'compare' && K_PATH.indexOf(TEACH[i].id) < 0) { cmp = TEACH[i]; break; }
    }
    if (cmp) {
      var cb = el('button', 'kexit-btn', '看一张对比卡');
      cb.type = 'button';
      cb.addEventListener('click', function () { openKCard(cmp); });
      row.appendChild(cb);
    }

    box.appendChild(row);
    return box;
  }

  /* ---------- 经典题目：按当前课本口径出题 ---------- */
  function kQuiz(it) {
    var all = it.quiz || [];
    if (!all.length) return null;
    var qs = all.filter(function (q) { return q.lv === TCH_LV; });
    var lvName = TCH_LV === 'jr' ? '初中' : '高中';
    if (!qs.length) {
      var empty = el('div', 'ksec');
      empty.appendChild(el('h4', '', '经典题目'));
      empty.appendChild(el('p', 'kquiz-note', lvName + '题还在补，先切到另一档看。'));
      return empty;
    }
    var sec = el('div', 'ksec');
    sec.appendChild(el('h4', '', '经典题目 · ' + lvName));

    qs.forEach(function (q, qi) {
      var box = el('div', 'kq');
      var head = el('div', 'kq-h');
      head.appendChild(el('span', 'kq-no', '题 ' + (qi + 1)));
      head.appendChild(el('span', 'kq-type', q.type === 'choice' ? '选择' : '简答'));
      /* S11：难度 + 能力 + 考点，一眼看出这题练什么、有多难 */
      var difName = (q.diff === 1 ? '易' : q.diff === 3 ? '难' : '中');
      var meta = el('span', 'kq-meta', difName);
      meta.title = '难度 ' + difName + '　考点：' + (q.tag || []).join('、');
      head.appendChild(meta);
      box.appendChild(head);
      box.appendChild(el('p', 'kq-q', q.q));

      var exp = el('div', 'kq-exp', q.exp ? '解析：' + q.exp : '');

      if (q.type === 'choice') {
        var opts = el('div', 'kq-opts');
        var done = false;
        (q.opts || []).forEach(function (o, oi) {
          var btn = el('button', 'kq-opt', String.fromCharCode(65 + oi) + '. ' + o);
          btn.type = 'button';
          btn.addEventListener('click', function () {
            if (done) return;
            done = true;
            Array.prototype.forEach.call(opts.children, function (n2, ni) {
              if (ni === q.ans) n2.classList.add('ok');
              if (ni === oi && oi !== q.ans) n2.classList.add('bad');
              if (ni !== oi && ni !== q.ans) n2.classList.add('dim');
            });
            exp.classList.add('on');
          });
          opts.appendChild(btn);
        });
        box.appendChild(opts);
      } else {
        var ansBox = el('div', 'kq-ans');
        ansBox.appendChild(el('b', '', '参考答案'));
        ansBox.appendChild(el('p', '', q.ans || ''));
        box.appendChild(ansBox);
        var showBtn = el('button', 'kq-show', '看参考答案与解析');
        showBtn.type = 'button';
        showBtn.addEventListener('click', function () {
          ansBox.classList.add('on');
          exp.classList.add('on');
          showBtn.style.display = 'none';
        });
        box.appendChild(showBtn);
      }

      box.appendChild(exp);
      sec.appendChild(box);
    });
    return sec;
  }

  /* 就地小提示：3 秒后自己消失，不弹窗、不关面板 */
  function kNote(msg) {
    var old = dBody.querySelector('.knote');
    if (old) old.parentNode.removeChild(old);
    var n = el('div', 'knote', msg);
    var wrapEl = dBody.querySelector('.kwrap');
    (wrapEl || dBody).appendChild(n);
    setTimeout(function () { if (n.parentNode) n.parentNode.removeChild(n); }, 3200);
  }

  function kPathBar() {
    if (K_PATH.length < 2) return null;
    var bar = el('div', 'kpath');
    var back = el('button', 'kpath-back', '‹ 返回');
    back.type = 'button';
    back.addEventListener('click', function () {
      var p = K_PATH.slice(0, K_PATH.length - 1);
      var prev = tchFind(p[p.length - 1]);
      if (prev) openKCard(prev, { path: p });
    });
    bar.appendChild(back);

    var trail = el('div', 'kpath-trail');
    K_PATH.forEach(function (id, i) {
      var it = tchFind(id);
      if (!it) return;
      if (i) trail.appendChild(el('i', '', '›'));
      var last = i === K_PATH.length - 1;
      var node = el(last ? 'span' : 'button', last ? 'kpath-cur' : 'kpath-ste', it.name);
      if (!last) {
        node.type = 'button';
        node.addEventListener('click', function () {
          openKCard(it, { path: K_PATH.slice(0, i + 1) });
        });
      }
      trail.appendChild(node);
    });
    bar.appendChild(trail);
    return bar;
  }

  function openKCard(it, opt) {
    if (!it) return;
    /* 搜索命中的往往是 IDX 文档快照（有 level 没有 media）——开卡前先换回
       TEACH 数组里的本体，图示、追问链这些富字段才拿得到。 */
    var canon = (typeof tchFind === "function") && tchFind(it.id);
    if (canon) it = canon;
    opt = opt || {};
    /* 面板本来关着 → 这是新的一条链，从零开始；点面包屑 → 用它给的路径。 */
    if (!detail.classList.contains('open')) K_PATH = [];
    if (opt.path) K_PATH = opt.path.slice();
    else if (K_PATH[K_PATH.length - 1] !== it.id) K_PATH.push(it.id);
    K_OPEN_ID = it.id;
    kRemember(it.id);
    openPanel();
    if (typeof setActive === 'function') setActive(null);

    dTitle.textContent = it.name;
    /* 原来这里被断成了两条语句：第二行是一个没人接的表达式，副标题永远是空的 ——
       面板顶上因此一直没有"初中 · 七上 · 知识卡"这行定位。 */
    dSub.textContent = (it.level ? ' · ' + (it.level[TCH_LV] || '') : '') + ' · 知识卡';
    dBody.innerHTML = '';

    var wrap = el('div', 'kwrap');

    var pb = kPathBar();
    if (pb) wrap.appendChild(pb);
    /* 学段条：板块 + 初高中课本位置，两枚色签放在最顶上 —— 第一眼就能看到分类口径。 */
    if (it.level) {
      var lvbar = el('div', 'klvbar');
      lvbar.appendChild(el('span', 'klv-cat', it.cat || '知识点'));
      if (it.level.jr) lvbar.appendChild(el('span', 'klv-chip klv-jr', '初中 · ' + it.level.jr));
      if (it.level.sr) lvbar.appendChild(el('span', 'klv-chip klv-sr', '高中 · ' + it.level.sr));
      wrap.appendChild(lvbar);
    }

    /* 口径：面板里也能切，不必退回搜索框 */
    wrap.appendChild(tchLevelBar());
    if (it.line) wrap.appendChild(el('p', 'kline', it.line));

    if (it.kind === 'compare') {
      /* 对比卡不另加导语：下面是表格（证据），再来“为什么”（解释），
         再加一句导语会和“为什么”那段重复。 */
      var tb2 = el('table', 'ktb');
      var th2 = el('thead'), tr3 = el('tr');
      tr3.appendChild(el('th', 'k', '维度'));
      tr3.appendChild(el('th', '', (LABEL_META[it.a] || {}).n || it.a));
      tr3.appendChild(el('th', '', (LABEL_META[it.b] || {}).n || it.b));
      th2.appendChild(tr3); tb2.appendChild(th2);
      var tb3 = el('tbody');
      (it.rows || []).forEach(function (r) {
        var tr4 = el('tr');
        tr4.appendChild(el('td', 'k', r.k));
        tr4.appendChild(el('td', '', r.a));
        tr4.appendChild(el('td', '', r.b));
        tb3.appendChild(tr4);
      });
      tb2.appendChild(tb3);
      var sw = el('div', 'ksec'); sw.appendChild(tb2); wrap.appendChild(sw);

      /* 对比卡同样给两个可点的国家行，但默认不动镜头 */
      var as2 = el('div', 'ksec');
      as2.appendChild(el('h4', '', '在这两个国家能看到'));
      [it.a, it.b].forEach(function (iso) {
        var nm = (LABEL_META[iso] || {}).n || iso;
        var row = el('div', 'ka');
        row.appendChild(el('b', '', nm));
        row.appendChild(el('span', '', '看它的位置与气候，再回头看表格里的差异'));
        row.appendChild(el('i', '', '›'));
        row.addEventListener('click', function () {
          var tgt = String((typeof targetIso === 'function' ? targetIso(iso) : iso) || iso).toUpperCase();
          flyToCountry(tgt);
          if (typeof setActive === 'function') setActive(tgt);
          Array.prototype.forEach.call(as2.querySelectorAll('.ka'), function (n2) {
            n2.classList.toggle('on', n2 === row);
          });
        });
        as2.appendChild(row);
      });
      wrap.appendChild(as2);
    }

    (it.sections || []).forEach(function (s) {
      var sec = el('div', 'ksec');
      sec.appendChild(el('h4', '', s.h));
      sec.appendChild(el('p', '', s.p));
      wrap.appendChild(sec);
    });
    /* 机理那一段只在高中口径出现：初中生看它只会更糊 */
    if (TCH_LV === 'sr' && it.mech) {
      var ms = el('div', 'ksec');
      ms.appendChild(el('h4', '', '高中加一层'));
      ms.appendChild(el('p', '', it.mech));
      wrap.appendChild(ms);
    }

    if (it.anchors && it.anchors.length) {
      var as = el('div', 'ksec');
      as.appendChild(el('h4', '', '在这些地方能看到'));
      it.anchors.forEach(function (a) {
        var row = el('div', 'ka');
        row.appendChild(el('b', '', a.where || a.iso));
        row.appendChild(el('span', '', a.see || ''));
        row.appendChild(el('i', '', '›'));
        row.addEventListener('click', function () {
          var tgt = String((typeof targetIso === 'function' ? targetIso(a.iso) : a.iso) || a.iso).toUpperCase();
          flyToCountry(tgt);
          if (typeof setActive === 'function') setActive(tgt);
          Array.prototype.forEach.call(as.querySelectorAll('.ka'), function (n2) {
            n2.classList.toggle('on', n2 === row);
          });
        });
        as.appendChild(row);
      });
      wrap.appendChild(as);
    }

    if (it.counter) {
      var kc = el('div', 'kc');
      kc.appendChild(el('b', '', it.kind === 'compare' ? '反直觉' : '反例 · 别记反'));
      kc.appendChild(el('p', '', it.counter));
      wrap.appendChild(kc);
    }

    var qz = kQuiz(it);
    if (qz) wrap.appendChild(qz);

    if (it.media && (it.media.img || it.media.svg || it.media.hint)) {
      var md = el('div', 'kmedia');
      /* 真实图（USGS / 官方制图 / 实拍）优先于手绘 SVG：它的信息密度和"专业感"
         是示意图给不了的；SVG 只留给没有现成好图的概念。 */
      var isImg = !!(it.media.img && TEACH_IMG[it.media.img]);
      md.appendChild(el('b', '', isImg ? '原图 · 点击放大'
        : (it.media.svg ? '图示' : '图示 / 动画位')));
      if (isImg) {
        var im = TEACH_IMG[it.media.img];
        var fig = el('div', 'kmedia-img' + (im.dark ? ' dark' : ''));
        var pic = document.createElement('img');
        pic.src = assetSrc(im.src, im.ver);
        pic.alt = im.alt || '';
        /* 别用 lazy：img 是先设 src 再插入 DOM 的，Chrome 对"离屏时设过 lazy"的元素
           不会在插入后重新触发加载，结果就是一个 0 高度的白条。卡片本来就是按需打开，
           一张图 eager 加载没有代价。 */
        pic.loading = 'eager';
        pic.decoding = 'async';
        /* 取图失败就退回文字说明，别给用户留一个空白框 */
        pic.onerror = function () { fig.style.display = 'none'; md.appendChild(el('span', '', it.media.hint || '')); };
        /* 卡片图框只有 ~460px，USGS 那种信息密集的图在这里字会小到看不清。
           点一下走站点已有的灯箱（同一张 1200 宽原图，不额外请求）。 */
        fig.appendChild(pic);
        fig.style.cursor = 'zoom-in';
        fig.addEventListener('click', function () {
          openLightbox(pic.src, im.cap || im.alt || '', im.credit || '', '');
        });
        md.appendChild(fig);
        var cr = el('div', 'kmedia-credit');
        if (im.cap) cr.appendChild(el('span', '', im.cap));
        if (im.credit) cr.appendChild(el('i', '', '来源：' + im.credit));
        md.appendChild(cr);
        /* 同一张卡若既有真图又有手绘图，两张都留：真图在上当"实物参照"，
           手绘图默认折起，点开看机理 —— 真图讲"长什么样"，示意图讲"为什么长这样"。 */
        if (it.media.svg && TEACH_MEDIA[it.media.svg]) {
          var more = el('div', 'ksvg-more');
          more.hidden = true;
          var sbox = el('div', 'kmedia-svg');
          sbox.innerHTML = TEACH_MEDIA[it.media.svg];
          more.appendChild(sbox);
          if (it.media.hint) more.appendChild(el('span', 'kmedia-cap', it.media.hint));
          var stg = el('button', 'ksvg-toggle');
          stg.type = 'button';
          stg.setAttribute('aria-expanded', 'false');
          stg.innerHTML = '<span class="kchev">\u203a</span><span class="klbl">看手绘示意图</span>';
          stg.addEventListener('click', function () {
            var opening = more.hidden;
            more.hidden = !opening;
            stg.setAttribute('aria-expanded', opening ? 'true' : 'false');
            stg.querySelector('.klbl').textContent = opening ? '收起示意图' : '看手绘示意图';
          });

        }
      } else if (it.media.svg && TEACH_MEDIA[it.media.svg]) {
        var holder = el('div', 'kmedia-svg');
        holder.innerHTML = TEACH_MEDIA[it.media.svg];
        md.appendChild(holder);
        if (it.media.hint) md.appendChild(el('span', 'kmedia-cap', it.media.hint));
      } else {
        md.appendChild(el('span', '', it.media.hint));
      }
      wrap.appendChild(md);
    }

    if (it.next && it.next.length) {
      var nx = el('div', 'ksec knext');
      nx.appendChild(el('h4', '', '接着可以问'));
      var row2 = el('div', 'knx');
      it.next.forEach(function (n) {
        var tgt = n.to ? tchFind(n.to) : null;
        var b2 = el('button', tgt ? '' : 'pend', n.q);
        b2.type = 'button';
        b2.title = tgt ? '打开：' + tgt.name : '这条还没有条目（待补）';
        b2.addEventListener('click', function () {
          if (tgt) { openKCard(tgt); return; }
          /* 没有目标条目时不要关面板：一关就把刚读到的上下文丢了。
             就地提示一句，等这批内容补完再连。 */
          kNote('「' + n.q + '」还没有条目。先按上面这张卡理解，补完再连上。');
        });
        row2.appendChild(b2);
      });
      nx.appendChild(row2);
      wrap.appendChild(nx);

      /* 走到链末端（两个追问都已走过）时给出口，否则用户只能关面板 */
      var ex = kExit(it);
      if (ex) wrap.appendChild(ex);
    } else {
      var ex2 = kExit(it);
      if (ex2) wrap.appendChild(ex2);

    dBody.appendChild(wrap);
    var sc = document.querySelector('.dscroll');
    if (sc) sc.scrollTop = 0;

    /* 打开卡不动地球：地球保持在用户点开之前的样子。
       只有点“在这些地方能看到”里的地点，才飞过去 —— 阅读不该把画面拽走。 */
    if (qInput) qInput.blur();
    setSearch(false);
  }


  function renderResults(q) {
    if (performance.now() < qFreezeUntil) { qPending = q; return; }
    qPending = null;
    var hits = boostByCapital(q, boostByCountry(q, bm25(q, 5)));
    qRes.innerHTML = '';
    qRes.hidden = false;
    /* 教学层优先：概念词、对比提问命中就直接出卡，不再走 BM25。
       没命中才落到原来的结果列表 —— 教学层是加在前面的一道筛子，不是替换。 */
    var tch = tchBlock(q);
    if (tch) { qRes.appendChild(tch); return; }
    /* 本名/别名都没命中 → 走标签兜底；再不行才落到 BM25 档案检索。
       但如果输入就是一个国家名（"日本""中国"），标签不能抢：用户要的是档案。 */
    var fc = (typeof findCountryInQuery === 'function') ? findCountryInQuery(q) : null;
    var pureCountry = !!(fc && String(fc.rest || '').replace(/[\s的之与和及，,、]/g, '') === '');
    var tagHits = pureCountry ? [] : tchTagHit(q);
    if (tagHits.length) {
      var tb0 = tchTagBlock(tagHits);
      if (tb0) { qRes.appendChild(tb0); return; }
    }
    /* 行都塞进 .sr-list，这样底部的说明行能钉在卡片下沿不动 */
    var box = el('div', 'sr-list');
    qRes.appendChild(box);
    if (!hits.length) {
      /* 空结果是最容易流失的地方：不要报"知识库共 N 条"这种内部数字，
         直接给几个能点的东西，让用户有下一步。 */
      var ew = el('div', 'sr-empty-wrap');
      ew.appendChild(el('div', 'sr-empty', '这个词暂时没有对应内容。换个说法，或者从这些开始：'));
      var sc2 = el('div', 'sr-sug-chips');
      ['季风', '地中海气候', '等高线地形图', '人口分布', '土壤与植被', '城镇化'].forEach(function (nm) {
        var it2 = null;
        for (var i2 = 0; i2 < TEACH.length; i2++) {
          if (TEACH[i2].name === nm) { it2 = TEACH[i2]; break; }
        }
        if (!it2) return;
        var b2 = el('button', 'sr-sug-chip', it2.name);
        b2.type = 'button';
        b2.addEventListener('mousedown', function (e) { e.preventDefault(); });
        b2.addEventListener('click', function (e) { e.stopPropagation(); openKCard(it2); });
        sc2.appendChild(b2);
      });
      ew.appendChild(sc2);
      box.appendChild(ew);
      return;
    }
    hits.forEach(function (h) {
      var d = h[0];
      var item = el('div', 'sr-item');
      /* 形状对齐 Google 地图：圆形图标 + 两行字（主标题 / 灰色副标题）。
         主标题用命中的那句问法、副标题用答案开头 —— 搜"沙特"会命中同一国的
         五个问题，若拿国家名当主标题，五行会整齐地重复"沙特阿拉伯"，
         等于把最有用的信息（到底命中了什么）全藏了起来。 */
      var isCountry = d.kind === 'country';
      if (d.iso) item.setAttribute('data-iso', String(d.iso).toUpperCase());
      /* brief 是"国家简介"那条：标题写国名就够，"朝鲜 简介"多两个字
         不增加信息量，还把它顶到第一条时显得像条公文。 */
      var headText = isCountry ? (d.name || '')
                   : (d.kind === 'brief' ? (d.name || d.q || '') : (d.q || d.name || ''));
      item.appendChild(srIcon(isCountry || d.kind === 'brief' ? 'country' : 'doc'));
      var txt = el('div', 'sr-txt');
      var nm = el('div', 'sr-name', headText);
      if (isCountry) {
        if (!d.noTag) nm.appendChild(el('span', 'sr-tag', '基础'));
      } else if (d.name && String(d.q || '').indexOf(d.name) < 0) {
        /* 问句里没有出现全名，就补一枚国名标签。
           搜「印尼」时问句写的是简称，全名"印度尼西亚"在句子里找不到 ——
           这一枚正好把左边的简称和右边的全称对上，是有用的信息；
           搜「中国」时问句本身带着国名，再挂一枚"中国"等于把同一件事
           说两遍，所以不挂。 */
        nm.appendChild(el('span', 'sr-tag', d.name));
      }
      txt.appendChild(nm);
      var sub = d.a || '';
      if (sub) txt.appendChild(el('div', 'sr-sub', sub));
      item.appendChild(txt);
      /* 鼠标移到这条结果上就把它的国界分片拉下来（232KB）。
         点下去到"金线出现"之间原本要现取现解析，卡片会先出来、线还在路上 ——
         这一下预热通常能省掉 200~800ms 的空窗。 */
      if (d.iso) {
        item.addEventListener('mouseenter', function () {
          loadGeo(String(d.iso).toUpperCase());
        });
      }
      item.addEventListener('click', function () {
        /* 地区归属统一走 targetIso：港澳台→中国，但**有自己档案的地区
           （新喀、南乔治亚、法属波利尼西亚……）不再被跳去主权国。 */
        executeHit(d, d.q || q);
        /* 点完把这条的字留在框里：联想列表一收，框里只剩刚敲的两个字
           （"法国"），回头看不知道自己刚点的是哪一条，想接着问还得重敲。
           这里写回被点那条的标题 —— 问答=问句，国家/简介=国名，
           首都条目=「首都 · 罗马」这种自带上下文的写法。
           值必须在 executeHit 之后写：它内部要读框里的原文判断"是不是纯国名"。
           光标拉到开头，长问句才不会只露出结尾那半截。 */
        if (qInput) {
          qInput.value = d.q || d.name || q;
          searchWrap.classList.add('has-text');
          try { qInput.setSelectionRange(0, 0); qInput.scrollLeft = 0; } catch (err) {}
          fitSearchWidth();      // 收起状态也要装得下整条问句
        }
      });
      box.appendChild(item);
    });
    /* 结果卡片已经摊开，下限从 168 提到 320：两行结果在窄卡里会挤成一条 */
    fitSearchWidth();
  }

  /* 搜到了却只跳到面板顶部，等于没定位。
     这里在渲染完之后按相关度找一段，滚过去并闪一下。
     中文没有空格，所以切成二元组打分（"中国传统节日" → 中国/国传/传统/统节/节日），
     这样"传统节日"也能命中正文里的"是岁首最重要的节日"。 */
    /* 从查询里认出一个国家（取最长匹配），剩下的部分当话题词。
     "中国美食" → { iso:'CN', name:'中国', rest:'美食' } */
  function findCountryInQuery(v) {
    if (!LABEL_META || !v) return null;
    var best = null;
    Object.keys(LABEL_META).forEach(function (iso) {
      var nm = String((LABEL_META[iso] || {}).n || '');
      if (nm.length < 2) return;
      var at = v.indexOf(nm);
      if (at < 0) return;
      /* 取最长的那个名字，免得长名字被短名字先吃掉 */
      if (!best || nm.length > best.name.length) {
        best = {
          iso: iso,
          name: nm,
          rest: (v.slice(0, at) + v.slice(at + nm.length))
                  .replace(/^[的之与和及，,、\s]+/, '')
        };
      }
    });
    return best;
  }

  /* 命中的这条问答，是不是用户**问的那件事**？
     回车选的是排序第一条，它未必对题：搜"中国美食"，排第一的是
     "中国说什么话？"（同国、高分，但话题不对）。这种时候不能拿它的答案
     去正文里定位（会把面板滚到语言那一节），得靠「国名 + 话题」的探针。
     而搜"瑞典在哪儿啊？周围都是些什么地方？"时，第一条就是这句原话，
     它的答案里写着"位于斯堪的纳维亚半岛""西邻挪威""濒临…海峡" ——
     这正是正文里真实存在的字，拿它定位最准。
     所以按"两条问句的二元组重合度"判断：重合度高=对题，反之=不对题。 */
  function qaMatchesQuery(qaQ, q) {
    function grams(t) {
      var s = String(t || '').toLowerCase().replace(/[^\u4e00-\u9fa5a-z0-9]/g, '');
      var m = {};
      for (var i = 0; i + 1 < s.length; i++) m[s.substr(i, 2)] = 1;
      return m;
    }
    var a = grams(q), b = grams(qaQ), n = 0, hit = 0;
    for (var k in a) { n++; if (b[k]) hit++; }
    return n > 0 && hit / n >= 0.6;
  }

  /* 打开一条搜索结果：开卡 → 收起搜索 → 定位到命中段。
     altProbe 是"国家+话题"里拆出来的话题词，用它当定位探针。 */
  function executeHit(d, q, focus, answerDoc) {
    /* 地区（港澳台）归到主权国：不给台湾单独开卡，搜到也落到中国 */
    var iso = String(d.iso || '').toUpperCase();
    var tgt = targetIso(iso);
    /* 命中的这条问答，是不是"就是这张卡自己的、而且确实在答用户问的事"。
       对得上 → 定位时直接拿**答案原文**去正文里找（正文写的就是"…；首都为北京市。"
       这类实句，复合问句的两个半句能各自命中）；
       对不上（"中国美食"排第一的是"中国说什么话？"）→ 交给下面的话题探针，
       免得被一条不相干的答案带偏。
       两种来源：点结果列表（d 本身就是问答）、回车（d 是合成的国家对象，
       真正的问答由 answerDoc 带进来）。 */
    var ansDoc = answerDoc || (d.kind === 'qa' ? d : null);
    var selfQa = (ansDoc && ansDoc.a &&
                  String(ansDoc.iso || '').toUpperCase() === tgt.toUpperCase() &&
                  qaMatchesQuery(ansDoc.q, q || (qInput ? qInput.value : ''))) ? ansDoc : null;
    openDetail(tgt, cardOf(tgt), false);
    setSearch(false);              // 选中即收起，视线回到地球
    /* 框里保留用户敲的词，让他自己清 —— 程序顺手清空会丢掉上下文，
       想改一个字重搜还得整句重打。 */
    if (qInput) qInput.blur();

    /* 港澳台这类没有独立档案、归到主权国的地区：开主人国的档案之后，
       要定位到正文里提到它的那一段 —— 否则点「中国香港」只是弹出一张中国卡，
       停在最上面，跟用户点的那三个字没有关系。 */
    if (!focus && d.kind === 'country' && tgt.toUpperCase() !== iso) {
      var shortName = String(d.name || '').replace(/^中国/, '');
      if (shortName.length >= 2) focus = { probe: shortName, extra: '' };
    }

    /* 纯国名不滚：整份档案就是在讲它，滚过去只会把主图顶出可视区 ——
       实测点开日本，主图和缩略图都被滚到了负坐标。 */
    var qq = String(q || '').trim();
    var nm = d.name || '';
    /* 基础档案那种条目（国家本身）没有"命中段落"可言，只在带话题词时才定位 */
    if (d.kind === 'country' && !focus) return;

    /* 框里敲的就是这个国名（"朝鲜"），点的又是它的简介条目：
       到这里就够了，别再拿问句去正文里找段落 —— 回车会滚到"语言"那一节，
       看着像跳错了地方。点具体问答（kind=qa）仍然滚到对应那段。
       港澳台例外：开的不是它自己的卡，必须滚到提到它的那一段。 */
    var typed = qInput ? qInput.value.trim() : '';
    var cq = findCountryInQuery(typed);
    if (cq && !cq.rest && d.kind === 'brief' &&
        tgt.toUpperCase() === String(cq.iso || '').toUpperCase()) return;

    /* 搜的是地区（"中国香港"→ 开的是中国卡）：必须滚到正文里提到它的那一段。
       第一条往往是该国随便一条问答，拿它的答案定位会滚到语言/地理段，
       跟用户要找的东西无关。 */
    var regionProbe = '';
    if (!focus && cq) {
      var region = '';
      if (tgt.toUpperCase() !== String(cq.iso || '').toUpperCase()) {
        region = String(cq.name || '').replace(/^中国/, '');
      } else {
        var rm = String(cq.rest || '').match(/^(香港|澳门|台湾)/);
        if (rm) region = rm[1];
      }
      if (region.length >= 2) { regionProbe = region; focus = { probe: region, extra: '' }; }
    }
    /* 开的是自己那张卡，且输入的就是国名本身 → 不滚（整份档案都是它）。
       港澳台不适用：开的是中国卡，输入框里写的就是"中国澳门"，
       这时反而必须滚到提到澳门的那一段，否则就是"搜了没反应"。 */
    var isOwnCard = tgt.toUpperCase() === iso;
    if (isOwnCard && (!qq || qq === nm || qq.toLowerCase() === iso.toLowerCase())) return;

    /* 命中的就是这张卡自己的那条问答（d.iso === 目标国）：
       直接拿**那条答案**去正文里找。答案里的实词（"位于…接壤…海峡"）是正文
       真的会写的字；而按下面那套「国名 + 话题」的探针，探针会变成
       "在哪儿啊？周围都是些什么地方"这类问句 —— 二元组在正文里一个都不出现，
       定位必然失败，面板就停在最上面那一片地标照片上，
       看起来就像"我问的是位置，怎么跳出来一堆地标"。
       只有命中的是**别国**的问答时（"法国历史"偏到了加蓬那条），
       才需要靠探针把话题带到目标国去。 */
    if (selfQa && !regionProbe) {
      locateInPanel(selfQa, qq);
    } else if (focus) {
      /* 主探针：先用话题词本身（"美食""历史"）。它短，二元组只有一两个，
         只要段落里出现这个词，覆盖率就是 1.0 —— 定位几乎必中。
         同国高分问答的答案文本只当备选：它动辄上百字，摊进覆盖率里分母太大，
         分数被压到阈值以下，反而"点了没反应"（实测"中国历史"就卡在这）。 */
      var primary = focus.probe || focus.extra || '';
      var secondary = [focus.extra, qq].filter(Boolean).join(' ');
      locateInPanel({ name: nm, q: secondary, a: primary }, qq);
    } else if (d.kind !== 'country') {
      locateInPanel(d, qq);
    }
  }

  /* 从搜索结果跳到档案里对应的那一段。
     旧实现只拿用户敲的词去正文里找二元组，两个问题：
       ① 用户搜的是**问题**（"法国人吃什么"），正文里未必出现这几个字，
          真正能对上的是答案里那几个实词；
       ② scrollIntoView 会被面板滑入动画打断，而且它会把整页一起滚，
          落点经常偏掉。
     现在：
       · 探针用**搜索结果里的答案原文**（它本来就是从整份档案里抽出来的），
         再补上问题关键词，两者取较高的那一个；
       · 打分用 Ochiai 系数（交集 / √(|A|×|B|)）：两边一边长一边短也不会被吃掉，
         "地标/景点"这种答案里全是专有名词，正好能对上图片题注；
       · 自己算 scrollTop 滚 .dscroll，不碰整页；
       · 图片到位后再校正一次，用户自己滚过就不再插手。 */
  var LOCATE_SEQ = 0;

  /* 话题词的说法不止一种。档案里写的是"饮食上大体南米北面，鲁、川、粤、淮扬
     等菜系各有章法"，用户搜的是"美食" —— 二元组一个都对不上，定位直接失效。
     这张表只在**定位**时用，不影响搜索排序。左边是用户可能敲的词，
     右边是档案正文里真正会出现的词。 */
  var LOCATE_SYN = {
    '美食': ['饮食', '菜系', '菜', '小吃', '餐', '吃'],
    '好吃': ['饮食', '菜', '吃'],
    '饮食': ['饮食', '菜系', '菜', '吃'],
    '节日': ['节日', '节庆', '习俗', '过年', '节'],
    '民俗': ['民俗', '习俗', '节序', '岁时', '过年'],
    '宗教': ['宗教', '信仰', '佛教', '道教', '天主教', '伊斯兰', '教派'],
    '语言': ['语言', '方言', '语'],
    '历史': ['历史', '王朝', '世纪', '帝国', '战争'],
    '地标': ['地标', '景点', '建筑', '遗迹', '塔', '宫'],
    '景点': ['景点', '地标', '建筑', '遗迹'],
    '经济': ['经济', '产业', '农业', '工业', '贸易'],
    '人口': ['人口', '万人'],
    '位置': ['位于', '地处', '接壤', '邻'],
    '气候': ['气候', '季风', '降水', '气温']
  };

  /* 位置类问法单独补一组。中文里问"在哪儿/周围是什么/挨着谁/隔海是哪国"，
     档案正文写的是"位于斯堪的纳维亚半岛""西邻挪威""濒临…海峡""隔海相望" ——
     两边一个字都不重叠，只靠二元组永远对不上。
     放在表尾：话题词（美食/历史/宗教…）先命中就先赢，
     "瑞典周围有什么好吃的"仍然去饮食那一段，不会被这组抢走。 */
  ['在哪', '哪儿', '哪里', '什么位置', '位置', '周围', '周边', '四邻', '邻国', '邻邦',
   '附近', '旁边', '挨着', '隔海', '接壤'].forEach(function (k) {
    LOCATE_SYN[k] = ['位于', '地处', '接壤', '西邻', '东邻', '南邻', '北邻', '邻',
                     '边界', '海峡', '相望', '半岛', '内陆', '沿海', '群岛'];
  });

  function locateInPanel(doc, q) {
    var token = ++LOCATE_SEQ;
    var tries = 0;

    function norm(t) {
      return String(t == null ? '' : t).toLowerCase()
        .replace(/[^\u4e00-\u9fa5a-z0-9]/g, '');
    }
    /* 中文没有空格，切成二元组。"中国传统节日" → 中国/国传/传统/统节/节日 */
    function grams(t) {
      var str = norm(t), map = {}, n = 0;
      for (var i = 0; i + 1 < str.length; i++) {
        var g = str.substr(i, 2);
        if (!map[g]) { map[g] = 1; n++; }
      }
      return { g: map, n: n };
    }
    function sim(a, b) {
      if (!a.n || !b.n) return 0;
      var m = 0;
      for (var k in a.g) if (b.g[k]) m++;
      if (!m) return 0;
      /* 两种口径取大的：
         Ochiai（交集 / √(|A|×|B|)）适合"长答案 vs 长段落"；
         覆盖率（交集 / |A|）适合"短探针 vs 长段落" —— 探针只剩两个字时，
         摊进 √ 里会被段落长度压死，怎么都过不了阈值。 */
      return Math.max(m / Math.sqrt(a.n * b.n), m / a.n);
    }

    /* 国名要从问题里剔掉：否则"法国人吃什么"里那两个字会把每一段都点亮 */
    var nm = (doc && doc.name) || '';
    var probes = [];
    if (doc && doc.a) probes.push(grams(doc.a));
    if (doc && doc.q) probes.push(grams(String(doc.q).split(nm).join('')));
    if (q) probes.push(grams(String(q).split(nm).join('')));
    probes = probes.filter(function (p) { return p.n > 0; });
    if (!probes.length) return;

    /* 段落内定位用的原词（不是二元组）。长段落里命中的词往往在后半截：
       "经济"落在"宋元之际市镇经济与印刷…"这半句上，而段落开头讲的是
       "隋唐确立的科举制" —— 只滚到段落顶部，用户会觉得"跳到毫无关系的历史"。 */
    var words = [];
    if (doc && doc.a) words.push(String(doc.a));
    if (doc && doc.q) words.push(String(doc.q).split(nm).join(''));
    if (q) words.push(String(q).split(nm).join(''));
    words = words.filter(function (w) { return w && w.length >= 2; });

    /* 话题词的同义扩展（见 LOCATE_SYN）：命中哪一组就按哪一组补分 */
    var ask = String((doc && doc.q) || '') + ' ' + String(q || '');
    var syn = null;
    Object.keys(LOCATE_SYN).forEach(function (k) {
      if (!syn && ask.indexOf(k) >= 0) syn = LOCATE_SYN[k];
    });

    function pick() {
      var host = document.getElementById('d-body');
      var sc = document.querySelector('.dscroll');
      if (!host || !sc) return null;
      /* 「地标 / 景点」直接去图片区：卡片最上面就是主图加缩略图，
         而正文里能对上的往往只是"宫殿""建筑"这类泛词，落点没有意义
         （实测印度、挪威、法国点"地标"都落在不相干的段落上）。 */
      if (/地标|景点/.test(ask)) {
        var img0 = host.querySelector('.dimg-wrap');
        if (img0) return { node: img0, sc: sc, words: [] };
      }
      /* 候选：正文段落、章节标题（历史 / 民俗 / 文化特征）、
         元信息的键和值（首都/语言/坐标）、文化特征标签、图片题注。
         标题必须收进来：搜「中国民俗」，档案里"民俗"两个字只出现在章节标题上，
         正文写的是"岁时节序构成日常生活的主干……"，只查 p 一个都对不上。
         dt 也要一起收：问"语言"时，那两个字同样只写在键名上。 */
      var nodes = host.querySelectorAll('.prose p, .sub-label, .dmeta dt, .dmeta dd, .chip, .cap');
      if (!nodes.length) return null;        // 骨架屏阶段：还没有可定位的内容
      var bestNode = null, bestVal = 0, bestWord = '';
      for (var i = 0; i < nodes.length; i++) {
        var txt = nodes[i].textContent || '';
        /* 元信息的键名（首都/语言/坐标…）不在屏幕上，但它是这一行真正的主题：
           问"法语"要落到"语言 | 法语"，问"语言"同样要落到这一行。
           把它拼进待匹配文本，两种问法都能对上。 */
        var kk = nodes[i].getAttribute && nodes[i].getAttribute('data-k');
        if (kk) txt = kk + ' ' + txt;
        var ng = grams(txt);
        var v = 0, hitWord = '';
        for (var k = 0; k < probes.length; k++) {
          var t = sim(probes[k], ng) * (k === 0 ? 1 : 0.55);
          if (t > v) { v = t; hitWord = ''; }   // 二元组命中，段内位置交给原词去找
        }
        /* 同义词命中：按词的"具体程度"加权，而不是简单地数个数。
           "佛教"命中一次比"教"这个单字命中一次可信得多 —— 正文里"教"字
           到处都有（教育、教会、教派），不加权的话「中国宗教」会被
           随便一段带"教"字的正文抢走。
           同时记下"具体命中的是哪个词"：点"美食"落到的段落里写的是
           "饮食/菜系"，标出来的也应该是这两个字，而不是用户敲的"美食"。 */
        if (syn) {
          var hitW = 0, synWord = '';
          for (var si = 0; si < syn.length; si++) {
            if (txt.indexOf(syn[si]) >= 0) {
              hitW += Math.min(1, syn[si].length / 3);   // 单字 0.33 / 双字 0.67 / 三字以上 1
              if (syn[si].length > synWord.length || !synWord) synWord = syn[si];
            }
          }
          /* 1.6 分算"很确定"：一个三字词（宗教/天主教）+ 一个双字词就够；
             只有单字命中时 0.17，过不了 0.15 的线，正好当噪声滤掉。 */
          var sv = 0.8 * Math.min(1, hitW / 1.6);
          if (sv > v) { v = sv; hitWord = synWord; }
        }
        if (v > bestVal) { bestVal = v; bestNode = nodes[i]; bestWord = hitWord; }
      }
      /* 0.15 以下基本是巧合命中，宁可不滚 —— 乱滚比停在顶部更让人迷惑。
         0.15 这条线正好卡在"只有一个单字命中"（0.167）和"什么都没有"之间：
         「语言」靠一个"语"字就能落到"现代标准汉语 / 粤语"那一行。 */
      if (!bestNode || bestVal < 0.15) {
        /* 兜底：**退到简介第一段**，而不是什么都不做。
           档案正文只有简介/历史/民俗/文化特征几节，问答是检索层的东西，
           正文里没有原文。所以只要问法和正文对不上（问位置、问天气、
           问"适合什么时候去"这类），以前就直接放弃 —— 面板停在顶部那一片
           地标照片上，用户看到满屏图，跟问题毫无关系，还以为"搜地点跳出了地标"。
           简介是整份档案的总述，任何话题都能在里头读到相关的一句；
           滚动量也小（就在影像区下面一段），不会把人甩到很远处。 */
        var lead = host.querySelector('.dtext p');
        if (lead) return { node: lead, sc: sc, words: [] };
        return null;
      }
      /* 同义词命中时用**实际命中的那个词**去量位置、去打高亮 ——
         点"美食"落到的段落写的是"饮食/菜系"，拿"美食"去 indexOf 什么都找不到，
         高亮和段内定位就都失效了。 */
      return { node: bestNode, sc: sc, words: bestWord ? [bestWord] : words };
    }

    /* 量出"命中词"在段落里到底落在哪一行。
       段落动辄两三行到十几行，把段落顶部滚到中间，用户看到的是开头
       那句无关的话；滚到命中词所在行，才看得见自己点的是什么。 */
    function wordRect(node, words) {
      try {
        var raw = node.textContent || '';
        var bestAt = -1, bestLen = 0;
        for (var i = 0; i < words.length; i++) {
          var at = raw.indexOf(words[i]);
          if (at >= 0 && (bestAt < 0 || at < bestAt)) { bestAt = at; bestLen = words[i].length; }
        }
        if (bestAt < 0) return null;
        var walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, null);
        var acc = 0, tn;
        while ((tn = walker.nextNode())) {
          var len = tn.nodeValue.length;
          if (acc + len > bestAt) {
            var rg = document.createRange();
            var start = bestAt - acc;
            /* 只框住命中词的第一个字：整词跨行时 getBoundingClientRect
               会给出一个横跨两行的大盒子，拿它居中会偏掉。 */
            rg.setStart(tn, start);
            rg.setEnd(tn, Math.min(len, start + 1));
            var rects = rg.getClientRects();
            var rect = (rects && rects.length) ? rects[0] : rg.getBoundingClientRect();
            return (rect && rect.height > 4) ? rect : null;
          }
          acc += len;
        }
      } catch (e) { /* Range 走到奇怪节点就退回按整段算 */ }
      return null;
    }

    /* 把命中的那个词本身标出来（1.9 秒后原样还原）。
       跳到的段落不一定整段都在讲这件事，标出词才能让人看明白落点。 */
    function flashWord(node, words) {
      try {
        var raw = node.textContent || '';
        var at = -1, bestLen = 2;
        for (var i = 0; i < words.length; i++) {
          var w = words[i];
          if (!w || w.length < 2) continue;
          var p = raw.indexOf(w);
          if (p >= 0 && (at < 0 || p < at)) { at = p; bestLen = w.length; }
        }
        /* 最新版结果行给的是整句问答，正文里不会原样出现：退化成用
           二元组找一个真正落在段落里的字眼，否则跳过去了却没标出落点。 */
        if (at < 0) {
          for (var wi = 0; wi < words.length && at < 0; wi++) {
            var w2 = String(words[wi] || '');
            for (var gi = 0; gi + 2 <= w2.length; gi++) {
              var gram = w2.substr(gi, 2);
              if (!/^[\u4e00-\u9fa5]{2}$/.test(gram)) continue;
              var p2 = raw.indexOf(gram);
              if (p2 >= 0) { at = p2; bestLen = 2; break; }
            }
          }
        }
        if (at < 0) return;
        var walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, null);
        var acc = 0, tn;
        while ((tn = walker.nextNode())) {
          var len = tn.nodeValue.length;
          if (acc + len > at) {
            var start = at - acc;
            var end = Math.min(len, start + bestLen);
            if (end <= start) return;
            var after = tn.splitText(end);
            var mid = tn.splitText(start);
            var span = document.createElement('span');
            span.className = 'hit-word';
            mid.parentNode.insertBefore(span, mid);
            span.appendChild(mid);
            setTimeout(function () {
              var par = span.parentNode;
              if (!par) return;
              par.insertBefore(mid, span);
              par.removeChild(span);
              par.normalize();
            }, 1900);
            return;
          }
          acc += len;
        }
      } catch (e) { /* 标不出来也不影响滚动 */ }
    }

    function centerOn(hit, smooth) {
      var node = hit.node, sc = hit.sc;
      var r = wordRect(node, hit.words) || node.getBoundingClientRect();
      var s = sc.getBoundingClientRect();
      var target = sc.scrollTop + (r.top - s.top) - (sc.clientHeight - r.height) / 2;
      var max = sc.scrollHeight - sc.clientHeight;
      target = Math.max(0, Math.min(max, target));
      if (Math.abs(target - sc.scrollTop) < 2) return;
      if (smooth) {
        try { sc.scrollTo({ top: target, behavior: 'smooth' }); }
        catch (e) { sc.scrollTop = target; }
      } else {
        sc.scrollTop = target;     // 首帧直接到位：面板一出来就已经在命中的那一段
      }
    }

    var t0 = -1;
    function run() {
      if (token !== LOCATE_SEQ) return;         // 又点开了别的国家，这次作废
      var hit = pick();
      if (!hit) {
        /* 卡片数据（cards.json 950KB）还没到时，#d-body 里是骨架屏，
           一个候选节点都没有。以前只重试 1.3 秒就放弃 —— 本地这条路要七八秒，
           于是「刚打开页面就点澳门」会停在卡片顶部，什么也没定位到。
           现在重试到 13 秒；期间用户自己滚过就放手，别跟他抢。 */
        var scNow = document.querySelector('.dscroll');
        if (t0 < 0) t0 = scNow ? scNow.scrollTop : 0;
        else if (scNow && Math.abs(scNow.scrollTop - t0) > 20) return;
        if (tries++ < 100) { setTimeout(run, 130); return; }
        /* 重试到尽头还是没对上：什么都不做，让卡片停在自己该在的位置。
           打开新卡时 openDetail 已经把它归零了；同一个国家里没对上，
           就保持用户当前看到的那一段 —— 硬滚回顶部只会像"跳错了地方"。 */
        return;
      }
      centerOn(hit, false);
      flashWord(hit.node, hit.words);
      hit.node.classList.add('hit-flash');
      setTimeout(function () { hit.node.classList.remove('hit-flash'); }, 1700);

      /* 图片和题注是延后加载的，可能把版面推一点：隔一会儿校正两次。
         用户这期间自己滚过就不再插手，否则会跟他抢滚动条。 */
      var bumped = false;
      function bum() { bumped = true; }
      hit.sc.addEventListener('wheel', bum, { once: true, passive: true });
      hit.sc.addEventListener('touchstart', bum, { once: true, passive: true });
      hit.sc.addEventListener('pointerdown', bum, { once: true });
      [700, 1500].forEach(function (ms) {
        setTimeout(function () {
          if (token !== LOCATE_SEQ || bumped) return;
          centerOn(hit, true);
        }, ms);
      });
    }

    run();
  }

  /* 国家列表：由搜索框右端的下拉按钮触发（不自动弹）。
     空输入直接点开时它就是入口，用户不用先背关键词。 */
  function showCountryList() {
    if (!IDX || !IDX.docs) {
      /* 1MB 的检索索引比首屏那几张图慢到：这时候给几条和真实条目同高的
         骨架，而不是一行"尚未就绪"—— 数据到了一换就好，面板高度不跳。
         索引到货后由 rerenderIfListOpen() 自动补一次渲染。 */
      qRes.innerHTML = '';
      qRes.hidden = false;
      var skelBox = el('div', 'sr-list');
      for (var si = 0; si < 6; si++) {
        var sk = el('div', 'sr-skel');
        sk.appendChild(el('i', 's-ico'));
        var sl = el('div', 's-lines');
        sl.appendChild(el('i', 's-l1'));
        sl.appendChild(el('i', 's-l2'));
        sk.appendChild(sl);
        skelBox.appendChild(sk);
      }
      qRes.appendChild(skelBox);
      qRes.appendChild(el('div', 'sr-foot', '正在载入知识库…'));
      return;
    }
    var seen = {}, list = [];
    IDX.docs.forEach(function (d) {
      if (d.iso && !seen[d.iso]) {
        seen[d.iso] = 1;
        list.push(d);
      }
    });
    /* 全部国家都在这里，排法：有完整档案的置顶，其余按人口降序。
       人口取不到就排最后 —— 这样打开列表第一屏就是"有料的那几个"。 */
    list.sort(function (a, b) {
      var da = a.kind === 'country' ? 0 : 1, db = b.kind === 'country' ? 0 : 1;
      if (da !== db) return db - da;
      var pa = (LABEL_META || {})[a.iso] ? LABEL_META[a.iso].pop || 0 : 0;
      var pb = (LABEL_META || {})[b.iso] ? LABEL_META[b.iso].pop || 0 : 0;
      return pb - pa;
    });
    qRes.innerHTML = '';
    qRes.hidden = false;
    var box = el('div', 'sr-list');
    qRes.appendChild(box);
    /* 235 个国家列表对第一次来的人没有信息量：先在顶部给四个能点的知识点 */
    box.appendChild(srSuggest());
    list.forEach(function (d) {
      var item = el('div', 'sr-item');
      if (d.iso) item.setAttribute('data-iso', String(d.iso).toUpperCase());
      item.appendChild(srIcon('country'));
      var txt = el('div', 'sr-txt');
      var nm = el('div', 'sr-name', d.name || '');
      if (d.kind === 'country') nm.appendChild(el('span', 'sr-tag', '基础'));
      txt.appendChild(nm);
      /* 副标题给英文名 + 大洲，和 Google 地图"家 / China"那种第二行一个位置 */
      var m = (LABEL_META || {})[String(d.iso || '').toUpperCase()];
      var sub = [m && m.en, m && m.cont].filter(Boolean).join(' · ');
      if (sub) txt.appendChild(el('div', 'sr-sub', sub));
      item.appendChild(txt);
      item.appendChild(el('span', 'sr-arrow', '›'));
      item.addEventListener('click', function () {
        /* 同理走 targetIso：有档案的地区开自己的，没档案的才落到主权国 */
        var lTgt = targetIso(d.iso);
        openDetail(lTgt, cardOf(lTgt), false);
        setSearch(false);
        if (qInput) qInput.blur();
        /* 和联想条目一致：从全量列表点走的那个国家也留在框里，
           下次点开搜索框能直接看到"上一次看的是谁"，接着问就行 */
        if (qInput) {
          qInput.value = d.name || '';
          searchWrap.classList.add('has-text');
          try { qInput.setSelectionRange(0, 0); qInput.scrollLeft = 0; } catch (err) {}
          fitSearchWidth();
        }
      });
      box.appendChild(item);
    });
    qRes.appendChild(el('div', 'sr-foot', '共 ' + list.length + ' 个国家 / 地区 · 按人口排序'));
  }

  var searchWrap = document.getElementById('search-wrap');
  var searchPanel = document.getElementById('search-panel');

  /* 结果区一显示，搜索框就从"一只胶囊"变成"一张连通卡片"（Google 地图那种
     形状：搜索行坐在结果面板顶上，共用一圈外轮廓）：给 wrap 挂 card-open，
     输入行只留上半圆角、结果区只留下半圆角，中间由结果区的内阴影当分隔线。
     用观察器盯 hidden，比在 renderResults / showCountryList / setSearch
     三四处各补一行 classList 更不容易漏改。 */
  if (qRes && searchWrap) {
    new MutationObserver(function () {
      searchWrap.classList.toggle('card-open', !qRes.hidden);
    }).observe(qRes, { attributes: true, attributeFilter: ['hidden'] });
  }

  /* ---------- 自绘提示气泡 ----------
     原生 title 要悬停一秒才弹、样式不可控、移动端干脆没有。
     这里用 data-tip 接管，悬停 120ms 后出现在元素上方（空间不够就放下面）。 */
  (function bindTip() {
    var tip = document.getElementById('tip');
    var cur = null, timer = 0;
    function place(el) {
      if (!tip) return;
      var r = el.getBoundingClientRect();
      tip.classList.add('on');
      var tw = tip.offsetWidth, th = tip.offsetHeight;
      /* 靠左的元素（左下角竖排工具栏）提示一律放右边。
         放上面会直接盖住上面那颗按钮 —— 竖排按钮间距只有 8px，
         提示一出来就分不清是在说谁。 */
      if (r.left + r.width / 2 < window.innerWidth * 0.4) {
        tip.classList.add('side-right');
        tip.style.left = (r.right + 10) + 'px';
        tip.style.top = (r.top + r.height / 2) + 'px';
        return;
      }
      tip.classList.remove('side-right');
      var cx = Math.min(Math.max(r.left + r.width / 2, tw / 2 + 8),
                        window.innerWidth - tw / 2 - 8);
      /* 一律放在元素下方。
         原来是"上面放不下才放下方"，于是同一排关键词里：靠上的那几个提示在下面、
         其余的在上面，鼠标扫过去一上一下，看着很散。统一在下，
         只有真的贴着屏幕底边（比如左下角那排按钮）才翻上去。 */
      var y = r.bottom + 8;
      if (y + th > window.innerHeight - 8) y = Math.max(6, r.top - th - 8);
      tip.style.left = cx + 'px';
      tip.style.top = y + 'px';
    }
    function show(el) {
      var txt = el.getAttribute('data-tip');
      if (!txt || !tip) return;
      cur = el;
      tip.textContent = txt;
      place(el);
    }
    function hide() {
      clearTimeout(timer);
      cur = null;
      if (tip) tip.classList.remove('on');
    }
    document.addEventListener('pointerover', function (e) {
      var el = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
      /* 工具面板里的按钮自己带 .tl（CSS 悬停显示，位置固定在按钮上方）。
         这里再弹一次全局 #tip，同一颗按钮就会同时冒出两个气泡 ——
         截图里那两个吵架的框就是这么来的。面板内一律交给 .tl。 */
      if (el && el.closest && el.closest('#tools')) return;
      if (!el || el === cur) return;
      clearTimeout(timer);
      timer = setTimeout(function () { show(el); }, 120);
    });
    document.addEventListener('pointerout', function (e) {
      var el = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
      if (el && el === cur) hide();
      else if (el) clearTimeout(timer);
    });
    document.addEventListener('pointerdown', hide, true);
    window.addEventListener('scroll', hide, true);
    window.__tipHide = hide;
    /* 工具面板里只保留 .tl 一个气泡（全局 #tip 在 #tools 内被挡掉，见上）。
       所以状态文字也要写进 .tl —— 不然开了气候带，提示永远还是"显示气候带"。 */
    window.__setTip = function (btn, txt) {
      if (!btn) return;
      var sp = btn.querySelector ? btn.querySelector('.tl') : null;
      if (sp) sp.textContent = txt;
      else btn.setAttribute('data-tip', txt);
    };
  })();

  /* 开合只有一个入口，避免三处各改一半导致状态对不上 */
  function setSearch(open, list) {
    if (!searchWrap) return;
    /* 手机上展开时品牌文字要让位：390px 的屏里它占掉约 70px，
       搜索框只剩 185px，而那句提示在 16px 字号下要 239px —— 一定被裁。
       只藏文字、保留 logo，顶栏不会变成一条空条。 */
    var tbEl = document.getElementById('topbar');
    if (tbEl) tbEl.classList.toggle('searching', !!open);
    /* 展开这一下不要跑宽度动画。
       卡片 #q-res 是 width:100%，跟着 .46s 的宽度过渡一帧一帧重排 ——
       236 条国家列表就在半透明的状态下不断换行、重新分栏，
       眼睛看到的是"框先出来，内容随后突然填进去"。
       宽度一帧跳到终值，只留 220ms 的淡入；收起方向仍保留收缩动画，
       那时视线已经离开，动画反而是个收尾。 */
    if (open) {
      searchWrap.style.transitionProperty = 'none';
      void searchWrap.offsetWidth;          // 先把"无过渡"落成实际样式
    }
    searchWrap.classList.toggle('open', !!open);
    if (!open) {
      qRes.hidden = true;
      searchWrap.classList.remove('list-open');
      fitSearchWidth();          // 收起后下限回到 168，长问句按实测宽度重算
      return;
    }
    searchWrap.classList.toggle('list-open', !!list);
    if (list) showCountryList(); else qRes.hidden = true;
    fitSearchWidth();
    /* 宽度已定，两帧之后把过渡还给 CSS（确保这一帧真的按"无过渡"渲染过） */
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { searchWrap.style.transitionProperty = ''; });
    });
  }

  /* ---------- 框宽跟着内容走 ----------
     固定宽度是为"空框"设计的：收起 168px、展开 min(384px,46vw)。但现在点完
     联想会把整条问句留在框里（"法国人吃什么？"），168px 一装只剩前半截，
     用户看不出自己刚点的到底是哪一条 —— 所以按当前文字实测宽度定框宽：
       · 空框 → 交回 CSS，两套原样保留
       · 有字 → 夹在 [168, 384/46vw] 之间；结果卡片摊开时下限提到 320，
                否则两行结果挤成一条
     测量用 canvas.measureText，字体取输入框计算后的 font，
     字号/字重改了也不用同步维护一份常量。 */
  var qMeasure = null;
  function fitSearchWidth() {
    if (!qInput || !searchWrap) return;
    /* 窄屏交给 flex（@media 里 .search-wrap.open{width:auto}），
       这时插 inline width 只会和它打架 */
    if (window.innerWidth <= 760) { searchWrap.style.width = ''; return; }
    var v = qInput.value || '';
    if (!v) { searchWrap.style.width = ''; return; }
    if (!qMeasure) {
      var cv = document.createElement('canvas');
      qMeasure = cv.getContext ? cv.getContext('2d') : null;
      if (!qMeasure) return;
    }
    var cs = window.getComputedStyle(qInput);
    qMeasure.font = (cs.fontWeight || '400') + ' ' + (cs.fontSize || '14.5px') + ' ' +
                     (cs.fontFamily || 'sans-serif');
    /* 92 = 左图标占位 42 + 光标后的呼吸位 12 + × 号 20 + 内边距余量 18 */
    var need = Math.ceil(qMeasure.measureText(v).width) + 92;
    /* 上限分两档：结果卡片摊开时按原来的 384/46vw（再宽就把地球压没了）；
       收起后只是一枚胶囊，可以放宽到 560/62vw —— 点完联想留下的整条问句
       才有机会完整显示，而不是又变回"只看得见前半截"。 */
    var listOpen = qRes && !qRes.hidden;
    var max = listOpen ? Math.min(384, window.innerWidth * 0.46)
                       : Math.min(560, window.innerWidth * 0.62);
    var min = listOpen ? 320 : 168;
    searchWrap.style.width = Math.round(Math.max(min, Math.min(max, need))) + 'px';
  }

  window.addEventListener('resize', function () { fitSearchWidth(); });

  /* 框本身常驻：点框内任何位置都算"要输入"，展开并聚焦。
     不再有那个圆钮 —— 一眼看不出是搜索框，反而像工具菜单。 */
  if (searchPanel) {
    searchPanel.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!searchWrap.classList.contains('open')) setSearch(true, true);
      if (qInput && document.activeElement !== qInput) {
        setTimeout(function () { qInput.focus(); }, 130);
      }
    });
  }
  if (qInput) {
    /* 没点进去之前不显示任何提示词（框本身够清楚，常驻的灰字只是噪音）。
       点进去、框展开变长之后才给两个真实问句 —— 提示"能提问"这件事，
       举一个例子比写十个字有用。 */
    /* 收起不显示，点进去才出现 —— 这句只在框展开后可见。
       先让人知道这里能点、能问；具体例子交给下拉里的「今天一条 / 可以这样问」。
       文案只有这一句：之前按屏宽给过短的，手机上就只剩"或提问"，
       看着像被截断。窄屏改成让出品牌文字（见 setSearch），不砍句子。 */
    var PH_LONG = '点一个地方，或问一个地理问题';
    qInput.addEventListener('focus', function () {
      /* 有字就恢复这轮搜索的结果，别拿 236 国全量列表盖掉它 ——
         否则用户按回车会选中全量列表的第一条（"中国"），
         看上去就像"搜了朝鲜却跳到中国"。 */
      var v = qInput.value.trim();
      if (!searchWrap.classList.contains('open')) setSearch(true, !v);
      if (v.length >= 2) { qRes.hidden = false; renderResults(v); }
      if (!v) qInput.placeholder = PH_LONG;
    });
    qInput.addEventListener('blur', function () {
      qInput.placeholder = '';
      /* 逐字改宽用的 .16s 只在打字时用，失焦还回设计原来的 .46s 缓动，
         否则下次点开"胶囊拉成卡片"会变快，手感跟别处不一致 */
      searchWrap.style.transitionDuration = '';
      // 点了下拉列表的话不收起；空输入离开才收起
      setTimeout(function () {
        if (document.activeElement === qInput) return;
        if (!qInput.value.trim()) setSearch(false);
      }, 140);
    });
  }


  document.addEventListener('click', function (e) {
    if (searchWrap && !searchWrap.contains(e.target)) setSearch(false);
  });

  var searchClear = document.getElementById('search-clear');
  if (searchClear) {
    searchClear.addEventListener('click', function (e) {
      e.stopPropagation();
      if (qInput) { qInput.value = ''; qInput.focus(); }
      searchWrap.classList.remove('has-text');
      setSearch(true, true);
    });
  }

  if (qInput) {
    var qTimer = null;
    qInput.addEventListener('input', function () {
      clearTimeout(qTimer);
      var v = qInput.value.trim();
      searchWrap.classList.toggle('has-text', !!qInput.value);
      searchWrap.classList.remove('list-open');
      /* 打字时框宽跟着字走。开合那条 .46s 的缓动是给"胶囊拉成卡片"用的，
         逐字改宽还沿用它会像橡皮筋，这里临时压到 .16s（失焦时还原）。 */
      searchWrap.style.transitionDuration = '.16s';
      fitSearchWidth();
      qTimer = setTimeout(function () {
        if (v.length < 2) { qRes.hidden = true; qRes.innerHTML = ''; return; }
        renderResults(v);
      }, 180);
    });
    qInput.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        qInput.value = '';
        setSearch(false);
        qInput.blur();
        return;
      }
      /* 回车 = 选中第一条结果。
         原来这里**完全没有 Enter 处理**（只处理了 Esc），所以搜完按回车
         什么都没发生 —— 用户报的"输入新喀按回车没反应"就是这个。
         结果还没出来时（输入有 180ms 防抖）先同步渲染一次再点，
         不然手快的人按回车会撞在防抖窗口里。 */
      if (e.key === 'Enter') {
        e.preventDefault();
        /* 面板现在是 236 国全量列表（还没输入）时，回车不该随手打开
           列表第一条（"中国"）—— 那不是一次搜索，只是浏览。 */
        if (searchWrap.classList.contains('list-open')) return;
        var v = qInput.value.trim();
        /* ---------- 混血：前端用上游，后端用本地那套「国名 + 话题」识别 ----------
           上游的把回车交给"点列表第一条"，纯国名靠 boostByCountry 把 brief 顶上
           第一条来兜底。好处是简单，但"中国美食""法国历史""埃及宗教"这类
           **国名 + 话题**的问法，它只会开出该国档案停在第 1 屏 —— 因为第一条
           往往是"中国说什么话"，跟"美食"没关系。
           所以这里接回本地的后端：先认出国家，把国名去掉后的剩余词当探针
           （"中国澳门"去掉国名后就是"澳门"），再点开档案并滚到对应段落。
           纯国名（"朝鲜"）交给 executeHit 里的 isOwnCard 分支，不会乱滚。 */
        var cq = findCountryInQuery(v);
        if (cq) {
          var focus = {
            probe: cq.rest || String(cq.name || '').replace(/^中国/, ''),
            extra: ''
          };
          /* 该国有高分问答时，把它的答案文本当备选探针（本地原逻辑）：
             "美食"这种两字探针定位几乎必中，答案文本只在探针失手时兜底。 */
          var hs = bm25(v, 5);
          var qaDoc = null;
          if (hs.length && hs[0][1] >= 12) {
            var hd = hs[0][0];
            if (hd.kind !== 'country' && hd.a &&
                String(hd.iso || '').toUpperCase() === String(cq.iso || '').toUpperCase()) {
              qaDoc = hd;
              focus.extra = hd.a;
            }
          }
          executeHit({ iso: cq.iso, name: cq.name, kind: 'country' }, v, focus, qaDoc);
          return;
        }
        var first = qRes.querySelector('.sr-item');
        if (!first && v.length >= 2) {
          clearTimeout(qTimer);
          renderResults(v);
          first = qRes.querySelector('.sr-item');
        }
        if (first) first.click();
      }
    });
  }


  /* 拼音组词期间不要检索：输入法会为每个字母派发 input，
     一次"jifeng"能触发 6 次检索 + 6 次重绘，看起来就是"打字卡"。 */
  var composing = false;
  if (qInput) {
    qInput.addEventListener('compositionstart', function () { composing = true; });
    qInput.addEventListener('compositionend', function () { composing = false; });
  }
  var __renderResults = renderResults;
  renderResults = function (q) {
    if (composing) return;
    return __renderResults(q);
  };

  /* ---------- 投影模式 ----------
     课堂上要"一屏讲一件事"：卡片放大到 92vw，地球、顶栏、工具箱全收起来。
     入口按用户要求放在左下角的工具抽屉里（新开一组「课堂」）。 */
  (function () {
    var tb = document.getElementById('tools-body');
    if (!tb) return;

    var sec = el('section', 'tg');
    sec.appendChild(el('h3', '', '课堂'));
    var row = el('div', 'tg-r');
    var btn = el('button', 'tool-btn');

    btn.type = 'button';

      '<path d="M8.6 19.4h6.8M12 15.8v3.6"/></svg>' +
      '<span class="tl">投影模式</span>';
    row.appendChild(btn);
    /* 看图猜国家与投影同属课堂教具，收进同一组（原来单独占一组「测验」） */
    var qbtn = el('button', 'tool-btn');
    qbtn.id = 'btn-quiz';
    qbtn.type = 'button';
    qbtn.setAttribute('aria-pressed', 'false');
    qbtn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
      '<circle cx="12" cy="12" r="8.3"/>' +
      '<path d="M9.6 9.5a2.5 2.5 0 1 1 3.2 2.4c-.8.3-1.1 1-1.1 1.9"/>' +
      '<circle cx="11.7" cy="16.7" r=".9" fill="currentColor" stroke="none"/></svg>' +
      '<span class="tl">看图猜国家</span>';
    row.appendChild(qbtn);
    sec.appendChild(row);
    tb.appendChild(sec);

    var exit = el('button', '', '退出投影 · Esc');
    exit.id = 'class-exit';
    exit.type = 'button';
    document.body.appendChild(exit);

    function setMode(on) {
      document.body.classList.toggle('class-mode', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      var sp = btn.querySelector('.tl');
      if (sp) sp.textContent = on ? '退出投影' : '投影模式';
      if (on && !detail.classList.contains('open')) {
        /* 没开卡就进投影，等于对着一片黑；直接打开今天那条 */
        var pool = TEACH.filter(function (x) { return x.kind === 'concept'; });
        if (pool.length) {
          var dayN = Math.floor(Date.now() / 86400000);
          openKCard(pool[dayN % pool.length]);
        }
      }
    }

    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      setMode(!document.body.classList.contains('class-mode'));
    });
    exit.addEventListener('click', function (e) {
      e.stopPropagation();
      setMode(false);
    });
    /* 投影里点“飞过去”时，地球是隐藏的，飞了也看不见 ——
       所以点地点就自动退出投影，让老师立刻看到那颗球。 */
    document.addEventListener('click', function (e) {
      if (!document.body.classList.contains('class-mode')) return;
      var ka = e.target && e.target.closest ? e.target.closest('.ka') : null;
      if (!ka) return;
      setTimeout(function () { setMode(false); }, 80);
    }, false);

    /* Esc 分两级：投影里先退投影，再按一次才关卡片 */
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && document.body.classList.contains('class-mode')) {
        e.preventDefault();
        e.stopPropagation();
        setMode(false);
      }
    }, true);

    window.__classMode = setMode;
  })();

  /* 国家档案与知识卡共用同一个面板，两条线的路径不能串：
     一开档案就清栈，一关面板也清栈。 */
  var __openDetail = openDetail;
  openDetail = function () {
    K_PATH = [];
    K_OPEN_ID = null;
    return __openDetail.apply(null, arguments);
  };
  var __closePanel = closePanel;
  closePanel = function () {
    K_PATH = [];
    K_OPEN_ID = null;
    return __closePanel.apply(null, arguments);
  };

  /* 回车直接进右侧详解：概念/对比不需要先点一行。 */
  if (qInput) {
    qInput.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      var hit = tchHit(qInput.value);
      if (!hit) return;
      e.preventDefault();
      openKCard(hit.it);
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.sr-ex'), function (btn) {
    btn.addEventListener('click', function () {
      qInput.value = btn.dataset.q;
      renderResults(btn.dataset.q);
      qInput.focus();
    });
  });

  /* 下拉正开着（还停在空列表状态）就把内容补上。
     以前索引到了什么都不做，面板一直停在"尚未就绪"，用户只能重新点一次。 */
  function rerenderIfListOpen() {
    if (!qRes || qRes.hidden) return;
    if (!searchWrap || !searchWrap.classList.contains('list-open')) return;
    showCountryList();
    var box = qRes.querySelector('.sr-list');
    if (box) box.classList.add('sr-swap');
  }

  function loadSearchIndex() {
    fetchAny('data/search.json')
      .then(function (d) {
        IDX = buildIdx(d.docs || []);
        mergeCountryDocs();
        updat
        rerenderIfListOpen();
      })
      .catch(function (e) {
        if (qSub) qSub.textContent = '索引未加载（' + e.message + '）';
      });
  }

  /* 所有国家的元数据：名称/大洲/人口/中心点。
     20KB，首屏就取 —— 检索、基础档案、飞行动画都要用。 */
  function loadCountryMeta() {
    return fetchAny('geo/meta.json')
      .then(function (m) {
        LABEL_META = m || null;
        mergeCountryDocs();
        updateIdxSub();
        rerenderIfListOpen();     // 排序按人口，元数据到了顺序才算得出来
      })
      .catch(function () { /* 拿不到就退化成"只有三国可查"，不影响地球本体 */ });
  }

  function updateIdxSub() {
    if (!qSub || !IDX) return;
    var n = Object.keys(LABEL_META || {}).length;
    qSub.textContent = n
      ? '知识库 ' + IDX.N + ' 条 · 覆盖 ' + n + ' 个国家与地区 · 本地检索'
      : '知识库 ' + IDX.N + ' 条 · 2-gram + BM25 本地检索';
  }

  /* 把"还没有档案的国家"作为基础条目并进检索。
     这样搜"日本""埃及"也能命中并飞过去，而不是只有三国可查。 */
  function mergeCountryDocs() {
    if (!IDX || !LABEL_META) return;
    var have = {};
    IDX.docs.forEach(function (d) { if (d.iso) have[d.iso] = 1; });
    var added = 0;
    Object.keys(LABEL_META).forEach(function (iso) {
      if (have[iso]) return;
      var m = LABEL_META[iso];
      IDX.docs.push({
        id: 'c-' + iso,
        iso: iso,
        name: m.n,
        kind: 'country',
        q: m.n + (m.en ? '　' + m.en : ''),
        a: (m.cont || '') + (m.pop ? ' · 人口约 ' + fmtPop(m.pop) : '') + ' · 基础档案',
        index_text: m.n + ' ' + (m.en || '') + ' ' + (m.cont || '')
      });
      added++;
    });
    if (added) IDX = buildIdx(IDX.docs);
  }

  /* ---------- 3D 地球 ----------
     设计上的四个决定：

     1) 懒加载。three.min.js 670KB，若在首屏加载会把 LCP 拖到 3 秒以上。
        用 IntersectionObserver 等区块进入视口再加载，首屏完全不受影响。

     2) 不用贴图，只用我们自己的 GeoJSON。真实地球纹理（4K 等距柱状图）动辄
        2~8MB，且来源授权要单独确认；而我们的数据只有 110KB —— 大陆轮廓 + 已采集国家的国界
        国界，全部来自 Natural Earth 与既有 geo/*.geojson。视觉上反而更统一：
        暗球 + 淡色大陆 + 金色国界，和站点其余部分同一套配色。

     3) 球面插值细分。国界相邻两点若相距较远，直接用直线连会在球体内部穿过去
        （弦切进球），表现为"线条沉到球里"。所以每条边按 ≤2° 插值成折线。

  /* 经纬度 → 球面坐标。y 轴朝北，经度 0 落在 -Z 方向（正对初始相机）。 */

  function pushEdge(a, b, r, arr) {

    llToVec3(a[0], a[1], r, va);
    for (var i = 1; i <= steps; i++) {
      var t = i / steps;
      var vb = new THREE.Vector3();
      llToVec3(a[0] + dLon * t, a[1] + dLat * t, r, vb);
      arr.push(va.x, va.y, va.z, vb.x, vb.y, vb.z);

  /* 经纬网：等距圆柱贴图，不是线段。

       * 经线在赤道处断开一小段，度数直接塞进断口 —— 数字压线最难读
       * 纬线在 ±90° 经线处各断一次，左右对称各标一个度数
       * 南北回归线（23.5°）与极圈（66.5°）画虚线，同样标注

    var W = 4096, H = 2048;

    cv.width = W; cv.height = H;
    var g = cv.getContext('2d');
    var LINE = 'rgba(226,190,120,0.58)';
    var MAJOR = 'rgba(240,206,140,0.92)';
    var TEXT = 'rgba(248,224,176,0.96)';
    var FONT = 'bold 30px system-ui,-apple-system,"Microsoft YaHei",sans-serif';
    var lon, lat, x, y;

    function Y(t) { return (90 - t) / 180 * H; }

    g.lineCap = 'butt';
    g.font = FONT;
    g.textAlign = 'center';
    g.textBaseline = 'middle';

       40° 这一带是空的 —— 30° 和 66.5° 之间没有任何纬线，
       南半球同理（用 40°N 统一，所有经线的数字连成一条横向的带，好认）。
       断口宽度按文字实测：固定 40px 塞不下 "120°W"（约 100px）。 */
    var LAB_LAT = 40;
    g.lineWidth = 2.2;
    g.strokeStyle = LINE;
    for (lon = -180; lon < 180; lon += 30) {
      x = X(lon);
      var lab = lon === 0 ? '0°' : Math.abs(lon) + '°' + (lon > 0 ? 'E' : 'W');
      var gap = g.measureText(lab).width / 2 + 12;
      var ly = Y(LAB_LAT);
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x, ly - gap); g.stroke();
      g.beginPath(); g.moveTo(x, ly + gap); g.lineTo(x, H); g.stroke();
      g.fillStyle = TEXT;
      g.fillText(lab, x, ly);

    function latLine(t, dashed, major) {
      y = Y(t);
      var lab = t === 0 ? '0°'
        : (Math.abs(t) % 1 === 0 ? Math.abs(t) : Math.abs(t).toFixed(1)) +
          '°' + (t > 0 ? 'N' : 'S');
      var gap = g.measureText(lab).width / 2 + 12;
      /* 断点放在 ±135° 而不是 ±90°。
         经线是在赤道处断开写度数的，如果纬线也在 ±90° 断，赤道和 90°W/90°E
         这两条经线的交点就会同时出现两个标注，糊成一团（"90°W" 里的 0 被
         "0°" 盖住，就是用户报的"西经 0 度的 0 被遮住"）。

      var xs = [X(-135), X(135)];

      for (var i = 0; i < xs.length; i++) {

        from = xs[i] + gap;

      g.beginPath(); g.moveTo(from, y); g.lineTo(W, y); g.stroke();
      g.restore();

      g.fillStyle = TEXT;
      for (var k = 0; k < xs.length; k++) g.fillText(lab, xs[k], y);

    // 回归线与极圈：虚线

    var tex = new THREE.CanvasTexture(cv);
    /* 必须声明 sRGB。canvas 里的颜色本来就是按 sRGB 写的，

        llToVec3(mlon, -mlat, radius, va);
        llToVec3(mlon, -(mlat + 2), radius, vb);
        segPts.push(va.x, va.y, va.z, vb.x, vb.y, vb.z);

    out.add(new THREE.LineSegments(segGeo, new THREE.LineBasicMaterial({
      color: 0xe2be78, transparent: true, opacity: 0.55, depthWrite: false
    })));

    /* 极点上再压一枚小球，把贴图与 3D 线的接缝盖住 */
    var dotGeo = new THREE.SphereGeometry(radius * 0.0065, 10, 8);
    var dotMat = new THREE.MeshBasicMaterial({
      color: 0xe6c078, transparent: true, opacity: 0.9, depthWrite: false

    [1, -1].forEach(function (sgn) {
      var dot = new THREE.Mesh(dotGeo, dotMat);
      dot.position.set(0, sgn * radius * 1.002, 0);
      out.add(dot);
    });
    return out;
  }

  function vec3ToLL(v) {

  /* 全量国界索引（223 国 / 1201 环，来自 geo/flat.json）。

     还放宽了 2°。于是点德国国土时，德国整块都落在法国那个大包围盒里，
     函数返回法国 —— 用户看到的就是"点德国跳出法国"。
     点国名反而是对的：那条路走标签自己的 iso，根本不经过这里。

     现在改成：bbox 粗筛 → 按面积升序 → 射线法。小国优先，
     大国包住小国时（南非/斯威士兰、法国/德国）不会再把邻国吞掉。 */

          (c.rings || []).forEach(function (raw) {
            var ring = new Array(raw.length), i, p;
            for (i = 0; i < raw.length; i++) {

              ring[i] = p;
              if (p[0] < box.x0) box.x0 = p[0];
              if (p[1] < box.y0) box.y0 = p[1];
              if (p[0] > box.x1) box.x1 = p[0];

  function countryAt(lon, lat) {

          }

      var d2 = dx * dx + dy * dy;

  /* 排查用：控制台里 __hitTest(10.5, 51) 直接看得某经纬度判给哪个国家。
     地球是三维的，"点屏幕中心"未必落在想点的地方，靠这个才能把
     判定逻辑和点击位置分开验证。 */

       传 null 只表示"当前不再看谁"，把最亮那条降一档，仍然留着 —— 以前这里
       会 setActive(null) 顺手把金线一起撤掉，于是"退出后国境线还亮着"和
       "退出后全黑了"两种相反的现象在不同路径下都出现过。 */
    if (iso && globe.lightBorder) globe.lightBorder(iso);
    else if (globe.dimCurrent) globe.dimCurrent();
    Array.prototype.forEach.call(
      document.querySelectorAll('.dock-item'),
      function (n) { n.classList.toggle('active', n.dataset.iso === iso); }
    );

     spin 绕 Y：点 (lon,lat) 的方位角 θ=(lon+180)°，令 θ+ry=90° 即朝向 +Z，

     tilt 绕 X：正角度使北极转向相机，故北半球国家用正 lat。 */

    var c = null;
    (globe.data.countries || []).forEach(function (x) { if (x.iso === iso) c = x; });
    if (!c || !globe.spin) return;
    var toY = -c.center[0] * D2R - Math.PI / 2;
    var toX = c.center[1] * D2R;

    var fromX = globe.tilt.rotation.x;

      var e = 1 - Math.pow(1 - k, 3);
      globe.spin.rotation.y = fromY + dY * e;
      globe.tilt.rotation.x = fromX + dX * e;
      if (k < 1) requestAnimationFrame(step);
      else globe.autoSpin = !globe.pinCN;   // 钉住的时候别自己转走
    })();

  /* ---------- 常驻中国 ----------
     原来是一颗一次性动作按钮（act）：按下去飞过去，飞完自转照旧，中国又转走了；
     而且是六个按钮里唯一不会亮的那个 —— 和旁边五个开关明显不是一类。
     改成开关：点亮 = 镜头钉在中国上空并冻结自转，再点一次解除。
     六个按钮于是全是 aria-pressed 开关，点亮态、交互、读屏口径都统一了。

     解除的时机有两处：用户手动拖球（dragDown）、或飞向别的国家（focusCountry）。
     滚轮缩放不算 —— 拉近看中国正是在用它，不该把钉子拔掉。 */
  function setPinChina(on) {
    on = !!on;
    if (globe.pinCN === on) return;
    globe.pinCN = on;
    var btn = document.getElementById('btn-china');
    if (btn) btn.classList.toggle('on', on);   // aria-pressed 由末尾的 MutationObserver 同步
    if (on) {
      globe.camMode = 'manual';
      globe.flying = false;
      /* 高度回到首屏那个 3.02，否则"定位到中国"会变得很随机 ——
         上次放大到街道级别的话，点一下还是贴在街道上。只动相机，不开面板。 */
      globe.camTarget = 3.02;
      focusCountry('CN', 900);
    } else {
      globe.autoSpin = true;
      globe.idleUntil = performance.now() + 600;
    }
  }

  /* ---------- 地球贴图与材质 ----------
     为什么需要 CORS：<img> 展示图片不受跨域限制，但 WebGL **纹理**必须有
     Access-Control-Allow-Origin，否则纹理会加载失败（画布被污染）。这是
     图片与纹理最容易踩的差别 —— 之前 assets 里的图片能显示，不代表贴图能用。

     加载策略（v2026-10-27-G 改）：
       4K 日面、夜面、8K 日面**一起下**，三张都推上显存之后才让球淡入。
     之前是"4K 先出球、8K 后台补"，但补的那一刻要把 8192×4096 传上 GPU，
     这笔开销无论怎么挪都会落在用户操作中间（缩放、拖拽、点国家都撞上过）。
     现在把它挪到"球还完全透明"的阶段：屏幕上只有线框地球 + 加载环，
     卡也卡在用户预期之内；球一出现就是最终画质，之后不再有任何贴图切换。
     网络太慢（5.2 秒下不完 8K）才回退到"先出 4K"，迟到的 8K 等手停再挂。 */
  var TEX_BASES = [OBS_BASE + 'assets/tex/', 'assets/tex/'];

  /* 贴图版本号 = 文件内容的 md5 前 8 位，由 scripts/stamp_tex_ver.py 写进来。
     别再用全局 BUILD_TAG：那玩意儿每次发版都变，哪怕只改了一行 CSS，
     回访用户也要把 2MB 贴图整套重下一遍 —— 华为云流量告警就是这么来的。
     内容哈希只在图片真的重新生成时才变，没变的图永远命中缓存。 */
  var TEX_VER = {
    /* TEX_VER:start */
    'climate-lo.png': '39eadfb4',
    'climate.png': 'b011d715',
    'temp.webp': 'dc0c15ce',
    'terrain-lo.webp': '1439af05',
    'terrain.webp': '124b640d',
    /* TEX_VER:end */
  };

  /* 单文件多源尝试：OBS 失败退仓库同域 */
  function loadTex(loader, name, ok, fail) {
    var i = 0;
    (function next() {
      if (i >= TEX_BASES.length) { fail(); return; }
      var url = TEX_BASES[i++] + name;
      loader.load(url, function (t) { ok(t, url); }, undefined, next);
    })();
  }

  /* 8K 只在真有本钱的情况下加载：
     - GPU 最大纹理尺寸够 8192（老集显/手机常见上限 4096）
     - 不是移动端（移动端 8K 纹理 ~180MB 显存，容易直接掉帧）
     - 用户没开省流量 */
  function canUse8K() {
    if (window.matchMedia && window.matchMedia('(pointer:coarse)').matches) return false;
    if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) return false;
    if (navigator.connection && navigator.connection.saveData) return false;
    if ((window.innerWidth || 0) < 1024) return false;
    return true;
  }

  /* 三张图一起下：4K 日面、夜面、8K 日面（能上 8K 的机器才要）。
     等 4K 与夜面到齐、且 8K 有结论（成功 / 失败 / 超时）之后才出球。
     为什么不"4K 先出球、8K 后台补"：补的那一刻要把 8192×4096 传上 GPU，
     这笔开销无论怎么挪都会落在用户操作中间 —— 缩放、拖拽、点国家都撞上过。
     现在把上传挪到"球还没出现"的阶段：屏幕上只有星空 + 加载环，
     卡也卡在用户预期之内。 */
  function loadEarthTextures(cb, renderer) {
    var loader = new THREE.TextureLoader();
    var day4 = null, night = null, day8 = null;
    var need = 2, settled8 = false, done = false, msgSent = false;
    /* 注意这里要用传进来的 renderer：globe.renderer 是在 buildGlobe 末尾才赋值的，
       这个函数在赋值之前就被调用了 —— 用 globe.renderer 会永远读到 4096，8K 永远不加载。 */
    var maxTex = (renderer && renderer.capabilities &&
                  renderer.capabilities.maxTextureSize) || 4096;
    var want8 = (maxTex >= 8192 && canUse8K());
    globe.can8k = want8;

    function finish() {
      if (done) return;
      done = true;
      cb(day4, night, day8);
    }
    function maybe() {
      if (done || need > 0) return;
      if (want8 && !settled8) {
        /* 4K 已经到手、还在等 8K：文字换成"准备高清贴图"，
           让用户知道这几秒不是白等（屏幕上已经有线框地球在转）。 */
        if (!msgSent) { msgSent = true; globeMsg('地表影像就位，正在准备高清贴图…'); }
        return;
      }
      finish();
    }

    loadTex(loader, 'earth-day.webp',
      function (t) { day4 = t; need--; maybe(); },
      function () { day4 = null; need--; maybe(); });
    loadTex(loader, 'earth-night.webp',
      function (t) { night = t; need--; maybe(); },
      function () { night = null; need--; maybe(); });

    /* 地形法线贴图：185KB，**不算进"出球"的等待**（need 不加），
       晚到一点没影响 —— 到了把 uBump 打开，地形就有了起伏。
       night 只作用于夜面，日面的山脉/沙漠本来是平的。 */
    loadTex(loader, 'earth-normal.webp',
      function (t) {
        t.anisotropy = 4;
        t.minFilter = THREE.LinearMipmapLinearFilter;
        t.magFilter = THREE.LinearFilter;
        t.generateMipmaps = true;
        t.needsUpdate = true;
        globe.normalTex = t;
        if (globe.earthMat) {
          globe.earthMat.uniforms.uNormalMap.value = t;
          globe.earthMat.uniforms.uBump.value = 1;
        }
      },
      function () { /* 拿不到就只是没有起伏，不影响其它 */ });

    if (want8) {      loadTex(loader, 'earth-day-8k.webp', function (t) {
        t.anisotropy = 1;                 // 无 mipmap，各向异性过滤没意义
        t.generateMipmaps = false;        // 省掉最贵的一步（3300 万像素的 mip 链）
        t.minFilter = THREE.LinearFilter;
        t.magFilter = THREE.LinearFilter;
        t.needsUpdate = true;
        day8 = t;
        globe.tex8k = t;
        settled8 = true;
        /* 超时之后才到的：球已经出来了，这时候上传会卡一下。
           标记成 ready，等用户手停下来（渲染循环里）再挂。 */
        if (done) globe.tex8kReady = true;
        maybe();
      }, function () {
        globe.can8k = false;
        settled8 = true;
        maybe();
      });
      /* 网络太慢就别耗着：5.2 秒还没下完就先用 4K 出球。
         迟到的 8K 仍然会被收下（tex8kReady），等手停下来再挂上去。 */
      setTimeout(function () {
        if (settled8) return;
        settled8 = true;
        maybe();
      }, 5200);
    }
  }

  /* ---------- 8K 的"迟到"路径 ----------
     正常情况 8K 和 4K 一起下、一起上传，球一出现就是高清，没有中途切换。
     只有网络太慢（5.2 秒没下完）时才会走这条路：球先出 4K，
     8K 到了先不挂，等用户手停下来（见渲染循环）再挂 —— 那一下的上传卡顿
     才不会落在拖拽/缩放中间。 */
  function bind8k() {
    if (!globe.tex8k || !globe.earthMat) return;
    globe.tex8kReady = false;
    globe.earthMat.uniforms.dayMapB.value = globe.tex8k;
    globe.mixBTarget = 1;
  }

  /* 星空：球面均匀分布的点云，带闪烁。
     用 PointsMaterial 出来的是"一堆死白点"；换成自定义 shader，每颗星带一个
     随机相位，亮度按 sin 缓慢呼吸（周期各不相同），才有真正夜空的感觉。
     半径 26~66 落在相机 far(100) 之内，不跟随地球自转，所以它是"背景"。 */
  var STAR_MAT = null;
  function addStars(scene) {
    /* 相机永远看着球心、fov 固定，所以视野其实是**一个固定的圆锥**。
       把星星撒满整个球面，只有 3% 会出现在画面里 —— 3200 颗看起来像 100 颗。
       所以直接在视野锥里撒（半角 44°，覆盖宽屏的水平视场），
       1400 颗就真的能看到 1400 颗，密度才像夜空。 */
    var N = 2000;
    var COSA = Math.cos(44 * Math.PI / 180);
    /* 一条"银河"：约三分之一星集中在一个大圆带附近（法向 n 的平面），
       实拍照片里银河就是一条斜贯画面的密集带，均匀撒是撒不出来的。 */
    var NW = [0.46, 0.78, 0.42];
    var pos = new Float32Array(N * 3);
    var col = new Float32Array(N * 3);
    var pha = new Float32Array(N);
    var siz = new Float32Array(N);
    var spk = new Float32Array(N);
    for (var i = 0; i < N; i++) {
      var r = 26 + Math.pow(Math.random(), 0.65) * 40;
      var dx, dy, dz, tries = 0;
      do {
        var cosT = 1 - Math.random() * (1 - COSA);
