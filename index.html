  var TEACH = [{"id":"monsoon","kind":"concept","name":"季风","alias":["季风气候","季风区","monsoon"],"level":{"jr":"七年级上 · 天气与气候","sr":"必修一 · 大气环流"},"line":"一年之内风向随季节近乎反向的盛行风，由海陆热力差驱动。","why":"夏季陆地升温快、成低压，风从海洋吹向陆地；冬季陆地冷、成高压，风反过来。东亚背靠最大的大陆、面朝最大的大洋，所以季风最强、最典型。","mech":"南亚还叠加了青藏高原的作用：高原夏季像一台加热器把赤道气流吸上来，西南季风因此“爆发式”到来，而不是慢慢加强。","anchors":[{"iso":"CN","where":"中国东部","see":"六月梅雨、七八月伏旱，雨热同期"},{"iso":"IN","where":"印度西南","see":"六月西南季风先到喀拉拉邦，全国等雨开耕"},{"iso":"SO","where":"索马里","see":"夏季同样刮西南风，却是离岸风，干燥少雨"}],"counter":"季风不等于多雨：索马里夏季正处在西南季风里，却因为风从陆地吹向海洋而干旱。把“季风区＝湿润”当通例，是把东亚的经验当成了全世界的规律。","next":[{"q":"中国北方为什么春天总缺水","to":"china-climate"},{"q":"梅雨是谁按住的","to":"fronts"}],"cite":"依据：中国／印度／索马里三份档案的气候问答字段，加自然地理常识；组内整理，未引用教材原文。","cat":"大气","sections":[{"h":"为什么","p":"夏季陆地升温快、成低压，风从海洋吹向陆地；冬季陆地冷、成高压，风反过来。东亚背靠最大的大陆、面朝最大的大洋，所以季风最强、最典型。"}],"media":{"svg":"monsoon","hint":"海陆热力差如何翻转风向"},"tags":["季风","夏季风","雨季","海陆热力差","雨热同期"],"quiz":[{"lv":"jr","type":"choice","q":"我国东部季风区夏季盛行的风向主要是","opts":["西北风","东南风","西南风","东北风"],"ans":1,"exp":"夏季风从海洋吹向陆地，我国东部受来自太平洋的东南季风影响，所以降水集中在夏季，形成雨热同期。","diff":1,"tag":["大气","季风","概念辨析"]},{"lv":"sr","type":"short","q":"说明青藏高原对南亚西南季风“爆发式”来临的作用。","ans":"① 夏季高原强烈加热，近地面形成热低压，把赤道以南的西南气流吸上来；② 高原作为高大屏障阻挡北方冷空气南下，使西南季风势力更强；③ 气流受地形抬升，形成大量降水。","exp":"注意高原的作用是“加热 + 阻挡”两件事，不是单纯“挡风”。只写“地形抬升”只答到第三点。","diff":3,"tag":["大气","季风","机制分析"]}]},{"id":"plate","kind":"concept","name":"板块运动","alias":["板块","板块构造","板块边界","plate"],"level":{"jr":"七年级上 · 海陆变迁","sr":"必修一 · 地表形态"},"line":"岩石圈被切成若干刚性板块，它们在软流圈上移动，交界处集中了全球绝大多数地震和火山。","why":"边界分三类：张裂（大洋中脊、东非大裂谷）、碰撞（喜马拉雅）、俯冲（日本海沟、安第斯）。地震带基本就画在这些线上，所以“地震多”往往是一个地方处在什么边界的直接证据。","mech":"板块运动的驱动力至今仍是前沿问题：地幔对流、板片下拉、地幔柱各有支持证据，中学教材只讲“在移动”，不讲“为什么动”——这一点在大学会被推翻重讲。","anchors":[{"iso":"NP","where":"喜马拉雅","see":"印度板块顶到欧亚板块，山还在长高"},{"iso":"JP","where":"日本海沟","see":"太平洋板块俯冲下去，地震与海啸的来源"},{"iso":"KE","where":"东非大裂谷","see":"板块正在张裂，裂谷每年变宽几毫米"}],"counter":"板块边界不是国界，也不是地图上画出来的线：同一片海域可以既有俯冲又有转换断层，判断依据是两侧板块的性质。","next":[{"q":"山脉是怎么挤出来的","to":"structures"},{"q":"为什么山会被削平","to":"exogenic"}],"cite":"依据：地质学通识（板块构造三类边界）；地震带分布与各国档案的地理位置一致。","cat":"地质","sections":[{"h":"为什么","p":"边界分三类：张裂（大洋中脊、东非大裂谷）、碰撞（喜马拉雅）、俯冲（日本海沟、安第斯）。地震带基本就画在这些线上，所以“地震多”往往是一个地方处在什么边界的直接证据。"}],"media":{"img":"plate-boundaries","hint":"板块运动"},"tags":["板块","地震","火山","喜马拉雅","海沟","东非大裂谷"],"quiz":[{"lv":"jr","type":"choice","q":"喜马拉雅山脉形成的主要原因是","opts":["板块张裂","板块碰撞挤压","流水侵蚀","火山堆积"],"ans":1,"exp":"印度板块与欧亚板块碰撞，岩层褶皱抬升，山还在长高。","diff":1,"tag":["地质","板块运动","概念辨析"]},{"lv":"sr","type":"short","q":"说明日本多地震的原因，并指出与我国西南地区地震成因的不同。","ans":"日本位于太平洋板块向欧亚板块俯冲的边界，板片摩擦、破裂频繁，地震多且常有海啸。我国西南为印度板块与欧亚板块碰撞挤压带，以逆冲型地震为主。","exp":"都是“板块边界”，但一个是俯冲、一个是碰撞，机制不同不能混写。","diff":2,"tag":["地质","板块运动","机制分析"]}]},{"id":"current","kind":"concept","name":"洋流与渔场","alias":["洋流","渔场","寒暖流","current"],"level":{"jr":"七年级上 · 海洋","sr":"必修一 · 海水运动"},"line":"表层海水的大规模定向流动；寒暖流交汇处或冷水上升处，最容易形成大渔场。","why":"交汇处海水被搅动，底层的营养盐被带上来，浮游生物爆发，鱼群随之聚集；上升流区是同一机制的另一条路——不用交汇，只要深层冷水能上来。","mech":"渔场位置还受大陆架宽度、河流入海营养、以及历史过度捕捞影响，所以“有渔场”与“现在还有鱼”是两件事。","anchors":[{"iso":"JP","where":"北海道渔场","see":"日本暖流与千岛寒流交汇，世界四大渔场之一"},{"iso":"CA","where":"纽芬兰渔场","see":"墨西哥湾暖流与拉布拉多寒流交汇，曾因滥捕崩溃"},{"iso":"PE","where":"秘鲁沿岸","see":"上升流把营养盐带上来，鳀鱼产量世界前列"}],"counter":"鱼多不等于水暖：秘鲁渔场靠的是冷水上升，水温比同纬度更低。把“渔场＝暖海”记反了，就会解释不了秘鲁和西北非。","next":[{"q":"为什么西欧冬天不冷","to":"oceanic"},{"q":"日本为什么鱼吃得多","to":"cmp-diet"}],"cite":"依据：档案中日本／加拿大／秘鲁的地理位置与洋流常识；纽芬兰崩溃为公认史实（1992 年禁渔）。","cat":"海洋","sections":[{"h":"为什么","p":"交汇处海水被搅动，底层的营养盐被带上来，浮游生物爆发，鱼群随之聚集；上升流区是同一机制的另一条路——不用交汇，只要深层冷水能上来。"}],"media":{"img":"ocean-currents","hint":"寒暖流与渔场"},"tags":["洋流","渔场","寒流","暖流","秘鲁","北海道"],"quiz":[{"lv":"jr","type":"choice","q":"北海道渔场形成的主要原因是","opts":["只有单一暖流经过","寒暖流交汇","上升流带来营养盐","河流入海带来养分"],"ans":1,"exp":"日本暖流与千岛寒流交汇，海水搅动把营养盐带到表层。","diff":1,"tag":["海洋","洋流与渔场","概念辨析"]},{"lv":"sr","type":"short","q":"比较秘鲁渔场与纽芬兰渔场成因的异同。","ans":"相同：都是营养盐丰富、浮游生物多，鱼类聚集。不同：秘鲁渔场靠沿岸上升流把深层冷水与营养盐带上来，水温偏低；纽芬兰渔场靠寒暖流交汇搅动海水。","exp":"两者机制不同，答题要分开写，不能一句“寒暖流交汇”套两个。","diff":2,"tag":["海洋","洋流与渔场","机制分析"]}]},{"id":"oceanic","kind":"concept","name":"温带海洋性气候","alias":["海洋性气候","温带海洋气候","oceanic"],"level":{"jr":"七年级上 · 世界气候","sr":"必修一 · 气候类型"},"line":"全年温和、降水季节分配均匀，只出现在南北纬 40°–60° 的大陆西岸。","why":"常年受西风带控制，海洋暖湿气流被带上岸；冬季有暖流增温，最冷月也不太冷。所以它的两个特征词是“均匀”和“西岸”，缺一个就不成立。","mech":"“西岸”不是地理偏见，是环流决定的：同一纬度的大陆东岸是季风或大陆性气候，因为风从陆地吹向海洋，水汽来源相反。","anchors":[{"iso":"GB","where":"英国","see":"西风加北大西洋暖流，同纬度港口冬季不冻"},{"iso":"NZ","where":"新西兰","see":"南半球同纬度西岸，四季温差更小"},{"iso":"CL","where":"智利南部","see":"西风带常年吹，年降水两千毫米以上"}],"counter":"同纬度的大陆东岸完全不是这样：中国东北在同纬度是冬冷夏热、降水集中在夏季。所以看到“温带海洋性”，先确认它在不在西岸——这正是现在搜索会把北马里亚纳群岛排进来的原因，而它在西太平洋热带。","next":[{"q":"同纬度东岸为什么冬冷夏热","to":"monsoon-temperate"},{"q":"暖流到底能暖多少","to":"current"}],"cite":"依据：英国／新西兰／智利档案的气候字段；本条同时用于修正一个现存错答（搜“温带海洋性气候”会命中北马里亚纳群岛）。","cat":"世界气候","sections":[{"h":"为什么","p":"常年受西风带控制，海洋暖湿气流被带上岸；冬季有暖流增温，最冷月也不太冷。所以它的两个特征词是“均匀”和“西岸”，缺一个就不成立。"}],"media":{"svg":"oceanic","hint":"温带海洋性气候"},"tags":["温带海洋性","西风","全年湿润","不冻港","西欧"],"quiz":[{"lv":"jr","type":"choice","q":"温带海洋性气候主要分布在","opts":["大陆东岸中纬度","大陆西岸 40°—60°","赤道两侧","极圈以内"],"ans":1,"exp":"它是“西岸气候”：常年受西风带控制、冬季有暖流增温。同纬度的东岸是温带季风或大陆性，不属此类。","diff":1,"tag":["世界气候","温带海洋性气候","概念辨析","季风"]},{"lv":"sr","type":"short","q":"说明温带海洋性气候“只出现在大陆西岸”的原因，并解释同纬度东岸为什么不是这种气候。","ans":"西岸位于西风带迎风侧，海洋暖湿气流被带上岸，冬季受暖流增温，全年温和湿润；东岸风从陆地吹向海洋，水汽来源相反，形成冬冷夏热、降水集中夏季的温带季风或温带大陆性气候。","exp":"关键在“风从海吹向陆”还是“从陆吹向海”，不是纬度本身。","diff":2,"tag":["世界气候","温带海洋性气候","机制分析"]}]},{"id":"zonality","kind":"concept","name":"纬度地带性","alias":["地带性","自然带","纬度地带","zonality"],"level":{"jr":"七年级上 · 自然景观","sr":"必修一 · 地理环境差异性"},"line":"热量随纬度递减，自然带从赤道向两极依次更替：雨林—草原—沙漠—温带—针叶林—苔原。","why":"太阳高度角随纬度变化，是这条规律的总开关。它解释的是“大趋势”，不是每一块地方——所以教材讲完地带性，紧接着就讲非地带性。","mech":"非地带性的三类成因：海陆位置（离海远近）、洋流（寒流降温减湿）、地形（背风坡焚风）。任何一条都能把某个地方从它“该在”的带里拽出来。","anchors":[{"iso":"BR","where":"亚马孙","see":"赤道雨林，全年高温多雨"},{"iso":"AR","where":"潘帕斯","see":"同纬度偏南，草原取代雨林"},{"iso":"CL","where":"火地岛以北","see":"温带针叶与苔原过渡"}],"counter":"南美西岸同纬度是阿塔卡马沙漠——秘鲁寒流降温减湿、副高下沉、又在安第斯背风坡，三个因素叠在一起。说明纬度只是必要条件，不是充分条件。","next":[{"q":"同纬度为什么一边雨林一边沙漠","to":"desert"},{"q":"为什么南美西岸是沙漠","to":"current"}],"cite":"依据：巴西／阿根廷／智利档案的气候与地形字段；非地带性三成因为自然地理通识。","cat":"自然带","sections":[{"h":"为什么","p":"太阳高度角随纬度变化，是这条规律的总开关。它解释的是“大趋势”，不是每一块地方——所以教材讲完地带性，紧接着就讲非地带性。"}],"media":{"svg":"zonality","hint":"纬度地带性"},"tags":["地带性","自然带","纬度","非地带性","沙漠成因"],"quiz":[{"lv":"jr","type":"choice","q":"自然带从赤道向两极依次更替，主导因素是","opts":["热量","水分","地形","洋流"],"ans":0,"exp":"太阳高度随纬度递减，热量是这条规律的总开关；水分更多解释经度方向（沿海到内陆）的差异。","diff":1,"tag":["自然带","纬度地带性","概念辨析"]},{"lv":"sr","type":"short","q":"以阿塔卡马沙漠为例，说明“纬度地带性不是唯一规律”。","ans":"阿塔卡马位于南美西岸，按纬度应属热带或亚热带，但常年受副热带高压控制、沿岸秘鲁寒流降温减湿、又处于安第斯背风坡，三重因素叠加形成世界干极，与同纬度自然带完全不同。这属于非地带性现象。","exp":"要写出三种非地带性成因（环流、洋流、地形），只写“靠海”解释不了它为什么比内陆还干。","diff":2,"tag":["自然带","纬度地带性","机制分析","洋流"]}]},{"id":"diffusion","kind":"concept","name":"文化扩散","alias":["文化传播","文化扩散","diffusion"],"level":{"jr":"七年级上 · 居民与聚落","sr":"必修二 · 人口与文化"},"line":"文化要素会沿着人、货、路移动；落地之后往往被本地条件改写，而不是原样保留。","why":"扩散的通道有三类：迁移（人口带着走）、商贸（货物带着走）、传布（宗教与语言）。改写的原因通常是本地的物产、气候和已有的口味习惯。","mech":"所以“某国文化纯正”几乎不成立：能被追溯来源的要素（作物、宗教、乐器）通常都是扩散来的，本地化的部分才是差异所在。","anchors":[{"iso":"MX","where":"墨西哥","see":"辣椒原产美洲，16 世纪经海路进入中国"},{"iso":"SA","where":"阿拉伯半岛","see":"伊斯兰教沿商路扩散到北非、中亚、东南亚"},{"iso":"IN","where":"印度","see":"印度教与佛教随贸易传向东南亚，吴哥与婆罗浮屠是物证"}],"counter":"扩散不是照搬：辣椒到四川变成麻辣，到泰国变成酸辣，到印度融进咖喱体系——同一种作物，三种完全不同的味型。看文化差异要问“怎么被改写”，不是“从哪来”。","next":[{"q":"辣椒怎么进了川菜","to":"cmp-diet"},{"q":"宗教为什么能传这么远","to":"religion"}],"cite":"依据：墨西哥／沙特／印度档案的文化与饮食字段；辣椒传播路径为公认史实（明代经海路入华）。","cat":"文化","sections":[{"h":"为什么","p":"扩散的通道有三类：迁移（人口带着走）、商贸（货物带着走）、传布（宗教与语言）。改写的原因通常是本地的物产、气候和已有的口味习惯。"}],"media":{"svg":"diffusion","hint":"文化扩散"},"tags":["文化扩散","文化传播","辣椒","宗教传播","移民"],"quiz":[{"lv":"jr","type":"choice","q":"辣椒原产美洲，传入中国后形成的典型味型是","opts":["酸辣","麻辣","咖喱","甜辣"],"ans":1,"exp":"四川把辣椒与花椒结合成麻辣，泰国是酸辣，印度融进咖喱——同一个作物，三种改写。","diff":1,"tag":["文化","文化扩散","概念辨析"]},{"lv":"sr","type":"short","q":"说明文化扩散中“本地化改写”的原因，并举两例。","ans":"原因：本地物产、气候与既有口味会筛选并改造外来要素，扩散不是原样搬运。例：辣椒入川与花椒结合成麻辣；伊斯兰教传入东南亚后与本地习俗融合，形成不同于阿拉伯半岛的实践。","exp":"答题落点要写“条件改写文化”，而不是“文化自己变化”。","diff":2,"tag":["文化","文化扩散","机制分析"]}]},{"id":"oasis","kind":"concept","name":"绿洲农业","alias":["绿洲","灌溉农业","oasis"],"level":{"jr":"七年级下 · 干旱地区","sr":"必修二 · 农业区位"},"line":"干旱区靠河流、地下水或人工灌溉维持的农业；人口沿水线分布，而不是按面积均匀分布。","why":"干旱区的限制因子是水，不是土地。所以聚落与耕地会挤成一条线：埃及 99% 的人口集中在尼罗河两岸和三角洲，占国土面积不到 5%。","mech":"绿洲的规模由水量决定，不由开垦意愿决定；一旦上游取水增加，下游绿洲会整体退化成盐碱地——咸海就是最典型的例子。","anchors":[{"iso":"EG","where":"尼罗河走廊","see":"一条河养活一亿人，两侧就是沙漠"},{"iso":"UZ","where":"阿姆河下游","see":"大规模棉田灌溉，咸海面积萎缩"},{"iso":"LY","where":"利比亚","see":"无常年河，靠地下水管道输水"}],"counter":"同样干旱，没有稳定水源就没有绿洲：利比亚靠人工输水维持，一旦断供就废。所谓“沙漠里的农业”从来不是靠沙漠，是靠别处来的水。","next":[{"q":"埃及人为什么都住在河边","to":"population"},{"q":"滴灌能改变什么","to":"agri-location"}],"cite":"依据：埃及／乌兹别克斯坦／利比亚档案的地形与人口字段；咸海萎缩为公认环境事件。","cat":"农业","sections":[{"h":"为什么","p":"干旱区的限制因子是水，不是土地。所以聚落与耕地会挤成一条线：埃及 99% 的人口集中在尼罗河两岸和三角洲，占国土面积不到 5%。"}],"media":{"svg":"oasis","hint":"绿洲农业"},"tags":["绿洲","灌溉","尼罗河","棉花","滴灌","干旱区农业"],"quiz":[{"lv":"jr","type":"choice","q":"埃及的人口与耕地主要集中在","opts":["沙漠腹地","尼罗河沿岸与三角洲","地中海沿岸","西奈半岛"],"ans":1,"exp":"全国绝大部分是沙漠，只有尼罗河走廊与三角洲有水与冲积土，99% 的人口集中于此。","diff":1,"tag":["农业","绿洲农业","概念辨析"]},{"lv":"sr","type":"short","q":"说明绿洲农业的规模由什么决定，并解释咸海萎缩的原因。","ans":"规模由可用水量决定，不由开垦意愿决定。咸海萎缩：阿姆河、锡尔河上游大规模引水灌溉棉田，入湖水量锐减，湖面缩小、盐度上升，周边土地盐碱化。","exp":"要写出“上游取水增加→入湖减少”这条因果链，只写“气候干旱”不成立。","diff":2,"tag":["农业","绿洲农业","机制分析"]}]},{"id":"cmp-diet","kind":"compare","name":"日本 vs 中国 · 饮食","alias":["日本和中国饮食","中日饮食","日本中国饮食","日本 中国 饮食","日本 vs 中国 饮食","日本vs中国饮食","中日饮食对比","中日饮食差异"],"a":"JP","b":"CN","dim":"饮食","rows":[{"k":"位置","a":"岛国，四面环海","b":"大陆东岸，季风区"},{"k":"气候","a":"温带海洋性向亚热带过渡","b":"南亚热带到中温带，南北跨度大"},{"k":"蛋白来源","a":"海产为主，渔场密集","b":"农牧并重，猪肉与豆制品比重大"},{"k":"主食","a":"米饭为主，配菜量小","b":"南稻北麦，两熟制"},{"k":"加工方式","a":"生食、少油、突出原味","b":"熟食为主，发酵与油脂调味"},{"k":"保存手段","a":"腌渍、风干、冷链","b":"酱、腌、腊、酒糟"}],"why":"岛国加寒暖流交汇，渔获多且抵岸新鲜，生食才成立；大陆季风区以农耕为底，谷物充足但肉少，于是发酵（酱、腌、酒）成了提味与保存的主要手段。差异是条件推出来的，不是口味偏好。","counter":"这不是“日本人爱吃生鱼”的性格差异：内陆国家同样临海也未必生食——生食的门槛是冷链与渔场距离，不是文化性格。","next":[{"q":"日本为什么靠海吃海","to":"current"},{"q":"中国南方为什么吃米","to":"agri-china"}],"cite":"依据：两国档案的饮食、农作物与位置字段；日本 cuisine 维度在现有档案中为空，本条为组内补写，需标注来源后入库。","cat":"文化对比","sections":[{"h":"为什么","p":"岛国加寒暖流交汇，渔获多且抵岸新鲜，生食才成立；大陆季风区以农耕为底，谷物充足但肉少，于是发酵（酱、腌、酒）成了提味与保存的主要手段。差异是条件推出来的，不是口味偏好。"}],"media":{"svg":"cmp-diet","hint":"日本 vs 中国 · 饮食"},"tags":["日本饮食","生食","海产","生鱼片","中日对比","寿司"],"quiz":[{"lv":"jr","type":"choice","q":"日本饮食中海产比重高，最主要的自然原因是","opts":["气候寒冷","岛国、渔场密集","耕地广阔","河流众多"],"ans":1,"exp":"四面环海且寒暖流交汇，渔获多且抵岸新鲜，生食传统才成立。","diff":1,"tag":["文化对比","日本 vs 中国 · 饮食","概念辨析"]},{"lv":"sr","type":"short","q":"从自然条件比较中日两国饮食结构的差异。","ans":"日本：岛国、渔场密集，海产丰富，山地多耕地少，稻米珍贵，形成“米饭 + 海产 + 少油生食”的结构。中国：大陆性季风气候，南北跨度大，南稻北麦，谷物充足而肉少，发展出以发酵与油脂提味的熟食体系。","exp":"两边都要写“条件→结构”，只写吃什么不得分。","diff":2,"tag":["文化对比","日本 vs 中国 · 饮食","机制分析"]}],"level":{"jr":"七年级上 · 居民与聚落","sr":"必修二 · 地域文化"}},{"id":"cmp-fest","kind":"compare","name":"埃及 vs 巴西 · 节日与宗教","alias":["埃及和巴西节日","埃巴节日","埃及巴西宗教","埃及 巴西 节日","埃及 vs 巴西 节日","埃及vs巴西节日","埃巴节日对比"],"a":"EG","b":"BR","dim":"节日","rows":[{"k":"主要宗教","a":"伊斯兰教（逊尼派为主）","b":"天主教为主"},{"k":"最大节日","a":"开斋节、宰牲节","b":"狂欢节、圣诞节"},{"k":"历法基础","a":"伊斯兰历（纯阴历）","b":"公历＋教会历（锚定复活节）"},{"k":"日期是否浮动","a":"每年提前约 11 天","b":"狂欢节随复活节浮动"},{"k":"节日吃什么","a":"开斋节甜点、宰牲节羊肉","b":"狂欢节街头饮食、圣诞火鸡"},{"k":"节日与气候","a":"与季节无关，会在四季中轮转","b":"固定在夏初（南半球初秋）"}],"why":"节日跟着宗教历法走。伊斯兰历一年比公历短约 11 天，所以开斋节在公历上逐年提前，会在四季里轮转；天主教节日锚在阳历与复活节，日期基本固定在季节里。","counter":"把节日当固定日期记，年年都会错：同一个国家，同一个节，今年的日期明年就不一样。这是“文化差异”里最容易被忽略的一层——历法本身不同。","next":[{"q":"为什么伊斯兰节日每年提前","to":"religion"},{"q":"节日为什么会跟着宗教走","to":"diffusion"}],"cite":"依据：两国档案的宗教与节日字段；伊斯兰历与公历的年差为历法常识（约 11 天）。","cat":"文化对比","sections":[{"h":"为什么","p":"节日跟着宗教历法走。伊斯兰历一年比公历短约 11 天，所以开斋节在公历上逐年提前，会在四季里轮转；天主教节日锚在阳历与复活节，日期基本固定在季节里。"}],"media":{"svg":"cmp-fest","hint":"埃及 vs 巴西 · 节日与宗教"},"tags":["开斋节","狂欢节","宗教节日","节日日期","伊斯兰历"],"quiz":[{"lv":"jr","type":"choice","q":"开斋节属于哪个宗教的节日","opts":["基督教","伊斯兰教","佛教","印度教"],"ans":1,"exp":"伊斯兰教两大节日之一（另一为宰牲节），在斋月结束后的第一天。","diff":1,"tag":["文化对比","埃及 vs 巴西 · 节日与宗教","概念辨析"]},{"lv":"sr","type":"short","q":"说明开斋节在公历上的日期为什么每年提前约 11 天。","ans":"伊斯兰历是纯阴历，一年约 354 天，比公历短约 11 天；节日按伊斯兰历固定日期，所以在公历上逐年提前，约 33 年轮转一周，会在四季中变化。巴西的狂欢节则锚定复活节，日期随复活节浮动。","exp":"要点是“历法长度不同”，不是“宗教规定日期变”。","diff":2,"tag":["文化对比","埃及 vs 巴西 · 节日与宗教","机制分析"]}],"level":{"jr":"七年级下 · 地区与国家","sr":"必修二 · 地域文化"}},{"id":"cmp-farm","kind":"compare","name":"法国 vs 中国 · 农业与餐桌","alias":["中法农业","法国中国农业","法国 中国 农业","法国和中国农业","法国 vs 中国 农业","法国vs中国农业","中法农业对比"],"a":"FR","b":"CN","dim":"农业","rows":[{"k":"气候","a":"温带海洋性向地中海过渡","b":"季风为主，雨热同期"},{"k":"降水","a":"全年较均匀，夏不酷热","b":"集中在夏季，年际波动大"},{"k":"主要作物","a":"小麦、葡萄、牧草、乳畜","b":"水稻、小麦、蔬菜、玉米"},{"k":"经营规模","a":"农场面积大，商品率高","b":"户均耕地小，精耕细作"},{"k":"餐桌结构","a":"面包＋乳制品＋葡萄酒","b":"主食＋多菜共享，蔬菜比重大"},{"k":"为什么","a":"降水均匀适合牧草与葡萄","b":"雨热同期适合谷物复种"}],"why":"法国降水均匀、夏季不酷热，牧草和葡萄都能长，于是乳畜与葡萄酒成了产业符号；中国季风区雨热同期，谷物可以一年两熟，但降水波动大，蔬菜与复种成了稳产手段。","counter":"“西方吃面包”是简化：法国南部也吃米（卡马格红米），北部以马铃薯为辅。用一国餐桌代表一整个洲，是地理课最常犯的错。","next":[{"q":"葡萄酒为什么长在西岸","to":"mediterranean"},{"q":"季风区为什么旱涝多","to":"china-climate"}],"cite":"依据：两国档案的农业与气候字段；卡马格红米为法国本地事实，需补入档案后生效。","cat":"农业对比","sections":[{"h":"为什么","p":"法国降水均匀、夏季不酷热，牧草和葡萄都能长，于是乳畜与葡萄酒成了产业符号；中国季风区雨热同期，谷物可以一年两熟，但降水波动大，蔬菜与复种成了稳产手段。"}],"media":{"svg":"cmp-farm","hint":"法国 vs 中国 · 农业与餐桌"},"tags":["法国农业","葡萄酒","乳畜","中法对比","小麦"],"quiz":[{"lv":"jr","type":"choice","q":"法国南部地中海气候区有利于葡萄种植的条件是","opts":["夏季高温多雨","夏季炎热干燥、光照充足","全年低温","降水四季均匀"],"ans":1,"exp":"夏干利于糖分积累、减少病害；冬温湿补足水分。所以葡萄酒产区与地中海气候高度重合。","diff":1,"tag":["农业对比","法国 vs 中国 · 农业与餐桌","概念辨析"]},{"lv":"sr","type":"short","q":"比较法国与中国农业在气候条件与经营方式上的差异。","ans":"气候：法国以温带海洋性为主、南部地中海，降水全年较均匀、夏不酷热；中国以季风为主，雨热同期但年际波动大。经营：法国农场规模大、商品率高、乳畜与葡萄专业化；中国户均耕地小、精耕细作、复种指数高。","exp":"气候与经营要分开写，两边各给一个因果。","diff":2,"tag":["农业对比","法国 vs 中国 · 农业与餐桌","机制分析"]}],"level":{"jr":"八年级上 · 中国的农业","sr":"必修二 · 农业地域"}},{"id":"graticule","kind":"concept","name":"经纬网","cat":"地球与地图","alias":["经纬度","经纬线","经线纬线","坐标"],"level":{"jr":"七年级上 · 地球和地图","sr":"必修一 · 地球运动"},"line":"用纬线和经线把地表切成网格，任何一点都能用一对数字定位。","why":"纬线指示南北，0° 是赤道，向两极各 90°；经线指示东西，0° 是本初子午线，向东向西各 180°。纬度决定太阳高度，经度决定时差。","sections":[{"h":"怎么读一个坐标","p":"先说纬度再说经度：北纬记 N、南纬记 S、东经记 E、西经记 W。纬度看南北半球，经度看东西半球——20°W 与 160°E 是东西半球的分界，不是 0° 和 180°。"},{"h":"为什么它是地基","p":"同一纬度太阳高度相近，所以自然带沿纬向排布；同一经度地方时相近，所以时区沿经向划分。后面讲气候和时区，全靠这张网。"}],"anchors":[{"iso":"EC","where":"厄瓜多尔","see":"赤道穿国而过，国名就是“赤道”"},{"iso":"KE","where":"肯尼亚","see":"赤道横穿中部，南北方季节相反"},{"iso":"GB","where":"格林尼治","see":"本初子午线起点，0° 经线所在地"}],"counter":"经纬网是角度不是距离：纬度 1° 永远是 111 公里，经度 1° 在赤道是 111 公里、到了两极变成 0。所以极地地图上经线会挤在一起。","media":{"svg":"graticule","hint":"经纬网展开动画：球面网格 → 平面方格纸"},"next":[{"q":"同一条经线上的人为什么同时看到日出","to":"rotation"},{"q":"为什么跨过太平洋要改日期","to":"timezone"}],"cite":"依据：地球坐标常识；格林尼治天文台位于英国伦敦。","tags":["经度","纬度","赤道","本初子午线","坐标定位","东西半球"],"quiz":[{"lv":"jr","type":"choice","q":"经线指示的方向是","opts":["东西方向","南北方向","东北方向","没有固定方向"],"ans":1,"exp":"纬线指示东西，经线指示南北；两条线在极点汇合。","diff":1,"tag":["地球与地图","经纬网","概念辨析"]},{"lv":"sr","type":"short","q":"说明纬度 1° 与经度 1° 的长度差异及其原因。","ans":"纬度 1° 在任何地方都约 111 千米；经度 1° 的长度随纬度升高而缩短，赤道处约 111 千米，到两极缩为 0。原因是经线向两极汇聚，同样的角度对应的实际弧长变短。","exp":"这是“角度不是距离”的直接应用，也是极地地图上经线挤在一起的原因。","diff":2,"tag":["地球与地图","经纬网","机制分析"]}]},{"id":"rotation","kind":"concept","name":"地球自转","cat":"地球运动","alias":["自转","昼夜交替","时差"],"level":{"jr":"七年级上 · 地球的运动","sr":"必修一 · 地球自转的地理意义"},"line":"地球绕地轴自西向东转，一圈约 24 小时，带来昼夜交替与时差。","why":"自西向东转，所以东边先看到日出；经度每差 15°，地方时差 1 小时。恒星日 23 小时 56 分 4 秒，太阳日才是 24 小时。","sections":[{"h":"昼夜交替不是自转“造成白天”","p":"地球不透明、太阳只照亮一半，昼夜本来就有；自转只是让晨昏线扫过地面，于是有了交替。晨昏线在图上永远与太阳光线垂直。"},{"h":"时差怎么算","p":"东加西减：往东走经度每 15° 加 1 小时。跨过 180° 日界线要改日期——向东减一天，向西加一天。"}],"anchors":[{"iso":"CN","where":"中国","see":"东西跨 5 个时区，却统一用东八区"},{"iso":"US","where":"美国","see":"本土四个时区，横穿一次要改四次表"},{"iso":"RU","where":"俄罗斯","see":"跨 11 个时区，是全球时区最多的国家"}],"counter":"时区是人为划的，不等于太阳：中国统一用北京时间，可喀什的日出比北京晚约两小时。手表时间与天亮时间不是一回事。","media":{"svg":"rotation","hint":"晨昏线与自转方向"},"next":[{"q":"为什么新疆十点才上班","to":"timezone"},{"q":"为什么会有昼夜长短的变化","to":"revolution"}],"cite":"依据：自转与时区常识；中国统一东八区、俄罗斯跨 11 时区为公认事实。","tags":["自转","昼夜","时差","晨昏线","东八区","地方时"],"quiz":[{"lv":"jr","type":"choice","q":"地球自转产生的地理现象是","opts":["四季更替","昼夜交替","五带划分","极昼极夜"],"ans":1,"exp":"四季与五带来自公转与地轴倾斜，昼夜交替来自自转。","diff":1,"tag":["地球运动","地球自转","概念辨析"]},{"lv":"sr","type":"short","q":"说明地方时与经度的关系，并计算东八区比中时区早多少小时。","ans":"经度每相差 15°，地方时相差 1 小时，东边时刻早。东八区中央经线为 120°E，中时区为 0°，相差 120°，故东八区比中时区早 8 小时。","exp":"“早”指时刻数值大，不是“先过一天”，两者别混。","diff":2,"tag":["地球运动","地球自转","机制分析","时区"]}]},{"id":"revolution","kind":"concept","name":"公转与四季","cat":"地球运动","alias":["公转","四季","黄赤交角","回归线"],"level":{"jr":"七年级上 · 地球的运动","sr":"必修一 · 地球公转"},"line":"地球绕日公转、地轴倾斜 23°26′，使太阳直射点在南北回归线之间往返，于是有了四季与五带。","why":"关键在倾角：地轴若垂直于公转轨道面，就不会有四季。倾斜让南北半球轮流正对太阳，直射点因此南北移动。","sections":[{"h":"四个节点","p":"春分、秋分直射赤道，全球昼夜等长；夏至直射北回归线，北半球昼最长；冬至直射南回归线，北半球昼最短。"},{"h":"极昼极夜","p":"极圈以内，一年中至少有一天太阳不落或不出。纬度越高，极昼极夜持续越久，极点各半年。"}],"anchors":[{"iso":"CN","where":"中国","see":"夏至白昼最长，冬至最短"},{"iso":"AU","where":"澳大利亚","see":"南半球，季节与北半球正好相反"},{"iso":"NO","where":"挪威","see":"北极圈内，夏季有极昼"}],"counter":"“夏天热是因为离太阳近”是错的：北半球夏季地球反而接近远日点。决定季节的是太阳高度与昼长，不是日地距离。","media":{"svg":"revolution","img":"earth-seasons","hint":"公转轨道与四个节气"},"next":[{"q":"为什么北极圈里夏天太阳不落","to":"polar"},{"q":"热带和寒带的界线是怎么定的","to":"zones"}],"cite":"依据：地球运动常识；远日点在 7 月初为天文事实。","tags":["公转","四季","直射点","回归线","极昼极夜","黄赤交角"],"quiz":[{"lv":"jr","type":"choice","q":"我国夏至日，太阳直射点位于","opts":["赤道","北回归线","南回归线","北极圈"],"ans":1,"exp":"夏至直射北回归线，北半球昼最长；冬至直射南回归线。","diff":1,"tag":["地球运动","公转与四季","概念辨析"]},{"lv":"sr","type":"short","q":"说明地轴倾斜对四季形成的意义；若地轴不倾斜，会怎样？","ans":"地轴倾斜使太阳直射点在南北回归线之间往返移动，各地太阳高度与昼长随之变化，形成四季与五带。若地轴垂直于公转轨道面，直射点永在赤道，全球昼夜等长、无四季更替。","exp":"“倾斜”是四季的必要条件，不是“离太阳远近”。","diff":2,"tag":["地球运动","公转与四季","机制分析"]}]},{"id":"zones","kind":"concept","name":"五带划分","cat":"地球运动","alias":["五带","热带","温带","寒带"],"level":{"jr":"七年级上 · 地球的运动","sr":"必修一 · 地球运动的意义"},"line":"按有无太阳直射、有无极昼极夜，地表分成热带、南北温带、南北寒带。","why":"界线是回归线与极圈：回归线之间一年有直射，极圈以内有极昼极夜，两者之间既无直射也无极昼极夜。","sections":[{"h":"五带是热量带","p":"它只回答“一年得到多少太阳热量”，不回答下不下雨。所以五带不是气候类型，两套体系不能互换。"},{"h":"为什么还要学气候类型","p":"热量只是底子，降水由环流、海陆位置、地形决定。同一带里可以有雨林，也可以有沙漠。"}],"anchors":[{"iso":"SG","where":"新加坡","see":"近赤道，热带，终年高温"},{"iso":"GB","where":"英国","see":"北温带，四季分明但温差不大"},{"iso":"IS","where":"冰岛","see":"紧贴北极圈，已属寒带边缘"}],"counter":"撒哈拉与亚马孙都在热带，一个沙漠一个雨林。用五带解释降水，必错。","media":{"svg":"zones","hint":"回归线与极圈：五带的界线"},"next":[{"q":"为什么同是热带却有沙漠和雨林","to":"desert"},{"q":"温带里为什么还有沙漠","to":"continental"}],"cite":"依据：五带划分常识；三国纬度见档案坐标字段。","tags":["五带","热带","温带","寒带","极圈","热量带"],"quiz":[{"lv":"jr","type":"choice","q":"五带划分的依据是","opts":["降水量多少","有无太阳直射与极昼极夜","距海远近","海拔高低"],"ans":1,"exp":"界线是回归线（有无直射）与极圈（有无极昼极夜），本质是按热量划分。","diff":1,"tag":["地球运动","五带划分","概念辨析"]},{"lv":"sr","type":"short","q":"说明五带与气候类型为什么不能互相替代，并举例。","ans":"五带只反映热量条件，气候类型还要看降水，由环流、海陆位置、地形共同决定。例：撒哈拉与亚马孙同属热带，一个是热带沙漠气候，一个是热带雨林气候。","exp":"两套体系回答不同问题：五带答“热不热”，气候类型答“热不热 + 湿不湿”。","diff":2,"tag":["地球运动","五带划分","机制分析"]}]},{"id":"contour","kind":"concept","name":"等高线地形图","cat":"地图","alias":["等高线","地形图","海拔"],"level":{"jr":"七年级上 · 地图的阅读","sr":"必修一 · 地形剖面"},"line":"把海拔相同的点连成线，就能在平面上读出地形的起伏。","why":"线密代表坡陡，线疏代表坡缓；闭合小圈是山顶或洼地；等高线向高处凸是山谷，向低处凸是山脊。","sections":[{"h":"四句话判读","p":"密陡疏缓、闭合为顶（或洼）、凸高为谷、凸低为脊。河流一定画在山谷里，不会出现在山脊上——这是最快的验算方法。"},{"h":"等高线不是高度图","p":"它只画等高，不画地表覆盖。两条线之间的高度靠插值估计，不是“线上一个高度、线外另一个高度”。"}],"anchors":[{"iso":"NP","where":"尼泊尔","see":"喜马拉雅南坡，等高线密到几乎并成一条"},{"iso":"CH","where":"瑞士","see":"阿尔卑斯山区，铁路全靠展线爬坡"},{"iso":"NL","where":"荷兰","see":"大片土地低于海平面，等高线是负值"}],"counter":"等高线“凸向”容易记反：凸向高处是山谷（水往低处流，谷底低），凸向低处是山脊。记不住就想“水往哪流”。","media":{"svg":"contour","img":"contour-map","hint":"等高线的疏密与坡度"},"next":[{"q":"地图上的比例尺怎么用","to":"scale-legend"},{"q":"峡谷是怎么被水切出来的","to":"exogenic"}],"cite":"依据：等高线判读常识；荷兰低地低于海平面为公认事实。","tags":["等高线","海拔","山脊","山谷","陡坡","地形图"],"quiz":[{"lv":"jr","type":"choice","q":"等高线密集的地方表示","opts":["坡度较缓","坡度较陡","一定是山谷","一定是山顶"],"ans":1,"exp":"等高线越密，同样水平距离内高差越大，坡越陡。","diff":1,"tag":["地图","等高线地形图","概念辨析"]},{"lv":"sr","type":"short","q":"判读等高线地形图时，如何区分山脊与山谷？河流一般发育在哪里？","ans":"等高线凸向低处为山脊（脊线比两侧高），凸向高处为山谷（谷线比两侧低）；河流发育在山谷，因为水往低处汇集。","exp":"记不住就记“水往哪流”：山谷能汇水，山脊是分水岭。","diff":2,"tag":["地图","等高线地形图","机制分析"]}]},{"id":"rainforest","kind":"concept","name":"热带雨林气候","cat":"世界气候","alias":["热带雨林","雨林","雨林气候","赤道气候"],"level":{"jr":"七年级上 · 世界的气候","sr":"必修一 · 气候类型"},"line":"全年高温多雨、没有明显干季，分布在赤道两侧。","why":"终年受赤道低气压带控制，空气上升，对流雨几乎每天下午来一场；年降水 2000 毫米以上，温差比日温差还小。","sections":[{"h":"为什么下午总下雨","p":"上午太阳把地面晒热，湿热空气上升凝结，午后形成对流雨。所以雨林地区的“天气预报”几乎不用改：晴—雨—晴。"},{"h":"土壤其实很瘦","p":"高温高湿让有机质迅速分解并被雨水淋走，养分主要锁在植被里。雨林被砍后地力掉得极快，这就是“烧荒—耕作—弃耕”轮转的原因。"}],"anchors":[{"iso":"BR","where":"亚马孙","see":"全球最大雨林，被称为“地球之肺”"},{"iso":"ID","where":"印度尼西亚","see":"赤道横穿，各岛普遍湿热"},{"iso":"CD","where":"刚果（金）","see":"刚果盆地，非洲最大雨林"}],"counter":"雨林土壤并不肥沃：养分在植物体内而不在土里。所以“砍了树种庄稼”通常只能撑几年。","media":{"svg":"rainforest","hint":"日降水循环动画：蒸发—凝结—午后暴雨"},"next":[{"q":"雨林的土为什么这么瘦","to":"soil"},{"q":"雨林旁边为什么是草原","to":"savanna"}],"cite":"依据：气候学常识；三国位置见档案坐标。","tags":["雨林","赤道多雨","亚马孙","刚果盆地","对流雨","全年高温"],"quiz":[{"lv":"jr","type":"choice","q":"热带雨林地区土壤肥力普遍较低，主要原因是","opts":["降水太少","气温太低","有机质分解快、雨水淋溶强","植被过于稀少"],"ans":2,"exp":"养分主要储存在植物体内而不是土壤里，所以“植被茂密”与“土壤贫瘠”同时成立。","diff":1,"tag":["世界气候","热带雨林气候","概念辨析","土壤"]},{"lv":"sr","type":"short","q":"说明雨林地区“植被茂密但土壤贫瘠”的原因，并指出对农业的影响。","ans":"① 高温高湿使有机质迅速分解；② 降水多、淋溶强，养分被带走；③ 养分主要保存在植被体内。影响：砍伐后地力迅速下降，只能“烧荒—耕作—弃耕”轮转，难以持续耕作。","exp":"影响部分要写“不可持续”，否则只答了成因而没答影响。","diff":3,"tag":["世界气候","热带雨林气候","机制分析","土壤"]}]},{"id":"mediterranean","kind":"concept","name":"地中海气候","cat":"世界气候","alias":["地中海式气候","夏干冬雨"],"level":{"jr":"七年级上 · 世界的气候","sr":"必修一 · 气候类型"},"line":"夏季炎热干燥、冬季温和多雨，只出现在南北纬 30°–40° 的大陆西岸。","why":"夏天副热带高压压在这里，下沉气流不让成云；冬天西风带南移，把海洋水汽带进来。所以雨热不同期。","sections":[{"h":"一句话判读","p":"只看“夏干冬雨”。全世界只有这一种气候是雨热不同期，记住这一条就不会认错。"},{"h":"为什么适合葡萄和橄榄","p":"夏季干热利于糖分积累、减少病害；冬季温和多雨刚好补足水分。所以葡萄酒产区与地中海气候高度重合。"}],"anchors":[{"iso":"IT","where":"意大利","see":"典型地中海气候，橄榄与葡萄遍野"},{"iso":"ES","where":"西班牙","see":"中南部夏干，北部偏海洋性"},{"iso":"CL","where":"智利中部","see":"南半球同纬度西岸，同样夏干冬雨"}],"counter":"它和温带海洋性气候同在西岸，差别在纬度与环流：温海全年吃西风，地中海夏天被副高按住。一个全年湿，一个夏天干。","media":{"img":"climate-barcelona","hint":"副高与西风带季节移动对比动画"},"next":[{"q":"为什么地中海气候适合种葡萄","to":"agri-location"},{"q":"同纬度的西岸另一种气候是什么","to":"oceanic"}],"cite":"依据：气候类型常识；智利中部为南半球地中海气候的典型区。","tags":["地中海","夏干冬雨","葡萄","橄榄","雨热不同期"],"quiz":[{"lv":"jr","type":"choice","q":"地中海气候的降水特点是","opts":["夏雨冬干","夏干冬雨","全年多雨","全年少雨"],"ans":1,"exp":"全世界只有这一种气候是“雨热不同期”，记住这一条就不会认错。","diff":1,"tag":["世界气候","地中海气候","概念辨析"]},{"lv":"sr","type":"short","q":"从气压带、风带的季节移动解释地中海气候夏干冬雨的原因。","ans":"夏季气压带风带北移，该地受副热带高压控制，下沉气流抑制成云致雨；冬季气压带风带南移，该地受西风带影响，海洋水汽被带上岸形成降水。","exp":"关键是“同一地点一年内先后被两个环流控制”，不是两个地方。","diff":2,"tag":["世界气候","地中海气候","机制分析","气压带"]}]},{"id":"continental","kind":"concept","name":"温带大陆性气候","cat":"世界气候","alias":["大陆性气候","温带大陆气候"],"level":{"jr":"七年级上 · 世界的气候","sr":"必修一 · 气候类型"},"line":"冬冷夏热、年温差大、降水少且集中在夏季，出现在大陆内部。","why":"离海远，水汽到不了；陆地比热小，白天升温快、夜里降温也快。所以年温差与日温差都大。","sections":[{"h":"典型表现","p":"最冷月可到 −20℃ 以下，最热月又能上 25℃；降水 200–400 毫米，七八月占一大半。"},{"h":"为什么同纬度差别这么大","p":"同纬度的西岸是温带海洋性、东岸是温带季风、内陆是温带大陆性。“温带”分三种，分的是海陆位置，不是温度。"}],"anchors":[{"iso":"MN","where":"蒙古","see":"深居内陆，冬季严寒、降水稀少"},{"iso":"KZ","where":"哈萨克斯坦","see":"世界最大内陆国，典型大陆性"},{"iso":"RU","where":"俄罗斯","see":"西伯利亚冬季极冷，年温差全球最大之一"}],"counter":"“降水少”不等于“干旱”：温带大陆性气候下仍有草原，干旱区是另一套判据（蒸发量远大于降水量）。","media":{"svg":"continental","hint":"温带大陆性气候"},"next":[{"q":"为什么西伯利亚比西欧冷这么多","to":"oceanic"},{"q":"大陆性气候和温带季风差在哪","to":"monsoon-temperate"}],"cite":"依据：气候类型常识；哈萨克斯坦为内陆国、蒙古深居内陆均为事实。","tags":["大陆性","年温差大","内陆","西伯利亚","干旱少雨"],"quiz":[{"lv":"jr","type":"choice","q":"温带大陆性气候的典型特征是","opts":["全年温和湿润","冬冷夏热、年温差大","夏干冬雨","全年高温多雨"],"ans":1,"exp":"远离海洋、下垫面比热小，升降温都快；降水少且集中夏季。","diff":1,"tag":["世界气候","温带大陆性气候","概念辨析"]},{"lv":"sr","type":"short","q":"从海陆位置与下垫面性质解释温带大陆性气候年温差大的原因。","ans":"深居内陆，海洋水汽难以到达，降水少、云量少；陆地比热容小，白天升温快、夜间降温快，且缺少海洋调节，冬季受冷高压控制严寒、夏季升温迅速，故年较差与日较差都大。","exp":"两个得分点：水汽到不了（降水少）、陆地比热小（温差大）。","diff":2,"tag":["世界气候","温带大陆性气候","机制分析"]}]},{"id":"population","kind":"concept","name":"人口分布","cat":"居民与聚落","alias":["人口密度","人口分布不均"],"level":{"jr":"七年级上 · 人口与人种","sr":"必修二 · 人口分布"},"line":"人口集中在沿海、平原与河流沿岸；干旱、高寒、湿热雨林区人口稀少。","why":"水、热量、地形、土壤四个条件同时合适，才聚得住人。缺一个就成了“空白区”，而空白区往往最能说明限制因子是什么。","sections":[{"h":"先看空白","p":"读密度图别只看密集区。撒哈拉、青藏、亚马孙、西伯利亚四块空白，正好对应干旱、高寒、湿热、严寒四种限制。"},{"h":"密度是平均数","p":"全国密度会把沙漠与绿洲平均掉。埃及全国约 100 人/km²，去掉沙漠后沿河实际超过 1000——所以看密度要配合分布图。"}],"anchors":[{"iso":"EG","where":"埃及","see":"99% 的人口挤在尼罗河两岸和三角洲"},{"iso":"IN","where":"印度","see":"恒河平原是全球人口最密的大片区域之一"},{"iso":"CA","where":"加拿大","see":"国土世界第二，北部几乎无人"}],"counter":"人口多不等于密度高：加拿大面积比中国大，人口只有三千多万；孟加拉国面积不到中国 1/60，人口过亿。","media":{"svg":"population","hint":"夜间灯光图与人口密度图叠加"},"next":[{"q":"为什么人都挤在沿海和平原","to":"settlement"},{"q":"中国人口为什么东密西疏","to":"china-population"}],"cite":"依据：各国档案的人口与地形字段；埃及人口集中于尼罗河走廊为公认事实。","tags":["人口密度","人口分布","胡焕庸线","沿海","人口集中"],"quiz":[{"lv":"jr","type":"choice","q":"世界人口稠密区主要分布在","opts":["高山地区","中低纬度沿海平原","沙漠地区","热带雨林地区"],"ans":1,"exp":"水、热量、地形、土壤四项条件同时好的地方才聚得住人。","diff":1,"tag":["居民与聚落","人口分布","概念辨析","土壤"]},{"lv":"sr","type":"short","q":"说明埃及人口分布的特点及其自然原因。","ans":"特点：约 99% 的人口集中在尼罗河沿岸和三角洲，国土其余部分几乎无人。原因：全国绝大部分为热带沙漠气候，干旱缺水；尼罗河提供水源、灌溉与肥沃冲积土，形成狭长绿洲带。","exp":"要写出“气候干旱”这个限制因子，只写“沿河”没有解释力。","diff":2,"tag":["居民与聚落","人口分布","机制分析"]}]},{"id":"china-relief","kind":"concept","name":"中国地形三级阶梯","cat":"中国地理","alias":["三级阶梯","中国地势","西高东低"],"level":{"jr":"八年级上 · 中国的地形","sr":"必修一 · 中国地形"},"line":"中国地势西高东低，呈三级阶梯下降，所以大河多向东流。","why":"第一级青藏高原平均 4000 米以上，第二级高原盆地 1000–2000 米，第三级东部平原丘陵 500 米以下。阶梯交界处落差大。","sections":[{"h":"影响一：河流","p":"西高东低决定了长江黄河自西向东流，也决定了阶梯交界处水能集中——大型水电站基本都卡在这两条界线上。"},{"h":"影响二：气候与人口","p":"西高东低让夏季风能深入内陆，但被青藏高原与第二级台阶挡了一部分；人口与耕地也主要落在第三级。"}],"anchors":[{"iso":"CN","where":"青藏高原（第一级）","see":"平均 4000 米以上，长江黄河的发源地"},{"iso":"CN","where":"黄土高原（第二级）","see":"1000–2000 米，水土流失最严重的区域"},{"iso":"CN","where":"长江中下游平原（第三级）","see":"500 米以下，人口与耕地最集中"}],"counter":"三级阶梯不是三条直线：界线是山脉（昆仑山—祁连山—横断山，大兴安岭—太行山—巫山—雪峰山），山脉走向决定了阶梯边界是弯的。","media":{"svg":"china-relief","hint":"中国地形剖面动画：沿北纬 32° 从青藏到东海","img":"china-relief"},"next":[{"q":"长江黄河为什么都向东流","to":"rivers"},{"q":"为什么夏季风到不了西北","to":"china-climate"}],"cite":"依据：中国地形常识；三级阶梯界线为教材通行表述，未引用原文。","tags":["三级阶梯","西高东低","青藏高原","地势","水能"],"quiz":[{"lv":"jr","type":"choice","q":"我国地势的总特征是","opts":["东高西低","西高东低、呈三级阶梯","南高北低","四周高、中间低"],"ans":1,"exp":"三级阶梯是“西高东低”的具体化，界线是山脉而不是直线。","diff":1,"tag":["中国地理","中国地形三级阶梯","概念辨析"]},{"lv":"sr","type":"short","q":"说明我国地势对河流流向与水能分布的影响。","ans":"① 西高东低决定大河自西向东流，沟通东西；② 阶梯交界处落差大，水能集中，大型水电站多分布在这些河段。","exp":"两句话对应两个得分点：流向由“西高东低”决定，水能由“阶梯交界落差”决定。","diff":2,"tag":["中国地理","中国地形三级阶梯","机制分析"]}]},{"id":"heating","kind":"concept","name":"大气受热过程","cat":"大气","alias":["受热过程","大气受热","温室效应","地面辐射"],"level":{"jr":"七年级上 · 气温","sr":"必修一 · 大气受热过程"},"line":"太阳短波辐射穿过大气到达地面，地面升温后再以长波辐射加热大气——近地面气温由地面决定。","why":"大气对太阳短波辐射吸收很少（几乎“透明”），真正吸收的是地面发出的长波辐射。所以“太阳晒热空气”是错觉，顺序是：太阳晒地、地暖空气。","sections":[{"h":"三步链条","p":"太阳辐射 → 地面吸收升温 → 地面长波辐射 → 大气中的水汽与二氧化碳吸收。任何一步被改动，气温就变。"},{"h":"两个常见应用","p":"晴天昼夜温差大：云少，白天太阳直射强、夜里地面散热快。温室大棚与全球变暖：都是“让长波辐射出不去”。"}],"anchors":[{"iso":"EG","where":"埃及","see":"沙漠晴天多，昼夜温差可到 20℃"},{"iso":"BO","where":"玻利维亚","see":"高原空气稀薄，紫外线强、夜间骤冷"},{"iso":"GB","where":"英国","see":"多云多雨，昼夜温差小"}],"counter":"“大气被太阳直接晒热”是错的：如果真是这样，越高的地方应该越热，可实际每上升 100 米气温降约 0.6℃。","media":{"svg":"heating","hint":"短波/长波辐射流程图，可拖动云量滑块看温差"},"next":[{"q":"为什么晴天昼夜温差大","to":"cyclone"},{"q":"为什么沙漠白天烫晚上冷","to":"desert"}],"cite":"依据：大气受热过程常识；气温垂直递减率约 0.6℃/100m 为通行数值。","tags":["大气受热","温室效应","地面辐射","昼夜温差","保温作用"],"quiz":[{"lv":"jr","type":"choice","q":"近地面大气的主要直接热源是","opts":["太阳辐射","地面辐射","大气逆辐射","宇宙射线"],"ans":1,"exp":"大气对太阳短波辐射吸收很少，真正吸收的是地面长波辐射，所以“太阳晒地、地暖空气”。","diff":1,"tag":["大气","大气受热过程","概念辨析"]},{"lv":"sr","type":"short","q":"用大气受热过程解释“晴天昼夜温差大”。","ans":"晴天云量少：白天大气对太阳辐射削弱弱，到达地面的太阳辐射强、气温高；夜晚云少则大气逆辐射弱，保温作用差，地面散热快、气温低。两者叠加使昼夜温差大。","exp":"要同时写“白天削弱弱”和“夜晚保温差”，只写一头只能得一半分。","diff":2,"tag":["大气","大气受热过程","机制分析","昼夜温差"]}]},{"id":"thermal","kind":"concept","name":"热力环流","cat":"大气","alias":["热力环流","海陆风","城市热岛"],"level":{"jr":"七年级上 · 风","sr":"必修一 · 热力环流"},"line":"地面冷热不均→空气上升下沉→同一水平面出现气压差→空气水平流动，形成环流。","why":"顺序不能倒：先有垂直运动，才有水平气压差，才有风。近地面与高空的低压高压正好相反。","sections":[{"h":"两个必考例子","p":"海陆风：白天陆地升温快，风从海洋吹向陆地（海风）；夜里反过来（陆风）。城市热岛：市中心热，风从郊区吹向中心。"},{"h":"风为什么不直吹","p":"水平气压梯度力只是起点，还要受地转偏向力与摩擦力影响，所以实际风向与等压线有夹角，不会垂直吹过去。"}],"anchors":[{"iso":"CN","where":"中国","see":"大城市热岛环流，郊区风往市中心吹"},{"iso":"JP","where":"日本","see":"沿海海陆风明显，渔民按风出海"},{"iso":"SG","where":"新加坡","see":"海风调节，午后常有对流雨"}],"counter":"“风从高压吹向低压”只说了一半：它解释的是初始方向，实际风向还要被地转偏向力掰一个角度。","media":{"svg":"thermal","hint":"海陆风昼夜切换动画（可拖动时间）"},"next":[{"q":"海风为什么白天从海上吹来","to":"monsoon"},{"q":"城市热岛的风往哪吹","to":"urbanization"}],"cite":"依据：热力环流常识；热岛环流为城市气候学通行结论。","tags":["热力环流","海陆风","城市热岛","山谷风"],"quiz":[{"lv":"jr","type":"choice","q":"白天，海陆之间近地面的风向一般是","opts":["由陆地吹向海洋","由海洋吹向陆地","无风","上下对流"],"ans":1,"exp":"白天陆地升温快、气压低，风从海洋吹向陆地，称为海风。","diff":1,"tag":["大气","热力环流","概念辨析"]},{"lv":"sr","type":"short","q":"说明城市热岛环流的形成过程，并提出两条缓解措施。","ans":"过程：市区人为热排放多、地面硬化、绿地少 → 气温高于郊区 → 空气上升 → 近地面气压降低 → 近地面风由郊区吹向市区，高空相反。措施：增加绿地与水体、预留通风廊道、工业与人口分散布局。","exp":"过程要写出“垂直上升→水平气压差→近地面风”，顺序倒了就说不通。","diff":2,"tag":["大气","热力环流","机制分析"]}]},{"id":"pressure-belts","kind":"concept","name":"气压带与风带","cat":"大气","alias":["三圈环流","气压带","风带","副热带高压"],"level":{"jr":"七年级上 · 气候成因","sr":"必修一 · 气压带和风带"},"line":"全球有七个气压带、六个风带，随太阳直射点南北移动，是气候类型分布的骨架。","why":"赤道低压上升多雨，副热带高压下沉干燥，副极地低压多锋面雨，极地高压冷而干。风从高压吹向低压，被地转偏向力偏成信风、西风、极地东风。","sections":[{"h":"一条记忆线索","p":"低压带＝上升＝多雨，高压带＝下沉＝干燥。所以赤道多雨、副高带多沙漠（撒哈拉、阿拉伯、澳大利亚中部都在 30° 附近）。"},{"h":"季节性移动","p":"夏季北移、冬季南移，幅度约 5°–10°。季风与地中海气候都是“带子挪动了”的结果，不是新机制。"}],"anchors":[{"iso":"ID","where":"印度尼西亚","see":"赤道低压带控制，全年多雨"},{"iso":"EG","where":"埃及","see":"副高带控制，撒哈拉几乎无雨"},{"iso":"GB","where":"英国","see":"西风带控制，全年湿润"}],"counter":"气压带不是固定在地图上的带子：同一地方一年里可能先后被两个带控制，这正是季风气候与地中海气候的成因。","media":{"svg":"pressure-belts","hint":"气压带风带随季节南北移动的动画"},"next":[{"q":"副高为什么让长江中下游伏旱","to":"cyclone"},{"q":"地中海气候的夏干是谁造成的","to":"mediterranean"}],"cite":"依据：三圈环流与气压带常识；副高带与 30° 沙漠带对应为通行结论。","tags":["气压带","风带","副热带高压","信风","西风带","三圈环流"],"quiz":[{"lv":"jr","type":"choice","q":"常年受副热带高压控制地区的气候特征通常是","opts":["阴雨连绵","晴朗干燥","大风多雨","暴雨频发"],"ans":1,"exp":"副高是下沉气流，抑制成云致雨，所以 30° 附近多沙漠。","diff":1,"tag":["大气","气压带与风带","概念辨析"]},{"lv":"sr","type":"short","q":"气压带风带的季节移动，如何造成地中海气候与季风气候的差异？","ans":"地中海气候：同一地点一年内先后受副高（夏）与西风带（冬）控制，形成夏干冬雨。季风气候：主因是海陆热力差异造成的风向季节反转，气压带风带移动是叠加因素，形成雨热同期。","exp":"关键区别：一个靠“带子南北移动”，一个靠“海陆热力差”，成因不同。","diff":2,"tag":["大气","气压带与风带","机制分析","季风"]}]},{"id":"fronts","kind":"concept","name":"锋面系统","cat":"天气","alias":["冷锋","暖锋","锋面","梅雨"],"level":{"jr":"七年级上 · 天气","sr":"必修一 · 常见天气系统"},"line":"冷暖气团相遇形成锋面；冷锋雨在锋后、暖锋雨在锋前，过境后天气都会转好。","why":"冷锋是冷气团主动推，来得急、雨区窄、常伴大风降温；暖锋是暖气团主动爬升，来得缓、雨区宽、多连续性降水。","sections":[{"h":"判读口诀","p":"过境前：暖（冷锋）或冷（暖锋）；过境时：暴雨大风或连绵细雨；过境后：气温气压反向变化、天气转晴。"},{"h":"我国的例子","p":"冬季寒潮是冷锋，夏季江淮梅雨是准静止锋（冷暖势均力敌，雨带停在那儿一个月）。"}],"anchors":[{"iso":"CN","where":"中国","see":"冬季寒潮是冷锋南下，夏季梅雨是准静止锋"},{"iso":"GB","where":"英国","see":"暖锋过境频繁，阴雨连绵是常态"},{"iso":"JP","where":"日本","see":"梅雨锋（Baiu）自南向北推进"}],"counter":"“下雨就是锋面雨”不成立：对流雨（雨林午后）、地形雨（迎风坡）、台风雨都不是锋面雨。四种成因要能分开。","media":{"svg":"fronts","img":"cold-warm-fronts","hint":"冷锋与暖锋的雨区"},"next":[{"q":"台风和锋面雨有什么不一样","to":"cyclone"},{"q":"为什么雨带会一路往北推","to":"china-climate"}],"cite":"依据：天气系统常识；梅雨为准静止锋、寒潮为冷锋均为通行表述。","tags":["锋面","冷锋","暖锋","梅雨","寒潮","降温"],"quiz":[{"lv":"jr","type":"choice","q":"冷锋过境后，当地气温和气压的变化通常是","opts":["气温升高、气压降低","气温降低、气压升高","气温气压都升高","气温气压都降低"],"ans":1,"exp":"冷气团取代暖气团，气温下降；冷空气密度大，气压上升，天气转晴。","diff":1,"tag":["天气","锋面系统","概念辨析"]},{"lv":"sr","type":"short","q":"比较冷锋与暖锋在降水位置和天气特征上的差异。","ans":"冷锋：冷气团主动推进，雨区在锋后，降水强度大、时间短，常伴大风、降温。暖锋：暖气团主动爬升，雨区在锋前，降水强度小、时间长，多为连续性降水。","exp":"“雨在锋前还是锋后”是最容易记反的一处，用“谁主动、谁被抬”来推。","diff":2,"tag":["天气","锋面系统","机制分析"]}]},{"id":"water-cycle","kind":"concept","name":"水循环","cat":"水","alias":["水循环","径流","海陆间循环"],"level":{"jr":"七年级上 · 水与生命","sr":"必修一 · 水循环"},"line":"蒸发、水汽输送、降水、径流、下渗五个环节，把海洋与陆地的水连起来。","why":"海陆间循环最重要，因为它把海水变成陆地可用的淡水；陆地内循环与海上内循环量小，但决定了内陆降水。","sections":[{"h":"人类只改得动一段","p":"修水库、跨流域调水、抽取地下水，改的都是径流与下渗环节，改不动降水。所以调水能解近渴，改不了气候。"},{"h":"可用水看径流","p":"决定一个地区有多少水可用的是径流量与储水能力，不是降水量——沙漠也会下暴雨，但留不住。"}],"anchors":[{"iso":"CN","where":"中国","see":"南水北调改的是径流，不是降水"},{"iso":"EG","where":"埃及","see":"阿斯旺大坝拦水，下游三角洲退缩"},{"iso":"ET","where":"埃塞俄比亚","see":"青尼罗河源头，上游降水决定下游水量"}],"counter":"“降水多就不缺水”是错的：降水集中在几个月、又留不住的地方照样缺水。看水要看“降水—蒸发—径流”三者的差。","media":{"img":"water-cycle","hint":"水循环五环节动画，点击环节看人类影响"},"next":[{"q":"沙漠里的人靠什么水","to":"oasis"},{"q":"修大坝改变了哪一环","to":"rivers"}],"cite":"依据：水循环常识；阿斯旺大坝导致三角洲退缩为公认环境问题。","tags":["水循环","蒸发","径流","下渗","南水北调","大坝"],"quiz":[{"lv":"jr","type":"choice","q":"目前人类活动影响最直接的水循环环节是","opts":["蒸发","水汽输送","径流","降水"],"ans":2,"exp":"修水库、调水、抽取地下水改的都是径流与下渗；降水与蒸发人类几乎改不动。","diff":1,"tag":["水","水循环","概念辨析"]},{"lv":"sr","type":"short","q":"说明修建水库与跨流域调水分别改变了哪些环节，为什么改变不了降水。","ans":"水库改变径流的季节分配与蒸发、下渗条件；跨流域调水改变径流的空间分布。降水由大气环流与水汽条件决定，人类只能小范围影响（如人工增雨），无法改变区域降水格局。","exp":"“改得动地表水、改不动天上的水”是这题的落点。","diff":2,"tag":["水","水循环","机制分析"]}]},{"id":"structures","kind":"concept","name":"地质构造","cat":"地质","alias":["褶皱","断层","背斜","向斜"],"level":{"jr":"七年级上 · 地表形态","sr":"必修一 · 地质构造"},"line":"岩层受挤压弯曲成褶皱，断裂错开成断层；背斜成山、向斜成谷只是一般规律，常被侵蚀反转。","why":"判读靠岩层新老关系：背斜中心老、两翼新；向斜中心新、两翼老。断层则看岩层是否错开、有没有断层线。","sections":[{"h":"地形倒置","p":"背斜顶部受张力、岩石破碎，容易被侵蚀成谷；向斜槽部受挤压、岩性紧实，反被留下来成山。所以“看形状判构造”经常错。"},{"h":"工程意义","p":"隧道修在背斜（拱形稳定、不易积水），水库避开断层（易渗漏、诱发地震）。"}],"anchors":[{"iso":"CN","where":"中国","see":"喜马拉雅是褶皱山系，仍在抬升"},{"iso":"US","where":"美国","see":"科罗拉多大峡谷切开岩层，层理一目了然"},{"iso":"TR","where":"土耳其","see":"北安纳托利亚断层，地震频发"}],"counter":"“背斜一定成山”是错的：地形倒置非常常见。判断构造要凭岩层新老，不凭外形。","media":{"svg":"structures","img":"syncline-anticline","hint":"背斜与向斜"},"next":[{"q":"背斜为什么反而成了谷","to":"exogenic"},{"q":"断层带为什么不能修水库","to":"water-cycle"}],"cite":"依据：地质构造常识；北安纳托利亚断层为全球著名活动断裂带。","tags":["褶皱","断层","背斜","向斜","隧道","水库选址"],"quiz":[{"lv":"jr","type":"choice","q":"背斜顶部常被侵蚀成谷地，主要原因是","opts":["岩层受挤压紧实","顶部受张力、岩石破碎易侵蚀","断层下陷","岩浆侵入"],"ans":1,"exp":"背斜顶部受张力产生裂隙，抗侵蚀能力弱；向斜槽部受挤压紧实，反而保存成山。","diff":1,"tag":["地质","地质构造","概念辨析"]},{"lv":"sr","type":"short","q":"判断背斜与向斜的依据是什么？为什么不能只看地形？","ans":"依据岩层新老关系：背斜中心老、两翼新；向斜中心新、两翼老。因为存在地形倒置——背斜顶部被侵蚀成谷、向斜槽部残留成山，只看地表起伏会把两者判反。","exp":"答题要写“岩层新老”，这是唯一可靠判据。","diff":2,"tag":["地质","地质构造","机制分析"]}]},{"id":"exogenic","kind":"concept","name":"外力作用","cat":"地质","alias":["风化","侵蚀","流水作用","风力作用"],"level":{"jr":"七年级上 · 地表形态","sr":"必修一 · 外力作用"},"line":"风化、侵蚀、搬运、沉积把高处削低、低处填平，流水与风力是最常见的两把刀。","why":"流水在山区切峡谷、出山口堆冲积扇、入海口造三角洲；风力在干旱区磨出雅丹，也把细颗粒吹成黄土与沙丘。","sections":[{"h":"四种作用一条链","p":"风化把岩石弄碎（原地不动）→ 侵蚀把碎屑带走 → 搬运 → 沉积。顺序搞清，判读题就对一半。"},{"h":"黄土是风搬来的","p":"黄土高原的黄土来自西北干旱区的风力搬运，不是本地河流沉积。所以它颗粒均匀、层理不明显。"}],"anchors":[{"iso":"CN","where":"中国","see":"黄土高原（风力沉积）、长江三角洲（流水沉积）"},{"iso":"EG","where":"埃及","see":"尼罗河三角洲，河流搬运的泥沙堆出来的"},{"iso":"US","where":"美国","see":"科罗拉多高原，流水下切形成峡谷"}],"counter":"黄土不是流水沉积：它颗粒细而均匀、没有明显层理，是风力搬来的。把它当“河流冲积”，就解释不了它为什么盖在山顶上。","media":{"svg":"exogenic","hint":"风力/流水两种侵蚀的并排对比动画"},"next":[{"q":"黄土是从哪来的","to":"continental"},{"q":"三角洲为什么会退缩","to":"rivers"}],"cite":"依据：外力作用常识；黄土风成为通行结论。","tags":["风化","侵蚀","沉积","黄土","三角洲","峡谷"],"quiz":[{"lv":"jr","type":"choice","q":"黄土高原的黄土主要来自","opts":["本地岩石风化","风力搬运沉积","河流冲积","冰川堆积"],"ans":1,"exp":"颗粒细而均匀、层理不明显，是西北干旱区风力搬运来的，所以能盖在山顶上。","diff":1,"tag":["地质","外力作用","概念辨析"]},{"lv":"sr","type":"short","q":"说明流水作用在山区、出山口、入海口分别形成什么地貌。","ans":"山区：流水下切侵蚀形成峡谷；出山口：流速骤减，泥沙堆积成冲积扇（洪积扇）；入海口：地势平缓、海水顶托，泥沙沉积成三角洲。","exp":"三段对应三种作用：侵蚀—沉积—沉积，位置决定流速，流速决定地貌。","diff":2,"tag":["地质","外力作用","机制分析"]}]},{"id":"migration","kind":"concept","name":"人口迁移","cat":"人口","alias":["人口迁移","推拉理论","移民"],"level":{"jr":"七年级上 · 人口","sr":"必修二 · 人口迁移"},"line":"人口在空间上的移动，由迁出地的推力与迁入地的拉力共同决定，中间还有迁移障碍。","why":"推力是失业、灾害、战乱；拉力是收入、公共服务、亲属网络。障碍是距离、语言、签证与路费。","sections":[{"h":"谁走得成","p":"最穷的人往往走不了：路费与信息都是门槛。所以迁移多发生在“负担得起”的中间层，这被称为迁移的选择性。"},{"h":"两端都受影响","p":"迁出地：劳动力外流、老人与儿童留守；迁入地：劳动力充足，但住房、教育与融合压力上升。"}],"anchors":[{"iso":"MX","where":"墨西哥","see":"向美国的大规模迁移，形成长年走廊"},{"iso":"PH","where":"菲律宾","see":"劳务输出大国，海员与护理遍全球"},{"iso":"DE","where":"德国","see":"欧洲主要迁入国，缺工行业依赖移民"}],"counter":"“穷就迁移”不成立：战乱与极端贫困反而降低迁移能力。真正推动迁移的是“差距 + 走得动”。","media":{"svg":"migration","hint":"人口迁移"},"next":[{"q":"打工的人为什么都往大城市去","to":"urbanization"},{"q":"为什么穷国的人反而走不了","to":"development"}],"cite":"依据：人口迁移推拉理论；菲律宾劳务输出、德国为主要迁入国均为事实。","tags":["人口迁移","移民","推拉理论","打工","劳务输出"],"quiz":[{"lv":"jr","type":"choice","q":"下列属于人口迁移的是","opts":["每天跨城通勤","春节回老家过年","农村人口进城定居","短期旅游"]
